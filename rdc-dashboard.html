// ============ SHORTAGE PAGE ============
let shortagePage = 1;
// ==================== v131 月度缺货画像（SKU×RDC，剔除双休日）====================
// 口径（2026-08-29 与张宇飞确认）：
//  1. 剔除双休日：周末 RDC 不排单，首日缺货量≈订单量（8/08、8/22 首日满足率仅 0.3%）。
//     实测不剔除会虚增 14.4% 首日缺货量，并凭空多出 92 个「缺货组合」（375 vs 283）。
//  2. MR（月度首日缺货率）= 月累计首日缺货量 ÷ 月累计订单量 —— 衡量缺货强度。
//  3. SF（缺货频率）= 首日缺货工作日数 ÷ 该 SKU 有单工作日数 —— 衡量持续性。
//     分母用「有单工作日」而非「当月工作日」：否则低频次下单 SKU 的 SF 上限被压死
//     （月下单 3 次的 SKU，SF 上限 3/17=17.6%，永远进不了榜），且月中小月数据不全时
//     写死分母会把所有 SKU 的频率系统性稀释。
//  4. 双高门槛：MR≥60% 且 SF≥60% 且有单≥3天 且 缺货量≥500支
//     （2026-08 实测命中 34 个，占 365 个缺货组合的 9.3%）
var MS_PROFILE = { MR: 0.5, SF: 0.5, MIN_DAYS: 4 }; // v152: 删除 MIN_QTY=500（v131 拍脑袋定的硬门槛）—— 严重度评分的 sizeTerm 已含 log10(缺货量+1)/4.5 自动捕获规模，500 支门槛冗余
// v147: 综合严重度评分（4 维度加权和，弥补单一率/频门槛忽略规模的缺陷）
//   severity = 0.4×sizeTerm + 0.3×mrTerm + 0.2×sfTerm + 0.1×dayTerm，范围 0~1
// v153: sizeTerm 除数改为「有效组合缺货量 P75 的 log10 值」（数据驱动，跟随业务量级自适应），
//       不再用 v147 拍脑袋的 4.5（log10(31623)，即"3.16 万支=满分"）
var MS_SEVERITY = { SEV_DOUBLE: 0.55, SEV_HIGH: 0.65 }; // v153: 仅作兜底默认值，实际用 prof.dynamicThresholds

// 分位数（线性插值法）：sortedArr 必须已升序
function quantile(sortedArr, p) {
  if (!sortedArr || sortedArr.length === 0) return 0;
  if (sortedArr.length === 1) return sortedArr[0];
  var i = (sortedArr.length - 1) * p;
  var lo = Math.floor(i), hi = Math.ceil(i);
  return lo === hi ? sortedArr[lo] : sortedArr[lo] + (sortedArr[hi] - sortedArr[lo]) * (i - lo);
}

// v159: 严重度评分改为「分位规模 + 率 + 频」三因子加权和（替代 v147 的 log 压缩版）
//   旧版 sizeTerm = min(1, log10(缺货量+1) / sizeDivisor) 有两个问题：
//     ① log10 把缺货量的天然长尾(偏度 3.64, 最大/中位数 50 倍)压成 4.7 倍差距
//     ② min(1,...) 削平顶部(缺 5 万和 50 万同分)
//   → 综合后果: 严重度分布被压成钟形正态(偏度 -0.15), 前 20% 只覆盖 58% 缺货量, 没有重点
//   新版 sizeTerm = 缺货量在当月有效组合中的分位排名(0~1), 不做 log 压缩也不截断
//   → 实测帕累托集中度: 前 20% 覆盖 71%(旧 58%), 前 30% 覆盖 84%(旧 80%)
//   → 前 25% 覆盖 77%, 已接近 2/8 法则(80/20)
function calcSeverity(p, sizePct) {
  var mrTerm = Math.min(1, p.mr || 0);
  var sfTerm = Math.min(1, p.sf || 0);
  return 0.5 * (sizePct || 0) + 0.3 * mrTerm + 0.2 * sfTerm;
}

// v159: 两阶段计算严重度 + 动态分位数阈值
//  阶段1：算每个组合的「缺货量分位排名」(0~1) → 代入 calcSeverity 算 severity
//         （分位排名保留原始长尾排序，不做 log 压缩也不截断）
//  阶段2：求 severity 分布的 P75/P90 作为「严重度高」「紧急升级」阈值
//         v159 起阈值从 P50/P75 收窄到 P75/P90——P50 会让一半 SKU 都入选，
//         清单失去"重点"意义（用户反馈：没有重点）
//         P75 = 前 25%（8月 63 个）/ P90 = 前 10%（8月 26 个）
// 返回动态阈值供 UI 显示（用户能看到当月基准）
function finalizeSeverity(list) {
  if (!list.length) return { shortP75: 0, sizeDivisor: 4.5, sevP50: 0.55, sevP75: 0.65, sevP90: 0.75 };
  // 分位数基准只用「有效组合」（有缺货 + 有单≥MIN_DAYS）——不含无缺货/噪声组合，
  // 否则大量不缺货的 SKU 会把阈值拉低，失去区分度
  var base = list.filter(function(q) {
    return (q.shortQty || 0) > 0 && (q.orderDayCnt || 0) >= MS_PROFILE.MIN_DAYS;
  });
  if (!base.length) base = list;
  var shorts = base.map(function(q) { return q.shortQty || 0; }).filter(function(v) { return v > 0; }).sort(function(a, b) { return a - b; });
  var shortP75 = quantile(shorts, 0.75);
  var sizeDivisor = Math.log10(shortP75 + 1) || 4.5;   // 保留供 UI 参考展示

  // 阶段1：算缺货量分位排名（同分位取平均，避免并列时排名跳跃）
  var rank = {};
  base.forEach(function(q) { (rank[q.shortQty] = rank[q.shortQty] || []).push(q); });
  var sortedKeys = Object.keys(rank).map(Number).sort(function(a, b) { return a - b; });
  var idx = 0, N = base.length;
  sortedKeys.forEach(function(k) {
    var group = rank[k];
    var avgPct = group.length > 1
      ? (idx + (group.length - 1) / 2) / Math.max(1, N - 1)
      : idx / Math.max(1, N - 1);
    group.forEach(function(q) { q.sizePct = avgPct; });
    idx += group.length;
  });

  // v163: hardFloor = 几何平均（对数正态的中心趋势）+ 软衰减（替代硬归零）
  //   统计依据：缺货量是长尾/对数正态分布（偏度 3.64，标准差 3970 > 均值 2109 = 极度偏态）
  //     对偏态分布，几何平均 = exp(mean(ln x)) 是"中心趋势"的正确度量，不是算术中位数 P50
  //     8月几何平均 = 513 支（几乎等于 v131 拍脑袋的 500，但这次有统计依据）
  //   关键优势（淡旺季稳定性，实测 4 场景）：
  //     ① 长尾(8月实际)  P50=1200 geo=1000  0.83x 接近
  //     ② 淡季双峰      P50=135  geo=181   1.34x ← P50 被小 SKU 拉低，geo 稳
  //     ③ 旺季          P50=5500 geo=5850  1.06x 接近
  //     ④ 均匀分布      P50=1050 geo=831   0.79x
  //   → 用户反馈"华中还是有小 SKU"正是场景②，改用几何平均后 hardFloor 不会被拉太低
  //   软衰减（替代 v162 的硬归零）：缺货量 < hardFloor 时 sizePct × (缺货量/hardFloor)
  //     缺 72 支  → ×0.14（几乎归零）
  //     缺 432 支 → ×0.84（接近保留）
  //     缺 555 支 → ×1.00（完全保留）
  //     → 避免 v162 "缺 500 和缺 50 一样"的一刀切，保留梯度供业务判断
  var shortP50 = quantile(shorts, 0.50);   // 保留供 UI 参考展示
  var geoMean = Math.exp(shorts.reduce(function(s, v) { return s + Math.log(v + 1); }, 0) / shorts.length) - 1;
  var hardFloor = geoMean;
  list.forEach(function(q) {
    if (q.sizePct == null) q.sizePct = 0;
    var sq = q.shortQty || 0;
    if (sq > 0 && hardFloor > 0 && sq < hardFloor) {
      q.sizePct = q.sizePct * (sq / hardFloor);   // 软衰减，保留梯度
    }
  });

  // 代入新公式算 severity
  list.forEach(function(q) { q.severity = calcSeverity(q, q.sizePct); });

  // 阶段2：动态阈值（v159 收窄：P75 严重度高 / P90 紧急升级）
  var sevs = base.map(function(q) { return q.severity; }).sort(function(a, b) { return a - b; });
  var sevP50 = quantile(sevs, 0.50);   // 保留供展示（中位数参考）
  var sevP75 = quantile(sevs, 0.75);   // 严重度高（重点跟进）
  var sevP90 = quantile(sevs, 0.90);   // 紧急升级（立即处理）
  list.forEach(function(q) {
    q.isHighSeverity = q.severity >= sevP90;   // 紧急升级 = 前 10%
    // v167: isPersistent 改为仅看严重度评分（去掉 isPersistentOld OR 关系）
    //   之前 isPersistent = isPersistentOld || severity >= sevP75
    //   isPersistentOld 是「率 ≥ 50% 且 频 ≥ 50%」硬门槛——不看缺货量
    //   导致「率 100% 频 53% 缺 360 支」这种小 SKU 通过老口径直接入选严重度高清单
    //   去掉 OR 后：严重度高 = 严重度评分 ≥ P75（前 25%），缺货量下限由 v163 hardFloor (几何平均) 兜底
    q.isPersistent = q.severity >= sevP75;
  });
  return { shortP50: shortP50, geoMean: geoMean, hardFloor: hardFloor, shortP75: shortP75, sizeDivisor: sizeDivisor, sevP50: sevP50, sevP75: sevP75, sevP90: sevP90 };
}

function isWeekendDate(ds) {
  if (!ds || ds.length < 10) return false;
  var w = new Date(ds + 'T00:00:00').getDay();
  return w === 0 || w === 6;
}

function buildMonthlyShortageProfile() {
  var prof = {}, monthWd = {};
  var src = dataStore.orderDetail || [];
  for (var i = 0; i < src.length; i++) {
    var d = src[i];
    if (!d || !d.dateStr || !d.skuCode || !d.warehouse) continue;
    if (isWeekendDate(d.dateStr)) continue;
    var ym = d.dateStr.slice(0, 7);
    if (!monthWd[ym]) monthWd[ym] = {};
    monthWd[ym][d.dateStr] = 1;
    // rdc 归一化，保证与补货建议页（缺货报告口径）的 RDC 名称能直接关联
    var rdc = normalizeRdcName(d.warehouse);
    var k = ym + '|' + d.skuCode + '|' + rdc;
    if (!prof[k]) {
      // v137: 预取 boxSpec（SKU 箱规），用于派生「月缺货箱数」shortBoxes
      // 必须**先按 SKU 聚合 shortQty 再除 boxSpec**（v131 铁律），不能反过来，否则大箱规 SKU 加权放大
      var boxSpec = (window._boxSpec && window._boxSpec[String(d.skuCode)]) || null;
      prof[k] = { month: ym, sku: d.skuCode, name: d.skuName || '', brand: d.brand || '',
                  rdc: rdc, orderQty: 0, shortQty: 0, gapQty: 0,
                  shortDays: {}, orderDays: {}, kaShort: 0, dealerShort: 0,
                  boxSpec: boxSpec };
    }
    var p = prof[k];
    var o = d.orderQty || 0, sh = d.firstDayShort || 0;
    p.orderQty += o; p.shortQty += sh; p.gapQty += (d.totalGap || 0);
    p.orderDays[d.dateStr] = 1;
    if (sh > 0) p.shortDays[d.dateStr] = 1;
    if (d.channel === 'KA') p.kaShort += sh;
    else if (d.channel === '经销商') p.dealerShort += sh;
  }
  var list = [];
  for (var kk in prof) {
    if (!Object.prototype.hasOwnProperty.call(prof, kk)) continue;
    var q = prof[kk];
    q.shortDayCnt = Object.keys(q.shortDays).length;
    q.orderDayCnt = Object.keys(q.orderDays).length;
    q.mr = q.orderQty > 0 ? q.shortQty / q.orderQty : 0;
    q.sf = q.orderDayCnt > 0 ? q.shortDayCnt / q.orderDayCnt : 0;
    // v137: 派生月缺货箱数 = 整月 firstDayShort 累加 ÷ boxSpec
    // 用「按 SKU 聚合后的支数 ÷ 箱规」公式（v131 铁律），避免跨日累加导致的「同一批未满足订单在多日重复计入」虚增
    q.shortBoxes = (q.boxSpec && q.boxSpec > 0) ? Math.round(q.shortQty / q.boxSpec) : null;
    // v153: severity / isPersistent / isHighSeverity 改由 finalizeSeverity 用动态分位数统一计算
    list.push(q);
  }
  var mwd = {};
  for (var m in monthWd) {
    if (!Object.prototype.hasOwnProperty.call(monthWd, m)) continue;
    mwd[m] = Object.keys(monthWd[m]).length;
  }
  var dynTh = finalizeSeverity(list);
  return { list: list, byKey: prof, monthWorkdays: mwd, dynamicThresholds: dynTh };
}

// v145：滚动 30 天窗口的缺货画像（默认模式）
// 数据源：dataStore.orderDetail
// 窗口：以最新数据日为截止，向前滚动 30 天（剔除双休日后聚合）
// 维度：按 SKU×RDC 聚合，period 字段统一为 'rolling30'
// 与按月模式独立缓存、独立 key，前端按 _msWindowMode 切换
function buildRollingShortageProfile() {
  var src = dataStore.orderDetail || [];
  // 1) 找最新数据日
  var maxDs = null;
  for (var i = 0; i < src.length; i++) {
    var ds = src[i] && src[i].dateStr;
    if (ds && (!maxDs || ds > maxDs)) maxDs = ds;
  }
  if (!maxDs) return { list: [], byKey: {}, periodWorkdays: { rolling30: 0 } };

  // 2) 算 cutoff = maxDs - 30 天
  var maxDate = new Date(maxDs + 'T00:00:00');
  var cutoff = new Date(maxDate.getTime());
  cutoff.setDate(cutoff.getDate() - 30);
  var cutoffDs = cutoff.toISOString().slice(0, 10);

  // 3) 按 SKU×RDC 聚合，period 统一为 'rolling30'
  var byKey = {};
  var wdSet = {};
  for (var j = 0; j < src.length; j++) {
    var d = src[j];
    if (!d || !d.dateStr || !d.skuCode || !d.warehouse) continue;
    if (d.dateStr < cutoffDs || d.dateStr > maxDs) continue;
    if (isWeekendDate(d.dateStr)) continue;
    wdSet[d.dateStr] = 1;
    var rdc = normalizeRdcName(d.warehouse);
    var k = 'rolling30|' + d.skuCode + '|' + rdc;
    if (!byKey[k]) {
      var boxSpec = (window._boxSpec && window._boxSpec[String(d.skuCode)]) || null;
      byKey[k] = {
        period: 'rolling30', month: 'rolling30',
        sku: d.skuCode, name: d.skuName || '', brand: d.brand || '',
        rdc: rdc, orderQty: 0, shortQty: 0, gapQty: 0,
        shortDays: {}, orderDays: {}, boxSpec: boxSpec
      };
    }
    var p = byKey[k];
    var o = d.orderQty || 0, sh = d.firstDayShort || 0;
    p.orderQty += o; p.shortQty += sh; p.gapQty += (d.totalGap || 0);
    p.orderDays[d.dateStr] = 1;
    if (sh > 0) p.shortDays[d.dateStr] = 1;
  }
  // 4) 派生指标，与 buildMonthlyShortageProfile 完全一致
  var list = [];
  for (var kk in byKey) {
    if (!Object.prototype.hasOwnProperty.call(byKey, kk)) continue;
    var q = byKey[kk];
    q.shortDayCnt = Object.keys(q.shortDays).length;
    q.orderDayCnt = Object.keys(q.orderDays).length;
    q.mr = q.orderQty > 0 ? q.shortQty / q.orderQty : 0;
    q.sf = q.orderDayCnt > 0 ? q.shortDayCnt / q.orderDayCnt : 0;
    q.shortBoxes = (q.boxSpec && q.boxSpec > 0) ? Math.round(q.shortQty / q.boxSpec) : null;
    // v153: severity / isPersistent / isHighSeverity 改由 finalizeSeverity 用动态分位数统一计算
    list.push(q);
  }
  var dynTh = finalizeSeverity(list);
  return { list: list, byKey: byKey, periodWorkdays: { rolling30: Object.keys(wdSet).length }, maxDs: maxDs, cutoffDs: cutoffDs, dynamicThresholds: dynTh };
}

// ==================== v138 总仓供应月度画像（按 SKU×月 维度，缺货报告口径）====================
// 用途：判定 SKU 的"月缺货"是否由总仓卡死引起——对比「该 SKU×RDC 缺货天数」与「该 SKU 总仓异常天数」
// 数据源：dataStore.shortage（缺货报告），字段 dcSupply（"整体缺货"/"供应紧张"/"正常"）、dcStock（大仓库存箱数）
// 注意：shortage 不含 orderDetail 里的"日"概念，是每日快照；日期用 dateStr 直接归到月
// 异常判定：dcSupply 含"整体缺货"或"供应紧张" → 视为总仓该日有问题
function buildMonthlyDCSupplyProfile() {
  var byKey = {};  // '月|sku' -> { dcShortDays: Set, dcSupplyLatest, dcStockLatest, dcBadDays, totalDays }
  var src = dataStore.shortage || [];
  for (var i = 0; i < src.length; i++) {
    var d = src[i];
    if (!d || !d.dateStr || !d.materialCode) continue;
    var ym = d.dateStr.slice(0, 7);
    var k = ym + '|' + d.materialCode;
    if (!byKey[k]) byKey[k] = { month: ym, sku: d.materialCode, dcShortDays: new Set(), dcBadDays: new Set(), dcSupplyLatest: '', dcStockLatest: 0, lastDate: '' };
    var v = byKey[k];
    var sup = String(d.dcSupply || '');
    // 解析异常（总仓供应"有问题"的天数）
    if (sup.indexOf('整体缺货') >= 0 || sup.indexOf('供应紧张') >= 0) {
      v.dcShortDays.add(d.dateStr);
      v.dcBadDays.add(d.dateStr);
    }
    // 跟踪"最新一日"的供应情况（用于显示当前状态）
    if (!v.lastDate || d.dateStr > v.lastDate) {
      v.lastDate = d.dateStr;
      v.dcSupplyLatest = sup || '正常';
      v.dcStockLatest = d.dcStock || 0;
    }
  }
  // 转 Set 为 cnt
  var byKey2 = {};
  for (var kk in byKey) {
    if (!Object.prototype.hasOwnProperty.call(byKey, kk)) continue;
    var q = byKey[kk];
    q.dcShortDayCnt = q.dcShortDays.size;
    q.dcBadDayCnt = q.dcBadDays.size;
    byKey2[kk] = { month: q.month, sku: q.sku, dcShortDayCnt: q.dcShortDayCnt, dcBadDayCnt: q.dcBadDayCnt, dcSupplyLatest: q.dcSupplyLatest, dcStockLatest: q.dcStockLatest };
  }
  return { byKey: byKey2 };
}

var _dcsProfileCache = { shortageHash: '', data: null };
function getMonthlyDCSupplyProfile() {
  // 简化：用 shortage 长度 + 最后一个 dateStr 作为缓存 key（避免引入完整 hash）
  var src = dataStore.shortage || [];
  var lastDate = src.length ? src[src.length - 1].dateStr : '';
  var key = src.length + '|' + lastDate;
  if (_dcsProfileCache.data && _dcsProfileCache.shortageHash === key) return _dcsProfileCache.data;
  _dcsProfileCache.shortageHash = key;
  _dcsProfileCache.data = buildMonthlyDCSupplyProfile();
  return _dcsProfileCache.data;
}

// 判定"缺货瓶颈"——比对 SKU×RDC 缺货天数 与 总仓异常天数
// 返回 { level: 'card-dead' | 'partial' | 'normal', label: '...', color, bg }
// - card-dead: 总仓异常天数 ≥ SKU×RDC 缺货天数 → 总仓卡死，补多少都没用
// - partial: 总仓有部分问题 → 协调总仓 + RDC 内部调拨并行
// - normal: 总仓正常 → 问题在 RDC 内部（分仓调整/库存管理）
function judgeBottleneck(p, dcs) {
  if (!dcs || dcs.dcShortDayCnt === 0) {
    return { level: 'normal', label: '总仓正常·问题在 RDC 内部', bg: '#D1FAE5', color: '#065F46' };
  }
  if (dcs.dcShortDayCnt >= p.shortDayCnt) {
    return { level: 'card-dead', label: '总仓卡死·需总仓协调', bg: '#FEE2E2', color: '#991B1B' };
  }
  return { level: 'partial', label: '部分依赖总仓·并行处理', bg: '#FEF3C7', color: '#92400E' };
}
window.judgeBottleneck = judgeBottleneck;

  shortagePage = Math.min(shortagePage || 1, Math.max(1, totalPages));
  const start = (shortagePage - 1) * pageSize;
  const pageData = totalData.slice(start, start + pageSize);

  const tableHtml = '<table class="data-table"><thead><tr><th>日期</th><th>物料号</th><th>物料名称</th><th>品牌</th><th>ABC</th><th>缺货总箱</th><th>在途箱数</th><th>缺货金额</th><th>涉及RDC</th><th>大仓供应</th></tr></thead><tbody>' +
    (pageData.length > 0 ? pageData.map(d => `<tr>
      <td>${d.dateStr}</td><td>${d.materialCode}</td><td style="max-width:200px;overflow:hidden;text-ellipsis" title="${d.materialName}">${d.materialName}</td>
      <td>${d.brand}</td><td>${d.abcClass}</td><td class="num">${formatNum(d.rdcShortBoxes)}</td><td class="num">${formatNum(d.rdcTransitTotal||0)}</td><td class="num">${formatMoney(d.rdcShortAmount)}</td>
      <td class="num"><span class="badge ${d.rdcCount>=4?'badge-red':d.rdcCount>=2?'badge-orange':'badge-green'}">${d.rdcCount}个</span></td>
      <td><span style="font-size:11px">${d.dcSupply||'-'}</span></td></tr>`).join('') : '<tr><td colspan="10" style="text-align:center;padding:20px;color:var(--text-secondary)">该条件下暂无数据，请调整筛选条件</td></tr>')
    + '</tbody></table>';
  document.getElementById('table-shortage-detail').innerHTML = tableHtml;

  let pagHtml = showAll ? `<span>共 ${totalData.length} 条 / 第 ${shortagePage} / ${totalPages} 页</span>` : `<span>Top ${totalData.length} 条 / 共 ${sData.length} 条</span>`;
  if (showAll) {
    pagHtml += `<button ${shortagePage<=1?'disabled':''} onclick="shortagePage=1;renderShortage()">首页</button>`;
    pagHtml += `<button ${shortagePage<=1?'disabled':''} onclick="shortagePage--;renderShortage()">上一页</button>`;
    for (let p = Math.max(1, shortagePage-2); p <= Math.min(totalPages, shortagePage+2); p++) {
      pagHtml += `<button class="${p===shortagePage?'active':''}" onclick="shortagePage=${p};renderShortage()">${p}</button>`;
    }
    pagHtml += `<button ${shortagePage>=totalPages?'disabled':''} onclick="shortagePage++;renderShortage()">下一页</button>`;
    pagHtml += `<button ${shortagePage>=totalPages?'disabled':''} onclick="shortagePage=${totalPages};renderShortage()">末页</button>`;
  }
  document.getElementById('shortage-pagination').innerHTML = pagHtml;
}

// ============ v131 月度缺货全貌（SKU×RDC 整月聚合，剔除双休日）============
// v145：数据窗口切换——默认滚动30天（与用户既定工作流匹配，总是最新数据），可切回按月
function renderShortageMonthly() {
  setTitle('缺货四象限分析');
  const page = document.getElementById('page-shortage');
  if (!page || !dataStore.loaded || (dataStore.orderDetail || []).length === 0) {
    page.innerHTML = '<div style="text-align:center;padding:80px;color:var(--text-secondary)">请先导入包含订单明细的数据</div>';
    return;
  }

  // v145 数据窗口 mode：'rolling30'(默认) | 'monthly'
  const mode = window._msWindowMode || 'rolling30';
  const prof = mode === 'rolling30' ? getRollingShortageProfile() : getMonthlyShortageProfile();
  const period = mode === 'rolling30'
    ? 'rolling30'
    : (filters.dataMonth && filters.dataMonth !== 'all' ? filters.dataMonth : (window._latestMonth || ''));
  const all = prof.list.filter(p => !period || p.period === period || p.month === period);
  const wd = (mode === 'rolling30')
    ? (prof.periodWorkdays && prof.periodWorkdays.rolling30) || 0
    : (prof.monthWorkdays && prof.monthWorkdays[period]) || 0;

  // v146: 月度全貌 3 个筛选下拉框状态（默认值 all）
  const filterRdc = window._msFilterRdc || 'all';
  const filterBrand = window._msFilterBrand || 'all';
  const filterHainan = window._msFilterHainan || 'all'; // 'all' | 'yes' | 'no'

  // v146: 从 prof.list 派生筛选下拉选项（保留未筛选的列表供筛选框显示）
  const _allUnfiltered = all; // 当前窗口的全部
  const rdcOptions = ['all'].concat([...new Set(all.map(p => p.rdc).filter(Boolean))].sort());
  const brandOptions = ['all'].concat([...new Set(all.map(p => p.brand).filter(Boolean))].sort());

  // v146: 应用 3 个筛选
  const rdcFilter = (filterRdc === 'all') ? p => true : p => p.rdc === filterRdc;
  const brandFilter = (filterBrand === 'all') ? p => true : p => p.brand === filterBrand;
  const hainanFilter = (filterHainan === 'all') ? p => true
    : filterHainan === 'yes' ? p => window._skuIsHainan && window._skuIsHainan[p.sku]
    : p => !window._skuIsHainan || !window._skuIsHainan[p.sku];
  const applyFilters = arr => arr.filter(p => rdcFilter(p) && brandFilter(p) && hainanFilter(p));
  const allFiltered = applyFilters(all);
  const withShort = allFiltered.filter(p => p.shortQty > 0);
  const valid = withShort.filter(p => p.orderDayCnt >= MS_PROFILE.MIN_DAYS);
  const hi = valid.filter(p => p.isPersistent);

  const totOrder = allFiltered.reduce((s, p) => s + p.orderQty, 0);
  const totShort = allFiltered.reduce((s, p) => s + p.shortQty, 0);
  const monthMr = totOrder > 0 ? totShort / totOrder : 0;

  // 各 RDC 同口径对照：绝对数会被大仓（组合基数大）主导，必须同时看占本仓有效组合比
  const rdcMap = {};
  function rdcSlot(rdc) {
    if (!rdcMap[rdc]) rdcMap[rdc] = { rdc: rdc, valid: 0, hi: 0, noise: 0, order: 0, short: 0 };
    return rdcMap[rdc];
  }
  allFiltered.forEach(p => {
    const r = rdcSlot(p.rdc);
    r.order += p.orderQty;
    r.short += p.shortQty;
  });
  // 有缺货的组合再按「有单工作日」分流：≥4 天进有效组合（参与双高判定），<4 天计入噪声剔除
  withShort.forEach(p => {
    const r = rdcSlot(p.rdc);
    if (p.orderDayCnt >= MS_PROFILE.MIN_DAYS) {
      r.valid++;
      if (p.isPersistent) r.hi++;
    } else {
      r.noise++;
    }
  });
  const rdcList = Object.values(rdcMap)
    .map(r => { r.hiPct = r.valid > 0 ? r.hi / r.valid : 0; r.mr = r.order > 0 ? r.short / r.order : 0; return r; })
    .sort((a, b) => b.hiPct - a.hiPct);

  // v168: 「严重度高占比」色条改「跨 RDC 分位数」驱动，与严重度评分 P75/P90 同源
  //   旧版 15%/10% 是 v131 拍脑袋值（代码注释自己写明「无行业标准、0 来源」），
  //   且与已数据驱动的严重度判定（isPersistent=P75 / isHighSeverity=P90）口径脱节
  //   新规则：红 ≥ 跨 RDC P75（占比最高的 25% 仓）/ 黄 ≥ P50（中位数以上）/ 绿 < P50
  //   注：quantile 要求升序数组，rdcList 已按 hiPct 降序，需重新升序排列后再算
  //   首日满足率保持业务硬阈值 90%/80%（v162 业务自定义），v168 修复 v162 漏改的 85%/78%
  const _hiPctAsc = rdcList.map(r => r.hiPct).sort((a, b) => a - b);
  const hiPctP50 = quantile(_hiPctAsc, 0.50);
  const hiPctP75 = quantile(_hiPctAsc, 0.75);
  rdcList.forEach(r => {
    r.hiPctColor = r.hiPct >= hiPctP75 ? '#EF4444' : (r.hiPct >= hiPctP50 ? '#F59E0B' : '#10B981');
  });

  // v159: 动态分位数阈值收窄——严重度高=P75(前25%)，紧急升级=P90(前10%)
  // 旧版 P50(前50%) 会让一半 SKU 入选，清单失去"重点"意义（用户反馈：没有重点）
  const dynTh = prof.dynamicThresholds || { shortP75: 0, sizeDivisor: 4.5, sevP75: MS_SEVERITY.SEV_DOUBLE, sevP90: MS_SEVERITY.SEV_HIGH };
  const SEV_DOUBLE = dynTh.sevP75 != null ? dynTh.sevP75 : dynTh.sevP50;
  const SEV_HIGH = dynTh.sevP90 != null ? dynTh.sevP90 : dynTh.sevP75;
  const SEV_DOUBLE_TXT = SEV_DOUBLE.toFixed(2);
  const SEV_HIGH_TXT = SEV_HIGH.toFixed(2);
  // v154: 同步到 window 全局，供 renderDrillTableBody 等顶层函数使用（v153 漏这一步导致 Q1/Q2/Q3/Q4 数字块下钻报错 SEV_HIGH is not defined）
  window._msSevDouble = SEV_DOUBLE;
  window._msSevHigh = SEV_HIGH;

  // v158: 4 象限统一改回率×频 50%（经典坐标）。
  // 早先 v151 用「严重度高」填充 Q1 导致 Q2/Q3/Q4 严重失真——严重度评分含规模维度,
  // 严重度高的 SKU 按 MR×SF 散点位置不一定落在 Q1.
  // 改回后: Q1=率频双中 / Q2=高频低率 / Q3=低频高率 / Q4=双低. 「严重度高重点跟进」
  // (175 左右) 作为 KPI 卡独立显示,与象限图职责分离。
  const q = { q1: [], q2: [], q3: [], q4: [] };
  valid.forEach(p => {
    const hiRate = p.mr >= MS_PROFILE.MR;
    const hiFreq = p.sf >= MS_PROFILE.SF;
    if (hiRate && hiFreq) q.q1.push(p);
    else if (hiFreq && !hiRate) q.q2.push(p);
    else if (hiRate && !hiFreq) q.q3.push(p);
    else q.q4.push(p);
  });
  Object.values(q).forEach(arr => arr.sort((a, b) => b.shortQty - a.shortQty));

  // v145: 下钻数据池扩展——除了原有 byRdc(有效组合) / sku，新增 rdc-noise / rdc-all 支持数字下钻
  window._msDrillData = {
    q1: q.q1, q2: q.q2, q3: q.q3, q4: q.q4,
    byRdc: {},        // 该 RDC 有效组合（参与双高判定）
    byRdcNoise: {},   // 该 RDC 噪声剔除（有缺货但有单<3天）
    byRdcAll: {},     // 该 RDC 所有有缺货组合（有效+噪声）
    sku: {}
  };
  rdcList.forEach(r => {
    window._msDrillData.byRdc[r.rdc] = [];
    window._msDrillData.byRdcNoise[r.rdc] = [];
    window._msDrillData.byRdcAll[r.rdc] = [];
  });
  // 有效组合 → byRdc
  valid.forEach(p => {
    if (window._msDrillData.byRdc[p.rdc]) window._msDrillData.byRdc[p.rdc].push(p);
    if (window._msDrillData.byRdcAll[p.rdc]) window._msDrillData.byRdcAll[p.rdc].push(p);
  });
  // 噪声 → byRdcNoise + byRdcAll
  withShort.forEach(p => {
    if (p.orderDayCnt < MS_PROFILE.MIN_DAYS) {
      if (window._msDrillData.byRdcNoise[p.rdc]) window._msDrillData.byRdcNoise[p.rdc].push(p);
      if (window._msDrillData.byRdcAll[p.rdc]) window._msDrillData.byRdcAll[p.rdc].push(p);
    }
  });
  Object.values(window._msDrillData.byRdc).forEach(arr => arr.sort((a, b) => b.shortQty - a.shortQty));
  Object.values(window._msDrillData.byRdcNoise).forEach(arr => arr.sort((a, b) => b.shortQty - a.shortQty));
  Object.values(window._msDrillData.byRdcAll).forEach(arr => arr.sort((a, b) => b.shortQty - a.shortQty));
  valid.forEach(p => {
    if (!window._msDrillData.sku[p.sku]) window._msDrillData.sku[p.sku] = { name: p.name, brand: p.brand, list: [] };
    window._msDrillData.sku[p.sku].list.push(p);
  });
  Object.values(window._msDrillData.sku).forEach(g => g.list.sort((a, b) => b.shortQty - a.shortQty));

  // 散点数据 v154: 按严重度档分 3 色（位置按 MR×SF，颜色代表严重度档）
  //   红 = sev ≥ P75（紧急升级）、黄 = sev ≥ P50 但 < P75（严重度高）、灰 = sev < P50（不急）
  //   这样「红色 = 严重」在任何象限都醒目，纠正 v151 之前"红色只聚集在 Q1"造成的视觉误导
  const mapPt = p => ({ value: [p.sf, p.mr, p.shortQty], sku: p.sku, nm: p.name, rdc: p.rdc,
    q: p.shortQty, sd: p.shortDayCnt, od: p.orderDayCnt, mr: p.mr, sf: p.sf, sev: p.severity });
  const sevHighPts = valid.filter(p => p.severity >= SEV_HIGH).map(mapPt);
  const sevMidPts  = valid.filter(p => p.severity >= SEV_DOUBLE && p.severity < SEV_HIGH).map(mapPt);
  const sevLowPts  = valid.filter(p => p.severity < SEV_DOUBLE).map(mapPt);

  // v142: 删掉象限文字浮层（用户反馈：4 个浮层会盖住右上密集的红气泡，看不清散点分布）
  // 象限数量信息改由 card-header 副标题"高率+高频 52 / 高频低率 19 / 低频高率 10 / 双低 ·偶发 202 · 点击下钻"承担
  // 散点 click 下钻保留（双高的 34 个 SKU 仍可下钻）
  const quadSummaryHtml =
    '<div style="font-size:11px;color:var(--text-secondary)">高率+高频 ' + q.q1.length +
    '  ·  高频低率 ' + q.q2.length +
    '  ·  低频高率 ' + q.q3.length +
    '  ·  双低 ·偶发 ' + q.q4.length +
    (hi.length ? '  ·  严重度高命中 ' + hi.length : '') +
    '  ·  点击散点可下钻</div>';

  window._msSort = window._msSort || 'sev'; // v147: 默认按严重度排序
  let sorted = hi.slice();
  if (window._msSort === 'sev') sorted.sort((a, b) => (b.severity || 0) - (a.severity || 0) || b.shortQty - a.shortQty);
  else if (window._msSort === 'qty') sorted.sort((a, b) => b.shortQty - a.shortQty);
  else if (window._msSort === 'mr') sorted.sort((a, b) => b.mr - a.mr || b.shortQty - a.shortQty);
  else if (window._msSort === 'sf') sorted.sort((a, b) => b.sf - a.sf || b.shortDayCnt - a.shortDayCnt);

  const perPage = 20;
  window._msPage = window._msPage || 1;
  const totalPages = Math.ceil(sorted.length / perPage) || 1;
  if (window._msPage > totalPages) window._msPage = totalPages;
  if (window._msPage < 1) window._msPage = 1;
  const start = (window._msPage - 1) * perPage;
  const pageData = sorted.slice(start, start + perPage);

  const sortBtn = (id, label) => '<button class="btn-export" style="font-size:11px;padding:3px 10px;' +
    (window._msSort === id ? 'background:var(--color-blue);color:#fff;' : '') +
    '" onclick="window._msSort=\'' + id + '\';window._msPage=1;renderShortage()">' + label + '</button>';

  // v133：RDC 对照表行 onclick（带下钻）+ 各列加 hover 高亮
  const rdcRows = rdcList.map(r => {
    const rdcEsc = String(r.rdc).replace(/'/g, "\\'");
    return '<tr onclick="window._msDrill=\'rdc:' + rdcEsc + '\';window._msDrillPage=1;renderShortage()" ' +
      'style="cursor:pointer" title="点击查看 ' + r.rdc + ' 的全部有效组合明细">' +
      '<td style="text-align:left;font-weight:500">' + r.rdc + '</td>' +
      '<td style="text-align:right">' + r.valid + '</td>' +
      '<td style="text-align:right;color:var(--text-secondary)">' + (r.noise > 0 ? r.noise : '<span style="color:#CBD5E1">—</span>') + '</td>' +
      '<td style="text-align:right;color:var(--color-red);font-weight:600">' + r.hi + '</td>' +
      '<td style="text-align:right;font-weight:600">' + (r.hiPct * 100).toFixed(1) + '%</td>' +
      '<td style="text-align:right;color:' + (r.mr > 0.15 ? 'var(--color-red)' : 'var(--text-primary)') + '">' + ((1 - r.mr) * 100).toFixed(1) + '%</td>' +
      '</tr>';
  }).join('');

  page.innerHTML = `
    <div class="filter-bar" style="flex-wrap:wrap;align-items:center;gap:8px">
      <span style="font-size:12px;color:var(--text-secondary)">${mode === 'rolling30' ? '近 30 天（滚动窗口 ' + (prof.maxDs || '') + ' 向后 30 天）' : (period || '全部月份')} · 已剔除双休日${wd ? '（有效工作日 ' + wd + ' 天）' : ''} · 基于订单明细按 SKU×RDC 聚合</span>
      <div style="margin-left:auto;display:flex;gap:4px">
        <button class="btn-export" style="font-size:11px;padding:3px 12px;${mode==='rolling30'?'background:var(--color-blue);color:#fff;border-color:var(--color-blue);':''}" onclick="window._msWindowMode='rolling30';renderShortage()">📅 近 30 天（最新）</button>
        <button class="btn-export" style="font-size:11px;padding:3px 12px;${mode==='monthly'?'background:var(--color-blue);color:#fff;border-color:var(--color-blue);':''}" onclick="window._msWindowMode='monthly';renderShortage()">📊 按月</button>
      </div>
    </div>
    ${shortageTabBarHtml('monthly')}

    <!-- v146: 月度全貌 3 个筛选下拉框 (RDC / 品牌 / 海南花露水) -->
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:8px 12px;background:#FAFBFC;border:1px solid #E5E7EB;border-radius:6px">
      <span style="font-size:12px;color:var(--text-secondary);font-weight:500">📌 筛选：</span>
      <label style="font-size:12px;color:var(--text-secondary)">RDC：
        <select onchange="window._msFilterRdc=this.value;window._msDrill=null;renderShortage()" style="padding:4px 8px;border:1px solid #D1D5DB;border-radius:4px;font-size:12px;background:#FFFFFF;cursor:pointer">
          ${rdcOptions.map(r => '<option value="' + r + '"' + (filterRdc === r ? ' selected' : '') + '>' + (r === 'all' ? '全部' : r) + '</option>').join('')}
        </select>
      </label>
      <label style="font-size:12px;color:var(--text-secondary)">品牌：
        <select onchange="window._msFilterBrand=this.value;window._msDrill=null;renderShortage()" style="padding:4px 8px;border:1px solid #D1D5DB;border-radius:4px;font-size:12px;background:#FFFFFF;cursor:pointer;max-width:160px">
          ${brandOptions.map(b => '<option value="' + b + '"' + (filterBrand === b ? ' selected' : '') + '>' + (b === 'all' ? '全部' : b) + '</option>').join('')}
        </select>
      </label>
      <label style="font-size:12px;color:var(--text-secondary)">海南花露水：
        <select onchange="window._msFilterHainan=this.value;window._msDrill=null;renderShortage()" style="padding:4px 8px;border:1px solid #D1D5DB;border-radius:4px;font-size:12px;background:#FFFFFF;cursor:pointer">
          <option value="all"${filterHainan==='all'?' selected':''}>全部</option>
          <option value="yes"${filterHainan==='yes'?' selected':''}>仅海南花露水</option>
          <option value="no"${filterHainan==='no'?' selected':''}>不含海南花露水</option>
        </select>
      </label>
      <span style="font-size:11px;color:#94A3B8;margin-left:auto">窗口内共 ${_allUnfiltered.length} 个 SKU×RDC → 筛选后 ${allFiltered.length} 个${(filterRdc!=='all'||filterBrand!=='all'||filterHainan!=='all')?' · <a style="color:#3B82F6;cursor:pointer;text-decoration:underline" onclick="window._msFilterRdc=\'all\';window._msFilterBrand=\'all\';window._msFilterHainan=\'all\';window._msDrill=null;renderShortage()">清空筛选</a>':''}</span>
    </div>

    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px">
      <div class="card" style="text-align:center"><div style="font-size:22px;font-weight:700;color:var(--text-primary)">${wd || '—'}</div><div style="font-size:11px;color:var(--text-secondary)">有效工作日</div></div>
      <div class="card" style="text-align:center"><div style="font-size:22px;font-weight:700;color:var(--color-orange)">${formatNum(withShort.length)}</div><div style="font-size:11px;color:var(--text-secondary)">有首日缺货的 SKU×RDC</div></div>
      <div class="card" style="text-align:center"><div style="font-size:22px;font-weight:700;color:var(--color-red)">${formatNum(hi.length)}</div><div style="font-size:11px;color:var(--text-secondary)">严重度高 · 重点跟进</div></div>
      <div class="card" style="text-align:center"><div style="font-size:22px;font-weight:700;color:var(--color-blue)">${(monthMr * 100).toFixed(1)}%</div><div style="font-size:11px;color:var(--text-secondary)">${mode === 'rolling30' ? '30 天' : '月度'}首日缺货率（整体）</div></div>
    </div>

    <!-- v144-1：四象限「率」「频」含义文字解释段（红框位置：KPI 卡与 row-2 之间） -->
    <div style="background:#FAFBFC;border:1px solid #E5E7EB;border-left:3px solid #5B8DEF;border-radius:6px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:#475569;line-height:1.7">
      <div style="display:flex;gap:16px;flex-wrap:wrap">
        <div style="flex:1;min-width:240px">
          <span style="font-weight:600;color:#1F2937">「率」(MR · 首日缺货率)</span><span style="color:#94A3B8;margin-left:4px">= 强度，按「量」算</span><br>
          <span style="color:#64748B">分子：窗口内累计首日缺货量</span>　÷　<span style="color:#64748B">分母：窗口内累计订单量</span><br>
          <span style="font-size:11px;color:#94A3B8">例：8000 支订单里 5000 支首日没排上 → MR = 5000/8000 = 62.5%</span>
        </div>
        <div style="flex:1;min-width:240px;border-left:1px solid #E5E7EB;padding-left:16px">
          <span style="font-weight:600;color:#1F2937">「频」(SF · 缺货频率)</span><span style="color:#94A3B8;margin-left:4px">= 持续性，按「天」算</span><br>
          <span style="color:#64748B">分子：缺货工作日数</span>　÷　<span style="color:#64748B">分母：该 SKU×RDC 在窗口内的有单工作日数</span><br>
          <span style="font-size:11px;color:#94A3B8">例：12 天有单里 8 天缺货 → SF = 8/12 = 67%</span>
        </div>
      </div>
      <details style="margin-top:8px;padding-top:8px;border-top:1px dashed #E5E7EB;font-size:11px;color:#64748B">
        <summary style="cursor:pointer;font-weight:500;color:#475569;user-select:none;outline:none;list-style:none">
          <span style="color:#3B82F6">▶</span> <span style="color:#1F2937;font-weight:600">什么是「严重度评分」？点击展开完整判定逻辑</span>
        </summary>
        <div style="margin-top:10px;padding:10px 14px;background:#FFFFFF;border:1px solid #E5E7EB;border-radius:6px;line-height:1.7">
          <div style="margin-bottom:10px">
            <b>综合严重度评分 = 0.5 × 规模 + 0.3 × 率 + 0.2 × 频</b>，范围 0~1，越大越严重。
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11px">
            <div style="background:#FAFBFC;padding:8px 10px;border-radius:4px"><b style="color:#A32D2D">规模</b> = 缺货量在有效组合中的分位排名（0~1）　<span style="color:#64748B">// 缺最多=1.0</span></div>
            <div style="background:#FAFBFC;padding:8px 10px;border-radius:4px"><b style="color:#1E40AF">率</b> = 窗口内首日缺货量 ÷ 订单量　<span style="color:#64748B">// 100%=1.0</span></div>
            <div style="background:#FAFBFC;padding:8px 10px;border-radius:4px"><b style="color:#92400E">频</b> = 缺货工作日 ÷ 有单工作日　<span style="color:#64748B">// 100%=1.0</span></div>
            <div style="background:#FAFBFC;padding:8px 10px;border-radius:4px"><b style="color:#185FA5">为什么规模不压缩</b>：缺货量本身是长尾（最大是中位数的 50 倍），用分位排名<span style="color:#64748B">保留原始排序</span>，前 25% 的 SKU 能覆盖约 77% 的缺货量</div>
            <div style="background:#FAFBFC;padding:8px 10px;border-radius:4px"><b style="color:#791F1F">规模下限保险（v163 几何平均 + 软衰减）</b>：hardFloor = <b>${dynTh.hardFloor.toLocaleString()} 支</b> = 缺货量的<b>几何平均</b>（对数正态中心）。缺货量 &lt; hardFloor 时 sizePct <b>软衰减</b> ×(缺货量/hardFloor)，不是硬归零。<br><span style="color:#64748B">· 为什么几何平均：缺货量是长尾分布（偏度 3.64，标准差 &gt; 均值），对偏态分布几何平均才是"中心趋势"的正确度量<br>· 淡旺季实测：长尾 0.83x / <b>淡季双峰 1.34x（P50 会被小 SKU 拉太低，几何平均稳）</b> / 旺季 1.06x / 均匀 0.79x<br>· 软衰减示例：缺 72 支 →×0.14（几乎归零）；缺 432 支 →×0.84（接近保留）；缺 555 支 →×1.00</span></div>
          </div>
          <div style="margin-top:10px">
            <b>四象限怎么划分？</b>横轴=频（持续性），纵轴=率（强度），各以 50% 划线。
            <span style="color:#A32D2D">右</span>上（率+频都 ≥ 50%）= <b>率频双中</b>：缺得多 + 经常缺。
            <span style="color:#854F0B">左</span>上（频高率低）= <b>高频低率</b>：每单都缺一点。
            <span style="color:#185FA5">右</span>下（率高频低）= <b>低频高率</b>：偶发大单嫌疑。
            <span style="color:#5F5E5A">左</span>下（率+频都低）= <b>双低·偶发</b>。
            <div style="margin-top:4px;color:#64748B;font-size:11px">注意：四象限是<b>分布可视化</b>（只看率×频），与上方「严重度高」KPI 卡是两套口径——KPI 卡额外考虑规模，所以数字不同。</div>
          </div>
          <div style="margin-top:8px">
            <b>两个阈值（每月按实际数据自动算，不是固定值）：</b>
            <span style="background:#FEF3C7;color:#92400E;padding:2px 8px;border-radius:4px;margin:0 2px">严重度 ≥ ${SEV_DOUBLE_TXT}（前 25%）</span> 入选「严重度高重点跟进清单」　
            <span style="background:#FEE2E2;color:#A32D2D;padding:2px 8px;border-radius:4px;margin:0 2px">严重度 ≥ ${SEV_HIGH_TXT}（前 10%）</span> 触发补货紧急升级（每日「紧急」标签 / 中期「★月度持续」 / 安全库存 SS ×1.3）
          </div>
          <div style="margin-top:6px;color:#64748B;font-size:11px">
            本月基准：严重度评分 P75 = ${SEV_DOUBLE_TXT}、P90 = ${SEV_HIGH_TXT}（中位数 P50 = ${(dynTh.sevP50||0).toFixed(2)} 仅供参考）。<b>阈值跟随当月数据自适应</b>，淡季自动降低、旺季自动提高，清单长度恒定（约 25% / 10%）。
            <div style="margin-top:4px">集中度：按严重度排序，<b>前 25% 的 SKU 覆盖约 77% 的缺货量</b>，前 10% 覆盖约 46%——接近 2/8 法则，重点明确。</div>
            <div style="margin-top:4px"><b>业务硬保险</b>（v163 几何平均 + 软衰减）：hardFloor = <b>${dynTh.hardFloor.toLocaleString()} 支</b> = 缺货量的<b>几何平均</b>（对数正态的中心趋势）。缺货量低于此值时规模项<b>软衰减</b>（× 缺货量/hardFloor），不是一刀切归零。<br>
<span style="color:#64748B">· 统计依据：对偏态分布（标准差 &gt; 均值），几何平均才是正确的"中心"，算术中位数 P50 在淡季双峰时会被小 SKU 拉太低<br>
· 软衰减保留梯度：缺 72 支 ≈ 归零，缺 432 支 ≈ 保留 84%，缺 555 支 = 完全保留——避免"缺 500 和缺 50 一样"<br>
· 中位数参考 P50 = ${Math.round(dynTh.shortP50).toLocaleString()} 支</span></div>
          </div>
          <div style="margin-top:8px">
            <b>有效组合 vs 噪声剔除：</b>有效组合 = 当窗口有缺货 + 有单工作日 ≥ 4 天的 SKU×RDC；噪声剔除 = 有缺货但有单仅 1~3 天（频率无统计意义，不参与严重度高判定）。
          </div>
          <div style="margin-top:8px">
            <b>色条规则（分两类）：</b>
            <div style="margin-top:4px;padding:6px 10px;background:#F8FAFC;border-radius:4px">
              <b>① 业务硬阈值（不随月变）</b> — 业务自定义（v162 业务口径，无行业标准）：<br>
              · 首日满足率 <span style="color:#10B981">≥90% 绿</span>/<span style="color:#F59E0B">≥80% 黄</span>/<span style="color:#EF4444">&lt;80% 红</span>（衡量订单交付水平，属对客户的业务承诺口径，需跨月可比，故不随数据浮动）
            </div>
            <div style="margin-top:4px;padding:6px 10px;background:#FAFBFC;border-radius:4px">
              <b>② 数据驱动阈值（随当月数据自适应）</b> — 档位不随月变，具体数字会变：<br>
              · 严重度列 <span style="color:#DC2626">≥P90 红（紧急升级）</span>/<span style="color:#D97706">≥P75 橙（严重度高）</span>/<span style="color:#64748B">&lt;P75 灰</span>　
              当前月：严重度高 ≥ ${SEV_DOUBLE_TXT}（P75），紧急 ≥ ${SEV_HIGH_TXT}（P90）<br>
              · RDC 卡片「严重度高占比」色条 <span style="color:#EF4444">≥P75 红</span>/<span style="color:#F59E0B">≥P50 黄</span>/<span style="color:#10B981">&lt;P50 绿</span>　当前月：红 ≥ <b>${(hiPctP75 * 100).toFixed(1)}%</b>（6 个仓中占比最高的 25%）、黄 ≥ <b>${(hiPctP50 * 100).toFixed(1)}%</b>（中位数以上）<br>
              · 规模下限保险：缺货量 &lt; <b>${dynTh.hardFloor.toLocaleString()} 支</b>（几何平均）时规模项软衰减 ×(缺货量/hardFloor)，不硬归零
            </div>
          </div>
        </div>
      </details>
    </div>

      <div style="padding:12px">
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px" id="rdc-card-grid">
          ${rdcList.length > 0 ? rdcList.map(r => {
            // v168: 严重度高占比 = 跨 RDC 分位驱动（红 ≥P75 / 黄 ≥P50 / 绿 <P50），颜色已在 rdcList 预置为 r.hiPctColor
            //       首日满足率 = 业务硬阈值 90%/80%（v162 业务自定义，v168 修正 v162 漏改的 85%/78%）
            var fillColor = r.hiPctColor || '#10B981';

                '<div data-rdc-drill="rdc-valid:' + rdcAttr + '" style="text-align:center;padding:6px 4px;background:#F8FAFC;border-radius:4px;cursor:pointer" title="点击下钻有效组合"><div style="font-size:10px;color:#6B7280">有效组合</div><div style="font-size:18px;font-weight:600;line-height:1.2;color:#1F2937">' + r.valid + '</div></div>' +
                '<div data-rdc-drill="rdc-hi:' + rdcAttr + '" style="text-align:center;padding:6px 4px;background:#FEF2F2;border-radius:4px;cursor:pointer" title="点击下钻严重度高组合"><div style="font-size:10px;color:#6B7280">严重度高</div><div style="font-size:18px;font-weight:600;color:' + fillColor + ';line-height:1.2">' + r.hi + '</div></div>' +
                '<div data-rdc-drill="rdc-noise:' + rdcAttr + '" style="text-align:center;padding:6px 4px;background:#F8FAFC;border-radius:4px;cursor:pointer" title="点击下钻噪声剔除"><div style="font-size:10px;color:#6B7280">噪声</div><div style="font-size:18px;font-weight:600;color:#9CA3AF;line-height:1.2">' + (r.noise || '—') + '</div></div>' +

  const data = window._msDrillData || {};

  else if (dr === 'q2') { items = data.q2 || []; title = 'Q2 · 高频低率'; sub = '频次高但单次缺货率低 — 每单都缺一点'; drillType = 'quadrant'; }

  else if (dr === 'q4') { items = data.q4 || []; title = 'Q4 · 双低 · 偶发小量'; sub = '噪声区 — 偶发小量缺货'; drillType = 'quadrant'; }
  else if (dr.indexOf('rdc-valid:') === 0) { const rdc = dr.substring(dr.indexOf(':') + 1); items = data.byRdc[rdc] || []; title = rdc + ' · 该仓有效组合'; sub = '有首日缺货 且 有单工作日 ≥ ' + MS_PROFILE.MIN_DAYS + ' 天的全部组合'; drillType = 'rdc'; }
  else if (dr.indexOf('rdc-hi:') === 0) { const rdc = dr.substring(dr.indexOf(':') + 1); items = data.byRdc[rdc] ? data.byRdc[rdc].filter(p => p.isPersistent) : []; title = rdc + ' · 该仓严重度高组合'; sub = '严重度评分 ≥ ' + (window._msSevDouble||0.55).toFixed(2) + '（本月 P75，前 25%）的 SKU（缺得多 + 经常缺）'; drillType = 'rdc'; }
  else if (dr.indexOf('rdc-noise:') === 0) { const rdc = dr.substring(dr.indexOf(':') + 1); items = data.byRdcNoise ? (data.byRdcNoise[rdc] || []) : []; title = rdc + ' · 该仓噪声剔除'; sub = '有缺货但有单仅 1~3 天（频率无统计意义，不参与双高判定）'; drillType = 'rdc'; }
  else if (dr.indexOf('rdc-all:') === 0) { const rdc = dr.substring(dr.indexOf(':') + 1); items = data.byRdcAll ? (data.byRdcAll[rdc] || []) : []; title = rdc + ' · 该仓全部缺货'; sub = '当窗口内所有有首日缺货的组合（含有效+噪声），按缺货量降序'; drillType = 'rdc'; }
  else if (dr.indexOf('rdc:') === 0) { const rdc = dr.substring(dr.indexOf(':') + 1); items = data.byRdc[rdc] || []; title = rdc + ' · 该仓有效组合'; sub = '有首日缺货 且 有单工作日 ≥ ' + MS_PROFILE.MIN_DAYS + ' 天的全部组合'; drillType = 'rdc'; }
  else if (dr.indexOf('sku:') === 0) { const sku = dr.substring(dr.indexOf(':') + 1); const g = data.sku[sku]; if (!g) { items = []; title = sku + ' · 跨 RDC 画像'; sub = '该 SKU 在所有 RDC 的当前月数据'; } else { items = g.list; title = sku + ' ' + g.name + ' · 跨 RDC 画像'; sub = '品牌：' + g.brand + ' · 同一 SKU 在所有 RDC 的当前窗口表现（共 ' + items.length + ' 个 RDC）'; } drillType = 'sku'; }
  else return;

  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  // 品牌总览（v145 新增）
  const brandSummary = buildBrandSummary(items);
  const brandHtml = brandSummary.length === 0 ? '<div style="padding:12px;text-align:center;color:#94A3B8">无品牌聚合数据</div>' :
    '<table class="data-table" style="font-size:12px;margin-bottom:8px">' +

  const modal = document.createElement('div');

  modal.innerHTML =

      '</div>' +

        '</details>') +
      '</div>' +
    '</div>';
  // 点击遮罩关闭（但点击内容不关闭）
  modal.addEventListener('click', function(ev) { if (ev.target === modal) closeDrillModal(); });
  document.body.appendChild(modal);
  // ESC 关闭
  document.addEventListener('keydown', modal._escHandler = function(ev) { if (ev.key === 'Escape') closeDrillModal(); });

// v155: 拆分为「仅清 DOM」和「重置状态」两个函数 —— openDrillModal 翻页/重开时
// 不能再调 closeDrillModal(那会重置 _msDrillPage=1 让用户翻页后跳回第1页)
function closeDrillModalDOM() {
  const old = document.getElementById('drill-modal-root');
  if (old) {
    if (old._escHandler) document.removeEventListener('keydown', old._escHandler);
    old.remove();
  }
}
function closeDrillModal() {
  closeDrillModalDOM();
  window._msDrill = null;
  window._msDrillPage = 1;
}
window.openDrillModal = openDrillModal;
window.closeDrillModal = closeDrillModal;
window.closeDrillModalDOM = closeDrillModalDOM;

function buildBrandSummary(items) {
  const byBrand = {};
  items.forEach(p => {
    const b = String(p.brand || '其他');
    if (!byBrand[b]) byBrand[b] = { brand: b, count: 0, hi: 0, order: 0, short: 0 };
    byBrand[b].count++;
    if (p.isPersistent) byBrand[b].hi++;
    byBrand[b].order += p.orderQty || 0;
    byBrand[b].short += p.shortQty || 0;
  });
  return Object.values(byBrand)
    .map(b => ({ ...b, mr: b.order > 0 ? b.short / b.order : 0 }))
    .sort((a, b) => b.short - a.short);
}

function renderDrillTableBody(items) {

  const tagHtml = p => {
    if (p.isPersistent) return '<span style="padding:1px 6px;border-radius:4px;font-size:10px;background:#FEE2E2;color:#DC2626;white-space:nowrap;font-weight:600">持续</span>';
    if (p.mr >= MS_PROFILE.MR && p.sf >= MS_PROFILE.SF) return '<span style="padding:1px 6px;border-radius:4px;font-size:10px;background:#FEF3C7;color:#92400E;white-space:nowrap">高率+高频</span>';
    if (p.mr >= MS_PROFILE.MR) return '<span style="padding:1px 6px;border-radius:4px;font-size:10px;background:#FEF3C7;color:#92400E;white-space:nowrap">高率</span>';
    if (p.sf >= MS_PROFILE.SF) return '<span style="padding:1px 6px;border-radius:4px;font-size:10px;background:#DBEAFE;color:#2563EB;white-space:nowrap">高频</span>';
    return '<span style="color:#CBD5E1;font-size:10px">—</span>';
  };
  const perPage = 30;
  const p = Math.min(Math.max(1, window._msDrillPage || 1), Math.ceil(items.length / perPage) || 1);
  const tp = Math.ceil(items.length / perPage) || 1;
  const start = (p - 1) * perPage;
  const page = items.slice(start, start + perPage);
  const navHtml = tp > 1 ?

      '<td style="text-align:right;color:var(--color-red);font-weight:600">' + p.shortQty.toLocaleString() + '</td>' +

      '<td style="text-align:right">' + (p.sf * 100).toFixed(0) + '%</td>' +

      '<td style="text-align:center">' + tagHtml(p) + '</td>' +

}

// ============ SHORTAGE ORDER-DETAIL ANALYSIS ============
function renderShortageOrderDetail() {
  setTitle('缺货分析 - 订单明细');
  const page = document.getElementById('page-shortage');
  if (!page || !dataStore.loaded || dataStore.orderDetail.length === 0) {
    page.innerHTML = '<div style="text-align:center;padding:80px;color:var(--text-secondary)">请先导入包含订单明细的数据</div>';
    return;
  }

  const data = dataStore.orderDetail;
  const monthFilter = filters.dataMonth && filters.dataMonth !== 'all';

  // ---- Filters ----
  window._odRdc = window._odRdc || 'all';
  const odRdc = window._odRdc;
  // Channel checkboxes: default both checked (only when undefined)
  if (typeof window._odChKa === 'undefined') window._odChKa = true;
  if (typeof window._odChDealer === 'undefined') window._odChDealer = true;
  const showKa = window._odChKa;
  const showDealer = window._odChDealer;
  const activeChannels = [];
  if (showKa) activeChannels.push('KA');
  if (showDealer) activeChannels.push('经销商');

  // Get all RDCs from orderDetail
  const allRdcs = [...new Set(data.map(d => d.warehouse).filter(Boolean))].sort();

  // Apply month+RDC+channel filters
  let filtered = data;
  if (monthFilter) filtered = filtered.filter(d => d.dateStr && d.dateStr.startsWith(filters.dataMonth));
  if (odRdc !== 'all') filtered = filtered.filter(d => d.warehouse === odRdc);
  if (activeChannels.length > 0 && activeChannels.length < 2) {
    filtered = filtered.filter(d => activeChannels.includes(d.channel));
  } else if (activeChannels.length === 0) {
    filtered = [];
  }

  // ---- 汇总统计 (all/ka/dealer from filtered data, respecting channel) ----
  // 新口径：A=订单总量，B=首日累计未满足，C=累计未满足，D=累计已满足，E=拒绝（删单）；A=C+D，E⊂C，C≤B
  function buildSummary(src) {
    const s = { orderQty: 0, firstShort: 0, gap: 0, totalFulfilled: 0, reject: 0 };
    src.forEach(d => {
      s.orderQty += d.orderQty;
      s.firstShort += d.firstDayShort;
      s.gap += d.totalGap;
      s.totalFulfilled += d.totalFulfillQty;
      if (d.rejectReason && d.rejectReason.trim() !== '') s.reject += d.firstDayShort;
    });
    return s;
  }
  const sumAll = buildSummary(filtered);
  const sumKa = buildSummary(filtered.filter(d => d.channel === 'KA'));
  const sumDealer = buildSummary(filtered.filter(d => d.channel === '经销商'));

  // ---- 品牌维度 ----
  const brandMap = {};
  filtered.forEach(d => {
    if (!brandMap[d.brand]) brandMap[d.brand] = { all:0, ka:0, dealer:0, fulfilled:0, kaFulfilled:0, dealerFulfilled:0 };
    brandMap[d.brand].all += d.firstDayShort;
    brandMap[d.brand].fulfilled += d.firstDayQty;
    if (d.channel === 'KA') { brandMap[d.brand].ka += d.firstDayShort; brandMap[d.brand].kaFulfilled += d.firstDayQty; }
    else if (d.channel === '经销商') { brandMap[d.brand].dealer += d.firstDayShort; brandMap[d.brand].dealerFulfilled += d.firstDayQty; }
  });
  const brandSorted = Object.entries(brandMap).sort((a,b) => b[1].all - a[1].all);

  // 按渠道分别汇总各品牌 TOP5 主要缺货 SKU（用于表格 hover 弹框，按渠道区分）
  function buildBrandTopShortage(channel) {
    var m = {};
    filtered.forEach(function(d) {
      if (!d.brand || !d.skuCode || !(d.firstDayShort > 0)) return;
      if (channel && d.channel !== channel) return;
      if (!m[d.brand]) m[d.brand] = {};
      if (!m[d.brand][d.skuCode]) m[d.brand][d.skuCode] = { code: d.skuCode, name: d.skuName, gap: 0 };
      m[d.brand][d.skuCode].gap += d.firstDayShort;
    });
    Object.keys(m).forEach(function(b) {
      m[b] = Object.values(m[b]).sort(function(a, c) { return c.gap - a.gap; }).slice(0, 5);
    });
    return m;
  }
  var brandTopAll = buildBrandTopShortage(null);
  var brandTopKa = buildBrandTopShortage('KA');
  var brandTopDealer = buildBrandTopShortage('经销商');

  // ---- SKU维度明细 ----
  const skuMap = {};
  filtered.forEach(d => {
    const key = d.brand + '|' + d.skuCode;
    if (!skuMap[key]) skuMap[key] = {
      brand: d.brand, skuCode: d.skuCode, skuName: d.skuName,
      orderQty:0, firstShort:0, gap:0, totalFulfilled:0, reject:0,
      kaFirstShort:0, kaGap:0, dealerFirstShort:0, dealerGap:0,
      dates: new Set()
    };
    const s = skuMap[key];
    s.orderQty += d.orderQty;
    s.firstShort += d.firstDayShort;
    s.gap += d.totalGap;
    s.totalFulfilled += d.totalFulfillQty;
    if (d.rejectReason && d.rejectReason.trim() !== '') s.reject += d.firstDayShort;
    s.dates.add(d.dateStr);
    if (d.channel === 'KA') { s.kaFirstShort += d.firstDayShort; s.kaGap += d.totalGap; }
    else if (d.channel === '经销商') { s.dealerFirstShort += d.firstDayShort; s.dealerGap += d.totalGap; }
  });
  let skuList = Object.values(skuMap).sort((a,b) => b.gap - a.gap);
  // ---- 新增筛选：KA&经销商都缺货 ----
  window._odBothShort = typeof window._odBothShort === 'undefined' ? false : window._odBothShort;
  const showBothOnly = window._odBothShort;

  // Apply both-short filter
  if (showBothOnly) {
    skuList = skuList.filter(s => s.kaFirstShort > 0 && s.dealerFirstShort > 0);
  }

    <select onchange="window._odRdc=this.value;window._shortageSkuPage=1;renderShortage()" style="padding:3px 8px;border:1px solid var(--border-card);border-radius:4px;font-size:12px">

    </select>`;
  const channelFilterHtml = `<label>渠道：</label>
    <label style="display:inline-flex;align-items:center;gap:3px;margin-right:8px;font-size:12px;cursor:pointer">
      <input type="checkbox" ${showKa?'checked':''} onchange="window._odChKa=this.checked;window._shortageSkuPage=1;renderShortage()"> KA
    </label>
    <label style="display:inline-flex;align-items:center;gap:3px;font-size:12px;cursor:pointer">
      <input type="checkbox" ${showDealer?'checked':''} onchange="window._odChDealer=this.checked;window._shortageSkuPage=1;renderShortage()"> 经销商
    </label>`;

  const summaryFilterHtml = `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto">
      <label style="font-size:12px">RDC：</label>
      <select onchange="window._odRdc=this.value;window._shortageSkuPage=1;renderShortage()" style="padding:3px 8px;border:1px solid var(--border-card);border-radius:4px;font-size:12px">
        <option value="all" ${odRdc==='all'?'selected':''}>全部RDC</option>
        ${allRdcs.map(r => '<option value="'+r+'"'+(odRdc===r?' selected':'')+'>'+r+'</option>').join('')}
      </select>
      <label style="font-size:12px">渠道：</label>
      <label style="display:inline-flex;align-items:center;gap:3px;margin-right:8px;font-size:12px;cursor:pointer">
        <input type="checkbox" ${showKa?'checked':''} onchange="window._odChKa=this.checked;window._shortageSkuPage=1;renderShortage()"> KA
      </label>
      <label style="display:inline-flex;align-items:center;gap:3px;font-size:12px;cursor:pointer">
        <input type="checkbox" ${showDealer?'checked':''} onchange="window._odChDealer=this.checked;window._shortageSkuPage=1;renderShortage()"> 经销商
      </label>
    </div>`;

  page.innerHTML = `
    <div class="filter-bar" style="flex-wrap:wrap">
      <span style="font-size:12px;color:var(--text-secondary)">基于${monthLabel}订单明细（${filtered.length}条记录）</span>
      <button class="btn-export" onclick="exportShortageOrderDetailCSV()" style="margin-left:auto">导出CSV</button>
    </div>
    <!-- Tab切换：订单缺货明细分析 / 客户维度缺货分析 / 月度缺货全貌 -->
    ${shortageTabBarHtml('order-detail')}


    <!-- 表1: 汇总统计 + 图表 -->
    <div class="card" style="margin-bottom:12px">
      <div class="card-header" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span class="card-title">汇总统计</span>
        ${summaryFilterHtml}
      </div>
      <div style="display:flex;flex-wrap:wrap;justify-content:flex-start;gap:8px">
        <div class="chart-container" style="flex:0 0 320px;height:260px" id="chart-od-summary-ka"></div>
        <div class="chart-container" style="flex:0 0 320px;height:260px" id="chart-od-summary-dealer"></div>
      </div>
      <div style="margin-top:12px">
        <table class="data-table" style="font-size:12px;max-width:720px">
          <thead><tr>
            <th>统计范围</th><th style="text-align:right">订单总量(A)</th><th style="text-align:right;color:var(--color-red)">首日累计未满足(B)</th>
            <th style="text-align:right;color:var(--color-blue)">累计未满足(C)</th><th style="text-align:right;color:var(--color-green)">累计已满足(D)</th><th style="text-align:right;color:var(--color-orange)">拒绝（删单）(E)</th>
          </tr></thead>
          <tbody>
            ${[
              {key:'KA订单', s:sumKa},

            ].map(({key,s}) => '<tr>' +
              '<td>'+key+'</td>' +

const MATRIX_BRANDS = ['上海','六神','启初','家安','美加净','高夫','传统'];
const MATRIX_RDCS = ['华南RDC','华北RDC','东北RDC','西北RDC','华中RDC','西南RDC'];

// 满足率背景色（红→黄→绿，与图2 渐变一致）
function matrixColor(rate) {
  if (rate >= 0.95) return { bg: '#A7F3D0', fg: '#065F46' }; // 深绿
  if (rate >= 0.85) return { bg: '#D1FAE5', fg: '#065F46' }; // 绿
  if (rate >= 0.7)  return { bg: '#FEF3C7', fg: '#92400E' }; // 黄
  if (rate >= 0.5)  return { bg: '#FED7AA', fg: '#9A3412' }; // 橙
  if (rate > 0)     return { bg: '#FECACA', fg: '#991B1B' }; // 浅红
  return { bg: '#F3F4F6', fg: '#6B7280' }; // 灰
}


function exportShortageOrderDetailCSV() {
  const data = dataStore.orderDetail;
  const monthFilter = filters.dataMonth && filters.dataMonth !== 'all';
  const odRdc = window._odRdc || 'all';
  const showKa = window._odChKa !== false;
  const showDealer = window._odChDealer !== false;
  const activeCh = [];
  if (showKa) activeCh.push('KA');
  if (showDealer) activeCh.push('经销商');

  let filtered = data;
  if (monthFilter) filtered = filtered.filter(d => d.dateStr && d.dateStr.startsWith(filters.dataMonth));
  if (odRdc !== 'all') filtered = filtered.filter(d => d.warehouse === odRdc);
  if (activeCh.length > 0) filtered = filtered.filter(d => activeCh.includes(d.channel));

  const skuMap = {};
  filtered.forEach(d => {
    const key = d.brand + '|' + d.skuCode;
    if (!skuMap[key]) skuMap[key] = {
      brand: d.brand, skuCode: d.skuCode, skuName: d.skuName,
      orderQty:0, firstShort:0, gap:0, totalFulfilled:0, reject:0,
      kaFirstShort:0, kaGap:0, dealerFirstShort:0, dealerGap:0
    };
    const s = skuMap[key];
    s.orderQty += d.orderQty;
    s.firstShort += d.firstDayShort;
    s.gap += d.totalGap;
    s.totalFulfilled += d.totalFulfillQty;
    if (d.rejectReason && d.rejectReason.trim() !== '') s.reject += d.firstDayShort;
    if (!skuMap[key]._dates) skuMap[key]._dates = new Set();
    skuMap[key]._dates.add(d.dateStr);
    if (d.channel === 'KA') { s.kaFirstShort += d.firstDayShort; s.kaGap += d.totalGap; }
    else if (d.channel === '经销商') { s.dealerFirstShort += d.firstDayShort; s.dealerGap += d.totalGap; }
  });
  const skuList = Object.values(skuMap);
  let csv = '\uFEFF品牌,SKU编码,SKU名称,订单总量(A),首日累计未满足(B),累计未满足(C),累计已满足(D),拒绝（删单）(E),KA&经销商都缺货,KA首日累计未满足,KA累计未满足,经销首日累计未满足,经销累计未满足\n';
  skuList.forEach(s => {
    const bothShort = (s.kaFirstShort > 0 && s.dealerFirstShort > 0) ? '是' : '';
    csv += s.brand + ',' + s.skuCode + ',"' + s.skuName + '",' + s.orderQty + ',' + s.firstShort + ',' + s.gap + ',' + s.totalFulfilled + ',' + s.reject + ',' + bothShort + ',' + s.kaFirstShort + ',' + s.kaGap + ',' + s.dealerFirstShort + ',' + s.dealerGap + '\n';
  });
  downloadFile('订单缺货分析_' + new Date().toISOString().slice(0,10) + '.csv', csv);
}

function renderCustomerImpl(page) {

    cgMap[d.customerGroup].fulfillQty += d.totalFulfillQty;

  });

  if (window.customerSortMode === 'qty') {

    cgSorted.sort((a, b) => b.monthRate - a.monthRate);

function drillCustomerByIndex(idx) {
  const list = window._cgSummary || window._cgSorted || [];
  if (idx >= 0 && idx < list.length) {
    window.drillCustomer = list[idx];
    renderCustomerToShortage();
  }
}

function drillCustomerByName(name) {
  const list = window._cgSorted || [];
  const found = list.find(d => d.name === name);
  if (found) {
    window.drillCustomer = found;
    renderCustomerToShortage();
  }
}

// 渲染客户下钻详情 - 显示该客户的主要缺货SKU
// ===== 箱规 / 在途(箱) / 大仓供应 辅助（缺货报告增强）=====
const RDC_TRANSIT_KEY = {'华南RDC':'huananTransit','华北RDC':'huabeiTransit','东北RDC':'dongbeiTransit','西北RDC':'xibeiTransit','华中RDC':'huazhongTransit','西南RDC':'xinanTransit'};
function buildSupplyMaps() {
  // 每次重建，避免 dataStore.shortage 更新后索引仍停留在旧数据
  window._shortageByCode = {};
  dataStore.shortage.forEach(function(s) {
    const c = String(s.materialCode == null ? '' : s.materialCode).replace(/^0+/, '').trim();
    if (!c) return;
    (window._shortageByCode[c] = window._shortageByCode[c] || []).push(s);
  });
}
// 取某 SKU 的供应信息：在途(箱)=缺货报告原始在途箱数；大仓供应=缺货汇总文本
// rdc: 指定RDC时报该RDC在途，否则报合计在途；dateStr: 优先匹配该日期的缺货记录
function getSkuSupplyInfo(code, rdc, dateStr) {
  buildSupplyMaps();
  const bs = (window._boxSpec && window._boxSpec[String(code)] != null) ? window._boxSpec[String(code)] : null;
  const entries = window._shortageByCode ? window._shortageByCode[String(code)] : null;
  let entry = null;
  if (entries && entries.length) {
    if (dateStr) entry = entries.filter(function(e){ return e.dateStr === dateStr; })[0] || entries[0];
    else entry = entries.slice().sort(function(a,b){ return (a.date && b.date) ? (a.date < b.date ? 1 : -1) : 0; })[0];
  }
  let dcSupply = entry ? (entry.dcSupply || '') : '';
  let transitBoxes = 0;
  let shortageBoxes = 0;
  if (entry) {
    if (rdc && RDC_TRANSIT_KEY[rdc]) transitBoxes = entry[RDC_TRANSIT_KEY[rdc]] || 0;
    else transitBoxes = entry.rdcTransitTotal || 0;
    const rdcShortKeyMap = {'华南RDC':'huananShort','华北RDC':'huabeiShort','东北RDC':'dongbeiShort','西北RDC':'xibeiShort','华中RDC':'huazhongShort','西南RDC':'xinanShort'};
    if (rdc && rdcShortKeyMap[rdc]) shortageBoxes = entry[rdcShortKeyMap[rdc]] || 0;
    else shortageBoxes = entry.rdcShortBoxes || 0;
  }
  const transitUnits = (bs && transitBoxes) ? Math.round(transitBoxes * bs) : null;
  return { boxSpec: bs, dcSupply: dcSupply, transitBoxes: transitBoxes, transitUnits: transitUnits, shortageBoxes: shortageBoxes };
}

function floatTipInit() {

  document.head.appendChild(st);
  const d = document.createElement('div');
  d.id = 'float-tip'; d.className = 'float-tip';
  document.body.appendChild(d);
  function pos(e){ const t=document.getElementById('float-tip'); const pad=14,vw=window.innerWidth,vh=window.innerHeight,w=t.offsetWidth,h=t.offsetHeight; let l=e.clientX+pad,tp=e.clientY+pad; if(l+w+8>vw)l=e.clientX-w-8; if(tp+h+8>vh)tp=e.clientY-h-8; t.style.left=Math.max(8,l)+'px'; t.style.top=Math.max(8,tp)+'px'; }
  document.addEventListener('mouseover', function(e){ const el=e.target.closest('[data-tip]'); if(el){ const t=document.getElementById('float-tip'); t.innerHTML=window._tipStore[el.getAttribute('data-tip')]||''; t.style.display='block'; pos(e); } });
  document.addEventListener('mousemove', function(e){ const t=document.getElementById('float-tip'); if(t.style.display==='block') pos(e); });
  document.addEventListener('mouseout', function(e){ const el=e.target.closest('[data-tip]'); if(el){ document.getElementById('float-tip').style.display='none'; } });
}

// 统一的 TOP缺货SKU 悬浮表：含 RDC在途(箱) + 大仓供应，数字右对齐，避免挤在一起
// skus: [{code,name,...}]；metricLabel: 指标列名；metricFn(s, info): 返回指标单元格HTML；rdc: 指定RDC(用于取在途，否则取合计)
function buildTopShortTipTable(skus, metricLabel, metricFn, rdc) {
  if (!skus || !skus.length) return '<div style="color:#9ca3af;margin-top:4px">无缺货SKU记录</div>';
  let html = '<table class="tip-sku-table"><thead><tr><th class="c">#</th><th>SKU代码</th><th>品名</th><th class="num">' + metricLabel + '</th><th class="num">RDC在途(箱)</th><th>大仓供应</th></tr></thead><tbody>';
  skus.forEach(function(s, i) {
    const info = getSkuSupplyInfo(s.code, rdc);
    const transit = info.transitBoxes ? formatNum(info.transitBoxes) : '—';
    const supply = info.dcSupply || '—';
    html += '<tr><td class="c">' + (i+1) + '</td>' +
      '<td>' + s.code + '</td>' +
      '<td class="nm">' + (s.name || '-') + '</td>' +
      '<td class="num">' + metricFn(s, info) + '</td>' +
      '<td class="num">' + transit + '</td>' +
      '<td class="sup">' + supply + '</td></tr>';
  });
  html += '</tbody></table>';
  return html;
}

function renderCustomerDrillDetail(customer) {
  // 从订单明细中找出该客户组的订单，并过滤月份
  let custOrders = dataStore.orderDetail.filter(d => d.customerGroup === customer.name);
  const monthLabel = (filters.dataMonth && filters.dataMonth !== 'all') ? '所选月份(' + filters.dataMonth + ')' : '全量历史';
  if (filters.dataMonth && filters.dataMonth !== 'all') {
    custOrders = custOrders.filter(d => d.dateStr && d.dateStr.startsWith(filters.dataMonth));
  }
  
  // 计算每个SKU的总缺货量（只统计有缺货/被拒的订单行，与下方"按SKU+仓库聚合"明细表口径一致）
  const skuGapMap = {};
  custOrders.filter(d => (d.totalGap||0) > 0 || (d.rejectReason && d.rejectReason.trim())).forEach(d => {
    const key = d.skuCode || d.skuName || '未知';
    if (!skuGapMap[key]) skuGapMap[key] = { code: d.skuCode, name: d.skuName, brand: d.brand, gapQty: 0, orderQty: 0, fulfillQty: 0, totalGap: 0, rejectQty: 0 };
    skuGapMap[key].gapQty += (d.totalGap || 0);
    skuGapMap[key].orderQty += (d.orderQty || 0);
    skuGapMap[key].fulfillQty += (d.totalFulfillQty || 0);
    skuGapMap[key].totalGap += (d.totalGap || 0);
    if (d.rejectReason && d.rejectReason.trim()) skuGapMap[key].rejectQty += (d.orderQty || 0);
  });

  // 扣除拒绝量后的真实缺口 = 原始缺口 - 拒绝量
  Object.values(skuGapMap).forEach(s => {
    s.realGap = Math.max(0, s.gapQty - s.rejectQty);
  });
  
  // 只取有缺货的SKU，按真实缺口排序
  const skuWithGaps = Object.values(skuGapMap)
    .filter(s => s.realGap > 0)
    .sort((a, b) => b.realGap - a.realGap)
    .slice(0, 10);

  // 从缺货汇总表中找该客户的缺货信息（按物料号关联）
  const relatedShortages = dataStore.shortage.filter(s => {
    // 尝试通过品牌或物料名关联

  const totalGapBoxes = Object.values(skuGapMap).reduce((s, sku) => {

    </div>
    <div class="row-2">
      <div class="card" style="flex:1.5">
        <div class="card-header"><span class="card-title">⚠️ 主要缺货SKU排名（${monthLabel}）</span></div>
        <div class="table-wrap" style="max-height:400px">
          <table class="data-table">
            <thead><tr><th>排名</th><th>SKU代码</th><th>SKU品名</th><th>品牌</th><th>订单量</th><th>履约量</th><th>缺口量(箱)</th><th>拒绝量</th><th>缺货率</th><th>RDC在途(箱)</th><th>大仓供应</th></tr></thead>
            <tbody>
              ${skuWithGaps.length > 0 ? skuWithGaps.map((sku, i) => `<tr>
                <td><span class="badge ${i<3?'badge-red':'badge-orange'}">#${i+1}</span></td>
                <td>${sku.code || '-'}</td>
                <td style="max-width:180px" title="${sku.name}">${sku.name || '-'}</td>
                <td>${sku.brand || '-'}</td>
                <td class="num">${formatNum(sku.orderQty)}</td>
                <td class="num" style="color:#059669">${formatNum(Math.round(sku.fulfillQty))}</td>
                <td class="num" style="color:#EF4444;font-weight:600">${(()=>{const bs=window._boxSpec&&window._boxSpec[sku.code];return bs?formatNum(Math.round(sku.realGap/bs)):formatNum(sku.realGap);})()}</td>

// ============ WEEKEND SIMULATION ============
function runWeekendSimulation(monthStr) {
  if (!dataStore.orderDetail || dataStore.orderDetail.length === 0) return null;

  // Filter by month if provided
  let filteredOrders = dataStore.orderDetail;
  if (monthStr && monthStr !== 'all') {
    filteredOrders = dataStore.orderDetail.filter(d => d.dateStr && d.dateStr.startsWith(monthStr));
  }
  if (filteredOrders.length === 0) return null;

  // 1. 按日期、RDC、SKU分组汇总订单明细
  const groupMap = new Map();
  for (const order of filteredOrders) {
    const key = `${order.dateStr}|${order.warehouse}|${order.skuCode}`;
    if (!groupMap.has(key)) {
      groupMap.set(key, {
        dateStr: order.dateStr, warehouse: order.warehouse,
        skuCode: order.skuCode, skuName: order.skuName,
        orderQty: 0, firstDayQty: 0, firstDayShort: 0,
        totalFulfillQty: 0, totalGap: 0
      });
    }
    const g = groupMap.get(key);
    g.orderQty += order.orderQty;
    g.firstDayQty += order.firstDayQty;
    g.firstDayShort += order.firstDayShort;
    g.totalFulfillQty += order.totalFulfillQty;
    g.totalGap += order.totalGap;
  }

  const allGroups = Array.from(groupMap.values());

  // 2. 按日期分组
  const byDate = new Map();
  for (const g of allGroups) {
    if (!byDate.has(g.dateStr)) byDate.set(g.dateStr, []);
    byDate.get(g.dateStr).push(g);
  }

  // 3. 计算全月各RDC原始数据
  const rdcMonthData = new Map();
  for (const g of allGroups) {
    const rdc = g.warehouse;
    if (!rdcMonthData.has(rdc)) {
      rdcMonthData.set(rdc, { orderQty: 0, firstDayQty: 0, totalFulfillQty: 0 });
    }
    const r = rdcMonthData.get(rdc);
    r.orderQty += g.orderQty;
    r.firstDayQty += g.firstDayQty;
    r.totalFulfillQty += g.totalFulfillQty;
  }

  // 4. 识别周末并计算模拟
  const weekendResults = [];
  const rdcWeekendIncrement = new Map();

  for (const [dateStr, groups] of byDate) {
    const d = new Date(dateStr);
    const dayOfWeek = d.getDay(); // 0=周日, 6=周六
    if (dayOfWeek !== 0 && dayOfWeek !== 6) continue;

    const mondayD = new Date(d);
    mondayD.setDate(mondayD.getDate() + (dayOfWeek === 6 ? 2 : 1));
    const mondayStr = fmtDate(mondayD);

    const mondayGroups = byDate.get(mondayStr) || [];
    const mondayMap = new Map();
    for (const mg of mondayGroups) {
      mondayMap.set(`${mg.warehouse}|${mg.skuCode}`, mg);
    }

    let originalFirstDay = 0;
    let simulatedFirstDay = 0;
    let totalOrderQty = 0;

    for (const wg of groups) {
      originalFirstDay += wg.firstDayQty;
      totalOrderQty += wg.orderQty;

      const rdc = wg.warehouse;
      const mondayKey = `${wg.warehouse}|${wg.skuCode}`;
      const mondayGroup = mondayMap.get(mondayKey);

      if (mondayGroup && mondayGroup.firstDayShort === 0) {
        // 周一无缺失（firstDayShort=0），模拟该周末SKU订单100%满足
        simulatedFirstDay += wg.orderQty;
        rdcWeekendIncrement.set(rdc, (rdcWeekendIncrement.get(rdc) || 0) + (wg.orderQty - wg.firstDayQty));
      } else {
        // 周一有缺失或没有对应订单，维持原状
        simulatedFirstDay += wg.firstDayQty;
      }
    }

    weekendResults.push({
      weekendDate: dateStr, mondayDate: mondayStr,
      orderQty: totalOrderQty,
      originalRate: totalOrderQty > 0 ? originalFirstDay / totalOrderQty : 0,
      simulatedRate: totalOrderQty > 0 ? simulatedFirstDay / totalOrderQty : 0,
      improvement: totalOrderQty > 0 ? (simulatedFirstDay - originalFirstDay) / totalOrderQty : 0,
      originalFirstDayQty: originalFirstDay,
      simulatedFirstDayQty: simulatedFirstDay,
      increment: simulatedFirstDay - originalFirstDay
    });
  }

  // 5. 全月汇总
  let totalMonthOrder = 0;
  let totalMonthOriginalFirstDay = 0;
  let totalMonthTotalFulfill = 0;

  for (const g of allGroups) {
    totalMonthOrder += g.orderQty;
    totalMonthOriginalFirstDay += g.firstDayQty;
    totalMonthTotalFulfill += g.totalFulfillQty;
  }

  const totalIncrement = weekendResults.reduce((s, r) => s + r.increment, 0);
  const totalMonthSimulatedFirstDay = totalMonthOriginalFirstDay + totalIncrement;

  // 6. RDC维度计算
  const rdcNames = ['华南RDC','华北RDC','东北RDC','西北RDC','华中RDC','西南RDC'];
  const rdcResults = rdcNames.map(rdc => {
    const monthData = rdcMonthData.get(rdc) || { orderQty: 0, firstDayQty: 0, totalFulfillQty: 0 };
    const increment = rdcWeekendIncrement.get(rdc) || 0;
    const simulatedFirstDay = monthData.firstDayQty + increment;
    const originalRate = monthData.orderQty > 0 ? monthData.firstDayQty / monthData.orderQty : 0;
    const simulatedRate = monthData.orderQty > 0 ? simulatedFirstDay / monthData.orderQty : 0;

    return {
      rdc, orderQty: monthData.orderQty,
      originalRate, simulatedRate,
      improvement: simulatedRate - originalRate,
      originalFirstDay: monthData.firstDayQty,
      simulatedFirstDay: simulatedFirstDay
    };
  });

  return {
    originalDayRate: totalMonthOrder > 0 ? totalMonthOriginalFirstDay / totalMonthOrder : 0,
    simulatedDayRate: totalMonthOrder > 0 ? totalMonthSimulatedFirstDay / totalMonthOrder : 0,
    originalMonthRate: totalMonthOrder > 0 ? totalMonthTotalFulfill / totalMonthOrder : 0,
    simulatedMonthRate: totalMonthOrder > 0 ? totalMonthTotalFulfill / totalMonthOrder : 0,
    totalWeekendOrderQty: weekendResults.reduce((s, r) => s + r.orderQty, 0),
    totalIncrement: totalIncrement,
    weekendResults, rdcResults
  };
}
