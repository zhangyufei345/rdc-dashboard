        <div id="chart-channel" class="chart-area" style="height:280px"></div>
      </div>
      <div class="card">
        <div class="card-title">🔥 Top 5 缺货 SKU<span class="card-sub">按金额排序</span></div>
        <table class="top5-mini-table">
          <thead><tr><th style="text-align:left">物料</th><th class="num">缺货箱</th><th class="num">缺货金额</th><th>RDC</th></tr></thead>
          <tbody>
            ${top5Skus.length > 0 ? top5RowHtml : '<tr><td colspan="4" style="text-align:center;color:#94a3b8;padding:24px">暂无缺货数据</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>

    <!-- 品牌 × RDC 热力图（月/日切换） -->
    <div class="card">
      <div class="card-header" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="card-title">🌡️ 品牌 × RDC 满足率矩阵</span>
        <div style="display:flex;gap:4px">
          <button id="heat-gran-month" class="btn-export" style="font-size:12px;padding:4px 14px" onclick="window._heatGran='month';renderHeatMatrix()">月度</button>
          <button id="heat-gran-day" class="btn-export" style="font-size:12px;padding:4px 14px" onclick="window._heatGran='day';renderHeatMatrix()">日度</button>
        </div>
        <div id="heat-date-wrap" style="display:none;align-items:center;gap:6px">
          <label style="font-size:12px">日期：</label>
          <select id="heat-date" onchange="window._heatDate=this.value;renderHeatMatrix()" style="padding:3px 8px;border:1px solid var(--border-card);border-radius:4px;font-size:12px"></select>
        </div>
        <span id="heat-sub" style="font-size:11px;color:var(--text-secondary);margin-left:auto">点击「月度/日度」切换；悬停查看 TOP5 缺货产品</span>
      </div>
      <div id="chart-heat" class="chart-area" style="height:240px"></div>
    </div>

    <!-- 底部 Top 20 物料 -->
    <div class="card">
      <div class="card-header" style="display:flex;align-items:center;gap:8px">
        <span class="card-title">📋 Top 20 缺货物料（订单核心）</span>
        <div style="margin-left:auto;display:flex;gap:4px;align-items:center">
          ${_brandSelHtml}${_rdcSelHtml}${_sortBtnsHtml}${_showAllHtml}
        </div>
      </div>
      <table>
        <thead><tr>${_displayHeader}</tr></thead>
        <tbody>
          ${_displayList.length > 0 ? _displayRowHtml : '<tr><td colspan="' + _tableColspan + '" style="text-align:center;color:#94a3b8;padding:24px">暂无缺货数据</td></tr>'}
        </tbody>
      </table>
    </div>
  `;

  // ============== 5 个 ECharts（option 与 overview-preview 一致，仅 data 替换为真实） ==============

  // 1. 订单流核心：双层环形（外环月满足率 + 内环日满足率）；6 RDC 标签已外置为 HTML 元素（v53 修复被遮挡）
  const chartCore = initChart('chart-core');
  if (chartCore) {
    const mRate = Math.round(monthFulfillRate * 100);
    const dRate = Math.round(dayRate * 100);
    chartCore.setOption({
      tooltip: {
        trigger: 'item', backgroundColor: 'rgba(15,23,42,0.95)', borderColor: 'rgba(99,179,237,0.3)', textStyle: { color: '#e2e8f0' },
        formatter: function(p) {
          return '<div style="font-weight:600">' + p.name + '</div>' +
                 '<div style="margin-top:4px">数值：' + p.value + (p.name.indexOf('率') >= 0 ? '%' : '') + '</div>';
        }
      },
      series: [
        { type: 'pie', radius: ['88%','100%'], startAngle: 90, label: { show: false },
          data: [
            { value: mRate, name: '月满足率', itemStyle: { color: { type: 'linear', x: 0, y: 0, x2: 1, y2: 1, colorStops: [{ offset: 0, color: '#60a5fa' }, { offset: 1, color: '#a78bfa' }] } } },
            { value: 100 - mRate, name: '月缺口', itemStyle: { color: 'rgba(99,179,237,0.06)' } }
          ],
          emphasis: { scale: true, scaleSize: 4 }
        },
        { type: 'pie', radius: ['70%','82%'], startAngle: 90, label: { show: false },
          data: [
            { value: dRate, name: '日满足率', itemStyle: { color: { type: 'linear', x: 0, y: 0, x2: 1, y2: 1, colorStops: [{ offset: 0, color: '#34d399' }, { offset: 1, color: '#10b981' }] } } },
            { value: 100 - dRate, name: '日缺口', itemStyle: { color: 'rgba(52,211,153,0.06)' } }
          ],
          emphasis: { scale: true, scaleSize: 4 }
        },
        { type: 'pie', radius: ['0%','66%'], startAngle: 90, label: { show: false },
          data: [ { value: 1, name: '核心背景', itemStyle: { color: 'rgba(15,23,42,0.4)' } } ]
        }
      ]
    });
  }

  // 2. 日订单满足率趋势（近 7 个工作日；全部/单个 RDC 均显示 KA+经销商双曲线，v61）
  const trendRdc = window._trendRdc || 'all';
  const trendDayMap = {};
  monthOrders.forEach(d => {
    if (!d.dateStr || !d.warehouse) return;
    if (!isWorkday(d.dateStr)) return;
    if (trendRdc !== 'all' && d.warehouse !== trendRdc) return;
    const key = d.dateStr;
    if (!trendDayMap[key]) trendDayMap[key] = { ka: { orderQty: 0, firstQty: 0 }, jx: { orderQty: 0, firstQty: 0 } };
    const ch = normalizeTrendChannel(d.channel);
    if (ch === 'KA') {
      trendDayMap[key].ka.orderQty += d.orderQty || 0;
      trendDayMap[key].ka.firstQty += d.firstDayQty || 0;
    } else if (ch === '经销商') {
      trendDayMap[key].jx.orderQty += d.orderQty || 0;
      trendDayMap[key].jx.firstQty += d.firstDayQty || 0;
    }
  });
  const trendDates = Object.keys(trendDayMap).sort();
  const trendLast7 = trendDates.slice(-7);
  if (trendLast7.length > 0) {
    const chartTrend = initChart('chart-trend');
    if (chartTrend) {
      const legendData = ['KA 满足率', '经销商 满足率'];
      const kaData = trendLast7.map(d => trendDayMap[d].ka.orderQty > 0 ? trendDayMap[d].ka.firstQty / trendDayMap[d].ka.orderQty : null);
      const jxData = trendLast7.map(d => trendDayMap[d].jx.orderQty > 0 ? trendDayMap[d].jx.firstQty / trendDayMap[d].jx.orderQty : null);
      const seriesData = [
        { name: 'KA 满足率', type: 'line', smooth: true, data: kaData, lineStyle: { width: 3, color: '#60a5fa', shadowBlur: 8, shadowColor: 'rgba(96,165,250,0.5)' }, itemStyle: { color: '#60a5fa' }, symbol: 'circle', symbolSize: 8 },
        { name: '经销商 满足率', type: 'line', smooth: true, data: jxData, lineStyle: { width: 3, color: '#34d399', shadowBlur: 8, shadowColor: 'rgba(52,211,153,0.5)' }, itemStyle: { color: '#34d399' }, symbol: 'circle', symbolSize: 8 }
      ];
      // v100.6: 删除切分逻辑——用户要求恢复 KA + 经销商两段同时显示
      chartTrend.setOption({
        title: { text: trendRdc === 'all' ? '全部 RDC 聚合' : trendRdc, left: 'center', top: 0, textStyle: { color: '#94a3b8', fontSize: 11, fontWeight: 'normal' } },
        tooltip: { trigger: 'axis', backgroundColor: 'rgba(15,23,42,0.95)', borderColor: 'rgba(99,179,237,0.3)', textStyle: { color: '#e2e8f0' },
          extraCssText: 'max-width:480px;overflow:visible;box-sizing:border-box;padding:8px 10px',
          // v105: appendToBody 让 tooltip DOM 挂到 body，彻底脱离 .chart-area(220px/overflow) 的裁剪，从而能完整显示
          // 坐标语义：position 回调返回「容器本地坐标」（与 point 同系）；ECharts 内部 makeStyleCoord 会叠加容器文档偏移转成文档坐标
          // 故这里返回容器本地坐标，但把夹取边界从「容器 220px」换成「视口」——既保证完整可见，又不受容器高度裁剪限制
          appendToBody: true,
          confine: false,
          position: function(point, params, dom, rect, size) {
            const tipW = size.contentSize[0];
            const tipH = size.contentSize[1];
            const offset = 14;
            const margin = 8;
            const cr = chartTrend.getDom().getBoundingClientRect();
            const vw = window.innerWidth, vh = window.innerHeight;
            // 本地坐标 = 文档坐标 - 容器偏移；视口允许范围换算到本地（滚动量在 ECharts 叠加时抵消，无需 scrollX/Y）
            const xMin = margin - cr.left;
            const xMax = vw - tipW - margin - cr.left;
            let x = point[0] + offset;
            if (x > xMax) x = point[0] - tipW - offset;   // 右侧越界 → 翻到鼠标左侧
            if (x < xMin) x = xMin;
            if (x > xMax) x = xMax;
            const yMin = margin - cr.top;
            const yMax = vh - tipH - margin - cr.top;
            let y = point[1] - tipH - offset;             // 默认放在上方
            if (y < yMin) y = point[1] + offset;          // 上方放不下 → 放下方
            if (y > yMax) y = yMax;                       // 下方也越界 → 顶部贴可视区
            if (y < yMin) y = yMin;
            return [x, y];
          },
          formatter: function(params) {
            const idx = params[0] && typeof params[0].dataIndex === 'number' ? params[0].dataIndex : -1;
            const fullDate = (idx >= 0 && idx < trendLast7.length) ? trendLast7[idx] : '';
            const dayLabel = params[0] && params[0].name ? params[0].name : '';
            // v100.5: 整体包一层 min-width wrapper，保证下面 buildTop5TooltipHtml 的 flex:1（物料/品名列）不被压扁
            let html = '<div style="min-width:380px;box-sizing:border-box">' +
              '<div style="font-weight:600;margin-bottom:4px">' + dayLabel + '</div>';
            params.forEach(p => {
              const color = p.seriesName === 'KA 满足率' ? '#60a5fa' : '#34d399';
              html += '<div style="display:flex;align-items:center;margin:2px 0"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + color + ';margin-right:6px"></span>' +
                '<span style="flex:1">' + p.seriesName + '</span>' +
                '<span style="font-weight:600">' + (p.value != null ? (p.value * 100).toFixed(1) + '%' : '-') + '</span></div>';
            });
            // v100.6 恢复（用户要求）：KA + 经销商两段 top5 同时显示
            const trendTop5Ka = fullDate ? getTopShortageSKUsByDay(trendRdc, fullDate, 3, 'KA') : [];
            const trendTop5Jx = fullDate ? getTopShortageSKUsByDay(trendRdc, fullDate, 3, '经销商') : [];
            const rdcLabel = trendRdc === 'all' ? '全部 RDC' : trendRdc;
            // v104: 空数据时不渲染该段的标题表头——避免用户误以为"被截"，明确"无未清 SKU"
            html += trendTop5Ka.length > 0
              ? buildTop5TooltipHtml(trendTop5Ka, rdcLabel + ' · ' + fullDate + ' · KA · 未清箱数 TOP 3', '未清箱数', true)
              : '<div style="font-size:11px;color:#64748b;margin:8px 0 4px;border-top:1px dashed rgba(148,163,184,0.2);padding-top:4px">全部 RDC · ' + fullDate + ' · KA · 当日无未清 SKU</div>';
            html += trendTop5Jx.length > 0
              ? buildTop5TooltipHtml(trendTop5Jx, rdcLabel + ' · ' + fullDate + ' · 经销商 · 未清箱数 TOP 3', '未清箱数', true)
              : '<div style="font-size:11px;color:#64748b;margin:8px 0 4px;border-top:1px dashed rgba(148,163,184,0.2);padding-top:4px">全部 RDC · ' + fullDate + ' · 经销商 · 当日无未清 SKU</div>';
            html += '</div>';  // v100.5: 闭合 min-width wrapper
            return html;
          }
        },
        legend: { data: legendData, textStyle: { color: '#94a3b8', fontSize: 11 }, top: 18 },
        grid: { left: 50, right: 20, top: 50, bottom: 30 },
        xAxis: { type: 'category', data: trendLast7.map(d => d.slice(5)), axisLine: { lineStyle: { color: '#334155' } }, axisLabel: { color: '#94a3b8', fontSize: 11 } },
        yAxis: { type: 'value', min: 0, max: 1.03, axisLine: { lineStyle: { color: '#334155' } }, splitLine: { lineStyle: { color: 'rgba(99,179,237,0.1)' } }, axisLabel: { color: '#94a3b8', formatter: v => (v*100).toFixed(0)+'%' } },
        series: seriesData
      });
    }
  }

  // 3. RDC 缺货金额对比（bar）
  const rdcAmounts = RDC_LIST.map((rdc, i) => {
    const key = rdcKeysForKpi[i];
    return sData.filter(d => d[key] > 0).reduce((sum, d) => {
      const ratio = d.rdcShortBoxes > 0 ? d[key] / d.rdcShortBoxes : 0;
      return sum + d.rdcShortAmount * ratio;
    }, 0);
  });
  const rdcTop5Map = {};
  RDC_LIST.forEach(r => { rdcTop5Map[r] = getTopShortageSKUsByMonth('all', r, heatMonth, 5); });
  const chartRdc = initChart('chart-rdc');
  if (chartRdc) {
    chartRdc.setOption({
      tooltip: { trigger: 'axis', backgroundColor: 'rgba(15,23,42,0.95)', borderColor: 'rgba(99,179,237,0.3)', textStyle: { color: '#e2e8f0' },
        formatter: function(params) {
          const p = params[0];
          const shortRdc = p && p.name ? p.name : '';
          const fullRdc = shortRdc ? shortRdc + 'RDC' : '';
          const val = p && p.value != null ? p.value : 0;
          const top5 = fullRdc ? (rdcTop5Map[fullRdc] || []) : [];
          let html = '<div style="font-weight:600;margin-bottom:4px">' + (fullRdc || shortRdc) + ' 缺货金额</div>' +
            '<div style="margin-bottom:4px">¥' + (val / 10000).toFixed(2) + '万</div>';
          html += buildTop5TooltipHtml(top5, fullRdc + ' · ' + heatMonth + ' · TOP 5 缺货 SKU');
          return html;
        }
      },
      grid: { left: 60, right: 30, top: 10, bottom: 30 },
      xAxis: { type: 'value', axisLine: { lineStyle: { color: '#334155' } }, splitLine: { lineStyle: { color: 'rgba(99,179,237,0.1)' } }, axisLabel: { color: '#94a3b8', formatter: v => '¥'+(v/10000).toFixed(0)+'万' } },
      yAxis: { type: 'category', data: RDC_LIST.map(r => r.replace('RDC','')), axisLine: { lineStyle: { color: '#334155' } }, axisLabel: { color: '#cbd5e1', fontSize: 11 } },
      series: [{
        type: 'bar',
        data: rdcAmounts.map(v => ({
          value: v,
          itemStyle: { color: { type: 'linear', x: 0, y: 0, x2: 1, y2: 0, colorStops: [{ offset: 0, color: '#7f1d1d' }, { offset: 1, color: '#ef4444' }] }, borderRadius: [0, 4, 4, 0] }
        })),
        label: { show: true, position: 'right', color: '#fca5a5', fontSize: 11, formatter: p => '¥'+(p.value/10000).toFixed(1)+'万' }
      }]
    });
  }

  // 4. 渠道订单量分布（v57：恢复 donut 饼图 + MTD累计，与原 renderOverview 一致）
  const chMap = {};
  monthOrders.forEach(d => {
    const ch = d.channel || '其他';
    if (!chMap[ch]) chMap[ch] = { orderQty: 0, firstQty: 0, groups: {} };
    chMap[ch].orderQty += d.orderQty || 0;
    chMap[ch].firstQty += d.firstDayQty || 0;
    const cg = d.customerGroup || '未知';
    if (!chMap[ch].groups[cg]) chMap[ch].groups[cg] = { orderQty: 0, firstQty: 0 };
    chMap[ch].groups[cg].orderQty += d.orderQty || 0;
    chMap[ch].groups[cg].firstQty += d.firstDayQty || 0;
  });
  const channelData = Object.entries(chMap).map(([name, info]) => ({ name, value: info.orderQty }));
  const channelColors = { 'KA': '#60a5fa', 'KA直营': '#60a5fa', '经销商': '#fb923c', '新渠道': '#a78bfa' };
  const chartChannel = initChart('chart-channel');
  if (chartChannel) {
    chartChannel.setOption({
      tooltip: {
        trigger: 'item', backgroundColor: 'rgba(15,23,42,0.95)', borderColor: 'rgba(99,179,237,0.3)', textStyle: { color: '#e2e8f0' },
        formatter: function(p) {
          const info = chMap[p.name] || { orderQty: p.value, groups: {} };
          const groupRows = Object.entries(info.groups || {}).sort((a,b) => b[1].orderQty - a[1].orderQty).slice(0, 8);
          let html = '<div style="font-weight:600;font-size:13px;margin-bottom:6px">' + p.name + '（总量：' + formatNum(p.value) + '支）</div>';
          html += '<table style="font-size:11px;border-collapse:collapse;width:100%"><tr style="border-bottom:1px solid #334155"><td style="padding:2px 6px;color:#94a3b8">客户组</td><td style="padding:2px 6px;text-align:right;color:#94a3b8">订单量</td><td style="padding:2px 6px;text-align:right;color:#94a3b8">日满足率</td></tr>';
          groupRows.forEach(([cg, g]) => {
            const rate = g.orderQty > 0 ? (g.firstQty / g.orderQty * 100).toFixed(1) : '0.0';
            html += '<tr><td style="padding:2px 6px">' + cg + '</td><td style="padding:2px 6px;text-align:right">' + formatNum(g.orderQty) + '</td><td style="padding:2px 6px;text-align:right">' + rate + '%</td></tr>';
          });
          html += '</table>';
          return html;
        },
        extraCssText: 'max-width:360px;box-shadow:0 2px 12px rgba(0,0,0,.4);border-radius:8px;padding:10px 12px'
      },
      legend: { orient: 'vertical', right: 10, top: 'center', textStyle: { color: '#cbd5e1', fontSize: 11 }, itemWidth: 12, itemHeight: 12 },
      series: [{
        type: 'pie',
        radius: ['45%', '70%'],
        center: ['38%', '50%'],
        label: { color: '#e2e8f0', formatter: '{b}\n{d}%', fontSize: 11 },
        labelLine: { lineStyle: { color: '#475569' } },
        itemStyle: { borderColor: '#0a0e27', borderWidth: 2 },
        data: channelData.map(d => ({ ...d, itemStyle: { color: channelColors[d.name] || '#a78bfa' } }))
      }]
    });
  }

  renderHeatMatrix();

}

function renderHeatMatrix() {
  const container = document.getElementById('chart-heat');
  if (!container) return;
  const gran = window._heatGran || 'month';

  // 切换按钮高亮
  const mBtn = document.getElementById('heat-gran-month');
  const dBtn = document.getElementById('heat-gran-day');
  const dateWrap = document.getElementById('heat-date-wrap');
  if (mBtn) { mBtn.style.background = gran === 'month' ? 'var(--color-blue)' : 'var(--color-orange)'; mBtn.style.color = '#fff'; }
  if (dBtn) { dBtn.style.background = gran === 'day' ? 'var(--color-blue)' : 'var(--color-orange)'; dBtn.style.color = '#fff'; }
  if (dateWrap) dateWrap.style.display = gran === 'day' ? 'flex' : 'none';

  const brands = MATRIX_BRANDS;
  const rdcs = RDC_LIST;
  const heatData = [];
  const cellMap = {};
  const brandRdcTop5Map = {};
  let rateLabel = '';

  if (gran === 'month') {
    const mo = (filters.dataMonth && filters.dataMonth !== 'all')
      ? dataStore.orderDetail.filter(d => d.dateStr && d.dateStr.startsWith(filters.dataMonth))
      : dataStore.orderDetail;
    const brandRdcMap = {};
    mo.forEach(d => {
      if (!d.brand || !d.warehouse) return;
      const key = d.brand + '|' + d.warehouse;
      if (!brandRdcMap[key]) brandRdcMap[key] = { orderQty: 0, fulfillQty: 0 };
      brandRdcMap[key].orderQty += d.orderQty || 0;
      brandRdcMap[key].fulfillQty += d.totalFulfillQty || 0;
    });
    const heatMonth = (filters.dataMonth && filters.dataMonth !== 'all')
      ? filters.dataMonth
      : ((window._availableMonths && window._availableMonths.length > 0)
        ? window._availableMonths.filter(m => m.indexOf('2026-') === 0).pop() || '2026-08'
        : '2026-08');
    brands.forEach(b => rdcs.forEach(r => {
      const d = brandRdcMap[b + '|' + r];
      const hasOrder = !!(d && d.orderQty > 0);
      const rate = hasOrder ? d.fulfillQty / d.orderQty : 0;
      cellMap[b + '|' + r] = hasOrder;
      const idxR = rdcs.indexOf(r), idxB = brands.indexOf(b);
      if (hasOrder) heatData.push([idxR, idxB, rate]);
      else heatData.push({ value: [idxR, idxB, rate], itemStyle: { color: '#6b7280' } });
    }));
    brands.forEach(b => rdcs.forEach(r => {
      brandRdcTop5Map[b + '|' + r] = getTopShortageSKUsByMonth(b, r, heatMonth, 5);
    }));
    rateLabel = '月满足率';
  } else {
    let allOrders = dataStore.orderDetail || [];
    if (filters.dataMonth && filters.dataMonth !== 'all') allOrders = allOrders.filter(d => d.dateStr && d.dateStr.startsWith(filters.dataMonth));
    const allDates = [...new Set(allOrders.map(d => d.dateStr).filter(Boolean))].sort();
    const sel = document.getElementById('heat-date');
    if (sel) {
      if (sel.options.length === 0) {
        allDates.forEach(d => { const o = document.createElement('option'); o.value = d; o.textContent = d; sel.appendChild(o); });
      }
      if (!window._heatDate || !allDates.includes(window._heatDate)) {
        window._heatDate = allDates[allDates.length - 1] || '';
      }
      sel.value = window._heatDate;
    }
    const dateStr = window._heatDate;
    const matrix = {};
    brands.forEach(b => { matrix[b] = {}; rdcs.forEach(r => { matrix[b][r] = { qty: 0, firstShort: 0 }; }); });
    allOrders.forEach(d => {
      if (!d.brand || !d.warehouse) return;
      if (!matrix[d.brand] || matrix[d.brand][d.warehouse] === undefined) return;
      if (d.dateStr !== dateStr) return;
      matrix[d.brand][d.warehouse].qty += d.orderQty;
      matrix[d.brand][d.warehouse].firstShort += d.firstDayShort;
    });
    brands.forEach(b => rdcs.forEach(r => {
      const m = matrix[b][r];
      const hasOrder = m.qty > 0;
      const rate = hasOrder ? (1 - m.firstShort / m.qty) : 0;
      cellMap[b + '|' + r] = hasOrder;
      const idxR = rdcs.indexOf(r), idxB = brands.indexOf(b);
      if (hasOrder) heatData.push([idxR, idxB, rate]);
      else heatData.push({ value: [idxR, idxB, rate], itemStyle: { color: '#6b7280' } });
    }));

            return { code: d.code, name: d.name, boxes: boxes, transit: d.transit || 0, supply: d.supply || '' };

          top5.forEach((d, i) => {

            const supplyColor = supplyTxt.indexOf('紧张') >= 0 ? '#fca5a5' : (supplyTxt.indexOf('缺货') >= 0 ? '#fdba74' : '#86efac');
            const supplyLabel = supplyTxt.indexOf('紧张') >= 0 ? '紧张' : (supplyTxt.indexOf('缺货') >= 0 ? '缺货' : '正常');
            html += '<div style="display:flex;font-size:11px;line-height:1.5;padding:1px 2px">' +
              '<span style="width:18px;color:#94a3b8">' + (i+1) + '</span>' +
              '<span style="flex:1;min-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span style="color:#e2e8f0">' + d.code + '</span> <span style="color:#64748b">' + String(d.name || '').slice(0,10) + '</span></span>' +
              '<span style="width:48px;text-align:right;color:#fca5a5;font-weight:600">' + (d.boxes ? formatNum(d.boxes) : '—') + '</span>' +
              '<span style="width:48px;text-align:right;color:#e2e8f0">' + (d.transit ? formatNum(d.transit) : '—') + '</span>' +
              '<span style="width:40px;text-align:center;color:' + supplyColor + '">' + supplyLabel + '</span>' +
              '</div>';
          });
        } else {
          html += '<br/><span style="color:#64748b;font-size:11px">该品牌×RDC 无缺货 SKU</span>';
        }
        return html;
      }
    },
    grid: { left: 70, right: 30, top: 50, bottom: 30 },
    xAxis: { type: 'category', data: rdcs, position: 'top', axisLine: { lineStyle: { color: '#334155' } }, axisLabel: { color: '#94a3b8', fontSize: 11, rotate: 15 } },
    yAxis: { type: 'category', data: brands, axisLine: { lineStyle: { color: '#334155' } }, axisLabel: { color: '#94a3b8', fontSize: 11 } },
    visualMap: { min: 0.7, max: 1, calculable: true, orient: 'horizontal', left: 'center', bottom: 5, textStyle: { color: '#94a3b8', fontSize: 10 }, inRange: { color: ['#ef4444', '#f97316', '#facc15', '#84cc16', '#34d399'] }, formatter: v => (v*100).toFixed(0)+'%' },
    series: [{ type: 'heatmap', data: heatData, cursor: 'default', label: { show: true, color: '#fff', fontSize: 11, formatter: p => {
      const brand = brands[p.value[1]];
      const rdc = rdcs[p.value[0]];
      if (!cellMap[brand + '|' + rdc]) return '无订单';
      return (p.value[2]*100).toFixed(0)+'%';
    } }, itemStyle: { borderColor: '#0a0e27', borderWidth: 1 } }]
  });
}

// 渠道归一化（全局）：把订单明细里的 channel 原始值归一为 'KA' / '经销商' / '其他'
// 必须放全局作用域：renderOverview 内部的 trend 渲染 + getTopShortageSKUsByDay（3058）两处都会调用
function normalizeTrendChannel(ch) {
  const s = String(ch || '').trim().toUpperCase();
  if (s === 'KA' || s === 'KA直营' || s === 'KA直营店' || s.indexOf('KA') === 0) return 'KA';
  if (s.indexOf('经销') >= 0 || s === 'DEALER' || s === 'JX') return '经销商';
  return '其他';
}

// 获取某日（跨所有RDC、渠道）的缺货TOP N（折线图tooltip用）
function getDateShortageSKUs(dateStr, limit) {
  limit = limit || 5;
  if (!dateStr) return [];
  const dedup = {};
  dataStore.orderDetail.filter(d => d.dateStr === dateStr && d.totalGap > 0).forEach(d => {
    if (!dedup[d.skuCode]) dedup[d.skuCode] = { code: d.skuCode, name: d.skuName, gap: 0 };
    dedup[d.skuCode].gap += d.totalGap;
  });
  return Object.values(dedup).sort((a,b) => b.gap - a.gap).slice(0, limit);
}

          html += buildTopShortTipTable(topShort, '订单缺口', function(s, info){
            if (!info.boxSpec || !s.gap) return '—';
            const b = s.gap / info.boxSpec;

          }, null);
        } else {
          html += '<div style="margin-top:6px;color:#9ca3af;font-size:10px">当日无缺货记录</div>';

    series: activeChannels.map(ch => {

}

// ============ FULFILLMENT PAGE ============
function renderFulfillment() {
  setTitle('订单满足率分析');
  const page = document.getElementById('page-fulfillment');
  if (!page) return;

  // 构建日期选项列表（按全局月份过滤）
  const dateSet = new Set();

    : dataStore.orderDetail;
  odForDates.forEach(d => { if (d.dateStr) dateSet.add(d.dateStr); });
  const dateOptions = [...dateSet].sort().reverse();
  if (!filters.fulfillDate || filters.fulfillDate === 'all' || (filters.dataMonth && filters.dataMonth !== 'all' && !filters.fulfillDate.startsWith(filters.dataMonth))) {
    filters.fulfillDate = dateOptions[0] || 'all';
  }

  const monthFilter = filters.dataMonth && filters.dataMonth !== 'all';

  // ---- RDC×渠道 统计表数据 ----
  // 日满足率（按选中日期过滤）
  const dayRdcChMap = {};
  const dayFiltered = dataStore.orderDetail.filter(d => d.dateStr === filters.fulfillDate);
  dayFiltered.forEach(d => {
    const key = d.warehouse + '|' + d.channel;
    if (!dayRdcChMap[key]) dayRdcChMap[key] = { rdc: d.warehouse, channel: d.channel, orderQty: 0, firstDayQty: 0, totalFulfillQty: 0 };
    dayRdcChMap[key].orderQty += d.orderQty;
    dayRdcChMap[key].firstDayQty += d.firstDayQty;
    dayRdcChMap[key].totalFulfillQty += d.totalFulfillQty;
  });
  // 月满足率（按全局月份过滤）
  const monthRdcChMap = {};
  const monthOrderData = monthFilter
    ? dataStore.orderDetail.filter(d => d.dateStr && d.dateStr.startsWith(filters.dataMonth))
    : dataStore.orderDetail;
  monthOrderData.forEach(d => {
    const key = d.warehouse + '|' + d.channel;
    if (!monthRdcChMap[key]) monthRdcChMap[key] = { rdc: d.warehouse, channel: d.channel, orderQty: 0, firstDayQty: 0, totalFulfillQty: 0 };
    monthRdcChMap[key].orderQty += d.orderQty;
    monthRdcChMap[key].firstDayQty += d.firstDayQty;
    monthRdcChMap[key].totalFulfillQty += d.totalFulfillQty;
  });

  // MTD日满足率（从月初至选中日期累计，替换左侧日满足率列）
  const mtdRdcChMap = {};
  if (filters.fulfillDate && filters.fulfillDate !== 'all') {
    const monthPrefix = filters.fulfillDate.slice(0, 7);
    dataStore.orderDetail.filter(d => d.dateStr && d.dateStr.startsWith(monthPrefix) && d.dateStr <= filters.fulfillDate).forEach(d => {
      const key = d.warehouse + '|' + d.channel;
      if (!mtdRdcChMap[key]) mtdRdcChMap[key] = { rdc: d.warehouse, channel: d.channel, orderQty: 0, firstDayQty: 0, totalFulfillQty: 0 };
      mtdRdcChMap[key].orderQty += d.orderQty;
      mtdRdcChMap[key].firstDayQty += d.firstDayQty;
      mtdRdcChMap[key].totalFulfillQty += d.totalFulfillQty;
    });
  }

  // 获取RDC某渠道某日缺货TOP5（tooltip用）
  function getRdcChannelShortageSKUs(rdc, channel, dateStr, limit) {
    limit = limit || 5;
    if (!rdc || !channel || !dateStr) return [];
    const dedup = {};
    dataStore.orderDetail.filter(d => d.warehouse === rdc && d.channel === channel && d.dateStr === dateStr && d.totalGap > 0).forEach(d => {
      if (!dedup[d.skuCode]) dedup[d.skuCode] = { code: d.skuCode, name: d.skuName, gap: 0 };
      dedup[d.skuCode].gap += d.totalGap;
    });
    return Object.values(dedup).sort((a,b) => b.gap - a.gap).slice(0, limit);
  }

  // 获取RDC某渠道某日期范围缺货TOP5（MTD tooltip用）
  function getRdcChannelShortageSKUsRange(rdc, channel, startDate, endDate, limit) {
    limit = limit || 5;
    if (!rdc || !channel || !startDate || !endDate) return [];
    const dedup = {};
    dataStore.orderDetail.filter(d => d.warehouse === rdc && d.channel === channel && d.dateStr >= startDate && d.dateStr <= endDate && d.totalGap > 0).forEach(d => {
      if (!dedup[d.skuCode]) dedup[d.skuCode] = { code: d.skuCode, name: d.skuName, gap: 0 };
      dedup[d.skuCode].gap += d.totalGap;
    });
    return Object.values(dedup).sort((a,b) => b.gap - a.gap).slice(0, limit);
  }

  page.innerHTML = `
    ${renderOverviewHistory() || ''}
    <div class="filter-bar">
      <label>RDC：</label>
      <select id="filter-fulfill-rdc" onchange="filters.fulfillRDC=this.value;renderFulfillment()" style="min-width:120px">
        <option value="all" ${filters.fulfillRDC==='all'?'selected':''}>所有RDC</option>
        ${RDC_LIST.map(r => '<option value="'+r+'"'+(filters.fulfillRDC===r?' selected':'')+'>'+r+'</option>').join('')}
      </select>
      <span style="font-size:11px;color:var(--text-secondary);margin-left:auto">${filters.fulfillRateType==='mtd'?'MTD日满足率基于月初至所选日期累计':'日满足率基于所选日期'} · 月满足率基于全月数据</span>
    </div>
    ${renderFulfillmentHistory() || ''}
    <div class="card">
      <div class="card-header">
        <span class="card-title">RDC × 渠道 订单满足率统计表</span>
        <div style="display:flex;align-items:center;gap:8px">
          <select onchange="filters.fulfillRateType=this.value;renderFulfillment()" style="min-width:100px;padding:4px 8px;border:1px solid var(--border-card);border-radius:6px;font-size:12px;background:var(--bg-card);color:var(--text-primary);outline:none">
            <option value="day" ${filters.fulfillRateType==='day'?'selected':''}>日满足率</option>

          <select onchange="filters.fulfillDate=this.value;renderFulfillment()" style="min-width:120px;padding:4px 8px;border:1px solid var(--border-card);border-radius:6px;font-size:12px;background:var(--bg-card);color:var(--text-primary);outline:none">
            ${dateOptions.map(d => '<option value="'+d+'"'+(filters.fulfillDate===d?' selected':'')+'>'+d+'</option>').join('')}
          </select>
        </div>
      </div>
      <div class="table-wrap" id="table-rdc-channel-fulfill"></div>
    </div>
  `;

  // ---- 统计表：RDC×渠道 ----

  const dispLabel = isMtdMode ? 'MTD日满足率' : '日满足率';
  const tableRows = [];
  RDC_LIST.forEach(rdc => {
    const row = { rdc: rdc };
    let allDayOrder = 0, allDayFirst = 0, allMtdOrder = 0, allMtdFirst = 0, allMonthOrder = 0, allMonthFulfill = 0;
    channels.forEach(ch => {
      const dk = rdc + '|' + ch;
      const dayData = dayRdcChMap[dk];
      const mtdData = mtdRdcChMap[dk];
      const monthData = monthRdcChMap[dk];
      const dOrder = dayData ? dayData.orderQty : 0;
      const dFirst = dayData ? dayData.firstDayQty : 0;
      const mOrder = monthData ? monthData.orderQty : 0;
      const mFulfill = monthData ? monthData.totalFulfillQty : 0;
      const mtOrder = mtdData ? mtdData.orderQty : 0;
      const mtFirst = mtdData ? mtdData.firstDayQty : 0;
      row[ch + '_dayOrder'] = dOrder;
      row[ch + '_dayFirst'] = dFirst;
      row[ch + '_dayRate'] = dOrder > 0 ? dFirst / dOrder : 0;
      row[ch + '_mtdOrder'] = mtOrder;
      row[ch + '_mtdFirst'] = mtFirst;
      row[ch + '_mtdRate'] = mtOrder > 0 ? mtFirst / mtOrder : 0;
      row[ch + '_monthOrder'] = mOrder;
      row[ch + '_monthFulfill'] = mFulfill;
      row[ch + '_monthRate'] = mOrder > 0 ? mFulfill / mOrder : 0;
      allDayOrder += dOrder; allDayFirst += dFirst;
      allMtdOrder += mtOrder; allMtdFirst += mtFirst;
      allMonthOrder += mOrder; allMonthFulfill += mFulfill;
    });
    row['total_dayRate'] = allDayOrder > 0 ? allDayFirst / allDayOrder : 0;
    row['total_mtdRate'] = allMtdOrder > 0 ? allMtdFirst / allMtdOrder : 0;
    row['total_monthRate'] = allMonthOrder > 0 ? allMonthFulfill / allMonthOrder : 0;
    tableRows.push(row);

  const pctCell = function(v, type) {
    const cls = v >= 0.95 ? 'rate-good' : v >= 0.9 ? 'rate-warn' : 'rate-bad';
    const bg = type === 'day' ? 'background:#FFFBEB;' : 'background:#EFF6FF;';

    '<th rowspan="2" style="vertical-align:middle">RDC</th>' +

    '<th style="text-align:center;background:#FFFBEB">KA</th><th style="text-align:center;background:#FFFBEB">经销商</th><th style="text-align:center;background:#FFFBEB">合计</th>' +
    '<th style="text-align:center;background:#EFF6FF">KA</th><th style="text-align:center;background:#EFF6FF">经销商</th><th style="text-align:center;background:#EFF6FF">合计</th>' +
    '</tr></thead><tbody>';

  window._tipStore.length = 0;
  tableRows.forEach(r => {

// 订单满足率历史同比（矩阵 + 年度概览，不含月度折线）
function renderFulfillmentHistoryCharts() {
  if (!dataStore.history || !dataStore.history.fulfillment) return;
  const H = dataStore.history.fulfillment;
  const rdc = window._fulHtyRdc || 'all';

  // ========== 当月实时聚合：从 orderDetail 按 RDC×月聚合 ==========
  // type='daily' 用首日排单 / 订单总量；type='monthly' 用总履约排单 / 订单总量
  // 2026 年优先走实时聚合（避免 history.json 陈旧数据覆盖最新订单数据），实时无数据再回退 history
  function liveFulfillmentByType(rdcName, ym, type) {
    let sNum = 0, sOrder = 0;
    (dataStore.orderDetail || []).forEach(function(d) {
      if (d.warehouse !== rdcName) return;
      if (!d.dateStr || d.dateStr.slice(0, 7) !== ym) return;
      sOrder += d.orderQty || 0;
      sNum += (type === 'monthly' ? (d.totalFulfillQty || 0) : (d.firstDayQty || 0));
    });
    if (sOrder <= 0) return null;
    return sNum / sOrder;
  }
  function getDailyRate(rdcName, year, monthIdx0) {
    // 2026 年优先实时聚合（日满足率），无数据再回退 history
    if (year === '2026') {
      const ym = '2026-' + String(monthIdx0 + 1).padStart(2, '0');
      const live = liveFulfillmentByType(rdcName, ym, 'daily');
      if (live != null) return live;

    const yrMap = H[year] && H[year].daily;

  const monthsData = (window._availableMonths && window._availableMonths.length > 0)
    ? window._availableMonths.filter(function(m) { return m.indexOf('2026-') === 0; })

    : [{ label: '1月', monthNum: 1, histIdx: 0 }, { label: '2月', monthNum: 2, histIdx: 1 }, { label: '3月', monthNum: 3, histIdx: 2 }, { label: '4月', monthNum: 4, histIdx: 3 }, { label: '5月', monthNum: 5, histIdx: 4 }, { label: '6月', monthNum: 6, histIdx: 5 }];
  const months = monthsData.map(function(d) { return d.label; });
  const latestIdx = monthsData.length - 1;

    }
    window._fulHtyChartInstances = [];
    let gridHtml = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px">' +
      '<div style="grid-column:span 3;display:flex;align-items:center;gap:16px;padding:4px 8px;font-size:11px;color:var(--text-secondary);flex-wrap:wrap"><span style="display:inline-flex;align-items:center;gap:4px"><span style="display:inline-block;width:14px;height:2px;background:#94a3b8"></span>2025 1-' + latestMonthLabel + '</span><span style="display:inline-flex;align-items:center;gap:4px"><span style="display:inline-block;width:14px;height:2px;background:#2563EB"></span>2026 1-' + latestMonthLabel + '</span><span style="display:inline-flex;align-items:center;gap:4px"><span style="display:inline-block;width:10px;height:10px;border:2px solid #2563EB;border-radius:50%;background:#FFF"></span>2026 ' + latestMonthLabel + '（实时聚合）</span><span style="display:inline-flex;align-items:center;gap:4px"><span style="display:inline-block;width:8px;height:8px;background:#10B981;border-radius:50%"></span>同比改善</span><span style="display:inline-flex;align-items:center;gap:4px"><span style="display:inline-block;width:8px;height:8px;background:#EF4444;border-radius:50%"></span>同比下滑</span></div>';

          if (v26 != null && v25 != null) {

          }

        }},

        yAxis: { type: 'value', min: yMin, max: yMax, axisLabel: { formatter: function(v) { return (v * 100).toFixed(0) + '%'; }, fontSize: 9 }, splitLine: { lineStyle: { type: 'dashed', color: '#e5e7eb' } } },
        series: [
          { name: '2025', type: 'line', data: v25Arr, smooth: false, symbol: 'circle', symbolSize: function(v, p) { return p.dataIndex === latestIdx ? 8 : 5; }, itemStyle: { color: function(p) { return p.dataIndex === latestIdx ? '#64748b' : '#94a3b8'; } }, lineStyle: { color: '#94a3b8', width: 1.5, type: 'dashed' }, connectNulls: true },
          { name: '2026', type: 'line', data: v26Arr, smooth: false,
            symbol: function(v, p) { return p.dataIndex === latestIdx && v != null ? 'emptyCircle' : 'circle'; },
            symbolSize: function(v, p) { return p.dataIndex === latestIdx && v != null ? 12 : 6; },
            itemStyle: { color: function(p) { return ptColors[p.dataIndex] || '#2563EB'; }, borderColor: '#2563EB', borderWidth: function(p) { return p.dataIndex === latestIdx && v26Arr[p.dataIndex] != null ? 2 : 0; } },
            lineStyle: { color: '#2563EB', width: 2 },
            label: { show: true, position: 'top', distance: 10, fontSize: 9, color: '#1E40AF', formatter: labelFormatter },
            connectNulls: true,

  // KPI overview（v57：改为只显示当月 环比/同比，去掉 1-X月累计列）
  const rdcList = rdc === 'all' ? RDC_LIST : [rdc];
  const monthIdx = monthsData.map(function(d) { return d.histIdx; });
  const lastIdx = monthIdx[monthIdx.length - 1];
  const prevIdx = monthIdx.length >= 2 ? monthIdx[monthIdx.length - 2] : null; // 上一月 idx
  function avgOf(type, year, idxs) {

      // 2026 年优先实时聚合，避免 history.json 陈旧值覆盖

// TOP 5 缺货 SKU 弹框（v58：按缺货箱数从大到小，含物料/品名/缺货箱/在途/大仓供应）
function getTop5ShortageSku(month, rdcFilter) {
  const arr = (dataStore.shortage || []).filter(d => d && d.dateStr && d.dateStr.startsWith(month));
  const rdcKeyMap = { '华南RDC': 'huananShort', '华北RDC': 'huabeiShort', '东北RDC': 'dongbeiShort', '西北RDC': 'xibeiShort', '华中RDC': 'huazhongShort', '西南RDC': 'xinanShort' };
  const skuMap = {};
  arr.forEach(d => {
    if (!d.materialCode) return;
    let qty = 0, transit = 0;
    if (rdcFilter === 'all' || !rdcFilter) {
      qty = d.rdcShortBoxes || 0;
      transit = d.rdcTransitTotal || 0;
    } else {
      const key = rdcKeyMap[rdcFilter];
      if (!key) return;
      qty = d[key] || 0;
      if (qty <= 0) return;
      transit = d.rdcTransitTotal || 0;
    }
    if (qty <= 0) return;
    if (!skuMap[d.materialCode]) {
      skuMap[d.materialCode] = { materialCode: d.materialCode, materialName: d.materialName || '', brand: d.brand || '', rdcShortBoxes: 0, rdcTransitTotal: 0, dcSupply: d.dcSupply || '' };
    }
    skuMap[d.materialCode].rdcShortBoxes += qty;
    skuMap[d.materialCode].rdcTransitTotal = Math.max(skuMap[d.materialCode].rdcTransitTotal, transit);
  });
  return Object.values(skuMap).sort((a, b) => b.rdcShortBoxes - a.rdcShortBoxes).slice(0, 5);
}

// 按 品牌×RDC×月份 聚合缺货报告，取 TOP N（缺货箱数从大到小），用于总览矩阵弹框
function getTopShortageSKUsByMonth(brand, rdc, month, limit) {
  limit = limit || 5;
  const rdcShortKeyMap = { '华南RDC': 'huananShort', '华北RDC': 'huabeiShort', '东北RDC': 'dongbeiShort', '西北RDC': 'xibeiShort', '华中RDC': 'huazhongShort', '西南RDC': 'xinanShort' };
  let data = dataStore.shortage || [];
  if (month && month !== 'all') data = data.filter(d => d.dateStr && d.dateStr.startsWith(month));
  if (brand && brand !== 'all') data = data.filter(d => d.brand === brand);
  const rdcKey = rdc && rdc !== 'all' ? rdcShortKeyMap[rdc] : null;
  if (rdcKey) data = data.filter(d => d[rdcKey] > 0);
  // v63: 只取最新一天的缺货数据，避免跨日累计
  if (data.length > 0) {
    const latestDate = data.reduce((max, d) => (!max || d.dateStr > max) ? d.dateStr : max, '');
    if (latestDate) data = data.filter(d => d.dateStr === latestDate);
  }
  const map = {};
  data.forEach(d => {
    if (!d.materialCode) return;
    const boxes = rdcKey ? (d[rdcKey] || 0) : (d.rdcShortBoxes || 0);
    const transitKey = rdcKey ? RDC_TRANSIT_KEY[rdc] : null;
    const transit = transitKey ? (d[transitKey] || 0) : (d.rdcTransitTotal || 0);
    if (boxes <= 0) return;
    if (!map[d.materialCode]) {
      map[d.materialCode] = { materialCode: d.materialCode, materialName: d.materialName || '', brand: d.brand || '', boxes: 0, transit: 0, dcSupply: d.dcSupply || '' };
    }
    map[d.materialCode].boxes += boxes;
    map[d.materialCode].transit += transit;
  });
  return Object.values(map).sort((a, b) => b.boxes - a.boxes).slice(0, limit);
}

// v100: 按指定日期×RDC×渠道聚合**未清箱数**TOP5（用于日订单满足曲线hover tooltip）
// 数据源：dataStore.orderDetail（订单明细），字段 firstDayShort（首日未清支数 = 订单支数 - 首日排单支数）
// 换算：先按 SKU 累加未清支数，再除以 boxSpecMap[skuCode]（产品主数据「箱规转化因子」sheet）得到未清箱数
// 渠道：channel 可传 'KA' / '经销商' / '其他' / 'all'（默认 'all'）；用 normalizeTrendChannel 把原始 channel 值归一
// 排序规则：箱数 desc；缺箱规的 SKU 排在末尾（用未清支数兜底，避免在无箱规 SKU 上一支等于一箱的尺度错乱）
function getTopShortageSKUsByDay(rdc, dateStr, limit, channel) {
  limit = limit || 5;
  if (!dateStr) return [];
  const targetCh = channel || 'all';
  const boxSpecOf = code => { const bs = window._boxSpec && window._boxSpec[String(code)]; return (bs && bs > 0) ? bs : null; };
  const filtered = (dataStore.orderDetail || []).filter(d => {
    if (!d || d.dateStr !== dateStr) return false;
    if (rdc && rdc !== 'all' && d.warehouse !== rdc) return false;
    if (targetCh !== 'all') {
      const ch = normalizeTrendChannel(d.channel);
      if (ch !== targetCh) return false;
    }
    return (d.firstDayShort || 0) > 0;
  });
  const map = {};
  filtered.forEach(d => {
    const code = d.skuCode;
    if (!code) return;
    if (!map[code]) {
      map[code] = { materialCode: code, materialName: d.skuName || '', brand: d.brand || '', units: 0, boxes: 0, hasSpec: false };
    }
    map[code].units += d.firstDayShort || 0;
    const bs = boxSpecOf(code);
    if (bs) {
      map[code].boxes += (d.firstDayShort || 0) / bs;
      map[code].hasSpec = true;
    }
  });
  const arr = Object.values(map);
  arr.sort((a, b) => {
    if (a.hasSpec && !b.hasSpec) return -1;
    if (!a.hasSpec && b.hasSpec) return 1;
    if (a.hasSpec && b.hasSpec) return b.boxes - a.boxes;
    return b.units - a.units;
  });
  const top5 = arr.slice(0, limit);
  if (top5.length === 0) return top5;
  // v100.3: 在途箱数 / 大仓供应 仍取自缺货报告（shortage）——按 (dateStr, materialCode) 关联，每 SKU 独立取值
  // - 在途箱数：缺货报告 d[rdcKey] 是「该 SKU 在该 RDC 的缺货箱」；d[transitKey] 是「该 SKU 在该 RDC 的在途箱」
  //   所以『按 SKU 维度的在途』= d.rdcTransitTotal（缺货报告 col11，该 SKU 在所有 RDC 在途总和）
  // - 大仓供应：d.dcSupply（缺货报告 col9，大仓级状态）
  const rdcKey = (rdc && rdc !== 'all') ? getRDCShortageKey(rdc) : null;
  const transitKeyForRdc = rdc ? (RDC_TRANSIT_KEY[rdc] || null) : null;
  const shortageRows = (dataStore.shortage || []).filter(s => s.dateStr === dateStr);
  const transitBySku = {};   // materialCode -> 该 SKU 在所有 RDC 在途总箱数（rdc='all'）或 在该 RDC 的在途箱（rdc 指定）
  const supplyBySku = {};    // materialCode -> 大仓供应状态文本
  shortageRows.forEach(s => {
    if (!s.materialCode) return;
    let transit;
    if (transitKeyForRdc && (s[transitKeyForRdc] || 0) > 0) {
      transit = s[transitKeyForRdc];
    } else if ((s.rdcTransitTotal || 0) > 0) {
      transit = s.rdcTransitTotal;
    }
    if (transit && transitBySku[s.materialCode] === undefined) {
      transitBySku[s.materialCode] = transit;
    }
    if (s.dcSupply && !supplyBySku[s.materialCode]) {
      supplyBySku[s.materialCode] = s.dcSupply;
    }
  });
  top5.forEach(t => {
    t.transit = transitBySku[t.materialCode] || 0;    // 在途箱数（缺货报告，每 SKU 独立）
    t.dcSupply = supplyBySku[t.materialCode] || '';   // 大仓供应（缺货报告，每 SKU 独立）
  });
  return top5;
}

// ============ 订单数据洞察（普通 / 特殊价格 / 免费单，品牌×客户×RDC 环比） ============
// 数据源：
//   普通订单   ← dataStore.orderDetail（订单明细 sheet）
//   免费单     ← dataStore.otherOrders 中 orderType==='免费单'（其他订单 sheet，G列 ZKFD-跨公司免费销售订单）
//   特殊价格   ← dataStore.otherOrders 中 orderType==='特殊价格订单'（其他订单 sheet，G列 ZDTA-特殊价格标准订单）
// 时间：5/6/7 连续三个月环比（其他订单表本身含 5/6/7 三个月数据）
function renderOrderInsight() {
  setTitle('订单数据洞察');
  const page = document.getElementById('page-order-insight');
  if (!page) return;

  const orderDetail = dataStore.orderDetail || [];
  const otherOrders = dataStore.otherOrders || [];
  const covCur = (dataStore.inventory && dataStore.inventory.cov7) || []; // 当前月=7月
  const covPrev = (dataStore.inventory && dataStore.inventory.cov6) || []; // 基准月=6月
  // SKU 名称补全表：从多源补全（订单明细 → 库存覆盖 → 周转 sheet → 转储数据 → 海南花露水历史 → 基础数据）
  const skuNameMap = {};
  orderDetail.forEach(d => { if (d.skuCode && d.skuName) skuNameMap[d.skuCode] = d.skuName; });
  otherOrders.forEach(d => { if (d.skuCode && d.skuName) skuNameMap[d.skuCode] = d.skuName; });
  covCur.forEach(d => { if (d.sku && d.skuName && !skuNameMap[d.sku]) skuNameMap[d.sku] = d.skuName; });
  covPrev.forEach(d => { if (d.sku && d.skuName && !skuNameMap[d.sku]) skuNameMap[d.sku] = d.skuName; });
  // 数据源 4：转储数据 materialName（idb 缓存可能为空，每次都补一次以防万一）
  (dataStore.transship || []).forEach(d => { if (d.material && d.materialName && !skuNameMap[d.material]) skuNameMap[d.material] = d.materialName; });
  // 数据源 5：海南花露水历史数据（含 SKU 名称 + 编码，第 5/4 列）
  const _hainanSheet = (dataStore.inventory && dataStore.inventory._rawSheets && dataStore.inventory._rawSheets['海南花露水历史数据']) || null;
  if (_hainanSheet) {
    _hainanSheet.forEach(r => {
      if (!r || r.length < 5) return;
      const code = String(r[4] || '').trim();
      const name = String(r[3] || '').trim();
      if (code && name && !skuNameMap[code]) skuNameMap[code] = name;
    });
  }
  // 数据源 6：基础数据 sheet（产品编码 → 产品名称）
  const _baseSheet = (dataStore.inventory && dataStore.inventory._rawSheets && dataStore.inventory._rawSheets['基础数据']) || null;
  if (_baseSheet) {
    _baseSheet.forEach(r => {
      if (!r || r.length < 2) return;
      const code = String(r[0] || '').trim();
      const name = String(r[1] || '').trim();
      if (code && name && !skuNameMap[code]) skuNameMap[code] = name;
    });
  }
  const _pm2 = (dataStore.inventory && dataStore.inventory.productMaster) || {};
  Object.keys(_pm2).forEach(k => { if (_pm2[k] && _pm2[k].skuName && !skuNameMap[k]) skuNameMap[k] = _pm2[k].skuName; });
  // 动态月份：优先从全局可用月份取，确保新月份（如8月）自动出现
  const months = (window._availableMonths && window._availableMonths.length > 0)
    ? window._availableMonths.slice()
    : ['2026-07'];
  const monthLabels = months.map(m => {
    const mm = parseInt(m.split('-')[1], 10);
    return mm + '月';
  });
  // MTD 趋势图：连续 1月-当前月
  const latestMonth = window._latestMonth || (months.length ? months[months.length - 1] : '2026-08');
  const [latestY, latestMNum] = latestMonth.split('-').map(Number);
  const trendMonths = [];
  for (let mm = 1; mm <= latestMNum; mm++) {
    trendMonths.push(latestY + '-' + String(mm).padStart(2, '0'));
  }
  const trendMonthLabels = trendMonths.map(m => parseInt(m.split('-')[1], 10) + '月');
  const TYPE_COLORS = { '普通订单': '#2563EB', '特殊价格订单': '#F59E0B', '免费单': '#10B981' };

  if (typeof window._oiMonth === 'undefined') {
    window._oiMonth = window._latestMonth || (months.length > 0 ? months[months.length - 1] : '2026-07');
  }
  // 若缓存中的旧选中月已不在列表，回退到最新月
  if (months.indexOf(window._oiMonth) < 0) {
    window._oiMonth = window._latestMonth || (months.length > 0 ? months[months.length - 1] : '2026-07');
  }
  if (typeof window._oiHainan === 'undefined') window._oiHainan = 'all';
  if (typeof window._oiByBox === 'undefined') window._oiByBox = false;
  const u = window._oiByBox ? '箱' : '支';

  // ====== SKU → 是否海南花露水 映射 =====
  // 数据源（按优先级）：
  //   1. 库存覆盖数据 cov5/cov6 的 isHainan 字段（如有）
  //   2. 【权威】「海南花露水历史数据」sheet 里的产品编码 + 第 9 列「海南花露水」='是'
  // 早期实现只用了 1，cov5/cov6 sheet 实际不带 isHainan 列，导致 skuIsHainan 集合空，
  // 海南花露水筛选在所有页（含转储vs出货弹框）都失效。
  const skuIsHainan = {};
  [...covCur, ...covPrev].forEach(d => {
    if (d.sku && d.isHainan) skuIsHainan[d.sku] = true;
  });
  const _hainanSheet2 = (dataStore.inventory && dataStore.inventory._rawSheets && dataStore.inventory._rawSheets['海南花露水历史数据']) || null;
  if (_hainanSheet2 && _hainanSheet2.length > 1) {
    const hhdr = _hainanSheet2[0] || [];
    function hCol2(n) {
      for (let i = 0; i < hhdr.length; i++) {
        if (String(hhdr[i] || '').trim() === n) return i;
      }
      return -1;
    }
    const H_SKU = hCol2('产品编码');
    const H_FLAG = hCol2('海南花露水');
    if (H_SKU >= 0) {
      for (let i = 1; i < _hainanSheet2.length; i++) {
        const r = _hainanSheet2[i];
        if (!r) continue;
        const sku = String(r[H_SKU] || '').trim();
        if (!sku) continue;
        if (H_FLAG < 0) { skuIsHainan[sku] = true; continue; }
        const flag = String(r[H_FLAG] || '').trim();
        if (flag === '是') skuIsHainan[sku] = true;
      }
    }
  }
  window._skuIsHainan = skuIsHainan; // v113: 暴露到全局，让 renderPlanMonitor 等其他函数能访问
  console.log('[HainanFilter] 海南花露水 SKU 集合大小:', Object.keys(skuIsHainan).length, '当前筛选:', window._oiHainan);

  const _pm = (dataStore.inventory && dataStore.inventory.productMaster) || {};
  function specOf(sku) { const bs = window._boxSpec && window._boxSpec[String(sku)]; return (bs && bs > 0) ? bs : 1; }
  // ISO 周键（周一为一周起点），返回 'YYYY-Www' 可字典序排序
  function isoWeekKey(dateStr) {
    const p = String(dateStr).split('-');
    const d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    const dayNum = (d.getUTCDay() + 6) % 7; // 周一=0
    d.setUTCDate(d.getUTCDate() - dayNum + 3); // 移到本周四以确定所属 ISO 周
    const firstThu = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
    const wk = 1 + Math.round(((d - firstThu) / 86400000 - 3 + ((firstThu.getUTCDay() + 6) % 7)) / 7);
    return d.getUTCFullYear() + '-W' + String(wk).padStart(2, '0');
  }
  // 简单移动平均（不足窗口返回 null）
  function smaArr(arr, n) {
    const out = [];
    for (let i = 0; i < arr.length; i++) {
      if (i < n - 1) { out.push(null); continue; }
      let s = 0; for (let j = i - n + 1; j <= i; j++) s += arr[j];
      out.push(Math.round(s / n));
    }
    return out;
  }

  // ====== 归一化行 ======
  const rows = [];
  orderDetail.forEach(d => {
    if (!d.dateStr) return;
    rows.push({ type: '普通订单', month: d.dateStr.slice(0, 7), brand: d.brand || '未知',
      customerGroup: d.customerGroup || '未知', rdc: d.warehouse || '未知', channel: d.channel || '',
      skuCode: d.skuCode || '',
      isHainan: !!(d.skuCode && skuIsHainan[d.skuCode]),
      orderQty: d.orderQty || 0, firstDayQty: d.firstDayQty || 0, totalFulfillQty: d.totalFulfillQty || 0, line: 1 });
  });
  otherOrders.forEach(d => {
    if (!d.dateStr) return;
    rows.push({ type: d.orderType || '特殊价格订单', month: d.dateStr.slice(0, 7), brand: d.brand || '未知',
      customerGroup: d.customerGroup || '未知', rdc: d.warehouse || '未知', channel: d.channel || '',
      skuCode: d.skuCode || '',
      isHainan: !!(d.skuCode && skuIsHainan[d.skuCode]),
      orderQty: d.orderQty || 0, firstDayQty: d.firstDayQty || 0, totalFulfillQty: d.totalFulfillQty || 0, line: 1 });
  });

  // ====== 聚合工具 ======
  function sumBy(arr, keyFn) {
    const byBox = window._oiByBox === true;
    const m = {};
    arr.forEach(r => {
      const k = keyFn(r);
      if (!m[k]) m[k] = { orderQty: 0, lines: 0, firstDayQty: 0, totalFulfillQty: 0 };
      if (byBox) {
        const s = specOf(r.skuCode);
        m[k].orderQty += r.orderQty / s;
        m[k].firstDayQty += r.firstDayQty / s;
        m[k].totalFulfillQty += r.totalFulfillQty / s;
      } else {
        m[k].orderQty += r.orderQty;
        m[k].firstDayQty += r.firstDayQty;
        m[k].totalFulfillQty += r.totalFulfillQty;
      }
      m[k].lines += r.line;
    });
    if (byBox) {
      Object.keys(m).forEach(k => {
        m[k].orderQty = Math.round(m[k].orderQty);
        m[k].firstDayQty = Math.round(m[k].firstDayQty);
        m[k].totalFulfillQty = Math.round(m[k].totalFulfillQty);
      });
    }
    return m;
  }
  const byMonth = sumBy(rows, r => r.month);       // 月
  const monthFiltered = (window._oiMonth === 'all') ? rows : rows.filter(r => r.month === window._oiMonth);
  const selRows = (window._oiHainan === 'all') ? monthFiltered : monthFiltered.filter(r => window._oiHainan === 'yes' ? r.isHainan : !r.isHainan);
  const byType = sumBy(selRows, r => r.type);       // 类型×月
  const byTypeBrand = sumBy(selRows, r => r.type + '|' + r.brand);   // 类型|品牌
  const byTypeRdc = sumBy(selRows, r => r.type + '|' + r.rdc);       // 类型|RDC
  // AAA经销商排除：兼容 'AAA-经销商'、'AAA经销商' 等任何含 AAA 的写法
  function isExcludedAAA(r) { return r.customerGroup && /AAA/.test(r.customerGroup); }
  const filteredRowsForCust = (window._oiTopCustFilter === 'exclude') ? selRows.filter(r => !isExcludedAAA(r)) : selRows;
  const byTypeCust = sumBy(filteredRowsForCust, r => r.type + '|' + r.customerGroup); // 类型|客户
  const byBrand = sumBy(selRows, r => r.brand);      // 品牌×月
  const byCust = sumBy(filteredRowsForCust, r => r.customerGroup); // 客户×月（按卡片筛选）

  function rateOf(o) { return o.orderQty > 0 ? o.firstDayQty / o.orderQty : 0; }
  function fmtN(n) { return (n || 0).toLocaleString(); }
  function fmtPct(v) { return (v * 100).toFixed(1) + '%'; }
  function ppColor(v) { return v >= 0 ? 'var(--color-green)' : 'var(--color-red)'; }

  // 环比（当前选中月 vs 上月）
  function getPrevMonth(cur) {
    const [y, m] = cur.split('-').map(Number);
    if (m === 1) return (y - 1) + '-12';
    return y + '-' + String(m - 1).padStart(2, '0');
  }
  function mom(curKey, prevKey, map) {
    const c = map[curKey], p = map[prevKey];
    if (!c || !p || !p.orderQty) return null;
    return { d: c.orderQty - p.orderQty, pct: (c.orderQty - p.orderQty) / p.orderQty, lines: c.lines - p.lines };
  }
  const momType = {};
  const prevMonth = getPrevMonth(window._oiMonth);
  ['普通订单', '特殊价格订单', '免费单'].forEach(t => { momType[t] = mom(t + '|' + window._oiMonth, t + '|' + prevMonth, sumBy(rows, r => r.type + '|' + r.month)); });

  // 最新月（7月）类型构成
  const typeArr = ['普通订单', '特殊价格订单', '免费单'].map(t => byType[t] || { orderQty: 0, lines: 0 });
  const totalQty = typeArr.reduce((s, o) => s + o.orderQty, 0);

  // 品牌列表（按选中月订单量降序）
  const brandList = Object.keys(byBrand).sort((a, b) => (byBrand[b].orderQty || 0) - (byBrand[a].orderQty || 0)).slice(0, 10);
  // 客户TOP10
  const custList = Object.keys(byCust).sort((a, b) => (byCust[b].orderQty || 0) - (byCust[a].orderQty || 0)).slice(0, 10);
  // RDC 列表
  const rdcList = RDC_LIST.filter(r => byTypeRdc['普通订单|' + r] || byTypeRdc['特殊价格订单|' + r] || byTypeRdc['免费单|' + r]);
  if (rdcList.length === 0) rdcList.push(...RDC_LIST);

  // ====== 交叉洞察：满足率对比 ======
  const rateRows = typeArr.map((o, i) => ({ type: ['普通订单', '特殊价格订单', '免费单'][i], qty: o.orderQty, rate: rateOf(o) }));

  // ====== 交叉洞察：库存覆盖联动（品牌当月订单 vs 最近可用期末库存） ======
  function getCovBaseForMonth(targetMonth) {
    const inv = dataStore.inventory || {};
    const available = [];
    if (inv.cov5 && inv.cov5.length) available.push({ month: '2026-05', data: inv.cov5 }); // 5月sheet→5月末库存（6月起覆盖）
    if (inv.cov6 && inv.cov6.length) available.push({ month: '2026-06', data: inv.cov6 }); // 6月sheet→6月末库存（7月起覆盖）
    if (inv.cov7 && inv.cov7.length) available.push({ month: '2026-07', data: inv.cov7 }); // 7月sheet→7月末库存（8月起覆盖）
    if (!available.length) return null;
    const prev = getPrevMonth(targetMonth);
    const match = available.filter(x => x.month <= prev).pop();
    return match ? match.data : available[available.length - 1].data;
  }
  function getCovBaseMonthLabel(targetMonth) {
    const base = getCovBaseForMonth(targetMonth);
    if (!base) return '';
    const inv = dataStore.inventory || {};
    if (base === inv.cov7) return '7月末';
    if (base === inv.cov6) return '6月末';
    if (base === inv.cov5) return '5月末';
    return '';
  }
  const invBaseLabel = getCovBaseMonthLabel(window._oiMonth);
  const brandInv = {};
  const invCovBase = getCovBaseForMonth(window._oiMonth);
  (invCovBase || []).forEach(d => {
    if (!d.brand) return;
    const q = d.availableQty || 0;
    const s = window._oiByBox ? specOf(d.sku) : 1;
    brandInv[d.brand] = (brandInv[d.brand] || 0) + q / s;
  });
  if (window._oiByBox) Object.keys(brandInv).forEach(k => { brandInv[k] = Math.round(brandInv[k]); });
  const invWarn = [];
  brandList.forEach(b => {
    const o = byBrand[b]; if (!o || o.orderQty <= 0) return;
    const inv = brandInv[b] || 0;
    if (inv > 0 && o.orderQty > inv) {
      invWarn.push({ brand: b, orderQty: o.orderQty, inv: inv, ratio: o.orderQty / inv });

  invWarn.sort((a, b) => b.ratio - a.ratio);

  // ====== 交叉洞察：转储入库 vs 实际出货（按 RDC） ======
  // v94：转储数据是月度更新，图表只显示 T-1（当前筛选月上一个月）的数据。
  // 例如筛选 8 月时，实际出货与转储入库均展示 7 月数据；若 7 月无转储则回退到更早可用月。
  const transMonths = new Set();
  (dataStore.transship || []).forEach(r => { if (r.dateStr && r.dateStr.length >= 7) transMonths.add(r.dateStr.slice(0, 7)); });
  let compareMonth = window._oiMonth;
  let compareMonthFallback = false;  // 标记是否回退到其他月（避免标题误导）
  if (compareMonth === 'all') {
    const shipMonths = [...new Set(rows.map(r => r.month))].sort();
    const latestShip = shipMonths[shipMonths.length - 1] || '';
    compareMonth = latestShip ? getPrevMonth(latestShip) : '';
  } else {
    compareMonth = getPrevMonth(compareMonth);
  }
  if (compareMonth && !transMonths.has(compareMonth)) {
    const arr = [...transMonths].sort();
    const fallback = arr.filter(m => m <= compareMonth).pop() || arr[arr.length - 1] || '';
    if (fallback) {
      compareMonth = fallback;
      compareMonthFallback = true;
    } else {
      compareMonth = '';
    }
  }
  // 实际出货与转储均统一使用 T-1 月（compareMonth），与上方筛选的 T 月解耦
  // 修复 v126.1：rows 已被"统计月份"过滤，compareMonth=T-1 不在 rows 里必空。
  // 直接用全量 dataStore.orderDetail + dataStore.transship 过滤，保持与 T-1 语义一致。
  const allOrders = dataStore.orderDetail || [];
  const allOrdersWithMonth = allOrders.map(d => ({ ...d, month: (d.dateStr || '').slice(0, 7) }));
  const compareRows = compareMonth ? allOrdersWithMonth.filter(d => {
    if (d.month !== compareMonth) return false;
    if (window._oiHainan === 'all') return true;
    return window._oiHainan === 'yes' ? skuIsHainan[d.skuCode] : !skuIsHainan[d.skuCode];
  }) : [];
  const compareRowsNoFree = compareRows.filter(r => r.type !== '免费单'); // 转储vs出货模块排除免费单出货/需求
  const compareTrans = compareMonth ? (dataStore.transship || []).filter(r => r.dateStr && r.dateStr.startsWith(compareMonth) && !skuIsHainan[r.material]) : [];
  const shipByRdc = {}, transByRdc = {};
  compareRowsNoFree.forEach(r => {
    if (!r.rdc) return;
    // 订单明细的 totalFulfillQty 按支统计。_oiByBox=true 时除以箱规得箱数；false 时直接是支。
    const s = window._oiByBox ? specOf(r.skuCode) : 1;
    shipByRdc[r.rdc] = (shipByRdc[r.rdc] || 0) + (r.totalFulfillQty || 0) / s;
  });
  compareTrans.forEach(r => {
    if (!r.rdc || r.rdc === '未知') return;
    // 转储 inboundQty 原始单位由 r.isBox 决定：true=箱，false=支。
    // 目标单位由 window._oiByBox 决定：true=箱，false=支。同单位直接用，跨单位乘/除箱规。
    const s = specOf(r.material); // 始终取箱规（支/箱），缺箱规时视为1
    const qty = (r.isBox === window._oiByBox)
      ? (r.inboundQty || 0)
      : (window._oiByBox
          ? (r.inboundQty || 0) / s   // 源=支 → 目标=箱：除以箱规
          : (r.inboundQty || 0) * s); // 源=箱 → 目标=支：乘以箱规
    transByRdc[r.rdc] = (transByRdc[r.rdc] || 0) + qty;
  });
  if (window._oiByBox) {
    Object.keys(shipByRdc).forEach(k => shipByRdc[k] = Math.round(shipByRdc[k]));
    Object.keys(transByRdc).forEach(k => transByRdc[k] = Math.round(transByRdc[k]));
  }
  const transShipRdcs = RDC_LIST.filter(r => shipByRdc[r] || transByRdc[r]);
  if (transShipRdcs.length === 0) transShipRdcs.push(...RDC_LIST);
  const diffByRdc = {};
  transShipRdcs.forEach(rdc => { diffByRdc[rdc] = (transByRdc[rdc] || 0) - (shipByRdc[rdc] || 0); });
  const transShipMonthLabel = compareMonth
    ? (compareMonth.replace('2026-', '') + '月' + (compareMonthFallback ? '（回退到最近可用月）' : ''))
    : '无转储数据';
  // ====== SKU 级差异明细（转储 vs 出货 + 期初库存/未来需求 + 根因）======
  // 期初库存基准：取 targetMonth 上月最近可用的覆盖数据（5/6/7月 sheet 滚动，取最新可用）
  const covBase = getCovBaseForMonth(compareMonth);
  const invMap = {};
  (covBase || []).forEach(d => {
    if (!d.sku || !d.rdc) return;
    const s = window._oiByBox ? specOf(d.sku) : 1;
    const k = d.rdc + '|' + d.sku;
    if (invMap[k]) return;
    const fut = (d.cov08 || 0) + (d.cov09 || 0) + (d.cov10 || 0) + (d.cov11 || 0) + (d.cov12 || 0) + (d.cov13 || 0);
    invMap[k] = { avail: (d.availQtyPlan || 0) / s, fut: fut / s };
  });
  // SKU×RDC 聚合：出货/订单需求（来自订单明细，排除免费单），转储入库（来自转储）
  const skuAgg = {};
  compareRowsNoFree.forEach(r => {
    const s = window._oiByBox ? specOf(r.skuCode) : 1;
    const k = r.rdc + '|' + r.skuCode;
    if (!skuAgg[k]) skuAgg[k] = { rdc: r.rdc, sku: r.skuCode, skuName: r.skuName || '', ship: 0, order: 0, trans: 0 };
    skuAgg[k].ship += (r.totalFulfillQty || 0) / s;
    skuAgg[k].order += (r.orderQty || 0) / s;
  });
  compareTrans.forEach(r => {
    // 转储 inboundQty 原始单位由 r.isBox 决定：true=箱，false=支。
    // 目标单位由 window._oiByBox 决定：true=箱，false=支。同单位直接用，跨单位乘/除箱规。
    const s = specOf(r.material);
    const qty = (r.isBox === window._oiByBox)
      ? (r.inboundQty || 0)
      : (window._oiByBox
          ? (r.inboundQty || 0) / s   // 源=支 → 目标=箱
          : (r.inboundQty || 0) * s); // 源=箱 → 目标=支
    const k = r.rdc + '|' + r.material;
    if (!skuAgg[k]) skuAgg[k] = { rdc: r.rdc, sku: r.material, skuName: skuNameMap[r.material] || r.materialName || '', ship: 0, order: 0, trans: 0 };
    skuAgg[k].trans += qty;
  });
  // 根因分类：diff = 转储入库 − 实际出货
  function diagnoseTS(it) {
    const diff = it.trans - it.ship;
    const ship = it.ship || 0, order = it.order || 0, trans = it.trans || 0;
    const avail = it.avail || 0, fut = it.fut || 0;
    if (avail <= 0 && fut <= 0) { // 无期初库存基准：仅按订单vs出货/转储粗判
      if (diff < 0 && order > ship * 1.3) return '需求超预期';
      if (diff > 0 && order < ship * 0.9 && trans > ship) return '低销/需求不足';
      return '进出相对平衡';
    }
    if (diff < 0) { // 出货>转储：库存净减少
      if (avail > ship * 1.5 && trans < ship * 0.3) return '期初库存充足，消化库存为主';
      if (order > ship * 1.2 && trans < order * 0.6) return '需求超预期，补货未跟上';
      return '主动消耗库存';
    } else { // 转储>出货：库存净增加
      if (fut > ship * 2 && trans > ship) return '为未来需求备货';
      if (order > ship * 1.3) return '需求旺盛但出货受限';
      if (order < ship && fut < ship * 2) return '低销/需求不足';
      return '常规补货';
    }
  }
  const skuDetailAll = [];
  Object.keys(skuAgg).forEach(k => {
    const it = skuAgg[k];
    const im = invMap[k] || {};
    const diff = it.trans - it.ship;
    // 海南花露水双保险：com层已过滤，这里再过滤一次，防止纯转储的海南花露水 SKU 漏入
    if (skuIsHainan[it.sku]) return;
    // 强制 SKU 名称补全：skuNameMap 优先 → it.skuName
    const finalName = (skuNameMap[it.sku] || it.skuName || '').trim();
    skuDetailAll.push({
      rdc: it.rdc, sku: it.sku, skuName: finalName,
      trans: Math.round(it.trans), ship: Math.round(it.ship), order: Math.round(it.order),
      diff: Math.round(diff),
      avail: Math.round(im.avail || 0), fut: Math.round(im.fut || 0),
      rootCause: diagnoseTS({ ship: it.ship, order: it.order, trans: it.trans, avail: im.avail || 0, fut: im.fut || 0 })
    });
  });
  skuDetailAll.sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff));
  window._oiSkuDetail = skuDetailAll;
  window._oiSkuDetailMonth = transShipMonthLabel;
  function buildSkuTop5(rdc) { return skuDetailAll.filter(x => x.rdc === rdc).slice(0, 5); }

  // ====== 页面 HTML ======
  const monthSelect = '<label style="font-size:12px;color:var(--text-secondary);margin-right:6px">统计月份：</label>' +
    '<select onchange="window._oiMonth=this.value;renderOrderInsight()" style="min-width:110px;font-size:12px;padding:4px 8px;border:1px solid #D1D5DB;border-radius:4px;background:#FFF">' +
      months.slice().reverse().map((m, i) => '<option value="' + m + '"' + (window._oiMonth === m ? ' selected' : '') + '>' + monthLabels[months.length - 1 - i] + '</option>').join('') +
    '</select>';
  const hainanSelect = '<label style="font-size:12px;color:var(--text-secondary);margin-left:8px;margin-right:6px">是否海南花露水：</label>' +
    '<select onchange="window._oiHainan=this.value;renderOrderInsight()" style="min-width:110px;font-size:12px;padding:4px 8px;border:1px solid #D1D5DB;border-radius:4px;background:#FFF">' +
      '<option value="all" ' + (window._oiHainan === 'all' ? 'selected' : '') + '>全部</option>' +
      '<option value="yes" ' + (window._oiHainan === 'yes' ? 'selected' : '') + '>仅海南花露水</option>' +
      '<option value="no" ' + (window._oiHainan === 'no' ? 'selected' : '') + '>不含海南花露水</option>' +
    '</select>';
  const byBoxCheckbox = '<label style="font-size:12px;color:var(--text-secondary);margin-left:8px;display:inline-flex;align-items:center;cursor:pointer">' +
    '<input type="checkbox" onchange="window._oiByBox=this.checked;renderOrderInsight()" ' + (window._oiByBox ? 'checked' : '') + ' style="margin-right:4px;cursor:pointer">是否按箱统计（按SKU箱规换算）' +
    '</label>';

  // KPI 卡片
  const momSel = mom(window._oiMonth, prevMonth, sumBy(rows, r => r.month));
  const kpiHtml = '<div class="kpi-row" style="padding:0 8px 8px">' +
    '<div class="kpi-card blue"><div class="kpi-label">' + monthLabels[months.indexOf(window._oiMonth)] + '订单量</div><div class="kpi-value">' + fmtN(totalQty) + '<span class="kpi-unit">' + u + '</span></div>' +
      '<div style="font-size:11px;color:#64748B">' + selRows.length.toLocaleString() + ' 行订单</div></div>' +
    '<div class="kpi-card blue"><div class="kpi-label">普通订单</div><div class="kpi-value">' + fmtN(typeArr[0].orderQty) + '<span class="kpi-unit">' + u + '</span></div>' +
      '<div style="font-size:11px">占 <b>' + (totalQty > 0 ? (typeArr[0].orderQty / totalQty * 100).toFixed(1) : 0) + '%</b> · 环比 <span style="color:' + (momType['普通订单'] ? ppColor(momType['普通订单'].pct) : '#64748B') + '">' + (momType['普通订单'] ? (momType['普通订单'].pct >= 0 ? '+' : '') + (momType['普通订单'].pct * 100).toFixed(1) + '%' : '—') + '</span></div></div>' +
    '<div class="kpi-card orange"><div class="kpi-label">特殊价格订单</div><div class="kpi-value">' + fmtN(typeArr[1].orderQty) + '<span class="kpi-unit">' + u + '</span></div>' +
      '<div style="font-size:11px">占 <b>' + (totalQty > 0 ? (typeArr[1].orderQty / totalQty * 100).toFixed(1) : 0) + '%</b> · 环比 <span style="color:' + (momType['特殊价格订单'] ? ppColor(momType['特殊价格订单'].pct) : '#64748B') + '">' + (momType['特殊价格订单'] ? (momType['特殊价格订单'].pct >= 0 ? '+' : '') + (momType['特殊价格订单'].pct * 100).toFixed(1) + '%' : '—') + '</span></div></div>' +
    '<div class="kpi-card green"><div class="kpi-label">免费单</div><div class="kpi-value">' + fmtN(typeArr[2].orderQty) + '<span class="kpi-unit">' + u + '</span></div>' +
      '<div style="font-size:11px">占 <b>' + (totalQty > 0 ? (typeArr[2].orderQty / totalQty * 100).toFixed(1) : 0) + '%</b> · 环比 <span style="color:' + (momType['免费单'] ? ppColor(momType['免费单'].pct) : '#64748B') + '">' + (momType['免费单'] ? (momType['免费单'].pct >= 0 ? '+' : '') + (momType['免费单'].pct * 100).toFixed(1) + '%' : '—') + '</span></div></div>' +
  '</div>';

  // 明细表
  const detailRows = brandList.map(b => {
    const o = byBrand[b];
    const cells = ['普通订单', '特殊价格订单', '免费单'].map(t => {
      const key = t + '|' + b;
      const e = byTypeBrand[key];
      return e ? e.orderQty.toLocaleString() : '-';
    });
    return '<tr><td style="text-align:left">' + b + '</td><td style="text-align:right;font-weight:600">' + o.orderQty.toLocaleString() + '</td>' +
      cells.map((c, i) => '<td style="text-align:right;color:' + TYPE_COLORS[['普通订单','特殊价格订单','免费单'][i]] + '">' + c + '</td>').join('') +
      '<td style="text-align:right">' + o.lines.toLocaleString() + '</td></tr>';
  }).join('');

  const invWarnHtml = invWarn.length > 0
    ? '<div style="margin-top:8px;font-size:12px;line-height:1.8">' +
        invWarn.map(w => '<div>⚠️ <b>' + w.brand + '</b>：' + monthLabels[months.indexOf(window._oiMonth)] + '订单 ' + fmtN(w.orderQty) + ' ' + u + ' &gt; ' + invBaseLabel + '库存 ' + fmtN(w.inv) + ' ' + u + '（' + (w.ratio).toFixed(1) + '倍）— <span style="color:#EF4444">库存不足以覆盖订单，建议核查补货</span></div>').join('') +
      '</div>'
    : '<div style="margin-top:8px;font-size:12px;color:var(--color-green)">✅ 无品牌出现「订单量 &gt; ' + invBaseLabel + '库存」的预警</div>';

  // ====== 品牌×RDC 周度订单量 K线趋势（全月份，从1月起；不耦合上方"统计月份"）======
  // 修复 v126.1：rows 已被"统计月份"过滤（line 3319），导致选 7月时 rows 只剩 7月 → K线变空。
  // K线语义是"全月份趋势"，必须直接读全量 dataStore.orderDetail，与统计月份完全解耦。
  if (typeof window._oiKlineBrand === 'undefined') window._oiKlineBrand = 'all';
  if (typeof window._oiKlineRdc === 'undefined') window._oiKlineRdc = 'all';
  const kAll = dataStore.orderDetail || [];
  const kBrands = [...new Set(kAll.map(d => d.brand).filter(Boolean))].sort();
  const kRdcs = [...new Set(kAll.map(d => d.warehouse).filter(Boolean))].sort();
  const klineRows = kAll.filter(d => {
    if (!d.dateStr) return false;
    if (window._oiHainan !== 'all') {
      const ok = window._oiHainan === 'yes' ? skuIsHainan[d.skuCode] : !skuIsHainan[d.skuCode];
      if (!ok) return false;
    }
    if (window._oiKlineBrand !== 'all' && d.brand !== window._oiKlineBrand) return false;
    if (window._oiKlineRdc !== 'all' && d.warehouse !== window._oiKlineRdc) return false;
    return true;
  });
  const wkMap = {};
  klineRows.forEach(r => {
    const wk = isoWeekKey(r.dateStr);
    if (!wkMap[wk]) wkMap[wk] = { qty: 0, minDate: r.dateStr };
    else if (r.dateStr < wkMap[wk].minDate) wkMap[wk].minDate = r.dateStr;
    const s = specOf(r.skuCode);
    wkMap[wk].qty += window._oiByBox ? r.orderQty / s : r.orderQty;
  });
  const kWeeks = Object.keys(wkMap).sort();
  const kLabels = kWeeks.map(w => {
    const md = wkMap[w].minDate, p = md.split('-');
    const d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    const dn = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - dn);
    const wkNum = parseInt(w.split('-W')[1], 10);
    return 'W' + wkNum + ' ' + String(d.getUTCMonth() + 1).padStart(2, '0') + '/' + String(d.getUTCDate()).padStart(2, '0');
  });
  const kCloses = kWeeks.map(w => Math.round(wkMap[w].qty));
  const kCandle = [];
  for (let i = 0; i < kWeeks.length; i++) {
    const close = kCloses[i];
    const open = (i === 0) ? close : kCloses[i - 1];
    kCandle.push([open, close, Math.min(open, close), Math.max(open, close)]);
  }
  if (kCandle.length) kCandle[0] = { value: kCandle[0], itemStyle: { color: '#94A3B8', color0: '#94A3B8', borderColor: '#94A3B8', borderColor0: '#94A3B8' } };
  // v128: 按 SKU × ISO周 聚合订单量，供 K线 tooltip「相比上周升降 TOP5」明细
  //   与 wkMap 同步按"按箱统计/按支"换算；首周无可比基期，hover 时返回空提示
  const skuWkMap = {}; // skuWkMap[wk][skuCode] = qty
  klineRows.forEach(r => {
    const wk = isoWeekKey(r.dateStr);
    if (!skuWkMap[wk]) skuWkMap[wk] = {};
    const s = specOf(r.skuCode);
    skuWkMap[wk][r.skuCode] = (skuWkMap[wk][r.skuCode] || 0) + (window._oiByBox ? r.orderQty / s : r.orderQty);
  });
  const kMa5 = smaArr(kCloses, 5), kMa10 = smaArr(kCloses, 10), kMa15 = smaArr(kCloses, 15);
  let kGold = null, kDeath = null;
  for (let i = 1; i < kWeeks.length; i++) {
    if (kMa5[i] != null && kMa15[i] != null && kMa5[i - 1] != null && kMa15[i - 1] != null) {
      if (kMa5[i] > kMa15[i] && kMa5[i - 1] <= kMa15[i - 1]) kGold = i;

              h += '<br/>' + p.marker + p.seriesName + '：' + fmtN(p.value) + ' ' + u;
            }
          });
          // v128: 红K线=相比上周上升 TOP5；绿K线=相比上周下降 TOP5
          // 灰色首周（idx=0）无可比基期，直接跳过；idx<1 时同样跳过
          const detailTitle = isUp ? '本周相比上周 ↑ 上升最多 TOP5' : '本周相比上周 ↓ 下降最多 TOP5';
          if (hoveredIdx >= 1 && skuWkMap && skuWkMap[kWeeks[hoveredIdx]]) {
            const curMap = skuWkMap[kWeeks[hoveredIdx]] || {};
            const prevMap = skuWkMap[kWeeks[hoveredIdx - 1]] || {};
            const skuSet = new Set([...Object.keys(curMap), ...Object.keys(prevMap)]);
            const diffArr = [];
            skuSet.forEach(sku => {
              const cur = curMap[sku] || 0;
              const prev = prevMap[sku] || 0;
              diffArr.push({ sku: sku, cur: cur, prev: prev, diff: cur - prev });
            });
            // 红K线取 diff 最大 top5（升序，按 diff 倒序）；绿K线取 diff 最负 top5
            diffArr.sort((a, b) => isUp ? (b.diff - a.diff) : (a.diff - b.diff));
            const top = diffArr.slice(0, 5).filter(r => Math.abs(r.diff) > 0.5);
            h += '<br/><span style="display:inline-block;margin:6px 0 2px;font-weight:600;color:#475569">📋 ' + detailTitle + '</span>';
            if (top.length === 0) {
              h += '<br/><span style="color:#94A3B8;font-size:11px">本周与上周各 SKU 订单量无显著变化（无 Δ≥1）</span>';
            } else {
              h += '<table style="border-collapse:collapse;font-size:11px;margin-top:2px"><thead><tr style="text-align:right;color:#64748B">' +
                '<th style="text-align:left;padding:2px 6px 2px 0">SKU</th>' +
                '<th style="padding:2px 6px">本周</th>' +
                '<th style="padding:2px 6px">上周</th>' +
                '<th style="padding:2px 6px">Δ</th>' +
                '</tr></thead><tbody>';
              top.forEach((r, i) => {
                const name = skuNameMap[r.sku] || '';
                const arrow = r.diff > 0 ? '▲' : '▼';
                const color = r.diff > 0 ? '#DC2626' : '#16A34A';
                h += '<tr style="text-align:right">' +
                  '<td style="text-align:left;padding:2px 6px 2px 0"><span style="color:#94A3B8;font-size:10px">' + (i + 1) + '.</span> <span style="font-family:monospace">' + r.sku + '</span>' + (name ? '<br/><span style="color:#64748B;font-size:10px" title="' + name.replace(/"/g, '&quot;') + '">' + (name.length > 16 ? name.substring(0, 16) + '…' : name) + '</span>' : '') + '</td>' +
                  '<td style="padding:2px 6px">' + fmtN(Math.round(r.cur)) + '</td>' +
                  '<td style="padding:2px 6px;color:#94A3B8">' + fmtN(Math.round(r.prev)) + '</td>' +
                  '<td style="padding:2px 6px;font-weight:600;color:' + color + '">' + arrow + ' ' + fmtN(Math.round(Math.abs(r.diff))) + '</td>' +
                  '</tr>';
              });
              h += '</tbody></table>';
            }
          }
          return h;
        }
      },
      legend: { data: ['K线', 'MA5', 'MA10', 'MA15'], top: 0, left: 'center', textStyle: { fontSize: 10 }, itemWidth: 10, itemHeight: 10 },
      grid: { left: 65, right: 20, top: 35, bottom: 55 },
      xAxis: { type: 'category', data: kLabels, axisLabel: { fontSize: 9, rotate: 45, interval: Math.floor(kWeeks.length / 12) } },
      yAxis: { type: 'value', name: u, nameTextStyle: { fontSize: 10 }, axisLabel: { fontSize: 10 } },
      dataZoom: [{ type: 'inside' }, { type: 'slider', height: 16, bottom: 20 }],
      series: [
        { name: 'K线', type: 'candlestick', data: kCandle, itemStyle: { color: '#ef232a', color0: '#14b143', borderColor: '#ef232a', borderColor0: '#14b143' } },
        { name: 'MA5', type: 'line', data: kMa5, smooth: false, symbol: 'none', lineStyle: { width: 1.5 }, color: '#F59E0B', connectNulls: false },
        { name: 'MA10', type: 'line', data: kMa10, smooth: false, symbol: 'none', lineStyle: { width: 1.5 }, color: '#3B82F6', connectNulls: false },
        { name: 'MA15', type: 'line', data: kMa15, smooth: false, symbol: 'none', lineStyle: { width: 1.5 }, color: '#8B5CF6', connectNulls: false }
      ]
    });
  }

  renderOiSkuDetailTable();
}
