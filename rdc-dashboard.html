        const unit = C_UNIT >= 0 ? getSafeStr(r, C_UNIT) : '';
        const material = getSafeStr(r, C_MAT);
        const tKey = fmtDate(d) + '|' + material + '|' + loc;
        if (existTk.has(tKey)) continue;
        existTk.add(tKey);
        dataStore.transship.push({
          date: d, dateStr: fmtDate(d),
          location: loc, rdc: rdc, factory: getSafeStr(r, C_FACTORY),
          material: material, materialName: getSafeStr(r, C_NAME),
          poQty: getSafeNum(r, C_PO), planQty: getSafeNum(r, C_PLAN),
          confirmQty: getSafeNum(r, C_CONFIRM), invoiceQty: getSafeNum(r, C_INVOICE),
          unit: unit, isBox: unit === '箱',
          transType: transType,
          shipFactory: getSafeStr(r, C_SHIPFAC),
          inboundQty: getSafeNum(r, C_INBOUND),
          deliveryQty: getSafeNum(r, C_DELIVERY)
        });
      }
    }

    function getSN(row, idx) { const v = row[idx]; return (v == null || v === '' || isNaN(Number(v))) ? 0 : Number(v); }

    function parseStatusSheet(arr) {
      const result = [];
      if (!arr || arr.length < 2) return result;
      // 动态定位列：按表头名称查找列索引（适配 5月/6月 sheet 列结构差异）
      const header = arr[0] || [];
      function colIdx(name) {
        for (let i = 0; i < header.length; i++) {
          const v = String(header[i] || '').trim();
          if (v === name || v.indexOf(name) >= 0) return i;
        }
        return -1;
      }
      const C_LOC = colIdx('库存地点名称');
      const C_RDC = colIdx('RDC');
      const C_SKU = colIdx('产品编码');
      const C_NAME = colIdx('产品名称');
      const C_BRAND = colIdx('品牌');
      const C_QTY = colIdx('库存数量');
      const C_AMT = colIdx('库存金额');
      const C_STATUS = colIdx('状态');
      const C_AGE = colIdx('临期天数');
      const C_LIFE = colIdx('总货架寿命');
      const C_HAINAN = colIdx('海南花露水');
      for (let i = 1; i < arr.length; i++) {
        const r = arr[i];
        if (!r || !r[0]) continue;
        const status = String(r[C_STATUS] || '').trim();
        result.push({
          location: String(r[C_LOC>=0?C_LOC:0]||'').trim(),
          rdc: mapRDCName(String(r[C_RDC>=0?C_RDC:1]||'').trim()),
          sku: String(r[C_SKU>=0?C_SKU:3]||'').trim(),
          skuName: String(r[C_NAME>=0?C_NAME:4]||'').trim(),
          brand: normalizeBrandName(String(r[C_BRAND>=0?C_BRAND:6]||'').trim()),
          spec: '',
          availableQty: getSN(r, C_QTY>=0?C_QTY:9),
          ageDays: getSN(r, C_AGE>=0?C_AGE:10),
          amount: getSN(r, C_AMT>=0?C_AMT:11),
          status: status,
          isStale: '',
          isHainan: String(r[C_HAINAN>=0?C_HAINAN:14] || '').trim() === '是'
        });
      }
      return result;
    }

    function parseCoverageSheet(arr) {
      const result = [];
      if (!arr || arr.length < 3) return result;
      // 动态定位列：按表头名称查找（5月 sheet col0=null，导致后续列位置+1）
      // 5月: col0=null, col1=RDC, ..., col8=ABC分类, col9=海南花露水, col10=库存总数量, col11=库存总金额
      //             col12~17=数量分类, col18~23=金额分类, col24~27=2026-06~11需求
      // 6月: col0=RDC, ..., col8=海南花露水, col9=库存总数量, col10=库存总金额
      //             col11~16=数量分类, col17~22=金额分类, col23~28=2026-07~12需求
      const header = arr[1] || [];
      function colIdx(name) {
        for (let i = 0; i < header.length; i++) {
          const v = String(header[i] || '').trim();
          if (v === name || v.indexOf(name) >= 0) return i;
        }
        return -1;
      }
      function colLastIdx(name) {
        let r = -1;
        for (let i = 0; i < header.length; i++) {
          const v = String(header[i] || '').trim();
          if (v === name || v.indexOf(name) >= 0) r = i;
        }
        return r;
      }
      const C_RDC = colIdx('RDC');
      const C_SKU = colIdx('产品编码');
      const C_NAME = colIdx('产品名称');
      const C_BRAND = colIdx('品牌');
      const C_SUPPLY = colIdx('供应链属性');
      const C_LIFE = colIdx('生命周期标签');
      const C_FROZEN = colIdx('是否冻结（集团）');
      const C_ABC = colIdx('ABC分类');
      const C_HAINAN = colIdx('海南花露水');
      const C_QTY = colIdx('库存总数量');
      const C_TOTAL = colIdx('库存总金额');
      // 金额字段（按表头动态定位，兼容 6月「残次（元）」与 7月「【红色预警】残次品、效期品<1/3」等重命名）
      const C_STALE = colIdx('残次品') >= 0 ? colIdx('残次品') : colIdx('残次（元）');
      const C_EXPIRED = colIdx('过期~6个月（元）'); // 7月模板无独立"过期"列 → 0（已并入红/橙预警）
      const C_RETURN = colIdx('退货品') >= 0 ? colIdx('退货品') : colIdx('退货库位（元）');
      const C_NEAR = colIdx('1/3<效期') >= 0 ? colIdx('1/3<效期') : (colIdx('黄色预警') >= 0 ? colIdx('黄色预警') : colIdx('7~1/2效期（元）'));
      const C_AVAIL_RAW = colIdx('可用库存（元）') >= 0 ? colIdx('可用库存（元）') : colIdx('可用库存'); // 「可用库存」对应 planAmt（7月首个"可用库存"=金额版）
      const C_INTRANSIT = colIdx('在途库存（元）') >= 0 ? colIdx('在途库存（元）') : colIdx('在途');
      // 数量字段：7月"可用库存"出现两次（金额版在前/数量版在后），取最后一次出现 = 数量版
      const C_QTY_AVAIL = colIdx('可用库存（个）') >= 0 ? colIdx('可用库存（个）') : colLastIdx('可用库存');
      // 未来需求: cov06..cov13 = 2026-06..2027-01（按列名匹配；5月 06-11、6月 07-12、7月 08-13 各 6 个月）
      // 注意：不能只用 split('-')[1] 取月份，否则 2027-01 会映射到 cov01 而不是 cov13。
      const C_DEMAND = {};
      const COV_MONTH_MAP = {
        '2026-06':'cov06','2026-07':'cov07','2026-08':'cov08','2026-09':'cov09',
        '2026-10':'cov10','2026-11':'cov11','2026-12':'cov12','2027-01':'cov13'
      };
      Object.keys(COV_MONTH_MAP).forEach((n) => {
        C_DEMAND[COV_MONTH_MAP[n]] = colIdx(n);
      });
      const C_COVERAGE = colIdx('库存覆盖月数') >= 0 ? colIdx('库存覆盖月数') : colIdx('库存覆盖');
      const C_COV_LEVEL = colIdx('覆盖周数分类') >= 0 ? colIdx('覆盖周数分类') : colIdx('覆盖月数分类');
      for (let i = 2; i < arr.length; i++) {
        const r = arr[i];
        if (!r || r.length < 25) continue;
        // 跳过表头行（数字列多于字符列的行）
        if (typeof r[0] === 'string' && r[0].indexOf('RDC') >= 0) continue;
        const rdcRaw = String(r[C_RDC>=0?C_RDC:0]||'').trim();
        if (!rdcRaw) continue;
        const covLabel = String(r[(C_COV_LEVEL>=0?C_COV_LEVEL:30)] || '').trim();
        const qtyIdx = C_QTY>=0?C_QTY:9;
        const totalIdx = C_TOTAL>=0?C_TOTAL:10;
        // 6 个状态金额之和（用于 totalAmt 回退）
        const amountSum = (C_STALE>=0?getSN(r,C_STALE):0) + (C_EXPIRED>=0?getSN(r,C_EXPIRED):0)
                       + (C_RETURN>=0?getSN(r,C_RETURN):0) + (C_NEAR>=0?getSN(r,C_NEAR):0)
                       + (C_AVAIL_RAW>=0?getSN(r,C_AVAIL_RAW):0) + (C_INTRANSIT>=0?getSN(r,C_INTRANSIT):0);
        result.push({
          rdc: mapRDCName(rdcRaw), sku: String(r[C_SKU>=0?C_SKU:1]||'').trim(),
          skuName: String(r[C_NAME>=0?C_NAME:2]||'').trim(), brand: normalizeBrandName(String(r[C_BRAND>=0?C_BRAND:3]||'').trim()),
          supplyChainAttr: String(r[C_SUPPLY>=0?C_SUPPLY:4]||'').trim(), lifecycle: String(r[C_LIFE>=0?C_LIFE:5]||'').trim(),
          abc: String(r[C_ABC>=0?C_ABC:7]||'').trim(),
          isHainan: String(r[C_HAINAN>=0?C_HAINAN:9] || '').trim() === '是',
          availableQty: getSN(r, qtyIdx),
          availQtyPlan: C_QTY_AVAIL>=0 ? getSN(r,C_QTY_AVAIL) : 0,
          // 源表「库存总金额」全行为空 → 回退为该行 6 个金额拆分列之和
          totalAmt: (getSN(r, totalIdx) || amountSum),
          inventoryAmt: (getSN(r, totalIdx) || amountSum),
          // 状态金额字段（按列名动态定位，5月 sheet 多偏移 1 列）
          staleAmt: C_STALE>=0 ? getSN(r,C_STALE) : 0,
          expiredAmt: C_EXPIRED>=0 ? getSN(r,C_EXPIRED) : 0,
          returnAmt: C_RETURN>=0 ? getSN(r,C_RETURN) : 0,
          nearExpiryAmt: C_NEAR>=0 ? getSN(r,C_NEAR) : 0,
          planAmt: C_AVAIL_RAW>=0 ? getSN(r,C_AVAIL_RAW) : 0,
          inTransitAmt: C_INTRANSIT>=0 ? getSN(r,C_INTRANSIT) : 0,
          // 未来需求: cov06..cov13 = 2026-06..2027-01（按列名匹配，各月模板只含自身起点起 6 个月）
          cov06: getSN(r, C_DEMAND.cov06>=0?C_DEMAND.cov06:-1),
          cov07: getSN(r, C_DEMAND.cov07>=0?C_DEMAND.cov07:-1),
          cov08: getSN(r, C_DEMAND.cov08>=0?C_DEMAND.cov08:-1),
          cov09: getSN(r, C_DEMAND.cov09>=0?C_DEMAND.cov09:-1),
          cov10: getSN(r, C_DEMAND.cov10>=0?C_DEMAND.cov10:-1),
          cov11: getSN(r, C_DEMAND.cov11>=0?C_DEMAND.cov11:-1),
          cov12: getSN(r, C_DEMAND.cov12>=0?C_DEMAND.cov12:-1),
          cov13: getSN(r, C_DEMAND.cov13>=0?C_DEMAND.cov13:-1),
          coverageMonths: getSN(r, C_COVERAGE>=0?C_COVERAGE:29),
          coverageLevel: covLabel
        });
      }
      return result;
    }

    function mapRDCName(n) {
      const m = {
        '华南':'华南RDC','华北':'华北RDC','东北':'东北RDC','西北':'西北RDC','华中':'华中RDC','西南':'西南RDC',
        '华南RDC':'华南RDC','华北RDC':'华北RDC','东北RDC':'东北RDC','西北RDC':'西北RDC','华中RDC':'华中RDC','西南RDC':'西南RDC',
        '华南仓':'华南RDC','华北仓':'华北RDC','东北仓':'东北RDC','西北仓':'西北RDC','华中仓':'华中RDC','西南仓':'西南RDC',
        '华东RDC':'华东RDC','华东仓':'华东RDC','华东':'华东RDC'
      };
      return m[n] || n;
    }

    // v114: 海南花露水 SKU 集合必须在 parseInventoryExcel 末尾就构建并暴露到 window，
    // 而不是放在 renderOrderInsight 里（用户首次进入 plan-monitor 时 renderOrderInsight
    // 还没跑过，window._skuIsHainan 一直是 undefined → isH() 永远 false → 矩阵全 100% + 开关失效）。
    // 真实数据源：7月库存覆盖数据 col8='海南花露水'='是'（已由 parseCoverageSheet 解析为 d.isHainan）。
    // 7月库存覆盖数据是 cov7（最新月）；为避免「上月被剔除、下月又出现」，全量扫 cov5/cov6/cov7 取并集。
    try {
      const _hSet = {};
      const _covs = [].concat(dataStore.inventory.cov5 || [], dataStore.inventory.cov6 || [], dataStore.inventory.cov7 || []);
      for (const d of _covs) {
        if (d && d.sku && d.isHainan) _hSet[d.sku] = true;
      }
      // 兜底：直接扫 rawSheets['7月库存覆盖数据'] col8='是'（防止 parseCoverageSheet 漏解析或字段名漂移）
      const _rawCov7 = rawSheets && rawSheets['7月库存覆盖数据'];
      if (_rawCov7 && _rawCov7.length > 1) {
        const _hH = _rawCov7[1] || [];
        let _c8 = -1;
        for (let i = 0; i < _hH.length; i++) {
          if (String(_hH[i] || '').trim() === '海南花露水') { _c8 = i; break; }
        }
        if (_c8 >= 0) {
          for (let i = 2; i < _rawCov7.length; i++) {
            const r = _rawCov7[i];
            if (!r) continue;
            const sku = String(r[1] || '').trim();
            if (sku && String(r[_c8] || '').trim() === '是') _hSet[sku] = true;
          }
        }
      }
      window._skuIsHainan = _hSet;
      console.log('[HainanMap] parseInventoryExcel 构建 _skuIsHainan, 共', Object.keys(_hSet).length, '个 SKU');
    } catch(e) { console.warn('[HainanMap] 构建失败:', e); }

    // v121: 构建全局慢动品根因 map（key = rdc|sku → {rc, adv, flags}）。
    // 让 plan-monitor 操作列无需先进入「慢动品分析」页就能直接读取该 SKU×RDC 的具体根因。
    try {
      const _diagMap = {};
      if (dataStore.inventory && dataStore.inventory.cov7) {
        const _cov7 = dataStore.inventory.cov7;
        const _cov5 = dataStore.inventory.cov6 || []; // 基准月
        // inline 慢动品引擎函数（避免依赖未在 parseInventoryExcel 之前定义的全局函数）
        function _isSlow(level){ return level && (level==='无需求'||level==='3~4个月'||level==='4~5个月'||level==='5~6个月'||level==='大于6个月'); }
        function _hasAvail(d){ return (d.availQtyPlan||0)>0; }
        function _isExcluded(d){
          if(!d)return false;
          const attr=(d.supplyChainAttr||'').trim(),life=(d.lifecycle||'').trim(),cl=(d.coverageLevel||'').trim();
          return attr==='非卖品'||attr==='促销装'||life==='新品期'||cl==='非卖品'||cl==='促销装'||cl==='新品期';
        }
        const _skuRdcKeys = new Set(_cov7.map(function(d){return d.rdc+'|'+d.sku;}));
        const _transNet = {};
        (dataStore.transship || []).forEach(function(t){
          const key = (t.rdc||'')+'|'+(t.material||'');
          if(!_skuRdcKeys.has(key))return;
          if(!_transNet[key]) _transNet[key] = {inn:0,out:0};
          _transNet[key].inn += (t.inboundQty||0);
          _transNet[key].out += (t.deliveryQty||0);
        });
        const _shipQty = {};
        (dataStore.orderDetail || []).forEach(function(o){
          const rdc = (typeof normalizeRdcName==='function') ? normalizeRdcName(o.warehouse) : o.warehouse;
          const key = rdc+'|'+(o.skuCode||'');
          if(!_skuRdcKeys.has(key))return;
          _shipQty[key] = (_shipQty[key]||0) + (o.firstDayQty||0);
        });
        const _bizDemand = {};
        (dataStore.bizDemand || []).forEach(function(b){
          const rdc = (typeof normalizeRdcName==='function') ? normalizeRdcName(b.rdc) : b.rdc;
          const key = rdc+'|'+(b.opCode||'');
          if(!_skuRdcKeys.has(key))return;
          const total = (b.dealerDemand||0)+(b.kaDemand||0)+(b.newChannel||0);
          _bizDemand[key] = (_bizDemand[key]||0) + total;
        });
        const _fut = {};
        _cov7.forEach(function(d){ _fut[d.rdc+'|'+d.sku] = (d.cov08||0)+(d.cov09||0)+(d.cov10||0)+(d.cov11||0)+(d.cov12||0)+(d.cov13||0); });
        const _fut5 = {};
        _cov5.forEach(function(d){ _fut5[d.rdc+'|'+d.sku] = (d.cov07||0)+(d.cov08||0)+(d.cov09||0)+(d.cov10||0)+(d.cov11||0)+(d.cov12||0); });
        const _slow5Keys = new Set(_cov5.filter(function(d){return _isSlow(d.coverageLevel)&&!_isExcluded(d)&&_hasAvail(d);}).map(function(d){return d.rdc+'|'+d.sku;}));
        _cov7.forEach(function(d){
          if(!_isSlow(d.coverageLevel) || !_hasAvail(d) || _isExcluded(d)) return; // 只为真正的慢动品构建根因
          const key = d.rdc+'|'+d.sku;
          const tn = _transNet[key] || {inn:0,out:0};
          const exMap = (dataStore.inventory && dataStore.inventory.expiry7) ? dataStore.inventory.expiry7[key] : null;
          const expiryRatio = exMap && exMap.sellable>0 ? exMap.below23/exMap.sellable : 0;
          _diagMap[key] = diagnoseSlowItem({ netIn: tn.inn-tn.out, ship: _shipQty[key]||0, demand: _bizDemand[key]||0, fut: _fut[key]||0, fut5: _fut5[key]||0, expiryRatio: expiryRatio, isNew: !_slow5Keys.has(key) });
        });
      }
      window._slowDiagMap = _diagMap;
      console.log('[SlowDiagMap] parseInventoryExcel 构建 _slowDiagMap, 共', Object.keys(_diagMap).length, '个 SKU×RDC 根因');
    } catch(e) { console.warn('[SlowDiagMap] 构建失败:', e); }

    return true;
  } catch(e) { console.error('Inventory parse error:', e); return false; }
}

// 解析「海南花露水历史数据」sheet，按 (年, 月, RDC, 状态) 聚合库存金额(元)
// 状态标准化映射：「退货库」→「退货库位」；「可用库存」→「计划可用库存」
function parseHainanHistoryByStatus(arr) {
  const result = {}; // result[year][rdc][monthIdx][status] = 金额
  if (!arr || arr.length < 2) return result;
  const header = arr[0] || [];
  function colIdx(name) {
    for (let i = 0; i < header.length; i++) {
      const v = String(header[i] || '').trim();
      if (v === name || v.indexOf(name) >= 0) return i;
    }
    return -1;
  }
  const C_DATE = colIdx('日期');
  const C_RDC = colIdx('RDC');
  const C_AMT = colIdx('库存金额_考核');
  const C_STATUS = colIdx('状态');
  if (C_DATE < 0 || C_AMT < 0) return result;
  for (let i = 1; i < arr.length; i++) {
    const r = arr[i]; if (!r || !r[C_DATE]) continue;
    const dt = r[C_DATE];
    let y, m;
    if (dt instanceof Date) { y = dt.getUTCFullYear(); m = dt.getUTCMonth() + 1; }
    else if (typeof dt === 'number' && dt > 1000) {
      const d = new Date((dt - 25569) * 86400 * 1000);
      y = d.getUTCFullYear(); m = d.getUTCMonth() + 1;
    } else continue;
    // 跳过无 RDC 的行（5月 sheet 大量空 RDC）
    let rdcRaw = (C_RDC >= 0 ? r[C_RDC] : '') || '';
    if (!rdcRaw) continue;
    rdcRaw = String(rdcRaw).trim().replace('仓','RDC');
    const amt = Number(r[C_AMT]) || 0;
    if (amt <= 0) continue;
    // 状态标准化
    let status = String((C_STATUS >= 0 ? r[C_STATUS] : '') || '').trim();
    if (status === '退货库') status = '退货库位';
    else if (status === '可用库存') status = '计划可用库存';
    if (!status) continue; // 跳过无状态的行
    const year = String(y);
    if (!result[year]) result[year] = {};
    if (!result[year][rdcRaw]) result[year][rdcRaw] = {};
    const monthIdx = m - 1; // 0-based
    if (!result[year][rdcRaw][monthIdx]) result[year][rdcRaw][monthIdx] = {};
    result[year][rdcRaw][monthIdx][status] = (result[year][rdcRaw][monthIdx][status] || 0) + amt;
  }
  return result;
}

function renderInventoryStructure() {
  setTitle('库存结构分析');
  const page = document.getElementById('page-inventory-structure');
  if (!page) return;

  // 缓存命中：直接渲染缓存的 HTML + 重建两个图表（避免重遍历 + 重拼 HTML）
  const structCache = getStructCache();
  if (structCache && structCache.html) {
    page.innerHTML = structCache.html;
    if (structCache.stacked) renderStackedChartFromData(structCache.stacked.monthLabels, structCache.stacked.totals);
    if (structCache.cov) renderCovChartFromData(structCache.cov.covDisplayRdcs, structCache.cov.covLabels, structCache.cov.covAgg);
    return;
  }

  if (!dataStore.inventory) {
    page.innerHTML = '<div style="text-align:center;padding:80px;color:var(--text-secondary)"><div style="font-size:48px;margin-bottom:16px">📊</div><div>请先上传库存分析Excel文件</div><div style="font-size:12px;margin-top:8px">前往 <a href="javascript:navigateTo(\'data\')" style="color:var(--color-blue)">数据管理</a> 页面导入</div></div>';
    return;
  }

  // 全局错误边界：渲染失败时显示错误而非白屏
  try {
    const inv = dataStore.inventory;
    const structureAll = inv.structureByYear || {};            // 全部（含海南花露水）
    const structureNo = inv.structureByYearNoHainan || {};     // 不含海南花露水
    const coverageNew = inv.coverageNew || {};                 // {RDC:{status,coverage,fulfill}}
    if (!structureAll || !structureAll['2026']) {
      page.innerHTML = '<div style="text-align:center;padding:80px;color:var(--text-secondary)"><div style="font-size:48px;margin-bottom:16px">📊</div><div>未找到「库存金额」表中的库存结构分析数据</div><div style="font-size:12px;margin-top:8px">请确认已导入含「库存金额」Sheet 的最新库存分析模版</div></div>';
      return;
    }

    // 筛选器：海南花露水 + RDC
    window._invHainan = window._invHainan || 'all';
    window._isRdc = window._isRdc || 'all';
    const hainanFilter = window._invHainan;
    const rdcFilter = window._isRdc;
    const allRdcs = ['东北RDC','华北RDC','华东RDC','华南RDC','华中RDC','西北RDC','西南RDC'];
    // 动态月份：取 structure['2026'] 实际包含的月份（覆盖数据更新后会扩展），无结构数据则默认 1-6月
    const monthsAll2026 = structureAll && structureAll['2026'] ? Object.keys(structureAll['2026']).map(m => +m).filter(m => !isNaN(m)).sort((a, b) => a - b) : [];
    // 当前分析月 = 覆盖数据最新月（cov7=7月 / cov6=6月 / cov5=5月）；库存金额趋势仅展示到当前月，保持与覆盖/慢动口径一致（后续换月自动前移）
    const _curMonth = (inv && inv.cov7) ? 7 : ((inv && inv.cov6) ? 6 : ((inv && inv.cov5) ? 5 : 6));
    const months2026 = monthsAll2026.filter(m => m <= _curMonth);
    const MONTHS = months2026.length > 0 ? months2026 : (monthsAll2026.length ? monthsAll2026 : [1,2,3,4,5,6]);
    const monthLabels = MONTHS.map(m => m + '月');
    const latestMonth = MONTHS[MONTHS.length - 1] || 6;
    const STATUS_META = [
      { key: 'orange', name: '橙色预警', sub: '淘汰品、退货品', color: '#F97316' },
      { key: 'red',    name: '红色预警', sub: '残次品、效期品<1/3', color: '#EF4444' },
      { key: 'yellow', name: '黄色预警', sub: '效期品1/3<效期<1/2', color: '#FACC15' },
      { key: 'safe',   name: '非风险库存', sub: '计划可用库存', color: '#10B981' }
    ];
    const rdcKey = rdcFilter === 'all' ? null : rdcFilter.replace('RDC', '仓');

    // 根据海南花露水下拉得到有效库存结构数据
    function diffStruct(a, b) {
      return {
        orange: Math.max(0, (a.orange || 0) - (b.orange || 0)),
        red:    Math.max(0, (a.red    || 0) - (b.red    || 0)),
        yellow: Math.max(0, (a.yellow || 0) - (b.yellow || 0)),
        safe:   Math.max(0, (a.safe   || 0) - (b.safe   || 0))
      };
    }
    function getEffectiveStructure() {
      if (hainanFilter === 'all') return structureAll;
      if (hainanFilter === 'no') return structureNo;
      // 'yes' = 全部 - 非海南花露水
      const res = {};
      Object.keys(structureAll).forEach(year => {
        res[year] = {};
        Object.keys(structureAll[year]).forEach(month => {
          res[year][month] = {};
          Object.keys(structureAll[year][month]).forEach(rdc => {
            const a = structureAll[year][month][rdc] || { orange:0, red:0, yellow:0, safe:0 };
            const n = (structureNo[year] && structureNo[year][month] && structureNo[year][month][rdc]) || { orange:0, red:0, yellow:0, safe:0 };
            res[year][month][rdc] = diffStruct(a, n);
          });
        });
      });
      return res;
    }
    const structure = getEffectiveStructure();

    // 取某月（按 RDC 筛选）4状态金额（元）
    function monthCell(m) {
      const cell = (structure['2026'] && structure['2026'][m]) || null;
      if (!cell) return null;
      if (rdcKey) return cell[rdcKey] || { orange:0, red:0, yellow:0, safe:0 };
      const acc = { orange:0, red:0, yellow:0, safe:0 };
      allRdcs.forEach(r => { const c = cell[r.replace('RDC','仓')]; if (c) { acc.orange += c.orange; acc.red += c.red; acc.yellow += c.yellow; acc.safe += c.safe; } });
      return acc;
    }
    // 月度合计（含合计行兜底：若 RDC 明细缺失则用「合计」行）
    function monthCellWithFallback(m) {
      let acc = monthCell(m);
      if (!acc) return null;
      const cell = (structure['2026'] && structure['2026'][m]) || null;
      if (cell && cell['合计'] && (acc.orange + acc.red + acc.yellow + acc.safe) === 0 && rdcKey === null) acc = cell['合计'];
      return acc;
    }

    const totals = MONTHS.map(m => monthCellWithFallback(m));
    const latest = totals[MONTHS.length - 1] || { orange:0, red:0, yellow:0, safe:0 };
    const latestSum = latest.orange + latest.red + latest.yellow + latest.safe;
    const latestLabel = latestMonth + '月';

    // 最新月各状态占比（用于 KPI 副标题）
    function pctOf(v) { return latestSum > 0 ? (v / latestSum * 100).toFixed(1) + '%' : '0%'; }
    function fmtWan(v) { return (v / 10000).toLocaleString(undefined, { maximumFractionDigits: 1 }); }
    function fmtYuan(v) { return (v != null ? Math.round(v).toLocaleString() : '-') + ' 元'; }

    // RDC 颜色（堆叠图例用）+ 全局 RDC 勾选切换函数（提前定义避免 TDZ）
    const rdcColors = ['#EF4444','#F97316','#FACC15','#10B981','#3B82F6','#8B5CF6','#06B6D4'];
    window._covToggle = function(rdc, checked) {
      if (!Array.isArray(window._covSelectedRdcs)) window._covSelectedRdcs = [];
      const i = window._covSelectedRdcs.indexOf(rdc);
      if (checked && i < 0) window._covSelectedRdcs.push(rdc);
      else if (!checked && i >= 0) window._covSelectedRdcs.splice(i, 1);
      renderInventoryStructure();
    };
    window._covSelectAll = function(checked) {
      window._covSelectedRdcs = checked ? ['东北RDC','华北RDC','华东RDC','华南RDC','华中RDC','西北RDC','西南RDC'].slice() : [];
      renderInventoryStructure();
    };
    // toggle 版本：当前是全选就全取消，否则全选
    window._covToggleAll = function() {
      const all = ['东北RDC','华北RDC','华东RDC','华南RDC','华中RDC','西北RDC','西南RDC'];
      window._covSelectedRdcs = (window._covSelectedRdcs && window._covSelectedRdcs.length === all.length) ? [] : all.slice();
      renderInventoryStructure();
    };

    // 库存覆盖数据（SKU 级聚合：支持海南花露水筛选；与点击下钻明细同源 = 7月库存覆盖数据 sheet）
    const cov7All = (dataStore.inventory && dataStore.inventory.cov7) || [];
    const covRdcs = cov7All.reduce((acc, d) => { if (d && d.rdc && acc.indexOf(d.rdc) < 0) acc.push(d.rdc); return acc; }, []);
    const covLabels = ['≤1个月','1~2个月','2~3个月','3~4个月','4~5个月','5~6个月','大于6个月','零库存','无需求','非卖品','促销装','新品期'];
    const covColors = ['#3B82F6','#60A5FA','#93C5FD','#BFDBFE','#DBEAFE','#1D4ED8','#1E3A8A','#94A3B8','#9CA3AF','#6B7280','#F59E0B','#10B981'];
    // 兼容 0~1个月 / 零库存 变体 → 标准标签
    function normCovLabel(l) { return l === '0~1个月' ? '≤1个月' : l; }
    function covKey(cov, l) { return cov[l] ? l : (l === '≤1个月' && cov['0~1个月'] ? '0~1个月' : null); }
    // 按 RDC × 覆盖分类 聚合 7 月 SKU 明细「可用库存金额」（元），跟随海南花露水筛选
    const covAgg = {}; // {RDC: {分类: 可用库存金额}}
    cov7All.forEach(d => {
      if (!d || !d.rdc) return;
      if (hainanFilter === 'yes' && d.isHainan !== true) return;
      if (hainanFilter === 'no' && d.isHainan === true) return;
      const lv = normCovLabel(String(d.coverageLevel || '').trim());
      if (!covAgg[d.rdc]) covAgg[d.rdc] = {};
      covAgg[d.rdc][lv] = (covAgg[d.rdc][lv] || 0) + (d.planAmt || 0);
    });

    // 筛选栏：海南花露水 + RDC
    const hainanOptions = '<option value="all"' + (hainanFilter==='all'?' selected':'') + '>全部</option>' +
      '<option value="yes"' + (hainanFilter==='yes'?' selected':'') + '>仅海南花露水</option>' +
      '<option value="no"' + (hainanFilter==='no'?' selected':'') + '>不含海南花露水</option>';
    const rdcOptions = '<option value="all"' + (rdcFilter==='all'?' selected':'') + '>全部RDC</option>' +
      allRdcs.map(r => '<option value="' + r + '"' + (rdcFilter===r?' selected':'') + '>' + r + '</option>').join('');
    const filterBar = '<div class="filter-bar" style="margin-bottom:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">' +
      '<div><span style="font-size:12px;color:var(--text-secondary);margin-right:8px">海南花露水：</span>' +
      '<select onchange="window._invHainan=this.value;renderInventoryStructure()" style="padding:4px 10px;border:1px solid #D1D5DB;border-radius:4px;font-size:12px">' + hainanOptions + '</select></div>' +
      '<div><span style="font-size:12px;color:var(--text-secondary);margin-right:8px">RDC：</span>' +
      '<select onchange="window._isRdc=this.value;renderInventoryStructure()" style="padding:4px 10px;border:1px solid #D1D5DB;border-radius:4px;font-size:12px">' + rdcOptions + '</select></div>' +
      '<span style="font-size:11px;color:var(--text-secondary)">库存结构数据源：库存金额表「库存结构分析」· 金额单位：万元</span></div>';

    // 库存覆盖按当前 RDC 筛选聚合（6月，元）
    // 顶部 RDC 下拉选单个 RDC 时固定一个；选「全部」时用窗口内 _covSelectedRdcs 二次勾选
    // 注意：只在未初始化（undefined）时填默认值；空数组是合法的"全取消"状态，不要重置
    if (!Array.isArray(window._covSelectedRdcs)) {
      window._covSelectedRdcs = allRdcs.slice();
    }
    // 已不在 allRdcs 内的脏数据清理
    window._covSelectedRdcs = window._covSelectedRdcs.filter(r => allRdcs.indexOf(r) >= 0);
    const covDisplayRdcs = rdcFilter === 'all' ? window._covSelectedRdcs : [rdcFilter];
    const covTableRows = covDisplayRdcs.map(rdc => {
      const cov = covAgg[rdc] || {};
      const vals = covLabels.map(l => {
        const key = covKey(cov, l);
        return key ? (cov[key] || 0) : 0;
      });
      const rowTotal = vals.reduce((s, v) => s + v, 0);
      return { rdc, vals, total: rowTotal };
    });
    const covGrandTotal = covTableRows.reduce((s, r) => s + r.total, 0);

    // 风险库存 SKU 变动（6月 → 7月）：按 SKU 聚合风险金额(stale+expired+return+near)差值，跟随海南+RDC筛选
    const cov6All = (dataStore.inventory && dataStore.inventory.cov6) || [];
    const cov7All2 = (dataStore.inventory && dataStore.inventory.cov7) || [];
    const RISK_NAMES = [['staleAmt','残次','#F97316'],['expiredAmt','过期','#EF4444'],['returnAmt','退货','#9CA3AF'],['nearExpiryAmt','近效期','#FACC15']];
    function riskOf(d) { return RISK_NAMES.reduce((s,[k]) => s + (d[k]||0), 0); }
    function riskBreak(d) { return RISK_NAMES.map(([k]) => d[k]||0); } // [stale, expired, return, near]
    function aggRisk(src) {
      const m = {};
      src.forEach(d => {
        if (!d || !d.sku) return;
        if (hainanFilter === 'yes' && d.isHainan !== true) return;
        if (hainanFilter === 'no' && d.isHainan === true) return;
        if (rdcFilter !== 'all' && d.rdc !== rdcFilter) return;
        const k = d.sku;
        if (!m[k]) m[k] = { sku: k, skuName: d.skuName || '', brand: d.brand || '', amt: 0, parts: [0,0,0,0], isHainan: d.isHainan === true };
        m[k].amt += riskOf(d);
        const br = riskBreak(d);
        for (let i = 0; i < 4; i++) m[k].parts[i] += br[i];
      });
      return m;
    }
    const riskM6 = aggRisk(cov6All);
    const riskM7 = aggRisk(cov7All2);
    const riskSkuList = [];
    Object.keys(riskM7).forEach(k => {
      const a = riskM7[k], b = riskM6[k];
      const amt5 = b ? b.amt : 0;
      riskSkuList.push({ sku: k, skuName: a.skuName, brand: a.brand, isHainan: a.isHainan, amt5: amt5, amt6: a.amt, diff: a.amt - amt5, parts5: b ? b.parts : [0,0,0,0], parts6: a.parts });
    });
    Object.keys(riskM6).forEach(k => { if (!riskM7[k]) { const b = riskM6[k]; riskSkuList.push({ sku: k, skuName: b.skuName, brand: b.brand, isHainan: b.isHainan, amt5: b.amt, amt6: 0, diff: -b.amt, parts5: b.parts, parts6: [0,0,0,0] }); } });
    const riskUp = riskSkuList.filter(x => x.diff > 0).sort((a,b) => b.diff - a.diff).slice(0, 10);
    const riskDown = riskSkuList.filter(x => x.diff < 0).sort((a,b) => a.diff - b.diff).slice(0, 10);
    // 把 4 个状态占比做成小横条 + 文字（用 6 月金额口径）
    function partsHtml(parts, total) {
      if (total <= 0) return '<span style="color:var(--text-secondary)">-</span>';
      let bar = '<div style="display:flex;height:8px;border-radius:3px;overflow:hidden;min-width:80px;margin-bottom:3px">';
      let lbl = '';
      for (let i = 0; i < 4; i++) {
        const pct = parts[i] / total * 100;
        if (pct > 0) { bar += '<div title="' + RISK_NAMES[i][1] + ' ' + pct.toFixed(0) + '%" style="background:' + RISK_NAMES[i][2] + ';width:' + pct + '%"></div>'; lbl += (lbl ? ' ' : '') + '<span style="color:' + RISK_NAMES[i][2] + '">' + RISK_NAMES[i][1] + pct.toFixed(0) + '%</span>'; }
      }
      bar += '</div>';
      return bar + '<div style="font-size:10px;line-height:1.4">' + lbl + '</div>';
    }
    function riskRowHtml(x, arrow) {
      const cls = arrow === 'up' ? '#EF4444' : '#10B981';
      const arrowTxt = arrow === 'up' ? '⬆' : '⬇';
      return '<tr style="cursor:pointer" onclick="drillRiskSkuDetail(\'' + x.sku + '\')" title="点击查看该SKU风险明细"><td>' + (x.sku||'') + '</td><td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + (x.skuName||'') + '">' + (x.skuName||'') + '</td><td>' + (x.brand||'') + '</td><td class="num">' + fmtYuan(x.amt5) + '</td><td class="num">' + fmtYuan(x.amt6) + '</td><td class="num" style="color:' + cls + ';font-weight:600">' + arrowTxt + ' ' + fmtYuan(Math.abs(x.diff)) + '</td><td style="min-width:140px">' + partsHtml(x.parts6, x.amt6) + '</td></tr>';
    }
    const riskUpHtml = riskUp.length === 0 ? '<tr><td colspan="7" style="text-align:center;padding:16px;color:var(--text-secondary)">无上涨SKU</td></tr>' : riskUp.map(x => riskRowHtml(x, 'up')).join('');
    const riskDownHtml = riskDown.length === 0 ? '<tr><td colspan="7" style="text-align:center;padding:16px;color:var(--text-secondary)">无下降SKU</td></tr>' : riskDown.map(x => riskRowHtml(x, 'down')).join('');
    // 暴露给导出按钮用
    window._riskSkuExport = { up: riskUp, down: riskDown };

    page.innerHTML =
      filterBar +
      // KPI：4 状态（环比 = 最新月 vs 上月）
      '<div class="kpi-row" style="margin-bottom:16px">' +
      STATUS_META.map(s => {
        const bg = s.color + '18';
        const prev = totals[MONTHS.length - 2] || totals[4] || { orange:0, red:0, yellow:0, safe:0 };
        const prevKey = s.key;
        const prevVal = prev[prevKey] || 0;
        const diff = prevVal > 0 ? (latest[s.key] - prevVal) / prevVal : 0;
        const isRisk = s.key !== 'safe'; // 风险类 KPI：下降为好事
        const goodDir = isRisk ? diff <= 0 : diff >= 0;
        const arrow = diff > 0 ? '↑' : (diff < 0 ? '↓' : '·');
        const color = diff === 0 ? '#94A3B8' : (goodDir ? '#10B981' : '#EF4444');
        const prevLabel = (MONTHS.length >= 2 ? MONTHS[MONTHS.length - 2] : 5) + '月';
        return '<div class="kpi-card" style="background:' + bg + ';border-color:' + s.color + '55"><div class="kpi-label" style="color:#1E293B">' + s.name + '（' + s.sub + '）</div>' +
          '<div class="kpi-value" style="color:' + s.color + '">' + fmtWan(latest[s.key]) + '<span class="kpi-unit" style="color:' + s.color + '">万</span></div>' +
          '<div style="font-size:12px;font-weight:600;color:' + color + ';margin-top:2px">' + arrow + ' 环比 ' + (diff > 0 ? '+' : '') + (diff * 100).toFixed(1) + '%</div>' +
          '<div style="font-size:11px;color:var(--text-secondary)">vs ' + prevLabel + ' ' + fmtWan(prevVal) + ' 万 · ' + (rdcFilter === 'all' ? '全部RDC' : rdcFilter) + ' · ' + (hainanFilter==='all'?'全部':(hainanFilter==='yes'?'仅海南花露水':'不含海南花露水')) + '</div></div>';
      }).join('') +
      (function(){
        const prevSum = totals[MONTHS.length - 2] ? (totals[MONTHS.length - 2].orange + totals[MONTHS.length - 2].red + totals[MONTHS.length - 2].yellow + totals[MONTHS.length - 2].safe) : 0;
        const diffSum = prevSum > 0 ? (latestSum - prevSum) / prevSum : 0;
        const color = diffSum === 0 ? '#94A3B8' : (diffSum >= 0 ? '#10B981' : '#EF4444');
        const arrow = diffSum > 0 ? '↑' : (diffSum < 0 ? '↓' : '·');
        const prevSumLabel = (MONTHS.length >= 2 ? MONTHS[MONTHS.length - 2] : 5) + '月';
        return '<div class="kpi-card" style="background:#F1F5F9"><div class="kpi-label">全部库存合计（' + latestLabel + '）</div><div class="kpi-value">' + fmtWan(latestSum) + '<span class="kpi-unit">万</span></div>' +
          '<div style="font-size:12px;font-weight:600;color:' + color + ';margin-top:2px">' + arrow + ' 环比 ' + (diffSum > 0 ? '+' : '') + (diffSum * 100).toFixed(1) + '%</div>' +
          '<div style="font-size:11px;color:var(--text-secondary)">vs ' + prevSumLabel + ' ' + fmtWan(prevSum) + ' 万 · 4种状态之和 · ' + (rdcFilter === 'all' ? '全部RDC' : rdcFilter) + '</div></div>';
      })() +
      '</div>' +
      // 4状态堆叠柱状图（标题动态 1-N月）
      '<div class="card" style="margin-bottom:16px">' +
      '<div class="card-header"><span class="card-title">📊 库存结构分析（2026年1-' + latestMonth + '月 · 4种状态堆叠）</span><span style="font-size:11px;color:var(--text-secondary);margin-left:8px">' + (rdcFilter==='all'?'全部RDC':rdcFilter) + ' · ' + (hainanFilter==='all'?'全部':(hainanFilter==='yes'?'仅海南花露水':'不含海南花露水')) + ' · 单位：万元</span></div>' +
      '<div class="chart-container" style="height:320px;max-width:75%;min-width:480px" id="chart-is-stacked"></div>' +
      '</div>' +
      // 4状态月度明细表
      '<div class="card" style="margin-bottom:16px"><div class="card-header"><span class="card-title">📋 库存结构月度明细（万元）</span><span style="font-size:11px;color:var(--text-secondary);margin-left:8px">' + (rdcFilter==='all'?'全部RDC':rdcFilter) + ' · ' + (hainanFilter==='all'?'全部':(hainanFilter==='yes'?'仅海南花露水':'不含海南花露水')) + '</span></div>' +
      '<div class="table-wrap" style="max-width:75%"><table class="data-table" style="table-layout:fixed;width:100%"><colgroup>' +
      '<col style="width:24%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:16%"></colgroup>' +
      '<thead><tr><th>库存状态</th>' + monthLabels.map(m => '<th style="text-align:right">' + m + '</th>').join('') + '<th style="text-align:right">' + latestLabel + '占比</th></tr></thead><tbody>' +
      STATUS_META.map(s => {
        return '<tr><td><span style="color:' + s.color + ';font-weight:600">●</span> ' + s.name + '<br/><span style="font-size:10px;color:var(--text-secondary)">' + s.sub + '</span></td>' +
          MONTHS.map((m, idx) => { const t = totals[idx]; return '<td class="num">' + (t ? (t[s.key]/10000).toFixed(1) : '-') + '</td>'; }).join('') +
          '<td class="num" style="color:' + s.color + ';font-weight:600">' + pctOf(latest[s.key]) + '</td></tr>';
      }).join('') +
      '<tr style="background:#F1F5F9;font-weight:600"><td>合计</td>' +
      MONTHS.map((m, idx) => { const t = totals[idx]; const s = t ? t.orange+t.red+t.yellow+t.safe : 0; return '<td class="num">' + (s ? (s/10000).toFixed(1) : '-') + '</td>'; }).join('') +
      '<td class="num">100%</td></tr>' +
      '</tbody></table></div></div>' +
      // 库存覆盖-可用库存：堆叠柱状图（元）
      '<div class="card" style="margin-bottom:16px">' +
      '<div class="card-header" style="display:flex;flex-direction:column;gap:6px">' +

      '</div>' +
      // 风险库存 SKU 变动（6月→7月）
      '<div class="card" style="margin-bottom:16px">' +
      '<div class="card-header" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="card-title">🔴 风险库存 SKU 变动（2026年6月 → 7月）</span>' +
      '<button class="btn-export" onclick="exportRiskSkuChangeCSV()" style="margin-left:auto;font-size:12px;padding:4px 10px">导出CSV</button>' +
      '<span style="font-size:11px;color:var(--text-secondary)">' + (rdcFilter==='all'?'全部RDC':rdcFilter) + ' · ' + (hainanFilter==='all'?'全部':(hainanFilter==='yes'?'仅海南花露水':'不含海南花露水')) + ' · 风险=残次+过期+退货+近效期 · 单位：元 · 点击行下钻</span></div>' +
      '<div class="row-2" style="gap:16px">' +
        '<div class="card" style="background:#FFF7F7;border-color:#FECACA"><div class="card-header"><span class="card-title" style="color:#EF4444">⬆ 风险库存上涨 TOP 10</span><span style="font-size:11px;color:var(--text-secondary);margin-left:8px">6月→7月</span></div>' +
        '<div class="table-wrap" style="overflow-x:auto"><table class="data-table" style="font-size:11px"><thead><tr><th>SKU</th><th>名称</th><th>品牌</th><th class="num">6月</th><th class="num">7月</th><th class="num">上涨</th><th>7月风险构成</th></tr></thead><tbody>' + riskUpHtml + '</tbody></table></div></div>' +
        '<div class="card" style="background:#F0FDF4;border-color:#BBF7D0"><div class="card-header"><span class="card-title" style="color:#10B981">⬇ 风险库存下降 TOP 10</span><span style="font-size:11px;color:var(--text-secondary);margin-left:8px">6月→7月</span></div>' +
        '<div class="table-wrap" style="overflow-x:auto"><table class="data-table" style="font-size:11px"><thead><tr><th>SKU</th><th>名称</th><th>品牌</th><th class="num">6月</th><th class="num">7月</th><th class="num">下降</th><th>7月风险构成</th></tr></thead><tbody>' + riskDownHtml + '</tbody></table></div></div>' +
      '</div>' +
      '<div style="font-size:11px;color:var(--text-secondary);margin-top:8px">口径：同一 SKU 跨 RDC 聚合；「上涨」= 7月风险金额 − 6月风险金额（红色），「下降」= 6月 − 7月（绿色）。点击行查看该 SKU 在 6月/7月 的 RDC 明细。</div>' +
      '</div>';

    // 写入派生缓存（HTML + 图表纯数据），下次切换秒开
    try {
      setStructCache({
        html: page.innerHTML,
        stacked: { monthLabels: monthLabels.slice(), totals: totals },
        cov: { covDisplayRdcs: covDisplayRdcs.slice(), covLabels: covLabels.slice(), covAgg: covAgg }
      });
    } catch (e) { /* 缓存失败不影响展示 */ }

    // 4状态堆叠柱状图
    const stackedEl = document.getElementById('chart-is-stacked');
    if (stackedEl) {
      const c = initChart('chart-is-stacked');
      // 风险库存占比 = (橙+红+黄) / 4状态合计；单位：百分比
      const riskRatioData = MONTHS.map((m, idx) => {
        const t = totals[idx]; if (!t) return null;
        const risk = (t.orange || 0) + (t.red || 0) + (t.yellow || 0);
        const total = risk + (t.safe || 0);
        return total > 0 ? +(risk / total * 100).toFixed(1) : null;
      });
      c.setOption({
        tooltip: { trigger: 'axis', confine: true, textStyle: { fontSize: 11 },
          formatter: function(params) {
            let h = '<strong>' + params[0].axisValue + '</strong>';
            let sum = 0; let ratioShown = null;
            params.forEach(p => {
              if (p.seriesType === 'line') { ratioShown = p.value; return; }
              sum += (p.value || 0);
              h += '<br/>' + p.marker + p.seriesName + '：' + (p.value == null ? '-' : (p.value).toLocaleString() + ' 万');
            });
            h += '<br/><strong style="color:#1E293B">合计：' + sum.toLocaleString() + ' 万</strong>';
            if (ratioShown != null) h += '<br/>📍 风险库存占比：<strong style="color:#DC2626">' + ratioShown + '%</strong>';
            return h;
          }
        },
        legend: { data: STATUS_META.map(s => s.name).concat(['风险库存占比']), top: 0, left: 'center', textStyle: { fontSize: 11 } },
        grid: { left: 70, right: 70, top: 40, bottom: 30 },
        xAxis: { type: 'category', data: monthLabels, axisLabel: { fontSize: 11 } },
        // y轴 max 取 1-6月 4状态合计的最大值（含 25% 顶部留白），保证所有月份柱子完整显示
        yAxis: [
          { type: 'value', name: '万元', nameTextStyle: { fontSize: 10 }, axisLabel: { fontSize: 10 }, max: Math.max.apply(null, MONTHS.map((_, i) => { const t = totals[i]; return t ? (t.orange + t.red + t.yellow + t.safe) / 10000 : 0; })) * 1.25 },
          { type: 'value', name: '风险占比%', nameTextStyle: { fontSize: 10, color: '#DC2626' }, axisLabel: { fontSize: 10, color: '#DC2626', formatter: '{value}%' }, min: 0, max: 70, splitLine: { show: false } }
        ],
        series: STATUS_META.map(s => ({
          name: s.name, type: 'bar', stack: 'total',
          data: MONTHS.map((m, idx) => { const t = totals[idx]; return t ? Math.round(t[s.key] / 10000) : null; }),
          color: s.color,
          itemStyle: { borderRadius: 0 },
          emphasis: { focus: 'series' }
        })).concat([{
          name: '风险库存占比', type: 'line', yAxisIndex: 1,
          data: riskRatioData,
          color: '#DC2626', smooth: true, symbol: 'circle', symbolSize: 8,
          lineStyle: { width: 2 },
          itemStyle: { color: '#DC2626' },
          label: { show: true, position: 'top', fontSize: 10, color: '#DC2626', formatter: '{c}%' },
          z: 10
        }])
      });
    }

    // 库存覆盖堆叠柱状图（元）：横轴=覆盖周期，堆叠段=RDC（rdcColors 已提前定义在 page.innerHTML 之前）
    const covChartEl = document.getElementById('chart-cov-stacked');
    if (covChartEl) {
      const c2 = initChart('chart-cov-stacked');
      c2.setOption({
        tooltip: { trigger: 'axis', confine: true, textStyle: { fontSize: 11 },
          formatter: function(params) {
            let h = '<strong>' + params[0].axisValue + '</strong> <span style="color:#9aa7b4;font-size:10px">(点击下钻SKU)</span>';
            // 按金额降序排序
            const sorted = params.slice().sort((a, b) => (b.value || 0) - (a.value || 0));
            let sum = 0;
            sorted.forEach(p => { sum += (p.value || 0); h += '<br/>' + p.marker + p.seriesName + '：' + (p.value == null ? '-' : Math.round(p.value).toLocaleString() + ' 元'); });
            h += '<br/><strong style="color:#1E293B">合计：' + Math.round(sum).toLocaleString() + ' 元</strong>';
            return h;
          }
        },
        legend: { show: false },
        grid: { left: 70, right: 30, top: 50, bottom: 45 },
        xAxis: { type: 'category', data: covLabels, axisLabel: { fontSize: 10, rotate: 30, interval: 0 } },
        yAxis: { type: 'value', name: '元', nameTextStyle: { fontSize: 10 }, axisLabel: { fontSize: 10, formatter: v => v >= 10000 ? (v/10000).toFixed(0) + '万' : v } },
        series: covDisplayRdcs.map((rdc, idx) => ({
          name: rdc, type: 'bar', stack: 'cov',
          data: covLabels.map(l => {
            const cov = covAgg[rdc] || {};
            const key = covKey(cov, l);
            return key ? (cov[key] || 0) : 0;
          }),
          color: rdcColors[idx % rdcColors.length],
          cursor: 'pointer',
          itemStyle: { borderRadius: 0 },
          emphasis: { focus: 'series' }
        }))
      });
      // 点击柱状段下钻到 SKU 明细页（RDC × 周期）
      c2.on('click', function(p) {
        if (!p || !p.seriesName || p.value == null) return;
        drillRdcPeriodCovDetail(p.seriesName, p.name);
      });
    }
  } catch (e) {
    console.error('renderInventoryStructure error:', e);
    if (page) {
      page.innerHTML = '<div style="padding:24px;background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;margin:16px"><div style="color:#991B1B;font-weight:600;margin-bottom:8px">⚠ 库存结构分析渲染失败</div><div style="color:#7F1D1D;font-size:13px;font-family:monospace;background:#FFF;padding:12px;border-radius:4px;white-space:pre-wrap;margin-bottom:8px">' + (e.message||e) + '\n@ ' + (e.stack||'').split('\n').slice(0,3).join('\n') + '</div><div style="font-size:12px;color:var(--text-secondary)">DB_VERSION=' + DB_VERSION + '｜请尝试 Ctrl+F5 强刷；问题持续请截图发我</div></div>';
    }
  }
}

function drillStatusDetail(data, label) {
  if (!data || data.length === 0) { showToast('暂无' + (label||'') + '明细数据'); return; }

}

// 风险库存 SKU 明细弹窗（5月/6月 对比，按 RDC 拆分）
function drillRiskSkuDetail(sku) {
  // v79：按 RDC×SKU 聚合，同一行展示 5月/6月 对比（不再按月平铺成多行）
  // v80：同时聚合 4 类风险状态金额（残次/过期/退货/近效期），供弹框展示状态构成与变动主因
  const map = {};
  function push(arr, monthNum) {
    arr.forEach(d => {
      if (!d || d.sku !== sku) return;
      const h = window._invHainan || 'all';
      if (h === 'yes' && d.isHainan !== true) return;
      if (h === 'no' && d.isHainan === true) return;
      const r = window._isRdc || 'all';
      if (r !== 'all' && d.rdc !== r) return;
      const k = d.rdc + '|' + d.sku;
      if (!map[k]) map[k] = { rdc: d.rdc, sku: d.sku, skuName: d.skuName || '', brand: d.brand || '', isHainan: d.isHainan === true, amt5: 0, amt6: 0, parts5: [0,0,0,0], parts6: [0,0,0,0] };
      const br = [(d.staleAmt||0), (d.expiredAmt||0), (d.returnAmt||0), (d.nearExpiryAmt||0)];
      map[k]['amt' + monthNum] += br[0] + br[1] + br[2] + br[3];
      const parts = map[k]['parts' + monthNum];
      for (let i = 0; i < 4; i++) parts[i] += br[i];
    });
  }
  push((dataStore.inventory && dataStore.inventory.cov6) || [], 5);
  push((dataStore.inventory && dataStore.inventory.cov7) || [], 6);
  const rows = Object.values(map);
  if (rows.length === 0) { showToast('该 SKU 无风险库存数据'); return; }
  rows.forEach(r => r.diff = (r.amt6 || 0) - (r.amt5 || 0));
  // 按变动金额绝对值降序，最值得关注的 SKU×RDC 在前面
  rows.sort((a,b) => Math.abs(b.diff) - Math.abs(a.diff));
  window._drillTitle = '风险库存明细 · ' + sku + '（共' + rows.length + '条）';
  window._drillData = rows;
  window._drillType = 'risk';
  renderDrillModal();
}

// 库存覆盖图点击下钻：RDC + 周期 → SKU 明细
function drillRdcPeriodCovDetail(rdc, periodLabel) {
  // 兼容 "0~1个月" 与 "≤1个月"
  let data = (dataStore.inventory.cov7 || []).filter(d => d.rdc === rdc && (d.coverageLevel === periodLabel || (periodLabel === '≤1个月' && d.coverageLevel === '0~1个月')));
  const h = window._invHainan || 'all';
  if (h === 'yes') data = data.filter(d => d.isHainan === true);
  if (h === 'no') data = data.filter(d => d.isHainan !== true);
  window._invCoverageDetailTitle = rdc + ' · ' + periodLabel + ' 明细（共' + data.length + '条）';
  window._invCoverageDetailSource = 'cov7';
  window._invCoverageDetailData = data.slice().sort((a,b) => (b.planAmt || 0) - (a.planAmt || 0));
  if (data.length === 0) { showToast(rdc + ' · ' + periodLabel + ' 暂无SKU明细'); return; }
  navigateTo('inventory-coverage-detail');
}

function renderDrillModal() {
  const data = window._drillData || [];
  const title = window._drillTitle || '明细';
  const tp = window._drillType || 'status';
  const pageLen = 25;
  window._drillPage = window._drillPage || 1;
  const totalPages = Math.ceil(data.length / pageLen) || 1;
  window._drillPage = Math.min(window._drillPage, totalPages);
  const pageData = data.slice((window._drillPage-1) * pageLen, window._drillPage * pageLen);

  let html = '<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center" onclick="if(event.target===this)document.getElementById(\'drill-modal\').remove()">';
  html += '<div id="drill-modal" style="background:var(--bg-card);border-radius:12px;max-width:900px;width:95%;max-height:85vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">' + title + '</h3><button onclick="document.getElementById(\'drill-modal\').parentElement.remove()" style="background:none;border:none;font-size:24px;cursor:pointer;color:var(--text-secondary)">✕</button></div>';

  if (tp === 'status') {
    html += '<table class="data-table"><thead><tr><th>库位</th><th>RDC</th><th>SKU</th><th>名称</th><th>品牌</th><th>可用库存</th><th>金额</th><th>状态</th><th>海南花露水</th></tr></thead><tbody>' +
      pageData.map(d => '<tr><td>' + (d.location||'') + '</td><td>' + (d.rdc||'') + '</td><td>' + (d.sku||'') + '</td><td style="max-width:150px;overflow:hidden;text-overflow:ellipsis" title="' + (d.skuName||'') + '">' + (d.skuName||'') + '</td><td>' + (d.brand||'') + '</td><td class="num">' + formatNum(d.availableQty) + '</td><td class="num">' + formatMoney(d.amount) + '</td><td>' + (d.status||'') + '</td><td>' + (d.isHainan ? '是' : '否') + '</td></tr>').join('') + '</tbody></table>';
  } else if (tp === 'risk') {
    // v79：按 RDC×SKU pivot，同一行展示 6月/7月 风险金额对比
    // v80：月份列下加 4 类状态构成小字（残次/过期/退货/近效期）+ 新增「变动主因」列
    const R_NAMES = [['残次','#F97316'],['过期','#EF4444'],['退货','#9CA3AF'],['近效期','#FACC15']];
    // 状态构成小字：某月金额中 4 类占比（只显示非 0 类）
    function partMini(parts, total) {
      if (total <= 0) return '<span style="color:var(--text-secondary)">-</span>';
      const items = [];
      for (let i = 0; i < 4; i++) {
        if (parts[i] > 0) items.push('<span style="color:' + R_NAMES[i][1] + '">' + R_NAMES[i][0] + (parts[i]/total*100).toFixed(0) + '%</span>');
      }
      return '<div style="font-size:10px;line-height:1.5;margin-top:2px">' + items.join(' ') + '</div>';
    }
    // 变动主因：7月 vs 6月 各类状态金额差，取绝对值最大的一类
    function mainDriver(d) {
      const diffs = [];
      for (let i = 0; i < 4; i++) diffs.push({ name: R_NAMES[i][0], diff: (d.parts6||[0,0,0,0])[i] - (d.parts5||[0,0,0,0])[i] });
      diffs.sort((a,b) => Math.abs(b.diff) - Math.abs(a.diff));
      const top = diffs[0];
      if (!top || Math.abs(top.diff) < 0.01) return '<span style="color:var(--text-secondary)">-</span>';
      const up = top.diff > 0;
      return '<span style="color:' + (up ? '#EF4444' : '#10B981') + '">' + top.name + ' ' + (up ? '⬆' : '⬇') + ' ' + Math.abs(top.diff).toLocaleString() + ' 元</span>';
    }
    html += '<table class="data-table"><thead><tr>' +
      '<th>RDC</th><th>SKU</th><th>名称</th><th>品牌</th><th>海南花露水</th>' +
      '<th class="num" style="background:rgba(59,130,246,0.10)">6月风险金额</th>' +
      '<th class="num" style="background:rgba(16,185,129,0.10)">7月风险金额</th>' +
      '<th class="num">变动</th><th>变动主因</th></tr></thead><tbody>' +
      pageData.map(d => {
        const cls = d.diff > 0 ? '#EF4444' : (d.diff < 0 ? '#10B981' : 'var(--text-secondary)');
        const arrow = d.diff > 0 ? '⬆' : (d.diff < 0 ? '⬇' : '·');
        return '<tr>' +
          '<td>' + (d.rdc||'') + '</td>' +
          '<td>' + (d.sku||'') + '</td>' +
          '<td style="max-width:150px;overflow:hidden;text-overflow:ellipsis" title="' + (d.skuName||'') + '">' + (d.skuName||'') + '</td>' +
          '<td>' + (d.brand||'') + '</td>' +
          '<td>' + (d.isHainan ? '是' : '否') + '</td>' +
          '<td class="num" style="background:rgba(59,130,246,0.06)">' + (d.amt5||0).toLocaleString() + ' 元' + partMini(d.parts5, d.amt5) + '</td>' +
          '<td class="num" style="background:rgba(16,185,129,0.06)">' + (d.amt6||0).toLocaleString() + ' 元' + partMini(d.parts6, d.amt6) + '</td>' +
          '<td class="num" style="color:' + cls + ';font-weight:600">' + arrow + ' ' + Math.abs(d.diff).toLocaleString() + ' 元</td>' +
          '<td style="font-size:12px">' + mainDriver(d) + '</td>' +
          '</tr>';
      }).join('') + '</tbody></table>';
  } else {

// 根据覆盖数据源返回未来6个月字段与显示标签
function getCovMonthConfig(source) {
  if (source === 'cov5') {
    return { fields: ['cov06','cov07','cov08','cov09','cov10','cov11'], labels: ['6月','7月','8月','9月','10月','11月'] };
  }
  if (source === 'cov6') {
    return { fields: ['cov07','cov08','cov09','cov10','cov11','cov12'], labels: ['7月','8月','9月','10月','11月','12月'] };

}

window._slowFilters = { rdc: 'all', hainan: 'all', obsolete: 'all' };

function isSlowCoverage(level) { return level && (level === '无需求' || level === '3~4个月' || level === '4~5个月' || level === '5~6个月' || level === '大于6个月'); }
// 真正慢动品须有可用库存（availQtyPlan>0），剔除可用库存=0 的纯风险/无货 SKU（2026-08-12 决策）
function hasAvailableStock(d) { return (d.availQtyPlan || 0) > 0; }
// 新品/促销装/非卖品 完全排除在慢动品计算之外（按产品属性显式排除，不依赖未来需求判定周转）
function isExcludedProduct(d) {
  if (!d) return false;
  var attr = (d.supplyChainAttr || '').trim();
  var life = (d.lifecycle || '').trim();
  if (attr === '非卖品' || attr === '促销装') return true; // 供应链属性
  if (life === '新品期') return true;                       // 生命周期标签
  var cl = (d.coverageLevel || '').trim();                 // 兜底：源系统特殊覆盖标签
  if (cl === '非卖品' || cl === '促销装' || cl === '新品期') return true;
  return false;
}

window._bizDemandFilters = { rdc: 'all', month: 'all', channel: 'all' };

/**
 * 将订单明细记录映射到业务需求渠道
 * 经销商渠道 = 主渠道='经销商' 且 客户组≠'京东新通路'
 * KA渠道 = 主渠道含'KA'
 * 新通路 = 客户组='京东新通路'
 */
function mapOrderChannel(d) {
  const cg = (d.customerGroup || '').trim();
  const ch = (d.channel || '').trim();
  if (cg.includes('京东新通路')) return '新通路';
  if (ch.includes('KA')) return 'KA';
  if (ch === '经销商') return '经销商';
  return '其他';
}

/**
 * 计算某月的次月15日截止日期字符串（用于出货窗口）
 * @param {string} monthStr - "2026-06"
 * @returns {string} - "2026-07-15"
 */
function getNextMonth15Cutoff(monthStr) {
  const parts = monthStr.split('-');
  const y = parseInt(parts[0]);
  const m = parseInt(parts[1]);
  const nextM = m === 12 ? 1 : m + 1;
  const nextY = m === 12 ? y + 1 : y;
  return nextY + '-' + String(nextM).padStart(2, '0') + '-15';
}

/**
 * 规范化RDC名称（兼容"华南""华南仓""华南RDC"等混用格式）
 */
function normalizeRdcName(name) {
  if (!name) return '';
  const n = name.replace(/仓$/, '').trim();
  const m = {
    '华南':'华南RDC','华北':'华北RDC','华中':'华中RDC','东北':'东北RDC','西北':'西北RDC','西南':'西南RDC',
    '华南RDC':'华南RDC','华北RDC':'华北RDC','华中RDC':'华中RDC','东北RDC':'东北RDC','西北RDC':'西北RDC','西南RDC':'西南RDC'
  };
  return m[n] || name;
}

function normalizeBrandName(name) {
  if (!name) return '';
  // 品牌名称标准化映射表
  const map = { '传统品牌': '传统', '百爱神': '传统', '春蕾': '传统', '海鸥': '传统', '雅霜': '传统', '友谊': '传统' };
  return map[name] || name;
}

/**
 * 对 brandFulfill 做标准化归并（保险层）：
 * 兼容旧 IndexedDB 缓存、旧 data.json 或列解析异常导致的原始品牌名，
 * 确保友谊/春蕾/海鸥/百爱神/雅霜在矩阵中始终显示为"传统"。
 */
function getNormalizedBrandFulfill() {
  const list = (dataStore.overall && dataStore.overall.brandFulfill) || [];
  const rdcKeys = ['huanan','huabei','dongbei','xibei','huazhong','xinan'];
  const map = {};
  list.forEach(item => {
    const brand = normalizeBrandName(item.brand);
    if (!brand) return;
    if (!map[brand]) {
      map[brand] = { brand };
      rdcKeys.forEach(rk => { map[brand][rk] = 0; map[brand]['_count_' + rk] = 0; });
    }
    rdcKeys.forEach(rk => {
      const v = item[rk];
      if (v != null && !isNaN(v) && v !== 0) {
        const c = map[brand]['_count_' + rk] || 0;
        map[brand][rk] = c === 0 ? v : (map[brand][rk] * c + v) / (c + 1);
        map[brand]['_count_' + rk] = c + 1;
      }
    });
  });
  return Object.values(map);
}

/**
 * 获取业务需求满足分析汇总数据
 * 返回月×RDC×渠道维度的汇总数组
 */
function getBizDemandSummary(f) {
  const biz = dataStore.bizDemand || [];
  const orders = dataStore.orderDetail || [];
  const rdcFilter = f.rdc || 'all';
  const monthFilter = f.month || 'all';
  const chFilter = f.channel || 'all';

  // 收集所有月份
  const allMonths = new Set();
  biz.forEach(d => { if (d.dateStr && d.dateStr.length >= 7) allMonths.add(d.dateStr.slice(0,7)); });
  const sortedMonths = Array.from(allMonths).sort();

  // 收集所有RDC（规范化后）
  const allRdcs = new Set();
  biz.forEach(d => { if (d.rdc) allRdcs.add(normalizeRdcName(d.rdc)); });
  const rdcList = Array.from(allRdcs).sort();

  // 渠道列表
  const channels = ['经销商', 'KA', '新通路'];

  // 去重集合：同月同RDC同SKU同渠道同需求值只计一次（跳过重复提报）
  const dedupSet = new Set();

  // 按月×RDC×渠道聚合业务提报
  const demandMap = {}; // key: "month|rdc|channel" => { demand, skuCount }
  biz.forEach(d => {
    const m = d.dateStr.slice(0, 7);
    if (monthFilter !== 'all' && m !== monthFilter) return;
    const nrdc = normalizeRdcName(d.rdc);
    if (rdcFilter !== 'all' && nrdc !== rdcFilter) return;

    channels.forEach(ch => {
      let demandVal = 0;
      if (ch === '经销商') demandVal = d.dealerDemand || 0;
      else if (ch === 'KA') demandVal = d.kaDemand || 0;
      else if (ch === '新通路') demandVal = d.newChannel || 0;

      // 去重：同月同RDC同SKU同渠道同需求值只计一次
      if (demandVal > 0) {
        const dedupKey = m + '|' + nrdc + '|' + d.opCode + '|' + ch + '|' + demandVal;
        if (dedupSet.has(dedupKey)) return;
        dedupSet.add(dedupKey);
      }

      const key = m + '|' + nrdc + '|' + ch;
      if (!demandMap[key]) {
        demandMap[key] = { month: m, rdc: nrdc, channel: ch, demand: 0, skuCount: 0 };
      }
      demandMap[key].demand += demandVal;
      if (demandVal > 0) demandMap[key].skuCount++;
    });
  });

  // 构建需求SKU集合，用于出货匹配时的校验（只统计有业务提报的SKU出货）
  // 同时记录每个 SKU×RDC×月 的"最早补货日期"，作为出货计入的时间下限
  const demandSkuSet = new Set();
  const skuSubmitDate = {}; // key: month|rdc|opCode => 最早补货日期(YYYY-MM-DD)
  biz.forEach(d => {
    const m = d.dateStr.slice(0, 7);
    if (monthFilter !== 'all' && m !== monthFilter) return;
    const nrdc = normalizeRdcName(d.rdc);
    if (rdcFilter !== 'all' && nrdc !== rdcFilter) return;
    const anyDemand = (d.dealerDemand||0) + (d.kaDemand||0) + (d.newChannel||0);
    if (anyDemand > 0) {
      const sk = m + '|' + nrdc + '|' + d.opCode;
      demandSkuSet.add(sk);
      if (!skuSubmitDate[sk] || d.dateStr < skuSubmitDate[sk]) skuSubmitDate[sk] = d.dateStr;
    }
  });

  // 按月×RDC×渠道聚合实际出货（从订单明细，时间窗口：当月~次月15日）
  // 只统计能匹配到业务提报SKU的出货
  const shipmentMap = {}; // key: "month|rdc|channel" => shipped qty
  orders.forEach(d => {
    if (!d.dateStr || d.dateStr.length < 10) return;
    const orderMonth = d.dateStr.slice(0, 7);

    // 找出该订单属于哪个月份的需求窗口（按月份降序，优先归属到自身所在月份）
    for (const mi of sortedMonths.slice().reverse()) {
      const cutoff = getNextMonth15Cutoff(mi);
      // 出货日期 >= 当月1日 and <= 次月15日
      if (orderMonth === mi || (orderMonth > mi && d.dateStr <= cutoff)) {
        // 但不能跨越太远（只处理相邻两个月）
        const mNum = parseInt(mi.split('-')[1]);
        const oNum = parseInt(orderMonth.split('-')[1]);
        if (oNum > mNum + 1) continue;

        const ch = mapOrderChannel(d);
        if (ch === '其他') continue;

        // 只统计能匹配到业务提报SKU的出货
        const wrh = normalizeRdcName(d.warehouse || '');
        const skuKey = mi + '|' + wrh + '|' + d.skuCode;
        if (!demandSkuSet.has(skuKey)) continue;

        // 时间下限：仅计入"补货日期之后"（SAP放行日期 严格 > 该SKU最早补货日期）产生的出货
        const submitDate = skuSubmitDate[skuKey];
        if (submitDate && !(d.dateStr > submitDate)) { break; }

        const key = mi + '|' + wrh + '|' + ch;
        if (!shipmentMap[key]) shipmentMap[key] = 0;
        shipmentMap[key] += (d.firstDayQty || 0); // 用首日出货量作为实际出货
        break; // 每个订单只归属一个需求月份
      }
    }
  });

  // 合并成结果
  const results = [];
  Object.keys(demandMap).forEach(key => {
    const dm = demandMap[key];
    // 应用渠道筛选
    if (chFilter !== 'all' && dm.channel !== chFilter) return;

    const shipped = shipmentMap[key] || 0;
    const progress = dm.demand > 0 ? (shipped / dm.demand * 100) : 0;

    results.push({
      month: dm.month,
      rdc: dm.rdc,
      channel: dm.channel,
      demand: Math.round(dm.demand),
      shipped: Math.round(shipped),
      progress: progress,
      skuCount: dm.skuCount
    });
  });

  // 排序：月份 desc, RDC asc, 渠道固定顺序
  const chOrder = {'经销商':0,'KA':1,'新通路':2};
  results.sort((a,b) => {
    if (a.month !== b.month) return b.month.localeCompare(a.month);
    if (a.rdc !== b.rdc) return a.rdc.localeCompare(b.rdc);
    return (chOrder[a.channel]||9) - (chOrder[b.channel]||9);
  });

  return results;
}

// ========== 业务需求可信度（DACR）分析 ==========
function renderBizDemandDACR(targetId) {
  setTitle('业务需求可信度（DACR）');
  const page = document.getElementById(targetId || 'page-biz-demand-dacr');
  if (!dataStore.loaded || !dataStore.bizDemand || dataStore.bizDemand.length === 0) {
    page.innerHTML = '<div style="text-align:center;padding:80px;color:var(--text-secondary)">暂无业务需求数据</div>';
    return;
  }
  var f = window._dacrFilters || { rdc: 'all', month: 'all' };
  window._dacrFilters = f;
  // ===== 1. 按 SKU×RDC×渠道 聚合业务提报和实际出货 =====
  // 注意：bizDemand r[2] 实为"操作工号"非SKU编码，故用 产品名称+规格 作匹配键
  function normKey(s) { return String(s||'').replace(/[\s\u3000]/g,'').slice(0,30); }
  var dacrMap = {}; // key: "normPname|rdc|ch"
  var orders = dataStore.orderDetail || [];
  var biz = dataStore.bizDemand || [];
  // 先聚合订单明细的出货量到 productName+rdc+ch
  var shipMap = {};
  orders.forEach(function(d) {
    var nrdc = normalizeRdcName(d.warehouse);
    if (f.rdc !== 'all' && nrdc !== f.rdc) return;
    var m = d.dateStr ? d.dateStr.slice(0,7) : '';
    if (f.month !== 'all' && m !== f.month) return;
    var ch = d.channel;
    if (ch === 'KA' || ch === '经销商' || ch === '新通路') {
      var pkey = normKey(d.skuName) + '|' + nrdc + '|' + ch;
      shipMap[pkey] = (shipMap[pkey] || 0) + (d.firstDayQty || 0);
    }
  });
  // 再聚合业务提报
  biz.forEach(function(d) {
    var nrdc = normalizeRdcName(d.rdc);
    if (f.rdc !== 'all' && nrdc !== f.rdc) return;
    var m = d.dateStr ? d.dateStr.slice(0,7) : '';
    if (f.month !== 'all' && m !== f.month) return;
    var chs = [{k:'经销商',v:d.dealerDemand},{k:'KA',v:d.kaDemand},{k:'新通路',v:(d.newChannel||0)}];
    var pkey = normKey(d.productName);
    chs.forEach(function(ch) {
      if (!ch.v || ch.v <= 0) return;
      var key = pkey + '|' + nrdc + '|' + ch.k;
      if (!dacrMap[key]) dacrMap[key] = { sku: d.opCode || '', skuName: d.productName || '', rdc: nrdc, channel: ch.k, bizD: 0, shipped: 0, months: {} };
      dacrMap[key].bizD += ch.v;
      // 匹配出货
      var sk = normKey(d.productName) + '|' + nrdc + '|' + ch.k;
      if (shipMap[sk]) dacrMap[key].shipped = (dacrMap[key].shipped || 0) + shipMap[sk];
      if (m) dacrMap[key].months[m] = (dacrMap[key].months[m] || 0) + ch.v;
    });
  });
  var dacrList = Object.values(dacrMap).filter(function(r) { return r.bizD > 0; });
  dacrList.forEach(function(r) {
    r.dacr = r.bizD > 0 ? r.shipped / r.bizD : 0;
    r.gap = r.bizD - r.shipped;
  });
  dacrList.sort(function(a,b) { return a.dacr - b.dacr; });
  // ===== 分类 =====
  var levels = { green: 0, yellow: 0, orange: 0, red: 0 };
  var lvlList = [];
  dacrList.forEach(function(r) {
    if (r.dacr >= 0.8) { levels.green++; r.level='可信'; r.lvl=4; }
    else if (r.dacr >= 0.5) { levels.yellow++; r.level='偏高'; r.lvl=3; }
    else if (r.dacr >= 0.3) { levels.orange++; r.level='虚高'; r.lvl=2; }
    else { levels.red++; r.level='严重虚高'; r.lvl=1; }
    lvlList.push(r);
  });
  // ===== 渠道级 DACR =====
  var chMap = {};
  ['经销商','KA','新通路'].forEach(function(ch) {
    var items = dacrList.filter(function(r) { return r.channel === ch; });
    var totBiz = items.reduce(function(s,r) { return s + r.bizD; }, 0);
    var totShip = items.reduce(function(s,r) { return s + r.shipped; }, 0);
    chMap[ch] = { channel: ch, bizD: totBiz, shipped: totShip, dacr: totBiz > 0 ? totShip / totBiz : 0, count: items.length };
  });
  // ===== 筛选选项 =====
  var rdcs = [...new Set(dacrList.map(function(r) { return r.rdc; }))].sort();
  var months = [...new Set(biz.map(function(d) { return d.dateStr ? d.dateStr.slice(0,7) : ''; }).filter(Boolean))].sort().reverse();
  var topN = lvlList.slice(0, 30);
  // ===== HTML 渲染 =====
  var html = '<div style="display:flex;flex-wrap:wrap;gap:12px;padding:16px 20px;background:var(--bg-card);border-radius:12px;margin-bottom:16px;align-items:center">';
  html += '<button class="back-btn" onclick="navigateTo(\'biz-demand\')" style="margin-right:8px">← 返回需求满足</button>';
  html += '<span style="font-size:13px;font-weight:600;color:var(--text-primary)">📊 业务需求可信度分析</span>';
  html += '<select onchange="window._dacrFilters.rdc=this.value;renderBizDemandDACR()" style="padding:6px 10px;border:1px solid var(--border-card);border-radius:6px;font-size:12px"><option value="all"'+(f.rdc==='all'?' selected':'')+'>全部RDC</option>'+rdcs.map(function(r){return '<option value="'+r+'"'+(f.rdc===r?' selected':'')+'>'+r+'</option>';}).join('')+'</select>';
  html += '<select onchange="window._dacrFilters.month=this.value;renderBizDemandDACR()" style="padding:6px 10px;border:1px solid var(--border-card);border-radius:6px;font-size:12px"><option value="all"'+(f.month==='all'?' selected':'')+'>全部月份</option>'+months.map(function(m){return '<option value="'+m+'"'+(f.month===m?' selected':'')+'>'+m+'</option>';}).join('')+'</select>';
  html += '<span style="font-size:11px;color:var(--text-secondary);margin-left:auto">DACR = 历史出货量 ÷ 业务提报量（按SKU×RDC×渠道）｜共 '+dacrList.length+' 条</span></div>';
  // KPI
  html += '<div class="kpi-row">'+
    '<div class="kpi-card green"><div class="kpi-label">可信(DACR≥80%)</div><div class="kpi-value">'+levels.green+'</div></div>'+
    '<div class="kpi-card yellow-kpi"><div class="kpi-label">偏高(50~80%)</div><div class="kpi-value">'+levels.yellow+'</div></div>'+
    '<div class="kpi-card orange"><div class="kpi-label">虚高(30~50%)</div><div class="kpi-value">'+levels.orange+'</div></div>'+
    '<div class="kpi-card red"><div class="kpi-label">严重虚高(&lt;30%)</div><div class="kpi-value">'+levels.red+'</div></div></div>';
  // 渠道对比
  html += '<div class="row-2"><div class="card"><div class="card-header"><span class="card-title">渠道级 DACR 对比</span></div><div class="chart-container" id="chart-dacr-ch" style="height:280px"></div></div>';
  html += '<div class="card"><div class="card-header"><span class="card-title">月度 DACR 趋势</span></div><div class="chart-container" id="chart-dacr-trend" style="height:280px"></div></div></div>';
  // 可信度热力图
  html += '<div class="card" style="margin-top:12px"><div class="card-header"><span class="card-title">🎨 SKU × RDC 可信度矩阵（Top30低可信SKU）</span><span style="font-size:11px;color:var(--text-secondary)">点击单元格下钻SKU明细 | 颜色=可信度(DACR)</span></div>';
  html += '<div class="chart-container" id="chart-dacr-heat" style="height:'+Math.max(280,Math.min(topN.length*28, 600))+'px"></div></div>';
  // 低可信度高增量 TOP 30 表
  html += '<div class="card" style="margin-top:12px"><div class="card-header" style="display:flex;justify-content:space-between;align-items:center"><span class="card-title">🔴 低可信高增量 TOP 30（DACR由低到高）</span><button class="btn-export" onclick="exportDACR()">导出CSV(带补货建议)</button></div>';
  html += '<div class="table-wrap"><table class="data-table" id="dacr-topn-table"><thead><tr><th>#</th><th>SKU代码</th><th>名称</th><th>RDC</th><th>渠道</th><th class="num">业务提报</th><th class="num">实际出货</th><th class="num">DACR</th><th>可信度</th><th class="num">虚高增量</th><th class="num">DACR上限</th><th class="num">推荐采纳上限</th><th class="num">KA安全库存</th><th>补货操作建议</th></tr></thead><tbody></tbody></table></div></div>';
  const dacrRowsHtml = [];
  topN.forEach(function(r,i) {
    var lvlColor = r.lvl===4?'#15803D':r.lvl===3?'#D97706':r.lvl===2?'#EA580C':'#DC2626';
    var lvlBg = r.lvl===4?'#DCFCE7':r.lvl===3?'#FFFBEB':r.lvl===2?'#FEF3C7':'#FEE2E2';
    var dacCoef = Math.min(r.dacr, 0.3);
    var recAdopt = Math.round(r.bizD * dacCoef);
    var kaSafety = (r.channel==='KA' && r.dacr<0.5) ? '×0.7' : '×1.0';
    var advice = '';
    if (r.channel==='KA' && r.dacr<0.5) {
      advice = 'KA虚高：max(系统需求, 业务提报×DACR) +安全库存×0.7 +未清-在途-在库';
    } else if (r.lvl===4) {
      advice = 'DACR≥80%可信：补货量=max(系统需求,业务提报) +安全库存+未清-在途-在库';
    } else if (r.lvl===3) {
      advice = 'DACR 50-80%偏高：补货量=max(系统需求, 系统需求×1.3) +安全库存+未清-在途-在库';
    } else if (r.lvl===2) {
      advice = 'DACR 30-50%虚高：补货量=max(系统需求, 系统需求×1.15) +安全库存+未清-在途-在库';
    } else {
      advice = 'DACR<30%严重虚高：只按系统需求补，不采纳业务增量' + (r.channel==='KA'?'，KA安全×0.7':'');
    }
    dacrRowsHtml.push('<tr><td class="c">'+(i+1)+'</td><td style="font-family:monospace">'+r.sku+'</td><td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+(r.skuName||'')+'">'+(r.skuName||'—')+'</td><td>'+r.rdc+'</td><td>'+r.channel+'</td><td class="num">'+formatNum(r.bizD)+'</td><td class="num">'+formatNum(r.shipped)+'</td><td class="num" style="color:'+lvlColor+';font-weight:700">'+(r.dacr*100).toFixed(1)+'%</td><td style="background:'+lvlBg+';color:'+lvlColor+';font-weight:700">'+r.level+'</td><td class="num" style="color:#DC2626">'+formatNum(r.gap)+'</td><td class="num">'+dacCoef.toFixed(2)+'</td><td class="num" style="font-weight:700">'+formatNum(recAdopt)+'</td><td class="num" style="color:'+(kaSafety==='×0.7'?'#EA580C':'#15803D')+';font-weight:700">'+kaSafety+'</td><td style="font-size:10px;line-height:1.4;max-width:380px">'+advice+'</td></tr>');
  });
  html += '</div>';
  page.innerHTML = html;
  // 接入分页器（每页20条；Top30 会自动显示2页）
  paginateTable('dacr-topn-table', dacrRowsHtml);
  window._dacrData = { dacrList: dacrList, topN: topN, chMap: chMap };
  // ===== ECharts 渲染 =====
  setTimeout(function() {
    // 渠道 DACR 对比图
    var chChart = echarts.init(document.getElementById('chart-dacr-ch'));
    var chLabels = ['经销商','KA','新通路'];
    chChart.setOption({
      tooltip: { formatter: function(p) { return p.name+': <b>'+(p.value*100).toFixed(1)+'%</b><br/>提报'+formatNum(chMap[p.name].bizD)+' / 出货'+formatNum(chMap[p.name].shipped)+' / '+chMap[p.name].count+'条'; } },
      grid: { left: 100, right: 30, top: 10, bottom: 20 },
      xAxis: { type: 'value', max: 1, axisLabel: { formatter: function(v) { return (v*100).toFixed(0)+'%'; } } },
      yAxis: { type: 'category', data: chLabels },
      series: [{
        type: 'bar', data: chLabels.map(function(ch) { return { value: chMap[ch].dacr, itemStyle: { color: chMap[ch].dacr >= 0.8 ? '#15803D' : chMap[ch].dacr >= 0.5 ? '#D97706' : chMap[ch].dacr >= 0.3 ? '#EA580C' : '#DC2626' } }; }),
        label: { show: true, position: 'right', formatter: function(p) { return (p.value*100).toFixed(1)+'%'; }, fontSize: 12, fontWeight: 700 }
      }]
    });
    // 月度趋势图：只统计 dacrList 里的产品（口径与dacrList一致）
    var trendChart = echarts.init(document.getElementById('chart-dacr-trend'));
    var trendMonths = months.slice(0, 6).reverse();
    // 构建 dacrList 里的产品名+rdc 集合（用于过滤订单）
    var dacrProdSet = {};
    dacrList.forEach(function(r) { dacrProdSet[normKey(r.skuName) + '|' + r.rdc] = true; });
    var trendData = trendMonths.map(function(m) {
      var tBiz = 0, tShip = 0;
      dacrList.forEach(function(r) {
        if (r.months && r.months[m]) { tBiz += r.months[m]; }
      });
      orders.forEach(function(d) {
        var dm = d.dateStr ? d.dateStr.slice(0,7) : '';
        if (dm !== m) return;
        if (d.channel !== 'KA' && d.channel !== '经销商' && d.channel !== '新通路') return;
        var pkey = normKey(d.skuName) + '|' + normalizeRdcName(d.warehouse);
        if (dacrProdSet[pkey]) tShip += (d.firstDayQty || 0);
      });
      return tBiz > 0 ? Math.min(tShip / tBiz, 1.5) : 0;
    });
    trendChart.setOption({
      tooltip: { formatter: function(p) { return p.axisValue+': <b>'+(p.value*100).toFixed(1)+'%</b>'; } },
      grid: { left: 50, right: 20, top: 10, bottom: 30 },
      xAxis: { type: 'category', data: trendMonths, axisLabel: { fontSize: 11 } },
      yAxis: { type: 'value', min: 0, max: 1, axisLabel: { formatter: function(v) { return (v*100).toFixed(0)+'%'; } } },
      series: [{ type: 'line', data: trendData, smooth: true, symbol: 'circle', symbolSize: 6, lineStyle: { width: 3, color: '#2563EB' }, itemStyle: { color: '#2563EB' }, areaStyle: { color: 'rgba(37,99,235,0.1)' } }]
    });
    // 热力图：用产品名+RDC+渠道作key（与dacrMap一致）
    var heatEl = document.getElementById('chart-dacr-heat');
    if (heatEl && topN.length > 0) {
      var topPnameRdc = [...new Set(topN.map(function(r) { return r.skuName + '|' + r.rdc; }))];
      var heatChart = echarts.init(heatEl);
      var heatY = topPnameRdc.map(function(k) { var p=k.split('|'); var first=dacrList.find(function(x){return x.skuName===p[0]&&x.rdc===p[1];})||{}; return (p[0]||'').slice(0,12)+'@'+p[1]; });
      var heatChLabels = ['经销商','KA','新通路'];
      var heatData = [];
      topPnameRdc.forEach(function(k, yi) {
        var parts = k.split('|');
        heatChLabels.forEach(function(ch, xi) {
          var pkey = normKey(parts[0]) + '|' + parts[1] + '|' + ch;
          var r = dacrMap[pkey];
          if (r && r.bizD > 0) heatData.push([xi, yi, Math.min(r.dacr, 1)]);
        });
      });
      heatChart.setOption({
        tooltip: { position: 'top', formatter: function(p) {
          var pkey = topPnameRdc[p.data[1]];
          var ch = heatChLabels[p.data[0]];
          var r = dacrMap[normKey(pkey.split('|')[0]) + '|' + pkey.split('|')[1] + '|' + ch];
          if (!r) return ch+': 无数据';
          return '<b>'+r.skuName+'</b><br/>'+r.rdc+' × '+ch+'<br/>DACR: <b>'+(r.dacr*100).toFixed(1)+'%</b><br/>提报 '+formatNum(r.bizD)+' / 出货 '+formatNum(r.shipped);
        }},
        grid: { left: 180, right: 20, top: 40, bottom: 10 },
        xAxis: { type: 'category', data: heatChLabels, position: 'top', splitArea: { show: true }, axisLabel: { fontSize: 11 } },
        yAxis: { type: 'category', data: heatY, splitArea: { show: true }, axisLabel: { fontSize: 9 } },
        visualMap: { min: 0, max: 1, calculable: true, orient: 'horizontal', left: 'center', top: 0, inRange: { color: ['#DC2626','#EA580C','#D97706','#FBBF24','#4ADE80'] }, text: ['可信', '虚高'], textStyle: { fontSize: 10 } },
        series: [{ type: 'heatmap', data: heatData, label: { show: true, fontSize: 8, formatter: function(p) { return (p.data[2]*100).toFixed(0)+'%'; } }, cursor: 'pointer', emphasis: { itemStyle: { shadowBlur: 8 } } }]
      });
    }
  }, 100);
}

function exportDACR() {
  var data = (window._dacrData && window._dacrData.dacrList) || [];
  if (!data.length) { showToast('无数据', true); return; }
  // 表头：补货操作决策列
  var csv = '\uFEFF#,SKU代码,名称,RDC,渠道,业务提报量,实际出货量,虚高增量,DACR(%),DACR分级,DACR上限系数,推荐采纳上限,KA安全库存系数,补货操作建议(可直接套用)\n';
  data.forEach(function(r,i) {
    var dacCoef = Math.min(r.dacr, 0.3);  // DACR上限系数 = min(历史出货÷业务提报, 0.3)
    var recAdoptLimit = Math.round(r.bizD * dacCoef);  // 推荐采纳上限 = 业务提报 × DACR上限
    var kaSafetyCoef = (r.channel === 'KA' && r.dacr < 0.5) ? 0.7 : 1.0;
    // 补货操作建议（按DACR分级给出可直接套用的公式）
    var advice = '';
    if (r.lvl === 4) {
      advice = 'DACR≥80%可信：补货量=max(系统需求,业务提报) +安全库存+未清-在途-在库';
    } else if (r.lvl === 3) {
      advice = 'DACR 50-80%偏高：补货量=max(系统需求, 系统需求×1.3) +安全库存+未清-在途-在库';
    } else if (r.lvl === 2) {
      advice = 'DACR 30-50%虚高：补货量=max(系统需求, 系统需求×1.15) +安全库存+未清-在途-在库';
    } else {
      advice = 'DACR<30%严重虚高：只按系统需求补，不采纳业务增量；' + (r.channel === 'KA' ? 'KA安全库存×0.7；' : '') + '新品设默认上限(系统×1.2)';
    }
    // KA差异化说明
    if (r.channel === 'KA' && r.dacr < 0.5 && r.lvl > 2) {
      advice = 'KA虚高：max(系统需求, 业务提报×DACR) +安全库存×0.7 +未清-在途-在库';
    }
    csv += [
      (i+1),
      r.sku,
      (r.skuName||'').replace(/,/g,'，'),
      r.rdc,
      r.channel,
      r.bizD,
      r.shipped,
      r.gap,
      (r.dacr*100).toFixed(1),
      r.level || '',
      dacCoef.toFixed(3),
      recAdoptLimit,
      kaSafetyCoef.toFixed(1),
      advice
    ].join(',') + '\n';
  });
  downloadFile('业务需求可信度DACR+补货建议_' + new Date().toISOString().slice(0,10) + '.csv', csv);
}

function switchBizDemandCombined(tab) {
  const tabs = document.querySelectorAll('.bd-tab');
  tabs.forEach(function(b) {
    const on = b.dataset.tab === tab;
    b.style.background = on ? 'var(--bg-card)' : 'transparent';
    b.style.color = on ? 'var(--color-blue)' : 'var(--text-secondary)';
    b.style.borderColor = on ? 'var(--color-blue)' : 'var(--border-card)';
  });
  const dm = document.getElementById('bd-tab-dm');
  const dacr = document.getElementById('bd-tab-dacr');
  if (tab === 'dm') { dm.style.display = 'block'; dacr.style.display = 'none'; renderBizDemand('bd-tab-dm'); }
  else { dm.style.display = 'none'; dacr.style.display = 'block'; renderBizDemandDACR('bd-tab-dacr'); }
}
