  const _tab = window._simTab;
  const tabStyle = (k) => k === _tab ? 'background:var(--color-blue);color:#fff;' : '';
  const tabBar = '<div style="display:flex;gap:8px;margin-bottom:16px">' +
    '<button class="btn-export" style="font-size:13px;padding:7px 18px;' + tabStyle('weekend') + '" onclick="window._simTab=\'weekend\';renderWeekendSim()">📅 周末排单模拟</button>' +
    '<button class="btn-export" style="font-size:13px;padding:7px 18px;' + tabStyle('dcSupply') + '" onclick="window._simTab=\'dcSupply\';renderWeekendSim()">🏬 总仓供应模拟</button>' +
    '</div>';

  if (_tab === 'dcSupply') {
    renderDcSupplySimTab(page, tabBar);
    return;
  }

  // ============ 周末排单模拟（原内容）============
  const sim = runWeekendSimulation(filters.dataMonth);
  if (!sim) {
    page.innerHTML = tabBar + '<div style="text-align:center;padding:80px;color:var(--text-secondary)"><div style="font-size:48px;margin-bottom:16px">📅</div><div>模拟计算失败，请检查数据</div></div>';
    return;
  }

  const dates = [...new Set(dataStore.orderDetail.filter(d => filters.dataMonth && filters.dataMonth !== 'all' ? d.dateStr.startsWith(filters.dataMonth) : true).map(d => d.dateStr))].sort();
  const rangeStart = dates[0] || '-';
  const rangeEnd = dates[dates.length - 1] || '-';
  const monthLabel = filters.dataMonth && filters.dataMonth !== 'all' ? filters.dataMonth.split('-')[1] + '月' : '全月';

  const dayChange = ((sim.simulatedDayRate - sim.originalDayRate) * 100).toFixed(2);

  page.innerHTML = tabBar + `
    <div style="margin-bottom:16px">
      <div style="font-size:var(--font-size-xl);font-weight:600;margin-bottom:4px">${monthLabel}RDC周末订单排单模拟分析</div>
      <div style="font-size:12px;color:var(--text-secondary)">数据范围: ${rangeStart} 至 ${rangeEnd} | 模拟逻辑: 周末放行订单 → 按对应周一RDC+SKU满足率推算</div>
    </div>

    <!-- 表1: 全月整体满足率对比 -->
    <div class="card">
      <div class="card-header"><span class="card-title">表1: 全月整体满足率对比</span></div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th style="width:20%">指标</th><th style="width:18%">调整前</th><th style="width:18%">调整后(含模拟)</th><th style="width:15%">变化</th><th style="width:29%">说明</th></tr>
          </thead>
          <tbody>
            <tr>
              <td>全月日订单满足率</td>
              <td class="num">${(sim.originalDayRate*100).toFixed(2)}%</td>
              <td class="num">${(sim.simulatedDayRate*100).toFixed(2)}%</td>
              <td class="num rate-good">+${dayChange}pct</td>
              <td>将周末首日缺货按周一满足率重新计算</td>
            </tr>
            <tr>
              <td>月订单满足率（全量）</td>
              <td class="num">${(sim.originalMonthRate*100).toFixed(2)}%</td>
              <td class="num">${(sim.simulatedMonthRate*100).toFixed(2)}%</td>
              <td class="num">不变</td>
              <td>月满足率不受影响（总排单量不变）</td>
            </tr>
            <tr>
              <td>参与模拟的周末订单支数</td>
              <td class="num">${formatNum(sim.totalWeekendOrderQty)}</td>
              <td class="num">-</td>
              <td class="num">-</td>
              <td>-</td>
            </tr>
            <tr>
              <td>模拟后周末首日满足量增量</td>
              <td class="num">${formatNum(sim.totalIncrement)}</td>
              <td class="num">-</td>
              <td class="num rate-good">+${formatNum(sim.totalIncrement)}支</td>
              <td>-</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 表2: 各周末日期模拟明细 -->
    <div class="card">
      <div class="card-header"><span class="card-title">表2: 各周末日期模拟明细</span></div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>周末日期</th><th>对应周一</th><th>周末订单支数</th><th>原首日满足率</th><th>模拟满足率</th><th>提升幅度</th><th>说明</th></tr>
          </thead>
          <tbody>
            ${sim.weekendResults.map(w => {
              const icon = w.improvement >= 0.5 ? '[V]' : w.improvement >= 0.05 ? '△' : '';
              const desc = w.orderQty === 0 ? '无订单记录' : w.improvement >= 0.5 ? '模拟提升显著' : w.improvement >= 0.05 ? '有所提升' : '基本持平';
              return '<tr>' +
                '<td>' + w.weekendDate + '</td>' +
                '<td>' + w.mondayDate + '</td>' +
                '<td class="num">' + (w.orderQty === 0 ? '0（无订单）' : formatNum(w.orderQty)) + '</td>' +
                '<td class="num">' + (w.orderQty === 0 ? '-' : (w.originalRate*100).toFixed(2)+'%') + '</td>' +
                '<td class="num">' + (w.orderQty === 0 ? '-' : (w.simulatedRate*100).toFixed(2)+'%') + '</td>' +
                '<td class="num rate-good">' + (w.orderQty === 0 ? '-' : '+'+(w.improvement*100).toFixed(2)+'pct') + '</td>' +
                '<td>' + (icon ? '<span style="color:var(--color-green);font-weight:600">'+icon+'</span> ' : '') + desc + '</td>' +
                '</tr>';
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <!-- 表3: 各RDC维度 -->
    <div class="card">
      <div class="card-header"><span class="card-title">表3: 各RDC维度：调整前/后日满足率对比</span></div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>RDC</th><th>参与订单支数</th><th>调整前日满足率</th><th>模拟后日满足率</th><th>提升幅度</th><th>说明</th></tr>
          </thead>
          <tbody>
            ${sim.rdcResults.map(r => {
              const icon = r.improvement >= 0.05 ? '[V]' : r.improvement >= 0.01 ? '△' : '';
              const desc = r.improvement >= 0.05 ? '提升显著' : r.improvement >= 0.01 ? '有所提升' : '基本持平';
              return '<tr>' +
                '<td><strong>' + r.rdc + '</strong></td>' +
                '<td class="num">' + formatNum(r.orderQty) + '</td>' +
                '<td class="num">' + (r.originalRate*100).toFixed(2) + '%</td>' +
                '<td class="num">' + (r.simulatedRate*100).toFixed(2) + '%</td>' +
                '<td class="num rate-good">+' + (r.improvement*100).toFixed(2) + 'pct</td>' +
                '<td>' + (icon ? '<span style="color:var(--color-green);font-weight:600">'+icon+'</span> ' : '') + desc + '</td>' +
                '</tr>';
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

// ============ 总仓供应模拟 ============
// 缺货报告「总仓供应情况」字段值：含「缺货」→ 整体缺货；含「紧张」→ 供应紧张；其他→正常
// 模拟逻辑：假设选中的 SKU 在总仓供应充足（即不是整体缺货 / 供应紧张），
//           这些 SKU 在各 RDC 的缺货量可被总仓调拨消化，从而提升订单满足率。
// 字段映射：缺货汇总 sheet 中每个 SKU 有 6 个 RDC 的「缺货箱数」+「在途箱数」列
//           huabeiShort/huabeiTransit / xinanShort / dongbeiShort / huazhongShort / huananShort / huadongShort / xibeiShort
const DC_SUPPLY_RDC_KEYS = [
  { name: '华北RDC', shortKey: 'huabei', short: '华北' },
  { name: '西南RDC', shortKey: 'xinan', short: '西南' },
  { name: '东北RDC', shortKey: 'dongbei', short: '东北' },
  { name: '华中RDC', shortKey: 'huazhong', short: '华中' },
  { name: '华南RDC', shortKey: 'huanan', short: '华南' },
  { name: '华东RDC', shortKey: 'huadong', short: '华东' },
  { name: '西北RDC', shortKey: 'xibei', short: '西北' }
];
function renderDcSupplySimTab(page, tabBar) {
  // v2.6-fix：缺货数据为空时直接显示明确提示，避免空表困惑
  if (!dataStore.shortage || dataStore.shortage.length === 0) {
    page.innerHTML = tabBar + '<div class="card" style="padding:24px;text-align:center;color:var(--text-secondary)"><div style="font-size:48px;margin-bottom:12px">📭</div><div style="font-size:var(--font-size-lg);margin-bottom:8px;color:#1E293B">缺货数据未加载</div><div style="font-size:12px;line-height:1.8">本模块需要<b>缺货汇总</b> sheet 数据（含<b>大仓供应情况</b>字段）。<br/>请前往 <a href="javascript:navigateTo(\'data\')" style="color:var(--color-blue)">数据管理</a> 导入含缺货汇总的 Excel 文件，或确认数据未损坏。</div></div>';
    return;
  }
  // 模拟场景开关：用户可独立勾选「解除整体缺货」「解除供应紧张」
  if (typeof window._simDcUnblock === 'undefined') {
    window._simDcUnblock = { shortage: true, tight: true };
  }
  if (typeof window._simDcOnlyShortage === 'undefined') window._simDcOnlyShortage = false;
  // SKU 维度筛选
  if (typeof window._simDcBrand === 'undefined') window._simDcBrand = 'all';
  if (typeof window._simDcRdcFocus === 'undefined') window._simDcRdcFocus = 'all';
  if (typeof window._simDcSort === 'undefined') window._simDcSort = 'impact';
  if (typeof window._simDcMonth === 'undefined') window._simDcMonth = 'auto'; // 'auto'=跟随全局 filters.dataMonth；或具体月份 'YYYY-MM'
  if (typeof window._simDcRdcs === 'undefined') {
    // 默认勾选 6 大主RDC（华东已停运，默认不勾）
    window._simDcRdcs = ['东北RDC','华北RDC','华南RDC','华中RDC','西北RDC','西南RDC'];
  }

  const unblockShortage = !!window._simDcUnblock.shortage;
  const unblockTight = !!window._simDcUnblock.tight;
  const onlyShortage = !!window._simDcOnlyShortage;

  // 模拟所用月份：'auto' 跟随顶部全局；否则用用户指定
  const _globalMonths = (filters.dataMonth && filters.dataMonth !== 'all') ? [filters.dataMonth] : (window._latestMonth ? [window._latestMonth] : []);
  // 缺货报告/订单中实际存在的月份列表（按时间顺序）
  const availableMonths = Array.from(new Set((dataStore.shortage || []).map(d => d.dateStr && d.dateStr.slice(0,7)).filter(Boolean))).sort();
  // 顶部月选择的实际有数据交集（如果顶部选了 2026-08 但 shortage 没 8 月，则降级）
  const globalMonthsWithData = _globalMonths.filter(m => availableMonths.indexOf(m) >= 0);
  // 月份选择（auto / 用户指定 / 顶部选择 / 降级到 shortage 末月）
  const monthChoice = window._simDcMonth;
  let rangeMonths;
  let monthSourceLabel = '';
  if (monthChoice !== 'auto' && availableMonths.indexOf(monthChoice) >= 0) {
    rangeMonths = [monthChoice];
    monthSourceLabel = monthChoice;
  } else if (globalMonthsWithData.length) {
    rangeMonths = globalMonthsWithData;
    monthSourceLabel = '跟随顶部（' + rangeMonths[0] + '）';
  } else if (_globalMonths.length) {
    // 顶部选了某月但 shortage 没数据 → 用 shortage 的最新月份
    rangeMonths = availableMonths.length ? [availableMonths[availableMonths.length - 1]] : [];
    monthSourceLabel = rangeMonths.length ? ('顶部' + _globalMonths[0] + '无数据·已降级到 ' + rangeMonths[0]) : '';
  } else {
    rangeMonths = availableMonths.length ? [availableMonths[availableMonths.length - 1]] : [];
    monthSourceLabel = rangeMonths.length ? ('缺货数据 ' + rangeMonths[0]) : '';
  }
  const monthLabel = rangeMonths.length === 1 ? rangeMonths[0].split('-')[1] + '月' : '全月';
  // 用户勾选的 RDC（用于过滤订单和SKU明细的RDC维度）
  const selectedSimRdcs = Array.isArray(window._simDcRdcs) ? window._simDcRdcs : DC_SUPPLY_RDC_KEYS.map(r => r.name);

  // 取缺货报告原始数据
  const allShortage = (dataStore.shortage || []).filter(d => {
    if (!rangeMonths.length) return true;
    return d.dateStr && rangeMonths.some(m => d.dateStr.startsWith(m));
  });
  // productMaster 取箱规
  const _pm = (dataStore.inventory && dataStore.inventory.productMaster) || {};
  function specOf(sku) { const bs = window._boxSpec && window._boxSpec[String(sku)]; return (bs && bs > 0) ? bs : 1; }

  // 选取「总仓供应情况」含目标关键字的 SKU
  const selectedRows = allShortage.filter(d => {
    const s = (d.dcSupply || '').toString();
    const isShortage = s.indexOf('缺货') >= 0;
    const isTight = s.indexOf('紧张') >= 0;
    if (onlyShortage && !isShortage) return false;
    return (unblockShortage && isShortage) || (unblockTight && isTight);
  });

  // 按 SKU 聚合（用于 SKU 明细表展示，保留 dcSupply 标签和按 SKU 的箱规信息）
  const skuMap = {};
  selectedRows.forEach(d => {
    const key = d.materialCode;
    if (!key) return;
    if (!skuMap[key]) {
      skuMap[key] = {
        sku: d.materialCode, name: d.materialName, brand: d.brand,
        dcSupply: d.dcSupply, rdcShort: {}, rdcTransit: {},
        rdcCount: 0, totalShortBoxes: 0
      };
      DC_SUPPLY_RDC_KEYS.forEach(rdc => { skuMap[key].rdcShort[rdc.name] = 0; skuMap[key].rdcTransit[rdc.name] = 0; });
    }
    const it = skuMap[key];
    DC_SUPPLY_RDC_KEYS.forEach(rdc => {
      it.rdcShort[rdc.name] += (d[rdc.shortKey + 'Short'] || 0);
      it.rdcTransit[rdc.name] += (d[rdc.shortKey + 'Transit'] || 0);
    });
    it.rdcCount = DC_SUPPLY_RDC_KEYS.filter(r => (it.rdcShort[r.name] || 0) > 0).length;
    it.totalShortBoxes = DC_SUPPLY_RDC_KEYS.reduce((s, r) => s + (it.rdcShort[r.name] || 0), 0);
  });
  const skuList = Object.values(skuMap);
  // 受影响 SKU 集合（按 materialCode 汇总，与 orderDetail.skuCode 匹配）
  const impactedSkuSet = {};
  skuList.forEach(s => { impactedSkuSet[s.sku] = s; });

  // 当前订单整体（用于满足率计算）— 必须在 rdcImpact 循环之前声明
  const monthRows = (dataStore.orderDetail || []).filter(d => {
    if (!rangeMonths.length) return true;
    return d.dateStr && rangeMonths.some(m => d.dateStr.startsWith(m));
  });
  // 仅取非免费单（保持与原周末模拟一致口径），并按用户勾选的RDC过滤
  const paidRowsAll = monthRows.filter(r => (r.type || r.orderType) !== '免费单');
  // 订单明细中 RDC 字段叫 warehouse，归一化给 rdc
  paidRowsAll.forEach(r => { if (r.warehouse && !r.rdc) r.rdc = r.warehouse; });
  const paidRows = paidRowsAll.filter(r => !r.rdc || selectedSimRdcs.indexOf(r.rdc) >= 0);
  const totalOrder = paidRows.reduce((s, d) => s + (d.orderQty || 0), 0);
  const totalFirstDay = paidRows.reduce((s, d) => s + (d.firstDayQty || 0), 0);
  const currentRate = totalOrder > 0 ? totalFirstDay / totalOrder : 0; // 日订单满足率
  // SKU×订单支数累计（用于显示影响范围 + CSV 导出）
  const skuOrderQty = {};
  paidRows.forEach(d => {
    if (!d.skuCode) return;
    skuOrderQty[d.skuCode] = (skuOrderQty[d.skuCode] || 0) + (d.orderQty || 0);
  });

  // ========== 关键修正：模拟可消化 = 订单维度首日缺货支数累计（同一订单只算一次）==========
  // 口径：在用户选定的月份 + RDC 范围内，对受影响 SKU 的订单求 firstDayShort 累计
  // firstDayShort = orderQty - firstDayQty，即"该订单首日未满足的支数"
  // 如果这些 SKU 在总仓供应充足（不再是紧张/缺货），这部分首日缺货可被消化
  const rdcImpact = {};
  DC_SUPPLY_RDC_KEYS.forEach(r => {
    rdcImpact[r.name] = { skuSet: new Set(), shortOrderCount: 0, firstDayShort: 0 };
  });
  // SKU×RDC 维度的订单首日缺货累计（用于 SKU 明细表）
  const skuRdcFirstShort = {}; // key=sku -> { rdc -> firstDayShort合计, total }
  // v2.6-fix：诊断计数器
  let _matchTotal = 0, _shortTotal = 0;
  paidRows.forEach(r => {
    if (!r.skuCode || !impactedSkuSet[r.skuCode]) return;
    _matchTotal++;
    if (!r.rdc || !rdcImpact[r.rdc]) return;
    const short = (r.orderQty || 0) - (r.firstDayQty || 0);
    if (short > 0) {
      _shortTotal++;
      rdcImpact[r.rdc].skuSet.add(r.skuCode);
      rdcImpact[r.rdc].shortOrderCount += 1;
      rdcImpact[r.rdc].firstDayShort += short;
      if (!skuRdcFirstShort[r.skuCode]) skuRdcFirstShort[r.skuCode] = { rdc: {}, total: 0, count: 0 };
      skuRdcFirstShort[r.skuCode].rdc[r.rdc] = (skuRdcFirstShort[r.skuCode].rdc[r.rdc] || 0) + short;
      skuRdcFirstShort[r.skuCode].total += short;
      skuRdcFirstShort[r.skuCode].count += 1;
    }
  });
  window._simDcMatchCount = _matchTotal;
  window._simDcShortCount = _shortTotal;
  // 将订单维度的 firstDayShort 回写到 skuList（用于 SKU 明细表显示）
  skuList.forEach(s => {
    const info = skuRdcFirstShort[s.sku];
    s.firstDayShort = info ? info.total : 0;
    s.shortOrderCount = info ? info.count : 0;
    s.rdcFirstShort = info ? info.rdc : {};
  });

  // 过滤掉 0 影响的 RDC（避免噪声），并应用用户 RDC 筛选
  const rdcRows = DC_SUPPLY_RDC_KEYS.map(r => ({
    rdc: r.name, skuCount: rdcImpact[r.name].skuSet.size,
    shortOrderCount: rdcImpact[r.name].shortOrderCount, firstDayShort: rdcImpact[r.name].firstDayShort
  })).filter(x => x.firstDayShort > 0 && selectedSimRdcs.indexOf(x.rdc) >= 0);

  // 汇总受影响（用于顶部 KPI）— 仅计入用户勾选RDC的影响
  const impactSkuCount = (function() {
    const set = new Set();
    rdcRows.forEach(r => {
      rdcImpact[r.rdc].skuSet.forEach(sku => set.add(sku));
    });
    return set.size;
  })();
  const impactShortOrders = rdcRows.reduce((s, x) => s + x.shortOrderCount, 0);
  const impactSimulatedUnits = rdcRows.reduce((s, x) => s + x.firstDayShort, 0);
  // 日订单满足率 + 模拟可消化 = 调整后日满足率（上限不超 100%）
  const simulatedFirstDay = Math.min(totalFirstDay + impactSimulatedUnits, totalOrder);
  const simulatedRate = totalOrder > 0 ? simulatedFirstDay / totalOrder : 0;
  const rateDelta = ((simulatedRate - currentRate) * 100);
  // 受影响 SKU 的订单支数合计（用于显示影响范围百分比）
  const impactOrderUnitsCap = (function() {
    let sum = 0;
    Object.keys(impactedSkuSet).forEach(sku => { sum += (skuOrderQty[sku] || 0); });
    return sum;
  })();

  // SKU 明细筛选：品牌/RDC（仅显示当前已勾选RDC）
  const brandOpts = Array.from(new Set(skuList.map(s => s.brand || '其他'))).sort();
  const rdcFocusOpts = DC_SUPPLY_RDC_KEYS.filter(r => selectedSimRdcs.indexOf(r.name) >= 0).map(r => r.name);
  // 用户之前可能选了已不在 selectedSimRdcs 内的 RDC focus，自动回退到 'all'
  if (window._simDcRdcFocus !== 'all' && rdcFocusOpts.indexOf(window._simDcRdcFocus) < 0) window._simDcRdcFocus = 'all';
  const filteredSkuList = skuList.filter(s => {
    // 先按 selectedSimRdcs 过滤 SKU：必须至少有 1 个所选 RDC 有订单首日缺货
    const inSelRdc = DC_SUPPLY_RDC_KEYS.some(r => selectedSimRdcs.indexOf(r.name) >= 0 && s.rdcFirstShort && (s.rdcFirstShort[r.name] || 0) > 0);
    if (!inSelRdc) return false;
    if (window._simDcBrand !== 'all' && s.brand !== window._simDcBrand) return false;
    if (window._simDcRdcFocus !== 'all' && !(s.rdcFirstShort && s.rdcFirstShort[window._simDcRdcFocus] > 0)) return false;
    return true;
  });
  // 排序
  const sortSku = (a, b) => {
    if (window._simDcSort === 'impact') return (b.firstDayShort || 0) - (a.firstDayShort || 0);
    if (window._simDcSort === 'rdcCount') return b.rdcCount - a.rdcCount;
    if (window._simDcSort === 'supply') {
      const rank = v => ((v || '').indexOf('缺货') >= 0 ? 0 : (v || '').indexOf('紧张') >= 0 ? 1 : 2);
      return rank(a.dcSupply) - rank(b.dcSupply);
    }
    return 0;
  };
  filteredSkuList.sort(sortSku);

  // 一键切换
  function toggleSimDcFlag(key) {
    window._simDcUnblock[key] = !window._simDcUnblock[key];

function exportDcSupplySim() {
  const rows = window._dcSimSkuList || [];
  if (rows.length === 0) { showToast('暂无数据可导出', true); return; }
  const _pm = (dataStore.inventory && dataStore.inventory.productMaster) || {};
  function specOf(sku) { const bs = window._boxSpec && window._boxSpec[String(sku)]; return (bs && bs > 0) ? bs : 1; }
  const rdcNames = DC_SUPPLY_RDC_KEYS.map(r => r.name);
  const header = ['SKU','名称','品牌','大仓原状态','涉及RDC数','总缺货箱数','模拟可消化(支)','箱规'].concat(rdcNames.map(n => n + '缺货箱数'));
  const csv = '\uFEFF' + header.join(',') + '\n';
  rows.forEach(s => {
    const simulated = Math.round(s.totalShortBoxes * specOf(s.sku));
    const line = [
      s.sku, s.name, s.brand, s.dcSupply, s.rdcCount, s.totalShortBoxes, simulated, specOf(s.sku)
    ].concat(rdcNames.map(n => s.rdcShort[n] || 0));
    csv += line.map(x => /[,"\n]/.test(String(x)) ? '"' + String(x).replace(/"/g, '""') + '"' : String(x)).join(',') + '\n';
  });
  downloadFile('总仓供应模拟_' + new Date().toISOString().slice(0,10) + '.csv', csv);
}

function rdcFromLocation(loc) {
  if (loc.startsWith('20')) return '东北RDC';
  if (loc.startsWith('40')) return '华南RDC';
  if (loc.startsWith('60')) return '西北RDC';
  if (loc.startsWith('70')) return '华中RDC';
  if (loc.startsWith('80')) return '西南RDC';
  if (loc.startsWith('90')) return '华北RDC';
  return '未知';
}

function transTypeFromLocation(loc) {
  if (loc.endsWith('23') || loc.endsWith('06')) return '免费单转储';
  if (loc.endsWith('03')) return 'KA常规转储';
  return '常规转储';
}

function renderTransship() {
  setTitle('转储数据');
  const page = document.getElementById('page-transship');
  if (!page) return;

  if (!dataStore.loaded || dataStore.transship.length === 0) {
    page.innerHTML = '<div style="text-align:center;padding:80px;color:var(--text-secondary)"><div style="font-size:48px;margin-bottom:16px">📦</div><div style="font-size:var(--font-size-lg)">暂无转储数据</div><div style="font-size:12px;margin-top:8px">请导入包含「转储数据」Sheet的Excel文件</div></div>';
    return;
  }

  if (typeof window._transTab === 'undefined') window._transTab = 'transship';
  const _tTab = window._transTab;
  const tabStyle = (t) => t === _tTab ? 'background:var(--color-blue);color:#fff;' : '';
  // 在页面顶部加 TAB 切换栏（通过 renderTransship 后面的全局变量动态插入）
  if (_tTab === 'pullback') { renderPullbackAnalysis(page); return; }

  const data = dataStore.transship;

  // Month filter（已按用户要求下线：始终展示全量）
  const allMonths = [...new Set(data.map(d => d.dateStr.slice(0,7)))].sort();
  window._transMonth = 'all';
  const selMonth = 'all';

  let filtered = data;

  // Per-RDC aggregation for filtered data
  const rdcAgg = {};
  RDC_NAMES.forEach(r => { rdcAgg[r] = { invoiceQty: 0, boxQty: 0, nonBoxQty: 0, regularQty: 0, freeQty: 0, kaQty: 0 }; });
  filtered.forEach(d => {
    if (!rdcAgg[d.rdc]) return;
    const a = rdcAgg[d.rdc];
    a.invoiceQty += d.invoiceQty;
    if (d.isBox) a.boxQty += d.invoiceQty;
    else a.nonBoxQty += d.invoiceQty;
    if (d.transType === '常规转储') a.regularQty += d.invoiceQty;
    else if (d.transType === '免费单转储') a.freeQty += d.invoiceQty;
    else if (d.transType === 'KA常规转储') a.kaQty += d.invoiceQty;
  });

  // Monthly totals by RDC (for monthly trend chart)
  const monthRdcMap = {};
  allMonths.forEach(m => { monthRdcMap[m] = {}; RDC_NAMES.forEach(r => { monthRdcMap[m][r] = 0; }); });
  data.forEach(d => {
    const m = d.dateStr.slice(0,7);
    if (monthRdcMap[m] && monthRdcMap[m][d.rdc] !== undefined) {
      monthRdcMap[m][d.rdc] += d.invoiceQty;
    }
  });
  const activeRdcs = RDC_NAMES.filter(r => {
    return allMonths.some(m => monthRdcMap[m][r] > 0);
  });

  // RDC × Type for filtered data
  const validRdcs = RDC_NAMES.filter(r => rdcAgg[r].invoiceQty > 0);
  const rdcTypeMap = {};
  validRdcs.forEach(r => { rdcTypeMap[r] = { '常规转储': 0, '免费单转储': 0, 'KA常规转储': 0 }; });
  filtered.forEach(d => {
    if (rdcTypeMap[d.rdc] && rdcTypeMap[d.rdc][d.transType] !== undefined) {
      rdcTypeMap[d.rdc][d.transType] += d.invoiceQty;
    }
  });

  // Type pie
  const typePie = [
    { name: '常规转储', value: validRdcs.reduce((s, r) => s + rdcTypeMap[r]['常规转储'], 0) },
    { name: '免费单转储', value: validRdcs.reduce((s, r) => s + rdcTypeMap[r]['免费单转储'], 0) },
    { name: 'KA常规转储', value: validRdcs.reduce((s, r) => s + rdcTypeMap[r]['KA常规转储'], 0) }
  ];

  // TOP SKU by RDC
  const topSkuRdc = window._transTopRdc || 'all';
  function getTopSKUs(rdcFilter, limit) {
    limit = limit || 10;
    let f = rdcFilter !== 'all' ? filtered.filter(d => d.rdc === rdcFilter) : filtered;
    const skuMap = {};
    f.forEach(d => {
      const key = d.material + '|' + d.materialName;
      if (!skuMap[key]) skuMap[key] = { material: d.material, name: d.materialName, invoiceQty: 0, boxQty: 0, nonBoxQty: 0, count: 0 };
      skuMap[key].invoiceQty += d.invoiceQty;
      if (d.isBox) skuMap[key].boxQty += d.invoiceQty;
      else skuMap[key].nonBoxQty += d.invoiceQty;
      skuMap[key].count++;
    });
    return Object.values(skuMap).sort((a, b) => b.invoiceQty - a.invoiceQty).slice(0, limit);
  }

  // RDC checkboxes for trend line chart
  if (!window._transLineChecked) {

    </div>

    <!-- KPI Cards by RDC（已按用户要求下线）-->

    <!-- Free transshipment unit breakdown（已按用户要求下线）-->

    <!-- H1 YoY comparison（v74：按用户要求删除 25 vs 26 对比，不再保留历史月份转储数据）-->

    <!-- Monthly trend chart with RDC checkboxes -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-header"><span class="card-title">月度转储趋势</span></div>
      <div style="margin-bottom:6px;display:flex;flex-wrap:wrap;gap:2px">
        <label style="display:inline-flex;align-items:center;gap:3px;margin-right:6px;cursor:pointer;font-size:11px;color:var(--text-secondary)" onclick="var all=Object.values(window._transLineChecked).every(v=>v);Object.keys(window._transLineChecked).forEach(k=>window._transLineChecked[k]=!all);renderTransship()">全选/取消</label>
        ${rdcLineCheckHtml}
      </div>
      <div class="chart-container" id="chart-trans-monthly-trend"></div>
    </div>

    <div class="row-2" style="margin-bottom:16px">
      <div class="card">
        <div class="card-header"><span class="card-title">各RDC转储类型分布</span></div>
        <div class="chart-container" id="chart-trans-rdc-type"></div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">转储类型占比</span></div>
        <div class="chart-container" id="chart-trans-type-pie"></div>
      </div>
    </div>

    <!-- TOP SKU (no brand) -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-header"><span class="card-title">转储TOP SKU</span></div>
      <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">
        <select style="padding:4px 8px;border:1px solid var(--border-card);border-radius:4px;font-size:12px" onchange="window._transTopRdc=this.value;renderTransship()">
          <option value="all" ${topSkuRdc==='all'?'selected':''}>全部RDC</option>
          ${validRdcs.map(r => '<option value="'+r+'"'+(topSkuRdc===r?' selected':'')+'>'+r+'</option>').join('')}
        </select>
      </div>
      <div class="table-wrap" style="max-height:360px;overflow-y:auto">
        <table class="data-table">
          <thead><tr><th>排名</th><th>物料号</th><th>物料名称</th><th>转储数量</th><th>其中箱数</th><th>其中非箱</th><th>转储次数</th></tr></thead>
          <tbody>
            ${getTopSKUs(topSkuRdc, 15).map((sku, i) => `<tr>
              <td>${i+1}</td><td>${sku.material}</td>
              <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${sku.name}">${sku.name}</td>
              <td class="num">${formatNum(sku.invoiceQty)}</td>
              <td class="num">${sku.boxQty > 0 ? formatNum(sku.boxQty) : '-'}</td>
              <td class="num">${sku.nonBoxQty > 0 ? formatNum(sku.nonBoxQty)+'支' : '-'}</td>
              <td class="num">${sku.count}</td>
            </tr>`).join('')}
            ${getTopSKUs(topSkuRdc, 15).length === 0 ? '<tr><td colspan="7" style="text-align:center;color:var(--text-secondary)">无匹配数据</td></tr>' : ''}
          </tbody>
        </table>
      </div>
    </div>

    <!-- Detail table -->
    <div class="card">
      <div class="card-header"><span class="card-title">转储明细数据</span></div>
      <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">
        <input type="text" id="trans-search" placeholder="搜索物料号/名称..." style="flex:1;min-width:150px;padding:6px 10px;border:1px solid var(--border-card);border-radius:4px;font-size:12px" oninput="renderTransTable()">

        </select>
        <select id="trans-month-filter" style="padding:4px 8px;border:1px solid var(--border-card);border-radius:4px;font-size:12px" onchange="renderTransTable()">
          <option value="all">全部月份</option>
          ${allMonths.map(m => '<option value="'+m+'">'+m+'</option>').join('')}
        </select>
        <button class="btn-export" onclick="exportTransshipCSV()">导出CSV</button>

  // ====== CHARTS ======

  // 0. H1 YoY comparison by RDC（v74：按用户要求删除——不再保留历史月份转储数据）

  const chart1 = initChart('chart-trans-monthly-trend');
  chart1.setOption({

      return html;
    }},
    legend: { data: checkedRDCs, type: 'scroll', top: 5, left: 10, right: 10, textStyle: { fontSize: 11 }, height: 45 },
    grid: { left: 55, right: 20, top: 55, bottom: 30 },
    xAxis: { type: 'category', data: allMonths, axisLabel: { fontSize: 11 } },
    yAxis: { type: 'value', axisLabel: { formatter: v => formatNum(v) } },
    series: checkedRDCs.map(r => ({
      name: r, type: 'line', data: allMonths.map(m => monthRdcMap[m][r] || 0),
      smooth: true, symbol: 'circle', symbolSize: 6, lineStyle: { width: 2 },
      color: getRDCColor(r === '未知' ? null : r) || '#64748B'
    }))
  });

  // 2. RDC x Type Stacked
  const chart2 = initChart('chart-trans-rdc-type');
  const typeNames2 = ['常规转储', '免费单转储', 'KA常规转储'];
  const typeColors2 = { '常规转储': '#2563EB', '免费单转储': '#10B981', 'KA常规转储': '#F59E0B' };
  chart2.setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, confine: true, textStyle: { fontSize: 11 }, formatter: params => {
      let html = '<strong>' + params[0].axisValue + '</strong>';
      params.forEach(p => { html += '<br/>' + p.marker + p.seriesName + '：' + formatNum(p.value) + '箱'; });
      return html;
    }},
    legend: { data: typeNames2, top: 5, left: 10, textStyle: { fontSize: 11 } },
    grid: { left: 70, right: 20, top: 40, bottom: 30 },
    xAxis: { type: 'category', data: validRdcs, axisLabel: { fontSize: 11 } },
    yAxis: { type: 'value', axisLabel: { formatter: v => formatNum(v) } },
    series: typeNames2.map(t => ({
      name: t, type: 'bar', stack: 'total',
      data: validRdcs.map(r => rdcTypeMap[r][t]),
      color: typeColors2[t],
      emphasis: { focus: 'series' }
    }))
  });

  // 3. Type Pie
  const chart3 = initChart('chart-trans-type-pie');
  chart3.setOption({
    tooltip: { trigger: 'item', formatter: p => p.name + '<br/>转储数量：' + formatNum(p.value) + '<br/>占比：' + p.percent + '%' },
    legend: { bottom: 0, textStyle: { fontSize: 11 } },
    series: [{
      type: 'pie', radius: ['35%', '65%'], center: ['50%', '45%'],
      data: typePie.filter(p => p.value > 0),
      label: { formatter: '{b}\n{d}%', fontSize: 11 },
      color: ['#2563EB', '#10B981', '#F59E0B'],
      emphasis: { itemStyle: { shadowBlur: 10 } }
    }]
  });

  renderTransTable();
}

function renderTransTable() {
  const search = (document.getElementById('trans-search')?.value || '').toLowerCase();
  const rdcFilter = document.getElementById('trans-rdc-filter')?.value || 'all';
  const monthFilter = document.getElementById('trans-month-filter')?.value || 'all';
  const container = document.getElementById('trans-table-container');
  if (!container) return;

  let filtered = dataStore.transship;
  if (search) filtered = filtered.filter(d =>
    d.material.toLowerCase().includes(search) ||
    d.materialName.toLowerCase().includes(search)
  );
  if (rdcFilter !== 'all') filtered = filtered.filter(d => d.rdc === rdcFilter);
  if (monthFilter !== 'all') filtered = filtered.filter(d => d.dateStr.startsWith(monthFilter));

  // Pagination
  const perPage = 20;
  window._transPage = window._transPage || 1;
  const totalPages = Math.ceil(filtered.length / perPage) || 1;
  if (window._transPage > totalPages) window._transPage = totalPages;
  const startIdx = (window._transPage - 1) * perPage;
  const pageData = filtered.slice(startIdx, startIdx + perPage);

  container.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--text-secondary)">
      <span>共 ${filtered.length} 条记录${filtered.length !== dataStore.transship.length ? '（已筛选）' : ''}</span>
      <div style="display:flex;gap:4px;align-items:center">
        <button class="btn-export" style="padding:2px 8px;font-size:11px" onclick="window._transPage=Math.max(1,${window._transPage-1});renderTransTable()" ${window._transPage<=1?'disabled':''}>上一页</button>
        <span>第 ${window._transPage}/${totalPages} 页</span>
        <button class="btn-export" style="padding:2px 8px;font-size:11px" onclick="window._transPage=Math.min(${totalPages},${window._transPage+1});renderTransTable()" ${window._transPage>=totalPages?'disabled':''}>下一页</button>
      </div>
    </div>
    <table class="data-table">
      <thead><tr><th>日期</th><th>RDC</th><th>库位</th><th>转储类型</th><th>物料号</th><th>物料名称</th><th>发货单数量</th><th>单位</th><th>入库数量</th><th>发货过账</th></tr></thead>
      <tbody>
        ${pageData.map(d => `<tr>
          <td>${d.dateStr}</td>
          <td><span class="badge" style="background:${getRDCColor(d.rdc)}20;color:${getRDCColor(d.rdc)}">${d.rdc}</span></td>
          <td>${d.location}</td>
          <td>${d.transType}</td>
          <td>${d.material}</td>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${d.materialName}">${d.materialName}</td>
          <td class="num">${formatNum(d.invoiceQty)}</td>
          <td>${d.unit}</td>
          <td class="num">${formatNum(d.inboundQty)}</td>
          <td class="num">${formatNum(d.deliveryQty)}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  `;
}

function setPullHainanFilter(val) {
  window._pullHainan = String(val || 'all').trim();
  var p = document.getElementById('page-transship');
  if (p) renderPullbackAnalysis(p);
}
function setPullMarFilter(val) {
  window._pullMar = String(val || 'include').trim();
  var p = document.getElementById('page-transship');
  if (p) renderPullbackAnalysis(p);
}
function setPullViewMode(val) {
  window._pullView = String(val || 'box').trim();
  var p = document.getElementById('page-transship');
  if (p) renderPullbackAnalysis(p);
}
// v122: 「按收货仓」两级下钻 —— 收货仓 → 实际收货库位 → 该库位 SKU 汇总明细。
// window._pullRecDrill : 当前展开的收货仓名（'' = 全部收起）
// window._pullLocDrill : 当前展开的库位号；null/undefined = 尚未设置(渲染时自动展开数量TOP1库位)，'' = 显式全部收起
function togglePullRecDrill(name) {
  var cur = String(window._pullRecDrill || '').trim();
  var nm = String(name || '').trim();
  window._pullRecDrill = (cur === nm) ? '' : nm;
  window._pullLocDrill = null; // 切换收货仓时重置为「未设置」，渲染时自动展开该仓数量最大的库位
  var p = document.getElementById('page-transship');
  if (p) renderPullbackAnalysis(p);
}
function togglePullLocDrill(loc) {
  var raw = window._pullLocDrill;
  var cur = (raw == null) ? null : String(raw).trim();
  var lc = String(loc || '').trim();
  window._pullLocDrill = (cur === lc) ? '' : lc; // 再点一次收起（置 '' 而非 null，避免又被自动展开）
  var p = document.getElementById('page-transship');
  if (p) renderPullbackAnalysis(p);
}

function renderPullbackAnalysis(page) {
  // 1. 取结构化拉回数据（v59：不再硬编码列索引，直接用 parse 阶段生成的对象）
  var inv = dataStore.inventory || {};
  var invRaw = inv.pullbackRows || [];
  if (invRaw.length < 1) {
    var sheetNames = (window.__rawInventorySheets && Object.keys(window.__rawInventorySheets)) || (inv._rawSheets && Object.keys(inv._rawSheets)) || [];
    var sheetListHtml = sheetNames.length ? sheetNames.map(function(n) { return '<span style="display:inline-block;padding:2px 8px;margin:2px;background:rgba(99,179,237,0.15);color:#93c5fd;border-radius:4px;font-size:11px">' + n + '</span>'; }).join('') : '<span style="color:#94a3b8">未找到任何 sheet</span>';
    // v60: 区分「sheet 未找到」和「找到但解析出 0 行」
    var sheetFound = inv.pullbackSheetFound;
    var matchedName = inv.pullbackSheetName || '';
    var diag = inv.pullbackDiag || {};
    var titleText = sheetFound ? '找到「' + matchedName + '」Sheet，但未解析出有效数据' : '未找到「拉回数据」Sheet';
    var subText = sheetFound
      ? '已自动识别表头行与列映射，但所有行都在校验中被过滤。请参考下方诊断信息，或按 F12 查看 Console 日志。'
      : 'v55 已自动尝试以下变体：拉回数据 / 拉回明细 / 拉回 / 回货';
    // v64: 空态页面直接展示诊断信息（表头、样例行、失败计数），用户截图即可反馈
    var diagHtml = '';
    if (sheetFound && diag) {
      var headerJson = JSON.stringify(diag.header || []);
      var sampleJson = JSON.stringify((diag.sampleValues || []).slice(0, 5));
      var headerDesc = diag.headerDetected ? '匹配到 <b style="color:#fbbf24">' + diag.score + '</b> 个列名关键词' : '未匹配到任何列名关键词';
      var cols = diag.cols || {};
      diagHtml = '<div style="max-width:800px;margin:20px auto;text-align:left;background:rgba(15,23,42,0.6);border:1px solid rgba(99,179,237,0.3);border-radius:8px;padding:16px;font-size:11px;color:#cbd5e1;line-height:1.7">' +
        '<div style="font-weight:600;color:#93c5fd;margin-bottom:8px">🛠 诊断信息（可截图给我）</div>' +

// ============ SHORTAGE COMPARISON PAGE ============
const SHORTAGE_REASONS = ['库存在KA库', '低于2/3效期', '指定效期发货', '入库时间差', '超销', '淘汰产品'];

function buildShortageCompareData() {
  // Helper: check if dateStr is weekend (Saturday or Sunday)
  function isWeekend(dateStr) {
    const d = new Date(dateStr);
    const day = d.getDay();
    return day === 0 || day === 6;
  }

  // Build shortage index: date + materialCode -> Set of RDCs (细化到RDC维度)
  const shortageIdx = {};
  // Also build date list for reporting
  const shortageDates = {};
  const monthFilter = filters.dataMonth && filters.dataMonth !== 'all';
  dataStore.shortage.forEach(d => {
    if (!d.dateStr) return;
    if (monthFilter && !d.dateStr.startsWith(filters.dataMonth)) return;
    if (isWeekend(d.dateStr)) return; // 跳过周末
    const dateKey = d.dateStr;
    if (!shortageIdx[dateKey]) shortageIdx[dateKey] = {};
    // 记录该物料号在各RDC的缺货情况（只要有一个RDC有缺货就算有记录）
    const rdcFields = ['huananShort','huabeiShort','dongbeiShort','xibeiShort','huazhongShort','xinanShort'];
    const hasAnyShort = rdcFields.some(k => d[k] && d[k] > 0);
    if (hasAnyShort) {
      if (!shortageIdx[dateKey][d.materialCode]) shortageIdx[dateKey][d.materialCode] = new Set();
      rdcFields.forEach(k => {
        const rdcIdx = rdcFields.indexOf(k);
        if (d[k] && d[k] > 0 && rdcIdx >= 0) {
          shortageIdx[dateKey][d.materialCode].add(RDC_LIST[rdcIdx]);
        }
      });
    }
    shortageDates[dateKey] = true;
  });

  // Find mismatches: orderDetail has shortage but NOT in shortage report (按日期+物料号+RDC比较)
  const mismatchMap = {};
  dataStore.orderDetail.forEach(d => {
    if (monthFilter && !d.dateStr.startsWith(filters.dataMonth)) return;
    if (isWeekend(d.dateStr)) return; // 跳过周末
    // 判断是否有缺货：首日缺货>0 或 总缺货缺口>0 或 订单量>首日履行量
    const hasShortage = d.firstDayShort > 0 || d.totalGap > 0 || (d.orderQty > 0 && d.firstDayQty < d.orderQty);
    if (!hasShortage) return;

    const dayShortage = shortageIdx[d.dateStr];
    let rdc = d.warehouse;
    if (rdc === '未知' || !rdc) rdc = '未知RDC';

    // 按RDC维度检查：该SKU在该RDC是否有缺货记录
    if (dayShortage && dayShortage[d.skuCode]) {
      if (dayShortage[d.skuCode].has(rdc)) return; // 该SKU在该RDC的缺货报告中已有记录，数据一致
      // 该SKU在缺货报告中存在，但不在该RDC — 仍有差异
    }

    const gapReason = (dayShortage && dayShortage[d.skuCode]) ? '缺货报告未收录该RDC' : '无当日缺货报告';
    const key = `${d.dateStr}|${d.skuCode}|${rdc}`;
    if (!mismatchMap[key]) {
      mismatchMap[key] = {
        dateStr: d.dateStr, skuCode: d.skuCode, skuName: d.skuName,
        brand: d.brand, rdc: rdc, firstShort: 0, gapReason: gapReason
      };
    }
    mismatchMap[key].firstShort += (d.firstDayShort > 0 ? d.firstDayShort : (d.totalGap > 0 ? d.totalGap : d.orderQty - d.firstDayQty));
    // 统一gapReason（以更严重为准）
    if (gapReason === '无当日缺货报告') mismatchMap[key].gapReason = '无当日缺货报告';
  });

  return Object.values(mismatchMap).sort((a, b) => a.dateStr.localeCompare(b.dateStr) || b.firstShort - a.firstShort);
}

function saveShortageReasonAt(i) {
  const keys = window._shortageRowKeys || [];
  const key = keys[i];
  if (!key) { showToast('数据异常，请刷新页面', true); return; }
  const sel = document.getElementById('reason-' + i);
  if (!sel || !sel.value) { showToast('请先选择缺货原因', true); return; }
  const isModify = !!window._shortageReasons[key];
  window._shortageReasons = window._shortageReasons || {};
  window._shortageReasons[key] = sel.value;
  // 写入IndexedDB + localStorage双备份
  saveToIDB().catch(() => {});
  try { localStorage.setItem('rdc_shortage_reasons', JSON.stringify(window._shortageReasons)); } catch(e) {}
  renderShortageCompare();
  showToast(isModify ? '缺货原因已更新' : '缺货原因已保存');
}

function importShortageReasons() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,.csv';
  input.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const imported = JSON.parse(ev.target.result);
        window._shortageReasons = window._shortageReasons || {};
        let count = 0;
        Object.keys(imported).forEach(k => {
          if (typeof imported[k] === 'string' && imported[k].trim()) {
            window._shortageReasons[k] = imported[k].trim();
            count++;
          }
        });
        saveToIDB().catch(() => {});
        try { localStorage.setItem('rdc_shortage_reasons', JSON.stringify(window._shortageReasons)); } catch(e) {}
        renderShortageCompare();
        showToast('成功导入 ' + count + ' 条缺货原因');
      } catch(err) {
        showToast('导入失败：文件格式不正确，请使用JSON格式', true);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function exportShortageReasons() {
  const reasons = window._shortageReasons || {};
  const blob = new Blob([JSON.stringify(reasons, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '缺货原因_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function exportShortageCompareCSV() {
  const allData = buildShortageCompareData();
  let csv = '\uFEFF日期,RDC,物料号,物料名称,品牌,首日缺货(箱),差异原因,缺货原因\n';
  allData.forEach(d => {
    const key = d.dateStr + '|' + d.skuCode + '|' + d.rdc;

  });
  downloadFile('缺货差异维护_' + new Date().toISOString().slice(0,10) + '.csv', csv);
}

function renderReplenishment() {
  setTitle('补货建议');
  var page = document.getElementById('page-replenishment');
  if (!page || !dataStore.loaded) {
    if (page) page.innerHTML = '<div style="text-align:center;padding:80px;color:var(--text-secondary)">请先导入数据</div>';
    return;
  }

  var shortageData = dataStore.shortage;
  var orderData = dataStore.orderDetail;
  var shortageReasons = window._shortageReasons || {};

  // Get latest date
  var allDates = shortageData.map(function(d) { return d.dateStr; }).filter(Boolean).sort();
  var latestDate = allDates[allDates.length - 1];
  if (!latestDate) { page.innerHTML = '<div style="text-align:center;padding:80px;color:var(--text-secondary)">暂无缺货数据</div>'; return; }

  // Month filter
  var monthFilter = filters.dataMonth && filters.dataMonth !== 'all';
  var latestShortage = shortageData.filter(function(d) { return d.dateStr === latestDate; });
  if (monthFilter) {
    latestShortage = latestShortage.filter(function(d) { return d.dateStr && d.dateStr.indexOf(filters.dataMonth) === 0; });
    var monthDates = shortageData.filter(function(d) { return d.dateStr && d.dateStr.indexOf(filters.dataMonth) === 0; }).map(function(d) { return d.dateStr; }).sort();
    latestDate = monthDates[monthDates.length - 1];
    latestShortage = shortageData.filter(function(d) { return d.dateStr === latestDate; });
  }

  // RDC filter
  var rdcFilter = window._replRdc || 'all';
  window._replRdc = rdcFilter;

  // ==== DAILY SUGGESTIONS ====
  // v136: 月度缺货画像提到顶部供「每日建议紧急度升级/中期分仓置顶/安全库存SS系数」三处共享
  // v164: 跟随「缺货四象限」页的窗口模式（window._msWindowMode，默认 rolling30）
  //   之前写死 getMonthlyShortageProfile()（月度），导致补货建议页的 P75/P90 阈值
  //   与四象限页(rolling30)不同源 → 两页"严重度高/紧急"数字对不上（用户反复困惑的根源）
  var _replMode = window._msWindowMode || 'rolling30';
  var msProf = _replMode === 'rolling30' ? getRollingShortageProfile() : getMonthlyShortageProfile();
  var msPeriod = _replMode === 'rolling30'
    ? 'rolling30'
    : ((filters.dataMonth && filters.dataMonth !== 'all') ? filters.dataMonth : (window._latestMonth || ''));
  function msPersistent(sku, rdc) { var ms = msProf.byKey[msPeriod + '|' + sku + '|' + rdc]; return !!(ms && ms.isHighSeverity); }
  // Step 1: Candidate SKU x RDC combos from latest shortage
  var rdcKeyMap = { '华南RDC':'huananShort','华北RDC':'huabeiShort','东北RDC':'dongbeiShort','西北RDC':'xibeiShort','华中RDC':'huazhongShort','西南RDC':'xinanShort' };
  var rdcKeys = Object.keys(rdcKeyMap);
  var rdcNames = Object.values(rdcKeyMap);

  var candidates = [];
  latestShortage.forEach(function(d) {
    if (d.dcSupply && d.dcSupply.indexOf('整体缺货') >= 0 && d.rdcTransitTotal <= 0) return; // 总仓缺货且无在途，跳过
    rdcKeys.forEach(function(rdcName, idx) {
      var rdcKey = rdcNames[idx];
      var shortVal = d[rdcKey] || 0;
      if (shortVal <= 0) return;
      var key = d.materialCode + '|' + rdcName;
      // Dedup by SKU+RDC (use latest entry if multiple)
      if (candidates.some(function(c) { return c.key === key; })) return;

      // Get shortage reason
      var reasonKey = d.dateStr + '|' + d.materialCode + '|' + rdcName;
      var reason = shortageReasons[reasonKey] || '';

      candidates.push({
        key: key,
        materialCode: d.materialCode,
        materialName: d.materialName,
        brand: d.brand,
        abcClass: d.abcClass || 'C',
        rdc: rdcName,
        dcStock: d.dcStock || 0,
        rdcTransitTotal: d.rdcTransitTotal || 0,
        rdcShortBoxes: shortVal,
        rdcShortAmount: d.rdcShortAmount || 0,
        dcSupply: d.dcSupply || '',
        reason: reason,
        dateStr: d.dateStr
      });
    });
  });

  // Step 2: Calculate daily demand and fulfillment rate (60 days, covering current + previous month)
  var sixtyDaysAgo = new Date(latestDate);
  sixtyDaysAgo.setDate(sixtyDaysAgo.getDate() - 60);
  var sixtyDaysAgoStr = sixtyDaysAgo.toISOString().slice(0, 10);
  var analysisDays = Math.min(60, Math.ceil((new Date(latestDate) - sixtyDaysAgo) / 86400000));

  // Build SKU x RDC demand map from orderDetail
  var demandMap = {}; // key: skuCode|rdc -> { total, fulfill, days, dailyVals }
  orderData.forEach(function(d) {
    if (d.dateStr < sixtyDaysAgoStr || d.dateStr > latestDate) return;
    var dmKey = d.skuCode + '|' + d.warehouse;
    if (!demandMap[dmKey]) demandMap[dmKey] = { total: 0, fulfill: 0, days: 0, dailyVals: {} };
    demandMap[dmKey].total += d.orderQty;
    demandMap[dmKey].fulfill += d.totalFulfillQty;
    if (!demandMap[dmKey].dailyVals[d.dateStr]) demandMap[dmKey].dailyVals[d.dateStr] = 0;
    demandMap[dmKey].dailyVals[d.dateStr] += d.orderQty;
  });

  // Calculate 7-day vs previous 7-day shortage trend
  var sevenDaysAgo = new Date(latestDate);
  sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
  var fourteenDaysAgo = new Date(latestDate);
  fourteenDaysAgo.setDate(fourteenDaysAgo.getDate() - 14);
  var sevenDaysAgoStr = sevenDaysAgo.toISOString().slice(0, 10);
  var fourteenDaysAgoStr = fourteenDaysAgo.toISOString().slice(0, 10);

  // Build shortage trend per SKU x RDC
  var shortTrendMap = {}; // key -> recent7, prev7
  shortageData.forEach(function(d) {
    if (!d.dateStr || d.dateStr > latestDate) return;
    rdcKeys.forEach(function(rdcName, idx) {
      var rdcKey = rdcNames[idx];
      var sv = d[rdcKey] || 0;
      if (sv <= 0) return;
      var stKey = d.materialCode + '|' + rdcName;
      if (!shortTrendMap[stKey]) shortTrendMap[stKey] = { recent7: 0, prev7: 0 };
      if (d.dateStr >= sevenDaysAgoStr) shortTrendMap[stKey].recent7 += sv;
      else if (d.dateStr >= fourteenDaysAgoStr) shortTrendMap[stKey].prev7 += sv;
    });
  });

  // Step 3: Score each candidate
  var maxShortBoxes = 0;
  candidates.forEach(function(c) { if (c.rdcShortBoxes > maxShortBoxes) maxShortBoxes = c.rdcShortBoxes; });

  var scoredCandidates = candidates.map(function(c) {
    var dmKey = c.materialCode + '|' + c.rdc;
    var dm = demandMap[dmKey] || { total: 0, fulfill: 0, days: 0, dailyVals: {} };
    var st = shortTrendMap[dmKey] || { recent7: 0, prev7: 0 };

    // Daily avg demand
    var dailyAvg = dm.total > 0 ? dm.total / analysisDays : 0;

    // Fulfillment rate (30-day)
    var fulfillRate = dm.total > 0 ? dm.fulfill / dm.total : 0;

    // Shortage trend (7-day vs previous 7-day)
    var trendUp = st.recent7 > st.prev7 * 1.1 ? 1 : 0;

    // ABC coefficient
    var abcCoeff = c.abcClass === 'A' ? 1.0 : c.abcClass === 'B' ? 0.6 : 0.3;

    // RDC count (how many RDCs this SKU affects)
    var skuRdcCount = 1;
    candidates.forEach(function(c2) {
      if (c2.materialCode === c.materialCode && c2.rdc !== c.rdc) skuRdcCount++;
    });
    var rdcNorm = skuRdcCount / 6;

    // Shortage normalization
    var shortNorm = maxShortBoxes > 0 ? c.rdcShortBoxes / maxShortBoxes : 0;

    // Composite score (0-1 → 0-100)
    var score = (1 - fulfillRate) * 0.25 + trendUp * 0.15 + abcCoeff * 0.15 + rdcNorm * 0.10 + shortNorm * 0.35;
    var score100 = Math.round(score * 100);

    // Suggested replenishment quantity
    var suggestQty = Math.max(0, Math.round(dailyAvg * 4 - c.dcStock - c.rdcTransitTotal));

    // Urgency level
    var urgency = score100 >= 70 ? 'emergency' : score100 >= 40 ? 'important' : 'attention';
    var urgencyLabel = score100 >= 70 ? '紧急' : score100 >= 40 ? '重要' : '关注';
    var urgencyColor = score100 >= 70 ? '#EF4444' : score100 >= 40 ? '#F59E0B' : '#2563EB';
    var urgencyBg = score100 >= 70 ? '#FEE2E2' : score100 >= 40 ? '#FFFBEB' : '#DBEAFE';

    // Shortage reason advice
    var reasonAdvice = '';
    if (c.reason) {
      if (c.reason.indexOf('总仓缺货') >= 0) reasonAdvice = '需总仓协调补充';
      else if (c.reason.indexOf('在途缺货') >= 0) reasonAdvice = '紧急调拨补货';
      else if (c.reason.indexOf('KA库') >= 0) reasonAdvice = '协调KA库释放';
      else if (c.reason.indexOf('效期') >= 0) reasonAdvice = '调拨替代批次';
      else if (c.reason.indexOf('效期发货') >= 0) reasonAdvice = '客户沟通效期';
      else if (c.reason.indexOf('入库时间差') >= 0) reasonAdvice = '持续监控入库';
      else if (c.reason.indexOf('超销') >= 0) reasonAdvice = '建议补货+下架评估';
      else if (c.reason.indexOf('淘汰产品') >= 0) reasonAdvice = '建议下架/不再补货';
      else reasonAdvice = '待确认原因';
    } else {
      reasonAdvice = '待确认原因';
    }

    return {
      key: c.key,
      materialCode: c.materialCode,
      materialName: c.materialName,
      brand: c.brand,
      abcClass: c.abcClass,
      rdc: c.rdc,
      dcStock: c.dcStock,
      rdcTransitTotal: c.rdcTransitTotal,
      rdcShortBoxes: c.rdcShortBoxes,
      dcSupply: c.dcSupply,
      dailyAvg: dailyAvg,
      fulfillRate: fulfillRate,
      trendUp: trendUp,
      score: score100,
      suggestQty: suggestQty,
      urgency: urgency,
      urgencyLabel: urgencyLabel,
      urgencyColor: urgencyColor,
      urgencyBg: urgencyBg,
      reason: c.reason,
      reasonAdvice: reasonAdvice,
      skuRdcCount: skuRdcCount
    };
  });

  // Sort by score desc
  scoredCandidates.sort(function(a, b) { return b.score - a.score; });

  // Per-RDC quota: each RDC shows at most 5 SKUs
  // Process in score order, collect per-RDC, then fill remaining slots
  var perRdcCount = {};
  var perRdcDisplay = [];
  var overflowCandidates = [];
  scoredCandidates.forEach(function(c) {
    perRdcCount[c.rdc] = perRdcCount[c.rdc] || 0;
    if (perRdcCount[c.rdc] < 5) {
      perRdcCount[c.rdc]++;
      perRdcDisplay.push(c);
    } else {
      overflowCandidates.push(c);
    }
  });
  // Fill remaining slots up to 20 with highest-score overflow candidates
  // Fill remaining slots up to 20 with highest-score overflow candidates
  var remainingSlots = Math.max(0, 20 - perRdcDisplay.length);
  var filledRemaining = overflowCandidates.slice(0, remainingSlots);
  var top20 = perRdcDisplay.concat(filledRemaining).slice(0, 20);
  // Re-sort by score to maintain descending order
  top20.sort(function(a, b) { return b.score - a.score; });

  // RDC filter
  var displayList = top20;
  if (rdcFilter !== 'all') {
    displayList = top20.filter(function(d) { return d.rdc === rdcFilter; });
  }

  // ==== MID-TERM STRATEGY ====
  // 3.1 SKU distribution adjustment (60-day range)
  var distAdjustments = [];
  // 构建 SKU 名称映射（orderData / shortageData 都可能提供）
  var skuNameMap = {};
  orderData.forEach(function(d) {
    if (d.skuCode && d.skuName && !skuNameMap[d.skuCode]) skuNameMap[d.skuCode] = d.skuName;
  });
  shortageData.forEach(function(d) {
    if (d.materialCode && d.materialName && !skuNameMap[d.materialCode]) skuNameMap[d.materialCode] = d.materialName;
  });
  var skuRdcDemand = {};
  orderData.forEach(function(d) {
    if (!d.dateStr || d.dateStr < sixtyDaysAgoStr || d.dateStr > latestDate) return;
    var distKey = d.skuCode + '|' + d.warehouse;
    if (!skuRdcDemand[distKey]) skuRdcDemand[distKey] = 0;
    skuRdcDemand[distKey] += d.orderQty;
  });

  var skuTotalDemand = {};
  Object.keys(skuRdcDemand).forEach(function(key) {
    var sku = key.split('|')[0];
    skuTotalDemand[sku] = (skuTotalDemand[sku] || 0) + skuRdcDemand[key];
  });

  Object.keys(skuRdcDemand).forEach(function(key) {
    var parts = key.split('|');
    var sku = parts[0];
    var rdc = parts[1];
    var demand = skuRdcDemand[key];
    var totalDemand = skuTotalDemand[sku];
    var ratio = totalDemand > 0 ? demand / totalDemand : 0;
    // v137: 月缺货箱数 = 当月 firstDayShort 累加 ÷ boxSpec（v131 铁律，按 SKU 聚合后再除箱规）
    // 不用 shortageData 跨日累加——同一批未满足订单在多日重复显示会导致严重虚增
    var msP = msProf.byKey[msPeriod + '|' + sku + '|' + rdc];
    var monthShort = (msP && msP.shortBoxes != null) ? msP.shortBoxes : 0;

    var persistentDA = msPersistent(sku, rdc);
    if (ratio > 0.4 && monthShort > 50) {
      distAdjustments.push({
        skuCode: sku,
        skuName: skuNameMap[sku] || '',
        rdc: rdc,
        ratio: (ratio * 100).toFixed(0),
        monthShort: Math.round(monthShort),
        persistent: persistentDA,
        suggestion: persistentDA ? '上调分仓分配比例 · ★月度持续' : '上调分仓分配比例'
      });
    }
  });
  // v136: 双高 SKU 置顶（★月度持续），同优先级内仍按月缺货量 desc
  distAdjustments.sort(function(a, b) {
    var aP = a.persistent ? 1 : 0, bP = b.persistent ? 1 : 0;
    if (aP !== bP) return bP - aP;
    return b.monthShort - a.monthShort;
  });
  distAdjustments = distAdjustments.slice(0, 10);

  // 3.2 Safety stock analysis
  var ssAdjustments = [];
  var skippedSS = {};
  Object.keys(demandMap).forEach(function(dmKey) {
    var dm = demandMap[dmKey];
    var parts = dmKey.split('|');
    var sku = parts[0];
    var rdc = parts[1];
    if (dm.total < 200) return; // Not enough data for meaningful analysis (60-day window)

    var dailyMean = dm.total / analysisDays;
    var vals = Object.values(dm.dailyVals).filter(function(v) { return v > 0; });
    if (vals.length < 5) return;

    var mean = vals.reduce(function(s, v) { return s + v; }, 0) / vals.length;
    var variance = vals.reduce(function(s, v) { return s + (v - mean) * (v - mean); }, 0) / vals.length;
    var stdDev = Math.sqrt(variance);
    var cv = stdDev / (dailyMean || 1);
    var persistentSS = msPersistent(sku, rdc);
    var ssBase = Math.round(1.65 * stdDev * 2); // 原始理论 SS
    var ss = Math.round(ssBase * (persistentSS ? 1.3 : 1.0)); // v136: 双高 SKU × 1.3

    // Find this SKU's current stock from shortage data
    var stockInfo = shortageData.filter(function(d) {
      return d.materialCode === sku;
    }).sort(function(a, b) { return b.dateStr.localeCompare(a.dateStr); })[0];
    var currentStock = stockInfo ? (stockInfo.dcStock || 0) : 0;

    if (currentStock < ss * 0.8 || currentStock > ss * 1.5 || cv > 0.3) {
      var suggest = currentStock < ss * 0.8 ? '上调安全库存' : currentStock > ss * 1.5 ? '下调安全库存' : '正常';
      if (cv > 0.3 && suggest === '正常') suggest = '高波动,重点监控';
      var ssKey = sku + '|' + rdc;
      if (!skippedSS[ssKey]) {
        skippedSS[ssKey] = true;
        ssAdjustments.push({
          skuCode: sku,
          skuName: skuNameMap[sku] || '',
          rdc: rdc,
          dailyMean: Math.round(dailyMean),
          stdDev: Math.round(stdDev),
          cv: cv.toFixed(2),
          ss: ss,
          ssBase: ssBase,
          persistent: persistentSS,
          currentStock: currentStock,
          suggestion: suggest + (persistentSS ? ' · ★月度持续' : '')
        });
      }
    }
  });
  ssAdjustments.sort(function(a, b) { return b.cv - a.cv; });
  ssAdjustments = ssAdjustments.slice(0, 10);

  // 3.3 Anomaly detection
  var anomalies = [];
  // Pattern 1: multi-RDC shortage
  var skuAnomalyMap = {};
  shortageData.filter(function(d) { return d.dateStr === latestDate; }).forEach(function(d) {
    var rdcCnt = rdcNames.reduce(function(c, k) { return c + (d[k] > 0 ? 1 : 0); }, 0);
    if (rdcCnt >= 4) {
      skuAnomalyMap[d.materialCode] = {
        materialCode: d.materialCode,
        materialName: d.materialName,
        brand: d.brand,
        rdcCount: rdcCnt,
        type: '多仓同时缺货',
        severity: 'high',
        advice: '总仓库存可能不足，建议紧急调拨或调整生产计划'
      };
    }
  });

  // Pattern 2: consecutive low fulfillment
  var recentDates = shortageData.map(function(d) { return d.dateStr; }).filter(Boolean).sort().reverse().slice(0, 5);
  var fulfillLowMap = {};
  orderData.forEach(function(d) {
    if (!d.dateStr || recentDates.indexOf(d.dateStr) < 0) return;
    var flKey = d.skuCode + '|' + d.warehouse;
    if (!fulfillLowMap[flKey]) fulfillLowMap[flKey] = { total: 0, fulfill: 0, days: new Set(), brand: d.brand, skuName: d.skuName };
    fulfillLowMap[flKey].total += d.orderQty;
    fulfillLowMap[flKey].fulfill += d.totalFulfillQty;
    fulfillLowMap[flKey].days.add(d.dateStr);
  });

  Object.keys(fulfillLowMap).forEach(function(key) {
    var fm = fulfillLowMap[key];
    if (fm.days.size >= 5 && fm.total > 0) {
      var rate = fm.fulfill / fm.total;
      if (rate < 0.6) {
        var parts = key.split('|');
        anomalies.push({
          materialCode: parts[0],
          materialName: fm.skuName,
          brand: fm.brand,
          rdc: parts[1],
          rdcCount: 0,
          type: '满足率持续走低',
          severity: 'medium',
          advice: '连续5天满足率<' + (rate*100).toFixed(0) + '%，优先排查库存水位'
        });
      }
    }
  });

  // Merge anomaly patterns (remove duplicates)
  var seenAnomalies = {};
  anomalies = anomalies.filter(function(a) {
    var ak = a.materialCode + '|' + a.type;
    if (seenAnomalies[ak]) return false;
    seenAnomalies[ak] = true;
    return true;
  }).slice(0, 5);

  // Add multi-RDC shortages
  Object.values(skuAnomalyMap).forEach(function(a) {
    var ak = a.materialCode + '|' + a.type;
    if (!seenAnomalies[ak]) {
      seenAnomalies[ak] = true;
      anomalies.push(a);
    }
  });
  anomalies = anomalies.slice(0, 8);

  // Apply RDC filter to mid-term tables
  if (rdcFilter !== 'all') {
    distAdjustments = distAdjustments.filter(function(d) { return d.rdc === rdcFilter; });
    ssAdjustments = ssAdjustments.filter(function(d) { return d.rdc === rdcFilter; });
    // For anomalies: keep multi-RDC alerts, filter single-RDC ones
    anomalies = anomalies.filter(function(a) {
      return a.type === '多仓同时缺货' || a.rdc === rdcFilter;
    });
  }

  // ====== RENDER ======
  var monthLabel = monthFilter ? filters.dataMonth : '全部月份';

  // Processed status - persist in IndexedDB
  window._replStatus = window._replStatus || {};
  function statusIcon(key) {
    return window._replStatus[key] ? '✅' : '⬜';
  }
  function toggleStatus(key) {
    window._replStatus[key] = !window._replStatus[key];
    saveToIDB();
    renderReplenishment();
  }
  function saveIDBReplStatus() {} // deprecated, using saveToIDB now

  // Restore from IDB
  try {
    if (db) {
      var tx = db.transaction(STORE_NAME, 'readonly');
      var store = tx.objectStore(STORE_NAME);
      var req = store.get('current_data');
      req.onsuccess = function() {
        if (req.result && req.result.replStatus) {
          window._replStatus = req.result.replStatus;
        }
      };
    }
  } catch(e) {}

  // Utility function
  function fmtNum(n) { return n == null ? '-' : n % 1 ? n.toFixed(1) : n.toLocaleString(); }
  function fmtPct(n) { return n == null ? '-' : (n*100).toFixed(1) + '%'; }

  // Count by urgency
  var emergencyCount = displayList.filter(function(d) { return d.urgency === 'emergency'; }).length;
  var importantCount = displayList.filter(function(d) { return d.urgency === 'important'; }).length;
  var attentionCount = displayList.filter(function(d) { return d.urgency === 'attention'; }).length;

  var dailyHtml = '<div class="card" style="margin-bottom:16px">' +
    '<div class="card-header"><span class="card-title">🔴 每日补货建议</span><span style="font-size:11px;color:var(--text-secondary);margin-left:auto">分析日期：' + latestDate + ' | ' + monthLabel + '</span><button onclick="navigateTo(\'replenish-logic\')" style="margin-left:12px;padding:6px 14px;border:2px solid var(--color-blue);color:var(--color-blue);background:transparent;border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap;font-weight:600;">📖 补货建议逻辑</button></div>' +
    '<div style="margin-bottom:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center">' +
    '<div style="flex:1;min-width:120px;border:1px solid var(--border-card);border-radius:8px;padding:10px;text-align:center;background:#F8FAFC">' +
    '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:2px">🔴 紧急</div><div style="font-size:24px;font-weight:600;color:#EF4444">' + emergencyCount + '</div><div style="font-size:10px;color:var(--text-secondary)">评分≥70</div></div>' +
    '<div style="flex:1;min-width:120px;border:1px solid var(--border-card);border-radius:8px;padding:10px;text-align:center;background:#F8FAFC">' +
    '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:2px">🟡 重要</div><div style="font-size:24px;font-weight:600;color:#F59E0B">' + importantCount + '</div><div style="font-size:10px;color:var(--text-secondary)">40≤评分<70</div></div>' +
    '<div style="flex:1;min-width:120px;border:1px solid var(--border-card);border-radius:8px;padding:10px;text-align:center;background:#F8FAFC">' +
    '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:2px">🔵 关注</div><div style="font-size:24px;font-weight:600;color:#2563EB">' + attentionCount + '</div><div style="font-size:10px;color:var(--text-secondary)">评分<40</div></div>' +
    '<div style="flex:1;min-width:120px;border:1px solid var(--border-card);border-radius:8px;padding:10px;text-align:center;background:#F8FAFC">' +
    '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:2px">📊 候选SKU</div><div style="font-size:24px;font-weight:600;color:var(--color-purple)">' + top20.length + '</div><div style="font-size:10px;color:var(--text-secondary)">当日有缺货的SKU×RDC</div></div>' +
    '</div>';

  // RDC filter & export
  dailyHtml += '<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">' +
    '<span style="font-size:12px;color:var(--text-secondary)">RDC：</span>' +
    '<select onchange="window._replRdc=this.value;renderReplenishment()" style="padding:4px 10px;border:1px solid var(--border-card);border-radius:6px;font-size:12px">' +
    '<option value="all"' + (rdcFilter==='all'?' selected':'') + '>全部RDC</option>' +
    rdcKeys.map(function(r) { return '<option value="'+r+'"'+(rdcFilter===r?' selected':'')+'>'+r+'</option>'; }).join('') +
    '</select>' +
    '<span style="font-size:11px;color:var(--text-secondary);margin-left:auto">共 ' + displayList.length + ' 条</span>' +
    '<button class="btn-export" style="font-size:11px;padding:4px 10px" onclick="exportReplenishmentCSV()">导出CSV</button>' +
    '</div>';

  // Table

function exportReplenishmentCSV() {
  var shortageData = dataStore.shortage;
  var orderData = dataStore.orderDetail;
  var shortageReasons = window._shortageReasons || {};
  var allDates = shortageData.map(function(d) { return d.dateStr; }).filter(Boolean).sort();
  var latestDate = allDates[allDates.length - 1];
  if (!latestDate) return;

  var rdcNames = ['huananShort','huabeiShort','dongbeiShort','xibeiShort','huazhongShort','xinanShort'];
  var rdcKeys = ['华南RDC','华北RDC','东北RDC','西北RDC','华中RDC','西南RDC'];
  var sixtyDaysAgoExp = new Date(latestDate);
  sixtyDaysAgoExp.setDate(sixtyDaysAgoExp.getDate() - 60);
  var sixtyDaysAgoStrExp = sixtyDaysAgoExp.toISOString().slice(0, 10);
  var analysisDaysExp = Math.min(60, Math.ceil((new Date(latestDate) - sixtyDaysAgoExp) / 86400000));

  var csv = '\uFEFF评分,SKU编码,物料名称,品牌,ABC,RDC,今日缺口箱数,近60天日均需求,月满足率,建议补货量,缺货原因,应对建议,紧急度,处理状态\n';
  var dmMap = {};
  orderData.forEach(function(d) {
    if (d.dateStr < sixtyDaysAgoStrExp || d.dateStr > latestDate) return;
    var dmKey = d.skuCode + '|' + d.warehouse;
    if (!dmMap[dmKey]) dmMap[dmKey] = { total: 0, fulfill: 0 };
    dmMap[dmKey].total += d.orderQty;
    dmMap[dmKey].fulfill += d.totalFulfillQty;
  });

  // Reuse the same scoring logic for export
  var latestShortage = shortageData.filter(function(d) { return d.dateStr === latestDate; });
  latestShortage.forEach(function(d) {
    if (d.dcSupply && d.dcSupply.indexOf('整体缺货') >= 0 && d.rdcTransitTotal <= 0) return;
    rdcKeys.forEach(function(rdcName, idx) {
      var rdcKey = rdcNames[idx];
      var shortVal = d[rdcKey] || 0;
      if (shortVal <= 0) return;
      var dmKey = d.materialCode + '|' + rdcName;
      var dm = dmMap[dmKey] || { total: 0, fulfill: 0 };
      var dailyAvg = dm.total > 0 ? dm.total / analysisDaysExp : 0;
      var fulfillRate = dm.total > 0 ? dm.fulfill / dm.total : 0;
      var suggestQty = Math.max(0, Math.round(dailyAvg * 4 - (d.dcStock||0) - (d.rdcTransitTotal||0)));
      var reasonKey = d.dateStr + '|' + d.materialCode + '|' + rdcName;
      var reason = shortageReasons[reasonKey] || '';
      var advice = reason ? (reason.indexOf('总仓缺货')>=0?'需总仓协调':reason.indexOf('KA库')>=0?'协调KA库':reason.indexOf('效期')>=0?'调拨替代批次':'待确认') : '待确认原因';
      var abcCoeff = d.abcClass==='A'?1.0:d.abcClass==='B'?0.6:0.3;
      var score = Math.round(((1-fulfillRate)*0.25 + abcCoeff*0.15 + (shortVal/(shortVal+100))*0.35)*100);
      var status = (window._replStatus||{})[d.materialCode+'|'+rdcName] ? '已处理' : '待处理';
      csv += score + ',' + d.materialCode + ',"' + (d.materialName||'').replace(/"/g,'""') + '",' + d.brand + ',' + (d.abcClass||'C') + ',' + rdcName + ',' + shortVal + ',' + Math.round(dailyAvg) + ',' + (fulfillRate*100).toFixed(1) + '%,' + suggestQty + ',"' + reason + '","' + advice + '",' + (score>=70?'紧急':score>=40?'重要':'关注') + ',' + status + '\n';
    });
  });
  downloadFile('补货建议_' + latestDate + '.csv', csv);
}

// RDC multi-select helpers for inventory turnover page
function getInvRdcSelection() {
  const inv = dataStore.inventoryTurnover;
  if (!inv || !inv.rdcOrder) return { isAll: true, rawSelected: [], selected: [] };
  const raw = window._invRdc || [];
  const rawSelected = raw.filter(function(x){ return inv.rdcOrder.indexOf(x) >= 0; });
  // isAll 仅当用户显式选中全部 RDC 时为 true
  const isAll = rawSelected.length === inv.rdcOrder.length && rawSelected.length > 0;
  // 数据计算兜底：用户未选任何 RDC 时仍按全量计算，避免页面空白
  const selected = rawSelected.length === 0 ? inv.rdcOrder.slice() : rawSelected;
  return { isAll: isAll, rawSelected: rawSelected, selected: selected };
}
function toggleInvRdc(rdc, checked) {
  const inv = dataStore.inventoryTurnover;
  if (!inv || !inv.rdcOrder) return;
  var arr = (window._invRdc || []).filter(function(x){ return inv.rdcOrder.indexOf(x) >= 0; });
  if (checked) { if (arr.indexOf(rdc) < 0) arr.push(rdc); }
  else arr = arr.filter(function(x){ return x !== rdc; });
  // 取消最后一个时保持空数组（不自动恢复全选），UI 上所有 specific RDC 不勾；数据层面仍兜底为全量
  window._invRdc = arr;
  renderInventoryTurnover();
}
function toggleInvRdcAll(checked) {
  const inv = dataStore.inventoryTurnover;
  if (!inv || !inv.rdcOrder) return;
  window._invRdc = checked ? inv.rdcOrder.slice() : [];
  renderInventoryTurnover();
}

// ===== 库存金额（7月新模板「库存金额」sheet）辅助 =====
// window._invHainan: 'all'|'yes'|'no'（沿用）；window._invStatus: 'all'|'非风险库存'
function getAmountTrendBlocksByStatus(status) {
  const inv = dataStore.inventory;
  if (!inv || !inv.amountTrendBlocks) return null;
  const statusKey = status === '非风险库存' ? '非风险库存' : '(全部)';
  let allBlock = null, noBlock = null;
  (inv.amountTrendBlocks || []).forEach(b => {
    if (b.status !== statusKey) return;
    if (b.hainan === '(全部)') allBlock = b;
    else if (b.hainan === '否') noBlock = b;
  });
  return { allBlock: allBlock, noBlock: noBlock };
}
// 返回该 RDC×年×月的库存金额(元)，按 window._invHainan + window._invStatus 筛选；无数据返回 null
function amountAt(rdc, year, month) {
  const hainan = window._invHainan || 'all';
  const status = window._invStatus || 'all';
  const pair = getAmountTrendBlocksByStatus(status);
  if (!pair) return null;
  const rdcKey = String(rdc).replace('RDC', '仓');
  function v(block) {
    return (block && block.byYear[year] && block.byYear[year][month] && block.byYear[year][month][rdcKey]) || 0;
  }
  const allAmt = v(pair.allBlock), noAmt = v(pair.noBlock);
  if (hainan === 'no') return noAmt;
  if (hainan === 'yes') return Math.max(0, allAmt - noAmt);
  return allAmt;
}
// 7个RDC 在某年某月的库存金额（元），可选 RDC 过滤
function amountAtRdcs(year, month, rdcs) {
  const list = rdcs || ['东北RDC','华北RDC','华东RDC','华南RDC','华中RDC','西北RDC','西南RDC'];
  let sum = 0;
  list.forEach(r => { const a = amountAt(r, year, month); if (a != null) sum += a; });
  return sum;
}
