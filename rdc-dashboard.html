function renderPlanMonitor() {
  setTitle('分仓计划监控');
  const page = document.getElementById('page-plan-monitor');
  const inv = dataStore.inventory || {};
  const covSource = inv.cov7 ? 'cov7' : (inv.cov6 ? 'cov6' : 'cov5');
  const cov7 = inv[covSource] || [];
  const orders = dataStore.orderDetail || [];
  if (!cov7.length || !orders.length) {
    page.innerHTML = '<div style="text-align:center;padding:80px;color:var(--text-secondary)"><div style="font-size:48px;margin-bottom:16px">📊</div><div style="font-size:var(--font-size-lg)">暂无数据</div><div style="font-size:12px;margin-top:8px">需含「7月库存覆盖数据」(cov7) 与订单明细</div></div>';
    return;
  }
  const rdcFilter = window._planRdc || 'all';
  window._planRdc = rdcFilter;
  const hainan = window._invHainan || 'all';
  window._invHainan = hainan; // 反写回全局，规避跨页面状态被误初始化
  // === 覆盖周数分类：剔除促销装/新品期（这两类不是按需求补货的）===
  // 数据来源：7月库存覆盖数据 col28「覆盖周数分类」(cov7[i].coverageLevel)
  //  - 促销装：139 行 cov08 都为 0，已被 plan<=0 自动过滤
  //  - 新品期：20 行 cov08=11100，需主动剔除（否则会拉低完成率）
  const _isPromoOrNew = function(cat){ return cat === '促销装' || cat === '新品期'; };
  const _excludedSkuSet = {};
  cov7.forEach(function(d){ if (d && d.sku && _isPromoOrNew(d.coverageLevel)) _excludedSkuSet[d.sku] = true; });
  // v116: 根因门控所需的「缺货报告真实缺货」查找表（按 SKU×RDC），随数据加载始终可用
  // 仅用「缺货箱数>0」与「大仓供应状态」两字段，不依赖 window._shortageReasons（后者需先开缺货页才有值，首次进计划监控会空→误判）
  // 失败安全：cov7.sku 与 shortage.materialCode 若不匹配，查找结果为 undefined → 保守判为"无真实缺货"→下调/暂停，绝不盲加
  const _rdcKeyMap = { '华南RDC':'huananShort','华北RDC':'huabeiShort','东北RDC':'dongbeiShort','西北RDC':'xibeiShort','华中RDC':'huazhongShort','西南RDC':'xinanShort' };
  const _rdcKeys = Object.keys(_rdcKeyMap);
  const _hasShortageData = !!(dataStore.shortage && dataStore.shortage.length);
  const _shortageMap = {};
  if (_hasShortageData) {
    const _sd = dataStore.shortage;
    const _sdDates = _sd.map(function(x){ return x.dateStr; }).filter(Boolean).sort();
    const _sdLatest = _sdDates[_sdDates.length - 1];
    _sd.forEach(function(r){
      if (r.dateStr !== _sdLatest) return;
      const _mc = r.materialCode;
      if (!_mc) return;
      _rdcKeys.forEach(function(rdcName){
        const _v = r[_rdcKeyMap[rdcName]] || 0;
        if (_v > 0) _shortageMap[_mc + '|' + rdcName] = { boxes: _v, dcSupply: r.dcSupply || '' };
      });
    });
  }
  const cfg = getCovMonthConfig(covSource);
  // v165: 目标月可切换（之前写死 cfg.fields[0]，无法查看其他月份）
  const _planMonthIdx = Math.min(Math.max(0, parseInt(window._planMonthIdx, 10) || 0), cfg.fields.length - 1);
  window._planMonthIdx = _planMonthIdx;
  const targetField = cfg.fields[_planMonthIdx];
  const COV_TO_YM = { cov06:'2026-06', cov07:'2026-07', cov08:'2026-08', cov09:'2026-09', cov10:'2026-10', cov11:'2026-11', cov12:'2026-12', cov13:'2027-01' };
  const targetMonth = COV_TO_YM[targetField] || '2026-08';
  const targetLabel = cfg.labels[_planMonthIdx];
  const now = new Date();
  const ym = targetMonth.split('-');
  const daysInMonth = new Date(+ym[0], +ym[1], 0).getDate();
  // v165: 时间进度按「目标月」算，不是「今天」——
  //   之前 dayOfMonth = now.getDate()，查看 8 月（已完整过去）时显示 1/31=3.2%（因为今天 9/1），
  //   与同页 KPI/矩阵 的 8 月口径冲突（用户反馈"一块是 8 月，一块已进入 9 月"）
  //   目标月已过完 → 100%；目标月是当月 → 已过天数/总天数；目标月未到 → 0%
  const nowYM = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  let dayOfMonth;
  if (targetMonth === nowYM) {
    dayOfMonth = Math.min(now.getDate(), daysInMonth);   // 当月：已过天数
  } else if (targetMonth < nowYM) {
    dayOfMonth = daysInMonth;                             // 已过完的月份：100%
  } else {
    dayOfMonth = 0;                                       // 未来月份：未开始 0%
  }
  const monthElapsed = dayOfMonth / daysInMonth;
  const viewMode = window._planView || 'month';
  window._planView = viewMode;

  function isH(sku) { return !!(sku && window._skuIsHainan && window._skuIsHainan[sku]); } // v113: 用 window._skuIsHainan 而非局部 const（之前因 TDZ 永远 false，导致"不含海南花露水"开关失效 + 品牌矩阵累计被 return 跳过 → 全部 100%）

  // 出货口径 = 订单口径：orderQty（订单支数），有订单即计入，不等实际出库
  // 聚合：SKU×RDC（明细用），品牌×RDC（矩阵用），按日×RDC（曲线用）
  const shipMap = {};       // sku|rdc -> orderQty
  const skuRdcBrand = {};   // sku|rdc -> brand（兜底来自订单行）
  const brandRdcOrder = {}; // brand -> rdc -> orderQty
  const dayOrderByRdc = {}; // rdc -> day -> orderQty 当日
  const brandRdcPlan = {};  // brand -> rdc -> planQty
  const skuRdcPlan = {};    // sku|rdc -> planQty（兜底来自 cov）
  const RDCS = [];
  orders.forEach(function(d) {
    if (!d.dateStr || d.dateStr.indexOf(targetMonth) !== 0) return;
    if (hainan === 'yes' && !isH(d.skuCode)) return;
    if (hainan === 'no' && isH(d.skuCode)) return;
    if (_excludedSkuSet[d.skuCode]) return; // 剔除促销装/新品期 SKU（与分母口径一致）
    const rdc = normalizeRdcName(d.warehouse);
    if (rdcFilter !== 'all' && rdc !== rdcFilter) return;
    const sku = d.skuCode || '';
    const key = sku + '|' + rdc;
    const q = d.orderQty || 0;
    shipMap[key] = (shipMap[key] || 0) + q;
    const br = d.brand || '';
    if (br) skuRdcBrand[key] = br;
    if (br) {
      if (!brandRdcOrder[br]) brandRdcOrder[br] = {};
      brandRdcOrder[br][rdc] = (brandRdcOrder[br][rdc] || 0) + q;
    }
    const day = Number(d.dateStr.slice(8, 10));
    if (!isNaN(day) && day >= 1 && day <= daysInMonth) {
      if (!dayOrderByRdc[rdc]) dayOrderByRdc[rdc] = {};
      dayOrderByRdc[rdc][day] = (dayOrderByRdc[rdc][day] || 0) + q;
    }
    if (RDCS.indexOf(rdc) === -1) RDCS.push(rdc);
  });

  // 计算偏差
  const rows = [];
  cov7.forEach(function(d) {
    const plan = d[targetField] || 0;
    if (plan <= 0) return;
    if (_isPromoOrNew(d.coverageLevel)) return; // 剔除促销装/新品期（不是按需求补货）
    if (hainan === 'yes' && !isH(d.sku)) return;
    if (_isPromoOrNew(d.coverageLevel)) return; // v111: 剔除促销装/新品期（与第一处口径一致）
    if (hainan === 'no' && isH(d.sku)) return;
    const rdc = d.rdc;
    if (rdcFilter !== 'all' && rdc !== rdcFilter) return;
    const key = (d.sku || '') + '|' + rdc;
    const shipped = shipMap[key] || 0;
    const comp = plan > 0 ? shipped / plan : 0;
    const forecast = monthElapsed > 0 ? Math.min(comp / monthElapsed, 3) : 0;
    let status, advice;
    // v115: advice 判定只看完成率，不再分「有/无库存」第二维度
    // 原因：availQtyPlan 是 cov7（7月底/8月初快照），到今天已过 22 天，无参考意义。
    //   滞后/超额的库存判定口径 v111 已废弃「无库存」KPI 卡，但 advice 判定 v108 没改，今天用户反馈再次踩坑。
    //   慢动品诊断由独立的「慢动品诊断」模块负责（用近 N 个月数据），plan-monitor 不重复。
    if (comp < 0.7) {
      status = '滞后';
      // v116: 根因门控——滞后不再无脑"加大补货"（低销品盲加=呆滞库存）
      if (_hasShortageData) {
        const _sh = _shortageMap[d.sku + '|' + rdc];
        if (_sh && _sh.boxes > 0) {
          // 有真实未满足需求：区分"需求超(超销)"与"供给受约束(总仓缺货/紧张)"
          if (_sh.dcSupply && (_sh.dcSupply.indexOf('缺货') >= 0 || _sh.dcSupply.indexOf('紧张') >= 0)) {
            advice = '协调总仓供给·紧急调拨（非单纯加大RDC）';
          } else {
            advice = '追计划·加大补货（真实缺货，合理）';
          }
        } else {
          advice = '无真实缺货·建议下调计划/暂停加量（防呆滞）'; // v121: "详见慢动品诊断" 后缀延后追加（仅在 _isSlowMover=true 时）
        }
      } else {
        advice = '触发补货建议加大（出货跟不上计划）'; // 无缺货报告时的保守回退，避免误判
      }
    } else if (comp > 1.1) {
      status = '超额';
      advice = '下月计划上调 + 提前补货';
    } else {
      status = '正常';
      advice = '保持';
    }
    // v118: 慢动品匹配判定（与「慢动品分析」页共用同一套引擎）。该 SKU×RDC 满足「覆盖≥3月 + 可用库存>0 + 非排除品」则视为慢动品，
    // 即"无真实缺货·防呆滞"建议的"可跳转目的地"——不满足则不显示慢动诊断按钮（避免点空联动）。
    const _isSlowMover = isSlowCoverage(d.coverageLevel) && hasAvailableStock(d) && !isExcludedProduct(d);
    // v121: "详见慢动品诊断" 后缀仅在 SKU×RDC 真正命中慢动品时追加；不命中时 advice 文案保持纯净
    if (_isSlowMover && advice && advice.indexOf('防呆滞') >= 0 && advice.indexOf('详见慢动品诊断') < 0) {
      advice += '·详见慢动品诊断';
    }
    rows.push({ sku:d.sku, skuName:d.skuName, brand:d.brand, rdc:rdc, plan:plan, shipped:shipped, comp:comp, forecast:forecast, status:status, advice:advice, isSlowMover:_isSlowMover, diag:_isSlowMover ? (window._slowDiagMap && window._slowDiagMap[rdc+'|'+d.sku]) || null : null });
  });
  // 兜底品牌（RDC 列、累计按日）
  cov7.forEach(function(d){
    if (hainan === 'yes' && !isH(d.sku)) return;
    if (hainan === 'no' && isH(d.sku)) return; // v129: 修复兜底循环条件写反（之前是 !isH，导致「不含花露水」时所有非花露水 SKU 被 return → brandRdcPlan 累加为空 → 品牌×RDC 矩阵所有非花露水品牌全显示 100%）
    const plan = d[targetField] || 0;
    const br = d.brand || '';
    if (br && plan > 0) {
      if (!brandRdcPlan[br]) brandRdcPlan[br] = {};
      brandRdcPlan[br][d.rdc] = (brandRdcPlan[br][d.rdc] || 0) + plan;
    }
    const key = (d.sku||'') + '|' + d.rdc;
    if (!skuRdcBrand[key] && br) skuRdcBrand[key] = br;
    skuRdcPlan[key] = (skuRdcPlan[key] || 0) + plan;
    if (RDCS.indexOf(d.rdc) === -1 && (!rdcFilter || rdcFilter === 'all' || rdcFilter === d.rdc)) RDCS.push(d.rdc);
  });
  // 累计按日：rdc -> [day1累计, day2累计, ...]
  const cumByDayByRdc = {};
  RDCS.forEach(function(rdc){
    cumByDayByRdc[rdc] = [];
    let acc = 0;
    for (let d = 1; d <= dayOfMonth; d++) {
      acc += (dayOrderByRdc[rdc] && dayOrderByRdc[rdc][d]) || 0;
      cumByDayByRdc[rdc].push(acc);
    }
  });
  rows.sort(function(a, b) { return a.comp - b.comp; });
  window._planMonitorRows = rows;

  // KPI
  const totalPlan = rows.reduce(function(s, r) { return s + r.plan; }, 0);
  const totalShipped = rows.reduce(function(s, r) { return s + r.shipped; }, 0);
  const overall = totalPlan > 0 ? totalShipped / totalPlan * 100 : 0;
  const overCnt = rows.filter(function(r) { return r.status === '超额'; }).length;
  const lagCnt = rows.filter(function(r) { return r.status === '滞后'; }).length;
  const addCnt = rows.filter(function(r) { return r.status === '滞后' && r.avail <= 0; }).length;
  // v113: 把 normalCnt 提前到 KPI 渲染之前（顶部 KPI 需用到"正常"分类）
  const totalSkuPlannedKpi = rows.length;
  const normalCnt = Math.max(0, totalSkuPlannedKpi - overCnt - lagCnt);

  // RDC 汇总
  const rdcMap = {};
  rows.forEach(function(r) { if (!rdcMap[r.rdc]) rdcMap[r.rdc] = { plan:0, shipped:0 }; rdcMap[r.rdc].plan += r.plan; rdcMap[r.rdc].shipped += r.shipped; });
  const rdcList = Object.keys(rdcMap).sort();

  // 筛选下拉
  const allRdcs = [...new Set(cov7.map(function(d){ return d.rdc; }).filter(Boolean))].sort();

  let html = '';
  html += '<div style="display:flex;flex-wrap:wrap;gap:12px;padding:16px 20px;background:var(--bg-card);border-radius:12px;margin-bottom:16px;align-items:center">';
  html += '<span style="font-size:13px;font-weight:600;color:var(--text-primary)">📊 分仓计划监控</span>';
  // v165: 月份下拉框——切换后整个页面（时间进度/完成率/品牌矩阵/趋势曲线）口径统一跟随
  html += '<select onchange="window._planMonthIdx=this.value;renderPlanMonitor()" style="padding:6px 10px;border:1px solid var(--border-card);border-radius:6px;font-size:12px;font-weight:600" title="切换目标月：整个页面所有进度（时间进度、完成率、品牌矩阵、趋势曲线）统一切换到该月">' + cfg.fields.map(function(f, i){ return '<option value="'+i+'"'+(String(_planMonthIdx)===String(i)?' selected':'')+'>'+cfg.labels[i]+'</option>'; }).join('') + '</select>';
  html += '<span style="font-size:11px;color:var(--text-secondary)">目标月：'+targetLabel+'（'+targetMonth+'）｜计划口径：'+covSource.toUpperCase()+' 覆盖表 '+targetLabel+' 需求（支）</span>';
  html += '<select onchange="window._planRdc=this.value;renderPlanMonitor()" style="padding:6px 10px;border:1px solid var(--border-card);border-radius:6px;font-size:12px"><option value="all"'+(rdcFilter==='all'?' selected':'')+'>全部RDC</option>'+allRdcs.map(function(r){return '<option value="'+r+'"'+(rdcFilter===r?' selected':'')+'>'+r+'</option>';}).join('')+'</select>';
  html += '<select onchange="window._invHainan=this.value;renderPlanMonitor()" style="padding:6px 10px;border:1px solid var(--border-card);border-radius:6px;font-size:12px"><option value="all"'+(hainan==='all'?' selected':'')+'>全部</option><option value="yes"'+(hainan==='yes'?' selected':'')+'>仅海南花露水</option><option value="no"'+(hainan==='no'?' selected':'')+'>不含海南花露水</option></select>';
  html += '<span style="font-size:11px;color:var(--text-secondary);margin-left:auto">完成率=当月订单量(支)/分仓计划(支)；全月预测=完成率÷已过天数占比</span>';
  html += '</div>';

function exportPlanMonitor() {
  const rows = window._planMonitorRows || [];
  if (!rows.length) { showToast('无数据', true); return; }
  let csv = '\uFEFFSKU,名称,品牌,RDC,计划(支),订单量(支),完成率(%),全月预测(%),状态,建议\n';
  rows.forEach(function(r) {
    csv += [r.sku, (r.skuName||'').replace(/,/g,'，'), r.brand||'', r.rdc, r.plan, r.shipped, (r.comp*100).toFixed(1), (r.forecast*100).toFixed(1), r.status, r.advice].join(',') + '\n';
  });
  downloadFile('分仓计划监控_' + (window._planRdc||'全部RDC') + '_' + new Date().toISOString().slice(0,10) + '.csv', csv);
}

function renderBizDemand(targetId) {
  setTitle('需求满足分析');
  const page = document.getElementById(targetId || 'page-biz-demand');
  if (!dataStore.loaded || !dataStore.bizDemand || dataStore.bizDemand.length === 0) {
    page.innerHTML = '<div style="text-align:center;padding:80px;color:var(--text-secondary)"><div style="font-size:48px;margin-bottom:16px">📋</div><div style="font-size:var(--font-size-lg)">暂无业务需求数据</div><div style="font-size:12px;margin-top:8px">请确保导入的Excel包含「业务需求满足情况」Sheet</div></div>';
    return;
  }

  const f = window._bizDemandFilters;
  const summary = getBizDemandSummary(f);

  // 收集筛选选项
  const months = [...new Set((dataStore.bizDemand||[]).map(d=>d.dateStr?d.dateStr.slice(0,7):'').filter(Boolean))].sort().reverse();
  const rdcs = [...new Set((dataStore.bizDemand||[]).map(d=>normalizeRdcName(d.rdc)).filter(Boolean))].sort();

  // 全局统计
  const totalDemand = summary.reduce((s,r)=>s+r.demand,0);
  const totalShipped = summary.reduce((s,r)=>s+r.shipped,0);
  const avgProgress = totalDemand > 0 ? (totalShipped/totalDemand*100) : 0;

  let html = '';

  // ===== 筛选区 =====
  html += '<div style="display:flex;flex-wrap:wrap;gap:12px;padding:16px 20px;background:var(--bg-card);border-radius:12px;margin-bottom:16px;align-items:center">';
  html += '<span style="font-size:13px;font-weight:600;color:var(--text-primary)">📋 需求满足分析</span>';
  html += '<select id="bd-month-filter" onchange="window._bizDemandFilters.month=this.value;renderBizDemand()" style="padding:6px 10px;border:1px solid var(--border-card);border-radius:6px;font-size:12px"><option value="all"'+(f.month==='all'?' selected':'')+'>全部月份</option>' + months.map(m=>'<option value="'+m+'"'+(f.month===m?' selected':'')+'>'+m+'</option>').join('') + '</select>';
  html += '<select id="bd-rdc-filter" onchange="window._bizDemandFilters.rdc=this.value;renderBizDemand()" style="padding:6px 10px;border:1px solid var(--border-card);border-radius:6px;font-size:12px"><option value="all"'+(f.rdc==='all'?' selected':'')+'>全部RDC</option>' + rdcs.map(r=>'<option value="'+r+'"'+(f.rdc===r?' selected':'')+'>'+r+'</option>').join('') + '</select>';
  html += '<select id="bd-channel-filter" onchange="window._bizDemandFilters.channel=this.value;renderBizDemand()" style="padding:6px 10px;border:1px solid var(--border-card);border-radius:6px;font-size:12px"><option value="all"'+(f.channel==='all'?' selected':'')+'>全部渠道</option><option value="经销商"'+(f.channel==='经销商'?' selected':'')+'>经销商</option><option value="KA"'+(f.channel==='KA'?' selected':'')+'>KA</option><option value="新通路"'+(f.channel==='新通路'?' selected':'')+'>新通路</option></select>';
  html += '<span style="font-size:11px;color:var(--text-secondary);margin-left:auto" title="仅统计 SAP放行日期 晚于该SKU最早补货日期 的出货，且不晚于次月15日">共 ' + summary.length + ' 条记录 · 出货窗口：补货日期次日 ~ 次月15日（仅计提报后出货）</span>';
  html += '</div>';

  // ===== KPI 卡片 =====
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px">';
  html += '<div class="kpi-card blue"><div class="kpi-label">总业务提报量</div><div class="kpi-value">' + formatNum(totalDemand) + '</div></div>';
  html += '<div class="kpi-card green"><div class="kpi-label">总实际出货量</div><div class="kpi-value">' + formatNum(totalShipped) + '</div></div>';
  html += '<div class="kpi-card orange"><div class="kpi-label">整体出货进度</div><div class="kpi-value">' + avgProgress.toFixed(1) + '<span class="kpi-unit">%</span></div></div>';
  html += '</div>';

  // ===== 图表 =====
  html += '<div style="margin-bottom:16px">';

  // 图表: 各渠道出货进度（按百分比，便于小渠道均衡展示）
  html += '<div class="card"><div class="card-header"><span class="card-title">各渠道出货进度（%）</span></div><div id="bd-chart-compare" style="height:360px"></div></div>';
  html += '</div>';

  // ===== 汇总对比表 =====
  html += '<div class="card" style="margin-bottom:16px">';
  html += '<div class="card-header" style="display:flex;justify-content:space-between;align-items:center"><span class="card-title">业务提报 vs 实际出货对比表</span>';
  html += '<button class="btn-export" onclick="exportBizDemandTable()">导出CSV</button></div>';

  html += '<div style="overflow-x:auto"><table class="data-table"><thead><tr>';
  html += '<th style="position:sticky;left:0;background:inherit;z-index:1">月份</th><th>RDC</th><th>渠道</th><th class="num">提报量</th><th class="num">出货量</th><th class="num">出货进度</th><th class="num">SKU数</th><th style="cursor:pointer" onclick="navigateToBizDemandDetail()" title="点击查看所有SKU明细">操作</th>';
  html += '</tr></thead><tbody>';

  if (summary.length === 0) {
    html += '<tr><td colspan="8" style="text-align:center;color:var(--text-secondary);padding:30px">当前筛选条件下无数据</td></tr>';
  } else {
    summary.forEach(row => {
      const progressColor = row.progress >= 95 ? 'var(--color-green)' : row.progress >= 70 ? 'var(--color-orange)' : 'var(--color-red)';
      html += '<tr>';
      html += '<td style="position:sticky;left:0;background:inherit">' + row.month + '</td>';
      html += '<td>' + row.rdc + '</td>';
      html += '<td><span class="badge ' + (row.channel==='经销商'?'badge-blue':row.channel==='KA'?'badge-purple':'badge-teal') + '">' + row.channel + '</span></td>';
      html += '<td class="num">' + formatNum(row.demand) + '</td>';
      html += '<td class="num">' + formatNum(row.shipped) + '</td>';
      html += '<td class="num"><span style="color:' + progressColor + ';font-weight:600">' + row.progress.toFixed(1) + '%</span></td>';
      html += '<td class="num">' + row.skuCount + '</td>';
      html += '<td><button class="btn-export" style="padding:2px 8px;font-size:11px" onclick="navigateToBizDemandDetail(\''+row.month+'\',\''+row.rdc+'\',\''+row.channel+'\')">下钻SKU</button></td>';
      html += '</tr>';
    });
  }
  html += '</tbody></table></div></div>';

  page.innerHTML = html;

  // ===== 渲染ECharts图表：各渠道出货进度% =====
  const compareChart = echarts.init(document.getElementById('bd-chart-compare'));
  const chartMonths = [...new Set(summary.map(r=>r.month))].sort().reverse();
  const chOrderList = ['经销商','KA','新通路'];
  const filteredChannels = f.channel === 'all' ? chOrderList : [f.channel];

  const progressSeries = filteredChannels.map((ch, idx) => {
    const color = ch==='经销商' ? '#3B82F6' : ch==='KA' ? '#8B5CF6' : '#14B8A6';
    return {
      name: ch,
      type: 'bar',
      barMaxWidth: 32,
      barMinWidth: 12,
      data: chartMonths.map(m => {
        const rows = summary.filter(r=>r.month===m && r.channel===ch);
        const d = rows.reduce((s,r)=>s+r.demand,0);
        const s = rows.reduce((s,r)=>s+r.shipped,0);
        return d > 0 ? +(s/d*100).toFixed(1) : 0;
      }),
      itemStyle: { color: color },
      label: { show: true, position: 'top', formatter: '{c}%', fontSize: 10 }
    };
  });

  compareChart.setOption({
    tooltip: { trigger: 'axis', formatter: function(p) {
      let res = p[0].axisValue + '<br/>';
      p.forEach(item => {
        if (item.value) res += item.marker + ' ' + item.seriesName + '：' + item.value + '%<br/>';
      });
      return res;
    }},
    legend: { bottom: 0, textStyle: { fontSize: 11 } },
    grid: { top: 30, left: 10, right: 10, bottom: 40, containLabel: true },
    xAxis: { type: 'category', data: chartMonths, axisLabel: { fontSize: 11 } },
    yAxis: { type: 'value', name: '进度%', max: v => Math.min(Math.ceil(v.max/50)*50, 2500) || 100, axisLabel: { formatter: '{value}%', fontSize: 11 } },
    series: progressSeries,
    animation: true
  });

  // 注册图表到resize列表
  window._chartInstances = window._chartInstances || [];
  window._chartInstances.push(compareChart);

  setTimeout(() => { compareChart.resize(); }, 100);
}

/**
 * 业务需求满足分析 — SKU明细独立页面（提报 vs 出货对比）
 */
window._bizDrillPage = 1;
function renderBizDemandDetail() {
  setTitle('需求满足分析 · SKU明细');
  const page = document.getElementById('page-biz-demand-detail');
  const filter = window._bdDetailFilter || { month: 'all', rdc: 'all', channel: 'all' };
  const filterMonth = filter.month || 'all';
  const filterRdc = filter.rdc || 'all';
  const filterCh = filter.channel || 'all';

  if (!dataStore.loaded || !dataStore.bizDemand || dataStore.bizDemand.length === 0) {
    page.innerHTML = '<div style="text-align:center;padding:80px;color:var(--text-secondary)"><div style="font-size:48px;margin-bottom:16px">📋</div><div style="font-size:var(--font-size-lg)">暂无业务需求数据</div></div>';
    return;
  }

  // 收集所有月份（用于出货窗口匹配）
  const sortedMonths = [...new Set((dataStore.bizDemand||[]).map(d=>d.dateStr&&d.dateStr.slice(0,7)).filter(Boolean))].sort();

  // ===== 1. 按SKU×月×RDC聚合提报需求（去重） =====
  const biz = (dataStore.bizDemand || []).filter(d => {
    if (filterMonth !== 'all' && d.dateStr.slice(0,7) !== filterMonth) return false;
    if (filterRdc !== 'all' && normalizeRdcName(d.rdc) !== filterRdc) return false;
    return true;
  });

  const dedupKeys = new Set();
  const skuMap = {}; // key: "month|rdc|opCode" => { dealer, ka, newChannel }

  biz.forEach(d => {
    const m = d.dateStr.slice(0, 7);
    const nrdc = normalizeRdcName(d.rdc);
    const sk = m + '|' + nrdc + '|' + d.opCode;

    // 去重：同月同RDC同SKU同渠道同需求值只计一次
    const dealerVal = d.dealerDemand || 0;
    if (dealerVal > 0) {
      const dk = sk + '|dealer|' + dealerVal;
      if (!dedupKeys.has(dk)) {
        dedupKeys.add(dk);
        if (!skuMap[sk]) skuMap[sk] = { month: m, rdc: nrdc, opCode: d.opCode, productName: d.productName, boxSpec: d.boxSpec, dealerD: 0, kaD: 0, ncD: 0 };
        skuMap[sk].dealerD += dealerVal;
        if (!skuMap[sk].prodName && d.productName) { skuMap[sk].productName = d.productName; skuMap[sk].boxSpec = d.boxSpec; }
      }
    }
    const kaVal = d.kaDemand || 0;
    if (kaVal > 0) {
      const dk = sk + '|ka|' + kaVal;
      if (!dedupKeys.has(dk)) {
        dedupKeys.add(dk);
        if (!skuMap[sk]) skuMap[sk] = { month: m, rdc: nrdc, opCode: d.opCode, productName: d.productName, boxSpec: d.boxSpec, dealerD: 0, kaD: 0, ncD: 0 };
        skuMap[sk].kaD += kaVal;
        if (!skuMap[sk].prodName && d.productName) { skuMap[sk].productName = d.productName; skuMap[sk].boxSpec = d.boxSpec; }
      }
    }
    const ncVal = d.newChannel || 0;
    if (ncVal > 0) {
      const dk = sk + '|newChannel|' + ncVal;
      if (!dedupKeys.has(dk)) {
        dedupKeys.add(dk);
        if (!skuMap[sk]) skuMap[sk] = { month: m, rdc: nrdc, opCode: d.opCode, productName: d.productName, boxSpec: d.boxSpec, dealerD: 0, kaD: 0, ncD: 0 };
        skuMap[sk].ncD += ncVal;
        if (!skuMap[sk].prodName && d.productName) { skuMap[sk].productName = d.productName; skuMap[sk].boxSpec = d.boxSpec; }
      }
    }
  });

  // ===== 2. 按SKU×月×RDC聚合出货（从订单明细） =====
  // 需要map SKU code to name (from bizDemand)
  const skuNameMap = {};
  dataStore.bizDemand.forEach(d => {
    if (d.opCode && d.productName) skuNameMap[d.opCode] = d.productName;
  });

  // 每个 SKU×RDC×月 的最早补货日期（出货计入时间下限）
  const skuSubmitDate = {}; // key: month|rdc|opCode => 最早补货日期(YYYY-MM-DD)
  biz.forEach(d => {
    const m = d.dateStr.slice(0, 7);
    const nrdc = normalizeRdcName(d.rdc);
    const anyDemand = (d.dealerDemand||0) + (d.kaDemand||0) + (d.newChannel||0);
    if (anyDemand <= 0) return;
    const sk = m + '|' + nrdc + '|' + d.opCode;
    if (!skuSubmitDate[sk] || d.dateStr < skuSubmitDate[sk]) skuSubmitDate[sk] = d.dateStr;
  });

  const orders = dataStore.orderDetail || [];
  const shipMap = {}; // key: "month|rdc|opCode|channel" => qty

  orders.forEach(d => {
    if (!d.dateStr || d.dateStr.length < 10 || !d.skuCode) return;
    const orderMonth = d.dateStr.slice(0, 7);
    const ch = mapOrderChannel(d);
    if (ch === '其他') return;

    // 匹配到对应月份的需求窗口（按月份降序，优先归属到自身所在月份）
    for (const mi of sortedMonths.slice().reverse()) {
      const cutoff = getNextMonth15Cutoff(mi);
      if (orderMonth === mi || (orderMonth > mi && d.dateStr <= cutoff)) {
        const mNum = parseInt(mi.split('-')[1]);
        const oNum = parseInt(orderMonth.split('-')[1]);
        if (oNum > mNum + 1) continue;

        // 应用筛选
        if (filterMonth !== 'all' && mi !== filterMonth) { continue; }
        const wrh = normalizeRdcName(d.warehouse || '');
        if (filterRdc !== 'all' && wrh !== filterRdc) { continue; }

        const baseKey = mi + '|' + wrh + '|' + d.skuCode;
        if (skuMap[baseKey]) {
          // 时间下限：仅计入"补货日期之后"（SAP放行日期 严格 > 该SKU最早补货日期）产生的出货
          const submitDate = skuSubmitDate[baseKey];
          if (!submitDate || d.dateStr > submitDate) {
            const sk = baseKey + '|' + ch;
            shipMap[sk] = (shipMap[sk] || 0) + (d.firstDayQty || 0);
          }
        }
        break;
      }
    }
  });

  // ===== 3. 合并成显示行，计算出货进度 =====
  let displayRows = Object.values(skuMap).map(s => {
    const skBase = s.month + '|' + s.rdc + '|' + s.opCode;
    const dealerS = shipMap[skBase + '|经销商'] || 0;
    const kaS = shipMap[skBase + '|KA'] || 0;
    const ncS = shipMap[skBase + '|新通路'] || 0;
    const totalD = s.dealerD + s.kaD + s.ncD;
    const totalS = dealerS + kaS + ncS;
    const progress = totalD > 0 ? (totalS / totalD * 100) : 0;
    return { ...s, dealerS, kaS, ncS, totalD, totalS, progress };
  });

  // 如果指定了渠道，只保留该渠道有需求的SKU，并按该渠道需求降序排列
  if (filterCh !== 'all') {
    const getVal = r => filterCh==='经销商' ? r.dealerD : filterCh==='KA' ? r.kaD : r.ncD;
    displayRows = displayRows.filter(r => getVal(r) > 0);
    displayRows.sort((a,b) => getVal(b) - getVal(a));
  } else {
    displayRows.sort((a,b) => b.totalD - a.totalD);
  }

  // 保存到全局，供导出使用
  window._bizDrillRows = displayRows;

  // 分页
  const pageSize = 20;
  const totalPages = Math.max(1, Math.ceil(displayRows.length / pageSize));
  let p = window._bizDrillPage || 1;
  if (p > totalPages) p = totalPages;
  window._bizDrillPage = p;
  const startIdx = (p - 1) * pageSize;
  const pageData = displayRows.slice(startIdx, startIdx + pageSize);

  const titleText = (filterMonth==='全部'?'全部月份':filterMonth) + ' · ' + (filterRdc==='全部'?'全部RDC':filterRdc) + (filterCh&&filterCh!=='all'?' · '+filterCh:'');

  let html = '';
  html += '<div style="padding:16px 20px;background:var(--bg-card);border-radius:12px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">';
  html += '<button class="btn-export" onclick="navigateTo(\'biz-demand\')" style="display:flex;align-items:center;gap:4px">← 返回需求满足分析</button>';
  html += '<span style="font-size:14px;font-weight:600;color:var(--text-primary)">SKU明细 — ' + titleText + '</span>';
  html += '<button class="btn-export" onclick="exportBizDemandDetail()">导出CSV</button>';
  html += '<span style="font-size:11px;color:var(--text-secondary);margin-left:auto">共 ' + displayRows.length + ' 条SKU · 需求已去重（同SKU同渠道同数量重复提报只计一次） · 出货窗口：当月至次月15日</span>';
  html += '</div>';

  html += '<div class="card"><div style="overflow-x:auto"><table class="data-table"><thead><tr style="background:var(--bg-primary)">';
  html += '<th rowspan="2" style="vertical-align:middle">月份</th><th rowspan="2" style="vertical-align:middle">RDC</th><th rowspan="2" style="vertical-align:middle">产品编码</th><th rowspan="2" style="vertical-align:middle">产品名称</th><th rowspan="2" style="vertical-align:middle">箱规</th>';
  html += '<th colspan="3" style="text-align:center;background:#DBEAFE">📋 业务提报</th>';
  html += '<th colspan="3" style="text-align:center;background:#DCFCE7">📦 实际出货</th>';
  html += '<th rowspan="2" class="num" style="vertical-align:middle">出货进度</th>';
  html += '</tr><tr style="background:var(--bg-primary)">';
  html += '<th class="num" style="color:#3B82F6">经销商</th><th class="num" style="color:#8B5CF6">KA</th><th class="num" style="color:#14B8A6">新通路</th>';
  html += '<th class="num" style="color:#059669">经销商</th><th class="num" style="color:#7C3AED">KA</th><th class="num" style="color:#0D9488">新通路</th>';
  html += '</tr></thead><tbody>';

  if (pageData.length === 0) {
    html += '<tr><td colspan="12" style="text-align:center;padding:30px;color:var(--text-secondary)">无数据</td></tr>';
  } else {
    pageData.forEach(d => {
      const progressColor = d.progress >= 95 ? 'var(--color-green)' : d.progress >= 70 ? 'var(--color-orange)' : 'var(--color-red)';
      html += '<tr>';
      html += '<td>' + d.month + '</td><td>' + d.rdc + '</td><td>' + d.opCode + '</td>';
      html += '<td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + d.productName + '">' + d.productName + '</td>';
      html += '<td>' + d.boxSpec + '</td>';
      html += '<td class="num" style="color:#3B82F6;font-weight:600">' + (d.dealerD>0?formatNum(d.dealerD):'-') + '</td>';
      html += '<td class="num" style="color:#8B5CF6;font-weight:600">' + (d.kaD>0?formatNum(d.kaD):'-') + '</td>';
      html += '<td class="num" style="color:#14B8A6;font-weight:600">' + (d.ncD>0?formatNum(d.ncD):'-') + '</td>';
      html += '<td class="num">' + (d.dealerS>0?formatNum(d.dealerS):'-') + '</td>';
      html += '<td class="num">' + (d.kaS>0?formatNum(d.kaS):'-') + '</td>';
      html += '<td class="num">' + (d.ncS>0?formatNum(d.ncS):'-') + '</td>';
      html += '<td class="num"><span style="color:' + progressColor + ';font-weight:600">' + d.progress.toFixed(1) + '%</span></td>';
      html += '</tr>';
    });
  }
  html += '</tbody></table></div>';

  html += '<div style="display:flex;justify-content:center;gap:8px;padding:12px 0;align-items:center">' +
    '<button class="btn-export" style="padding:4px 12px;font-size:12px" onclick="window._bizDrillPage=Math.max(1,window._bizDrillPage-1);renderBizDemandDetail()" ' + (p<=1?'disabled':'') + '>上一页</button>' +
    '<span style="font-size:12px">第' + p + '/' + totalPages + '页（共' + displayRows.length + '条）</span>' +
    '<button class="btn-export" style="padding:4px 12px;font-size:12px" onclick="window._bizDrillPage=Math.min('+totalPages+',window._bizDrillPage+1);renderBizDemandDetail()" ' + (p>=totalPages?'disabled':'') + '>下一页</button>' +
    '</div></div>';

  page.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', init);
window.addEventListener('resize', resizeAllCharts);
</script>
</body>
</html>
