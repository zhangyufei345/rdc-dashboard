  const isForecast = (_tab === 'forecast');
  const tabStyle = (active) => active ? 'background:var(--color-blue);color:#fff;' : '';
  const tabBar = '<div style="display:flex;gap:8px;margin-bottom:16px">' +
    '<button class="btn-export" style="font-size:13px;padding:7px 18px;' + tabStyle(!isForecast) + '" onclick="window._invTab=\'turnover\';renderInventoryTurnover()">📊 库存周转分析</button>' +
    '<button class="btn-export" style="font-size:13px;padding:7px 18px;' + tabStyle(isForecast) + '" onclick="window._invTab=\'forecast\';renderInventoryTurnover()">🔮 年末库存预测</button>' +
    '</div>';

  if (isForecast) {
    renderInventoryForecast(page, tabBar);
    return;
  }

  const inv = dataStore.inventoryTurnover;
  if (!inv || !inv.months || !inv.inventoryByRdc || !inv.shipmentCost) {
    page.innerHTML = tabBar + '<div style="text-align:center;padding:80px;color:var(--text-secondary)">暂无库存周转数据，请导入包含库存周转Sheet的Excel文件</div>';
    return;
  }

  const months = inv.months;
  const latestIdx = months.length - 1; // 6月
  const prevIdx = months.length - 2;   // 5月

  // Helper
  function getVal(arr, idx) { return (arr && arr.length > idx) ? arr[idx] : null; }
  function fmtPctChange(newVal, oldVal) {
    if (newVal == null || oldVal == null || oldVal === 0) return '';
    const chg = ((newVal - oldVal) / oldVal * 100).toFixed(1);
    const arrow = newVal > oldVal ? '↑' : '↓';
    const color = newVal > oldVal ? '#EF4444' : '#10B981';
    return '<span style="font-size:12px;color:' + color + '">环比 ' + arrow + Math.abs(chg) + '%</span>';
  }

  // RDC multi-select state
  const rdcSel = getInvRdcSelection();
  const selectedRdcs = rdcSel.selected;
  const isAllSelected = rdcSel.isAll;

  // KPI cards - RDC totals (exclude 总部/总仓)
  // 库存金额改用 7月新模板「库存金额」sheet（跟随 window._invHainan + window._invStatus 筛选）
  var rdcTotalInventory = 0, rdcTotalInventoryPrev = 0;
  var rdcTotalShipment = 0, rdcTotalShipmentPrev = 0;
  var _invRdcKeys = Object.keys(inv.inventoryByRdc);
  // 金额最新月：新表仅 2026 1-6月（7月起无金额数据）→ 用 min(latestIdx, 5)
  var amtLatestIdx = Math.min(latestIdx, 5);
  var amtPrevIdx = amtLatestIdx - 1;
  function _findInvBaseArr(rdc) {
    for (var k = 0; k < _invRdcKeys.length; k++) {
      if (_invRdcKeys[k].indexOf(rdc) >= 0 && _invRdcKeys[k].indexOf('总部') < 0 && _invRdcKeys[k].indexOf('共享') < 0) {
        return inv.inventoryByRdc[_invRdcKeys[k]];
      }
    }
    return null;
  }
  function _invAt(rdc, idx) {
    // 新表：idx 0-5 = 2026年1-6月；返回千元
    var amt = amountAt(rdc, '2026', idx + 1);
    return amt == null ? 0 : amt / 1000;
  }
  selectedRdcs.forEach(function(rdc) {
    rdcTotalInventory += _invAt(rdc, amtLatestIdx);
    rdcTotalInventoryPrev += _invAt(rdc, amtPrevIdx);
    // Find shipment cost for this RDC
    var shipKeys = Object.keys(inv.shipmentCost);
    for (var k = 0; k < shipKeys.length; k++) {
      if (shipKeys[k].indexOf(rdc) >= 0 && shipKeys[k].indexOf('总部') < 0 && shipKeys[k].indexOf('共享') < 0) {
        var vals = inv.shipmentCost[shipKeys[k]];
        if (vals) {
          rdcTotalShipment += (vals[latestIdx] || 0);
          rdcTotalShipmentPrev += (vals[prevIdx] || 0);
        }
        break;
      }
    }
  });

  const hqTurnover = getVal(inv.headquarters, latestIdx);
  const hqTurnoverPrev = getVal(inv.headquarters, prevIdx);
  const totalAllTurnover = getVal(inv.totalAllLocation, latestIdx);
  const totalAllTurnoverPrev = getVal(inv.totalAllLocation, prevIdx);
  const totalShared = getVal(inv.totalSharedLocation, latestIdx);
  const totalSharedPrev = getVal(inv.totalSharedLocation, prevIdx);
  const hqInventory = getVal(inv.inventoryByRdc['总部'], latestIdx);
  const hqInventoryPrev = getVal(inv.inventoryByRdc['总部'], prevIdx);
  const hqShipment = getVal(inv.shipmentCost['总部'], latestIdx);
  const hqShipmentPrev = getVal(inv.shipmentCost['总部'], prevIdx);

  // Find fastest/slowest RDC (among selected)
  let minTurn = 9999, maxTurn = 0, minRdc = '', maxRdc = '';
  selectedRdcs.forEach(function(rdc) {
    var rdcName = rdc;
    var vals = inv.allLocation[rdcName];
    if (vals) {
      var v = vals[latestIdx] || 0;
      if (v > 0 && v < minTurn) { minTurn = v; minRdc = rdcName; }
      if (v > maxTurn) { maxTurn = v; maxRdc = rdcName; }
    }
  });

  function fmtNum(n) { return n == null ? '-' : n.toLocaleString(); }

  // Build checkbox HTML for RDC multi-select
  function rdcCheckboxHtml() {
    // 空数组（未做选择）时，UI 上「全部RDC」不勾，specific RDC 也都不勾；
    //   数据层面 getInvRdcSelection() 内部已兜底为全选
    var rawSelected = rdcSel.rawSelected || [];
    var uiAllChecked = isAllSelected && rawSelected.length > 0;
    var allChecked = uiAllChecked ? 'checked' : '';
    var html = '<div class="filter-bar" style="margin-bottom:12px;align-items:flex-start">' +
      '<label style="margin-top:4px;font-size:12px;color:var(--text-secondary)">RDC：</label>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center">' +
      '<label style="font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap">' +
      '<input type="checkbox" value="allRDC" onchange="toggleInvRdcAll(this.checked)" ' + allChecked + '> 全部RDC</label>';
    inv.rdcOrder.forEach(function(r) {
      var checked = (uiAllChecked || rawSelected.indexOf(r) >= 0) ? 'checked' : '';
      html += '<label style="font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap">' +
        '<input type="checkbox" value="' + r + '" onchange="toggleInvRdc(\'' + r + '\', this.checked)" ' + checked + '> ' + r + '</label>';
    });
    html += '</div></div>';
    return html;
  }

  // YTD shipment for formula calculation
  function calcYTD(shipArr, monthIdx) {
    var sum = 0;
    for (var i = 0; i <= monthIdx; i++) sum += (shipArr[i] || 0);
    return sum;
  }

  // YTD sales cost and days for formula example
  var hqYtdShipment = 0;
  var hqShipArr = inv.shipmentCost['总部'];
  for (var i = 0; i <= latestIdx; i++) hqYtdShipment += (hqShipArr && hqShipArr[i]) || 0;
  var ytdDays = (latestIdx + 1) * 30;

  page.innerHTML = tabBar +
    // KPI cards
    '<div class="kpi-row">' +
    '<div class="kpi-card blue"><div class="kpi-label">RDC ' + months[latestIdx] + '全库位周转</div><div class="kpi-value">' + totalAllTurnover + '<span class="kpi-unit">天</span></div><div style="font-size:11px">' + fmtPctChange(totalAllTurnover, totalAllTurnoverPrev) + '</div></div>' +
    '<div class="kpi-card green"><div class="kpi-label">RDC ' + months[latestIdx] + '共享库周转</div><div class="kpi-value">' + totalShared + '<span class="kpi-unit">天</span></div><div style="font-size:11px">' + fmtPctChange(totalShared, totalSharedPrev) + '</div></div>' +
    '<div class="kpi-card purple"><div class="kpi-label">最快/慢RDC</div><div class="kpi-value">' + minTurn + '/' + maxTurn + '<span class="kpi-unit">天</span></div><div style="font-size:11px">' + (minRdc ? '最快' + minRdc + '<br/>最慢' + maxRdc : '') + '</div></div>' +
    '<div class="kpi-card teal"><div class="kpi-label">总仓周转</div><div class="kpi-value">' + hqTurnover + '<span class="kpi-unit">天</span></div><div style="font-size:11px">' + fmtPctChange(hqTurnover, hqTurnoverPrev) + '</div></div>' +
    '</div>' +
    rdcCheckboxHtml() +
    // 周转天数趋势 + 全库位 vs 共享库对比（移到库存金额趋势图之上）
    '<div class="row-2" style="margin-bottom:16px">' +
    '<div class="card"><div class="card-header"><span class="card-title">📈 全库位周转天数趋势</span></div><div class="chart-container" id="chart-inv-turnover-trend"></div></div>' +
    '<div class="card"><div class="card-header"><span class="card-title">📊 全库位 vs 共享库对比</span></div><div class="chart-container" id="chart-inv-compare"></div></div>' +
    '</div>' +
    (renderInventoryTurnoverHistory() || '') +
    // Chart 1: Inventory & Shipment dual-axis
    '<div class="card" style="margin-bottom:16px">' +
    '<div class="card-header"><span class="card-title">🔗 库存与出货联动趋势（双轴图）</span></div>' +
    '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:8px">柱状图=各RDC库存金额 · 折线图=出货成本 · 左轴=库存 · 右轴=出货 · 不含总仓</div>' +
    '<div class="chart-container" style="height:280px" id="chart-inv-dual"></div>' +
    '</div>' +
    // Detail tables
    '<div class="card" style="margin-bottom:16px"><div class="card-header"><span class="card-title">各RDC全库位周转天数（天）</span></div><div class="table-wrap" id="table-inv-turnover"></div></div>' +
    '<div class="card" style="margin-bottom:16px"><div class="card-header"><span class="card-title">库存与出货成本明细（单位：千元）</span></div><div class="table-wrap" id="table-inv-detail"></div></div>' +
    '<div class="card" style="background:#FFF7ED;border-color:#FED7AA"><div class="card-header"><span class="card-title">📐 周转天数公式</span></div><div style="font-size:13px;font-weight:500;color:#92400E;margin-bottom:4px">' + (inv.formula || '周转天数 = 月末存货金额 / YTD销售成本 × YTD天数（每月按30天计）') + '</div>' +
    '<div style="font-size:11px;color:#9A3412">每月按30天计算 · YTD天数 = 累计月份数 × 30 · 数据来源于库存周转Sheet</div>' +
    '<div style="margin-top:6px;padding:6px 10px;background:#FFFBEB;border-radius:6px;font-size:11px;color:#92400E">例（' + months[latestIdx] + '）：总仓周转 ' + hqTurnover + '天 = 月末存货金额' + fmtNum(hqInventory) + ' / YTD销售成本' + fmtNum(hqYtdShipment) + ' × ' + ytdDays + '天</div></div>';

  // ---- Chart 1: Dual-axis (Inventory bar + Shipment line) ----
  // Sum inventory/shipment across selected RDCs (exclude 总仓/总部)
  var invRdcKeys = Object.keys(inv.inventoryByRdc);
  var shipRdcKeys = Object.keys(inv.shipmentCost);

  function findInvArr(rdc) {
    for (var k = 0; k < invRdcKeys.length; k++) {
      if (invRdcKeys[k].indexOf(rdc) >= 0 && invRdcKeys[k].indexOf('总部') < 0 && invRdcKeys[k].indexOf('共享') < 0) {
        var baseArr = inv.inventoryByRdc[invRdcKeys[k]];
        // 按海南花露水筛选：调整每个月的金额
        var hainanFilter = window._invHainan || 'all';
        if (hainanFilter === 'all') return baseArr;
        // 2026 1-6 月（monthIdx 0-5）→ 调用 getHainanAdjustedAmount
        var out = [];
        for (var i = 0; i < baseArr.length; i++) out.push(getHainanAdjustedAmount('2026', rdc, i));
        return out;
      }
    }
    return null;
  }
  function findShipArr(rdc) {
    for (var k = 0; k < shipRdcKeys.length; k++) {
      if (shipRdcKeys[k].indexOf(rdc) >= 0 && shipRdcKeys[k].indexOf('总部') < 0 && shipRdcKeys[k].indexOf('共享') < 0) {
        return inv.shipmentCost[shipRdcKeys[k]];
      }
    }
    return null;
  }

  var dualInvData = months.map(function(_, i) {
    var sum = 0;
    var hasAny = false;
    selectedRdcs.forEach(function(rdc) {
      var a = amountAt(rdc, '2026', i + 1); // 元
      if (a != null) { hasAny = true; sum += a / 1000; } // 千元
    });
    // 7月起新表无金额数据 → 断开折线（null）
    return hasAny ? sum : null;
  });
  var dualShipData = months.map(function(_, i) {
    var sum = 0;
    selectedRdcs.forEach(function(rdc) {
      var arr = findShipArr(rdc);
      sum += (arr && arr[i]) || 0;
    });
    return sum;
  });
  var dualLabels = months;

  const chart1 = initChart('chart-inv-dual');
  chart1.setOption({
    tooltip: { trigger: 'axis', confine: true, textStyle: { fontSize: 11 }, formatter: function(p) { let h = '<strong>' + p[0].axisValue + '</strong>'; p.forEach(s => { if (s.value != null) h += '<br/>' + s.marker + s.seriesName + '：' + (s.value / 100000).toFixed(2) + ' 亿'; }); return h; } },
    legend: { data: ['库存金额','出货成本'], top: 0, left: 'center', itemGap: 20, textStyle: { fontSize: 11 } },
    grid: { left: 60, right: 60, top: 50, bottom: 30 },
    xAxis: { type: 'category', data: months, axisLabel: { fontSize: 11 } },
    yAxis: [
      { type: 'value', name: '库存(亿元)', nameTextStyle: { fontSize: 10 }, axisLabel: { fontSize: 10, formatter: function(v) { return (v/100000).toFixed(2) + ' 亿'; } } },
      { type: 'value', name: '出货(亿元)', nameTextStyle: { fontSize: 10 }, axisLabel: { fontSize: 10, formatter: function(v) { return (v/100000).toFixed(2) + ' 亿'; } } }
    ],
    series: [
      { name: '库存金额', type: 'bar', data: dualInvData, color: '#3B82F6', barWidth: '30%', yAxisIndex: 0, itemStyle: { borderRadius: [4,4,0,0] } },
      { name: '出货成本', type: 'line', data: dualShipData, color: '#F59E0B', yAxisIndex: 1, smooth: true, symbol: 'circle', symbolSize: 8, lineStyle: { width: 2 } }
    ]
  });

  // ---- Chart 2: Turnover days trend ----
  const chart2 = initChart('chart-inv-turnover-trend');
  var trendSeries = [];
  var trendColors = ['#2563EB','#10B981','#F59E0B','#EF4444','#8B5CF6','#14B8A6','#EC4899'];
  selectedRdcs.forEach(function(rdc, idx) {
    var rdcName = rdc;
    var vals = inv.allLocation[rdcName];
    if (vals) {
      trendSeries.push({ name: rdcName, type: 'line', data: vals, smooth: true, symbol: 'none', lineStyle: { width: 2 }, color: trendColors[idx % trendColors.length] });
    }
  });
  chart2.setOption({
    tooltip: { trigger: 'axis', confine: true, textStyle: { fontSize: 11 } },
    legend: { data: trendSeries.map(function(s) { return s.name; }), type: 'scroll', top: 5, left: 10, right: 10, textStyle: { fontSize: 10 } },
    grid: { left: 50, right: 20, top: 45, bottom: 30 },
    xAxis: { type: 'category', data: months, axisLabel: { fontSize: 11 } },
    yAxis: { type: 'value', name: '天', nameTextStyle: { fontSize: 10 }, axisLabel: { fontSize: 10 } },
    series: trendSeries
  });

  // ---- Chart 3: All-location vs Shared-location comparison ----
  const chart3 = initChart('chart-inv-compare');
  var compareLabels = selectedRdcs.map(function(r){ return r.replace('RDC',''); });
  var allVals = [];
  var sharedVals = [];
  selectedRdcs.forEach(function(rdc) {
    var allD = inv.allLocation[rdc];
    allVals.push(allD ? allD[latestIdx] : 0);
    var subD = inv.subLocation[rdc];
    sharedVals.push(subD ? subD[latestIdx] : 0);
  });
  chart3.setOption({
    tooltip: { trigger: 'axis', confine: true, textStyle: { fontSize: 11 } },
    legend: { data: ['全库位','共享仓'], top: 5, left: 10, textStyle: { fontSize: 11 } },
    grid: { left: 50, right: 20, top: 40, bottom: 30 },
    xAxis: { type: 'category', data: compareLabels.map(function(r) { return r + 'RDC'; }), axisLabel: { fontSize: 10, rotate: 15 } },
    yAxis: { type: 'value', name: '天', nameTextStyle: { fontSize: 10 }, axisLabel: { fontSize: 10 } },
    series: [
      { name: '全库位', type: 'bar', data: allVals, color: '#3B82F6', barWidth: '30%',
        label: { show: true, position: 'top', fontSize: 10, color: '#1E40AF', formatter: p => p.value > 0 ? p.value + '天' : '' } },
      { name: '共享仓', type: 'bar', data: sharedVals, color: '#10B981', barWidth: '30%',
        label: { show: true, position: 'top', fontSize: 10, color: '#065F46', formatter: p => p.value > 0 ? p.value + '天' : '' } }
    ]
  });

  // ---- Table 1: Turnover days ----
  var table1Html = '<table class="data-table"><thead><tr><th style="text-align:left">RDC</th>' + months.map(function(m) { return '<th style="text-align:right">' + m + '</th>'; }).join('') + '<th style="text-align:right;color:#10B981">共享库' + months[latestIdx] + '</th></tr></thead><tbody>';
  selectedRdcs.forEach(function(rdc) {
    var rdcName = rdc;
    var allV = inv.allLocation[rdcName] || [];
    var subV = inv.subLocation[rdcName] || [];
    table1Html += '<tr><td>' + rdcName + '</td>';
    for (var i = 0; i < months.length; i++) {
      table1Html += '<td class="num">' + fmtNum(allV[i]) + '</td>';
    }
    table1Html += '<td class="num" style="color:#10B981;font-weight:500">' + fmtNum(subV[latestIdx]) + '</td></tr>';
  });
  // HQ row
  table1Html += '<tr style="background:#F1F5F9;font-weight:500"><td>总仓</td>';
  for (var i = 0; i < months.length; i++) {
    table1Html += '<td class="num">' + fmtNum(getVal(inv.headquarters, i)) + '</td>';
  }
  table1Html += '<td class="num"></td></tr></tbody></table>';
  document.getElementById('table-inv-turnover').innerHTML = table1Html;

  // ---- Table 2: Inventory & Shipment detail ----
  var table2Html = '<table class="data-table"><thead><tr><th>项目</th>' + months.map(function(m) { return '<th style="text-align:right">' + m + '</th>'; }).join('') + '<th style="text-align:right">' + months[latestIdx] + '库占比</th></tr></thead><tbody>';

  // Find 6月 inventory proportion (selected RDCs + 总仓) - 库存金额跟随海南花露水筛选
  var total6mInv = 0;
  selectedRdcs.forEach(function(rdc) {
    total6mInv += _invAt(rdc, latestIdx);
  });
  total6mInv += getVal(inv.inventoryByRdc['总仓'], latestIdx);

  // Inventory rows
  selectedRdcs.forEach(function(rdc) {
    var baseArr = _findInvBaseArr(rdc);
    if (baseArr) {
      table2Html += '<tr><td>' + rdc + '</td>';
      for (var i = 0; i < months.length; i++) table2Html += '<td class="num">' + fmtNum(_invAt(rdc, i)) + '</td>';
      var pct = total6mInv > 0 ? (_invAt(rdc, latestIdx) / total6mInv * 100).toFixed(1) : '0.0';
      table2Html += '<td class="num">' + pct + '%</td></tr>';
    }
  });

  // 共享 inventory
  for (var k = 0; k < invRdcKeys.length; k++) {
    if (invRdcKeys[k].indexOf('共享') >= 0) {
      var vals = inv.inventoryByRdc[invRdcKeys[k]];
      if (vals) {
        table2Html += '<tr><td>共享库</td>';
        for (var i = 0; i < months.length; i++) table2Html += '<td class="num">' + fmtNum(vals[i]) + '</td>';
        var pct = total6mInv > 0 ? (getVal(vals, latestIdx) / total6mInv * 100).toFixed(1) : '0.0';
        table2Html += '<td class="num">' + pct + '%</td></tr>';
      }
      break;
    }
  }

  // HQ inventory
  var hqInvVals = inv.inventoryByRdc['总仓'];
  if (hqInvVals) {
    table2Html += '<tr style="background:#EEF2FF;font-weight:500"><td style="color:#1D4ED8">总库存</td>';
    for (var i = 0; i < months.length; i++) table2Html += '<td class="num" style="color:#1D4ED8">' + fmtNum(hqInvVals[i]) + '</td>';
    var hqPct = total6mInv > 0 ? (getVal(hqInvVals, latestIdx) / total6mInv * 100).toFixed(1) : '0.0';
    table2Html += '<td class="num" style="color:#1D4ED8">' + hqPct + '%</td></tr>';
  }

  // Shipment cost rows
  var hqShipVals = inv.shipmentCost['总部'];
  if (hqShipVals) {
    table2Html += '<tr style="background:#FFF7ED;font-weight:500"><td style="color:#D97706">总出货成本</td>';
    for (var i = 0; i < months.length; i++) table2Html += '<td class="num" style="color:#D97706">' + fmtNum(hqShipVals[i]) + '</td>';
    table2Html += '<td class="num">-</td></tr>';
  }

  // Turnover days row
  table2Html += '<tr style="background:#F0FDF4;font-weight:500"><td style="color:#065F46">总仓周转天数</td>';
  for (var i = 0; i < months.length; i++) table2Html += '<td class="num" style="color:#065F46">' + fmtNum(getVal(inv.headquarters, i)) + '</td>';
  table2Html += '<td class="num">-</td></tr></tbody></table>';
  document.getElementById('table-inv-detail').innerHTML = table2Html;

  // 库存规模年度对比（2025 vs 2026）
  renderInventoryTurnoverHistoryCharts();
}

// 年末库存预测 TAB（动态滚动库存模拟，数据基准 2026-07-23 快照）
// 算法：补货量 = MIN(MAX(0, 当月需求 + 目标期末库存 - 期初库存), 当月需求 × 渐进比率)
// 目标期末库存 = 覆盖天数/30 × 下月需求
// 覆盖天数：默认 14 天（2周含安全库存），西北 19 天（再加 5 天）。
// 起始库存：只算"可出货" = 计划可用库存 + 在途库存（不含残次/过期/退货/近效期）
// 总仓固定 = 6月末值，不参与预测；华东RDC停运不计入。
function renderInventoryForecast(page, tabBar) {
  const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const rdc6 = ['东北RDC','华北RDC','华南RDC','华中RDC','西北RDC','西南RDC'];
  // 可调参数：从 window._forecastParams 读取（默认在 initForecastParams 设置）
  if (!window._forecastParams) window._forecastParams = {
    coverageDays: {'东北RDC':14,'华北RDC':14,'华南RDC':14,'华中RDC':14,'西南RDC':14,'西北RDC':19},
    gradualRatio: 1.2
  };
  const CP = window._forecastParams.coverageDays;
  const GRADUAL = window._forecastParams.gradualRatio;
  const covFields = ['cov08','cov09','cov10','cov11','cov12','cov13']; // Aug..Jan(次年)

  // === 1. 从 history.json 读 2025/2026 1-6月 actual (千元) ===
  // 历史 actual 用 7RDC（含华东停运前）以对齐「库存金额趋势」年度对比卡片；华东 2026 已停运为 0，故 7RDC≈6RDC
  const hist = dataStore.history && dataStore.history.inventory;
  function sumRdcs(y, i, keys) {
    if (!hist || !hist[y] || !hist[y].inventoryAmount) return 0;
    let s = 0; keys.forEach(r => { s += (hist[y].inventoryAmount[r] && hist[y].inventoryAmount[r][i]) || 0; });
    return s;
  }
  const rdc7 = rdc6.concat(['华东RDC']); // 含华东（仅用于历史 actual 对齐）
  // 历史 actual 按 window._invHainan 筛选（2025 全年 + 2026 1-4月来自 hainanHistory；5-6月来自 cov6）
  const _hFilter = window._invHainan || 'all';
  function sumRdcsHainan(year, i, keys) {
    if (_hFilter === 'all') return sumRdcs(year, i, keys);
    let s = 0; keys.forEach(r => { s += getHainanAdjustedAmount(year, r, i); });
    return s;
  }
  // 2025 actual 与 2026 actual 统一用 amountAtRdcs（库存金额 sheet「库存金额_考核」透视，与库存结构分析图同源，含 2026 1-7 月真实值）
  // 单位：元 → 亿元（÷1e8）。注意 history.json 仅含 2026 1-6 月，7 月必须从 amountTrendBlocks 取，否则为 0
  const nat25 = months.map((_, i) => amountAtRdcs('2025', i + 1, rdc7) / 1e8);
  // 2026 actual 取 1-7 月（7 月为真实值，非 0）；预测期移到 8-12 月
  const nat26A = months.slice(0,7).map((_, i) => amountAtRdcs('2026', i + 1, rdc7) / 1e8);
  const twYuan = (sumRdcs('2026', 5, rdc6.concat(['总仓'])) - sumRdcs('2026', 5, rdc6)) * 1000; // 元（总仓仅 history 含，amountTrendBlocks 为 7RDC）
  const twYi = twYuan / 1e8;

  // === 2. 从 cov7(7月) 算单品成本 + 8月-次年1月 需求(元) ===
  // 起始库存：只算"可出货" = 计划可用库存(planAmt) + 在途库存(inTransitAmt)
  //   不含 残次/过期/退货/近效期（这些不能用于正常出货）
  // 按 window._invHainan 筛选：'yes' 只算 isHainan=true 的 SKU；'no' 跳过；'all' 不筛
  const cov7 = (dataStore.inventory && dataStore.inventory.cov7) || [];
  const demandYuan = {}; rdc6.forEach(r => demandYuan[r] = [0,0,0,0,0,0]);
  const startInvRdcYuan = {}; rdc6.forEach(r => startInvRdcYuan[r] = 0);
  let skuCount = 0;
  cov7.forEach(d => {
    if (rdc6.indexOf(d.rdc) < 0) return;
    // 海南花露水筛选
    if (_hFilter === 'yes' && d.isHainan !== true) return;
    if (_hFilter === 'no' && d.isHainan === true) return;
    const qty = d.availableQty || 0, amt = d.totalAmt || 0;
    if (qty <= 0 || amt <= 0) return;
    const unitCost = amt / qty; skuCount++;
    covFields.forEach((f, t) => { demandYuan[d.rdc][t] += (d[f] || 0) * unitCost; });
    // 可出货库存 = plan + inTransit
    startInvRdcYuan[d.rdc] += (d.planAmt || 0) + (d.inTransitAmt || 0);
  });

  // === 3. 滚动库存模拟 Aug-Dec (5个月) —— v3.1.4 预测期从7-12月改为8-12月（7月作actual） ===
  const forecastYuan = {};
  rdc6.forEach(rdc => {
    const cf = CP[rdc] / 30;
    const d = demandYuan[rdc]; // 直接用原始需求（不做准确率补偿，14天覆盖已含安全库存）
    let cur = startInvRdcYuan[rdc];
    const end = [];
    for (let t = 0; t < 5; t++) {  // 8月-12月：5个月预测
      const demand = d[t + 1] || d[t] || 0;  // d[1..5] = cov09..cov13（d[0]=cov08 不再用作预测起点）
      const nextD = t < 4 ? d[t + 2] || d[t] : d[t + 1] || d[t];
      const targetEnd = nextD * cf;
      if (cur >= demand + targetEnd) {
        cur = cur - demand; // 库存充裕，自然消耗
      } else {
        // 渐进补货：不足多少补多少，但 ≤ 当月需求 × 渐进比率
        const deficiency = demand + targetEnd - cur;
        const maxRep = demand * GRADUAL;
        const rep = Math.min(deficiency, maxRep);
        cur = cur + rep - demand;
      }
      if (cur < 0) cur = 0;
      end.push(cur);
    }
    forecastYuan[rdc] = end;
  });

  // === 5. 汇总 6RDC (亿元) - 图表口径与年度对比卡片一致；总仓单独保留在推演表 ===
  // v3.1.4：预测期 8-12 月（5 个月），rdcOnlyH2 取 forecastYuan[r][0..4]
  const rdcOnlyH2 = [0,1,2,3,4].map(t => rdc6.reduce((s,r) => s + forecastYuan[r][t], 0));
  const rdcOnlyYiH2 = rdcOnlyH2.map(v => v / 1e8);
  const nationalYiH2 = rdcOnlyH2.map(v => (v + twYuan) / 1e8);
  const nat26Demand = nat26A.concat(rdcOnlyYiH2);

  // === 7. 各地点年末推演 (亿元) —— 只含 6 RDC；总仓/全国合计作为信息脚注 ===
  // v3.1.4：预测期 8-12 月（5 个月），forecastYuan[r] 长度从 6 改为 5，索引 0-4
  const proj = [];
  rdc6.forEach(r => {
    const v = forecastYuan[r][4] / 1e8;
    proj.push([r, v, '覆盖'+CP[r]+'天，渐进'+GRADUAL.toFixed(1)+'倍']);
  });
  const rdcSumYi = rdc6.reduce((s,r) => s + forecastYuan[r][4], 0) / 1e8;
  proj.push(['6RDC合计', rdcSumYi, '各 RDC 年末可出货库存之和']);

  // === 8. 覆盖表 (基于未来 6 个月逐月累积需求，模拟库存能消化几个月) ===
  // 库存量 = 全部在库 SKU；逐月扣减需求，得到「库存能撑到几月」
  const _hcFilter = window._invHainan || 'all';
  const cov7Filtered = _hcFilter === 'all' ? cov7 : cov7.filter(function(d) { return _hcFilter === 'yes' ? d.isHainan === true : d.isHainan !== true; });
  const cover = [];
  rdc6.forEach(r => {
    let invQty = 0;
    const monthDemands = [0, 0, 0, 0, 0, 0]; // 8月..次年1月
    cov7Filtered.forEach(d => {
      if (d.rdc !== r) return;
      invQty += d.availableQty || 0;
      monthDemands[0] += d.cov08 || 0;
      monthDemands[1] += d.cov09 || 0;
      monthDemands[2] += d.cov10 || 0;
      monthDemands[3] += d.cov11 || 0;
      monthDemands[4] += d.cov12 || 0;
      monthDemands[5] += d.cov13 || 0;
    });
    // 逐月扣减，模拟库存消化进度
    let remaining = invQty, coveredMonths = 0;
    for (let i = 0; i < months.length; i++) {
      if (remaining <= 0) break;
      if (monthDemands[i] <= 0) { coveredMonths += 1; continue; } // 该月无需求，按整月计
      if (remaining >= monthDemands[i]) { remaining -= monthDemands[i]; coveredMonths += 1; }
      else { coveredMonths += remaining / monthDemands[i]; remaining = 0; }
    }
    // 6 个月都覆盖后还有库存 → 显示为 6.5（>2 即视为冗余，无须精确）
    const totalDemand = monthDemands.reduce((s, v) => s + v, 0);
    const covMonths = totalDemand > 0 ? coveredMonths : (invQty > 0 ? 6.5 : 0);
    let tag, note;
    if (covMonths > 2) { tag = '冗余'; note = '覆盖 > 2 个月，可向偏瘦 RDC 调拨'; }
    else if (covMonths >= 1) { tag = '偏高'; note = '覆盖 1-2 个月，库存略高，可正常出货'; }
    else if (covMonths >= 0.5) { tag = '正常'; note = '覆盖 0.5-1 个月，处于健康区间'; }
    else { tag = '偏瘦'; note = '覆盖 < 0.5 个月，下半月缺货风险高'; }
    cover.push([r, invQty, monthDemands[0], covMonths, tag, note]);
  });

  // === 9. 渲染 HTML ===
  // 保存 context 供参数面板 onChange 自动重推
  window._fcRenderContext = window._fcRenderContext || {};
  window._fcRenderContext.page = page;
  window._fcRenderContext.tabBar = tabBar;
  page.innerHTML = tabBar +
    (function(){
      const _hSel = window._invHainan || 'all';
      const hainanDropdown = '<label style="font-size:12px;color:var(--text-secondary);margin-right:6px">海南花露水：</label>' +
        '<select onchange="window._invHainan=this.value;reRenderForecast()" style="min-width:110px;font-size:12px;padding:4px 8px;border:1px solid #D1D5DB;border-radius:4px;background:#FFF">' +
          '<option value="all" ' + (_hSel==='all'?'selected':'') + '>全部</option>' +
          '<option value="yes" ' + (_hSel==='yes'?'selected':'') + '>仅海南花露水</option>' +
          '<option value="no" ' + (_hSel==='no'?'selected':'') + '>不含海南花露水</option>' +
        '</select>';
      return '<div class="card" style="margin-bottom:16px">' +
        '<div class="card-header" style="display:flex;align-items:center"><span class="card-title">🔮 2026 年度库存金额推演与冗余分析</span><div style="margin-left:auto;display:flex;align-items:center">' + hainanDropdown + '</div></div>' +
        '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px">数据基准：库存金额 sheet「库存金额_考核」透视（amountAtRdcs，与库存结构分析图同源；2025 全年 + 2026 1-7 月 actual）+ inventory.xlsx「6月库存覆盖数据」X–AB 列（8-12 月需求）｜快照日期 ' + new Date().toISOString().slice(0,10) + '｜单位：亿元（元 ÷ 1e8）｜图表口径：6RDC(+华东) actual / 6RDC 预测；推演表口径：6RDC + 总仓｜<b>可调参数</b>（⬇ 面板）：各 RDC 覆盖天数 + 渐进比率（月补 ≤ 月需×倍）</div>' +
        '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:6px">' +
          '<div style="flex:1;background:#F8FAFC;border:1px solid var(--border-card);border-radius:10px;padding:12px;font-size:13px"><b style="color:#7B4DF6">渐进入市（全国=6RDC+总仓）：</b>渐进补货（≤月需×'+GRADUAL.toFixed(1)+'倍），各 RDC 覆盖天数可调。<b>年末 ≈ '+ nationalYiH2[4].toFixed(2) + ' 亿</b>（6RDC '+ rdcSumYi.toFixed(2) + ' + 总仓 '+ twYi.toFixed(2) + '）。参数见下方 ⚙ 面板。</div>' +
        '</div>' +
      '</div>';
    })() +

    '<div class="card" style="margin-bottom:16px;background:#F0FDF4;border:1px solid #BBF7D0">' +
      '<div class="card-header" style="cursor:pointer" onclick="var p=document.getElementById(\'fc-params-body\'),a=document.getElementById(\'fc-arrow\');p.style.display=p.style.display===\'none\'?\'block\':\'none\';a.textContent=a.textContent===\'▶\'?\'▼\':\'▶\'">' +
        '<span class="card-title"><span id="fc-arrow">▶</span> ⚙ 推演参数（覆盖天数 / 渐进比率）</span>' +
      '</div>' +
      '<div id="fc-params-body" style="display:none;padding:6px 0">' +
        '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:6px">修改后自动刷新推演结果</div>' +
        '<table class="data-table" style="margin-bottom:6px">' +
          '<thead><tr><th>RDC</th><th>覆盖天数</th></tr></thead><tbody>' +
          rdc6.map(function(r){return '<tr><td style="font-weight:600">'+r+'</td><td><input type="number" min="7" max="60" value="'+CP[r]+'" style="width:60px;padding:3px;border:1px solid #D1D5DB;border-radius:4px;font-size:12px" onchange="window._forecastParams.coverageDays[\''+r+'\']=Number(this.value);reRenderForecast()"></td></tr>';}).join('') +
          '</tbody></table>' +
        '<label style="font-size:12px;display:flex;align-items:center;gap:6px">' +
          '渐进比率（每月补≤月需×<input type="number" min="1" max="3" step="0.1" value="'+GRADUAL+'" style="width:55px;padding:3px;border:1px solid #D1D5DB;border-radius:4px;font-size:12px" onchange="window._forecastParams.gradualRatio=Number(this.value);reRenderForecast()"> 倍）' +
        '</label>' +
      '</div>' +
    '</div>' +

    '<div class="card" style="margin-bottom:16px">' +
      '<div class="card-header"><span class="card-title">6RDC 库存金额月度走势（单位：亿元）</span></div>' +
      '<div class="chart-container" id="chart-forecast" style="height:420px"></div>' +
      '<div style="font-size:12px;color:var(--text-secondary);margin-top:8px">灰虚线=2025 7RDC 实际；紫虚线=2026 实际(1-7月, 与库存结构分析同源)+渐进入市预测(8-12月, 6RDC, 参数可调 ⬆ 面板)。<b>1-7月为历史 actual</b>（库存金额_考核透视）；<b>8月起为预测</b>，按华东停运仅含 6RDC；<b>总仓见下方推演表「全国合计」</b>。灰色阴影区为 H2 预测区间。</div>' +
    '</div>' +

    '<div class="card" style="margin-bottom:16px">' +
      '<div class="card-header"><span class="card-title">当前库存 vs 未来需求覆盖分析（7 月末）</span></div>' +
      '<div class="table-wrap" id="table-forecast-cover"></div>' +
      '<div style="font-size:12px;color:var(--text-secondary);margin-top:8px">覆盖月数 = 用 7 月末库存量逐月扣减未来 6 个月（8月-次年1月）需求，得出库存能消化到几月。&gt;2 个月冗余，1–2 个月偏高，0.5–1 个月正常，&lt;0.5 个月偏瘦（缺货风险）。</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-header"><span class="card-title">结论与建议</span></div>' +
      '<div style="font-size:13px;line-height:1.8">' +
        '<div>1. <b>6RDC 年末库存：</b>可出货库存（计划+在途）合计 <b>'+ rdcSumYi.toFixed(2) + ' 亿</b>（渐进入市，参数可调 ⬆）。</div>' +
        '<div>2. <b>冗余判断：</b>'+ cover.map(c => c[0].replace('RDC','') + ' ' + c[4] + '（' + c[3].toFixed(2) + '月）').join('；') + '。</div>' +
        '<div>3. <b>总仓</b>固定 '+ twYi.toFixed(2) + ' 亿不参与预测（补给池）。全国合计（参考）= '+ (rdcSumYi + twYi).toFixed(2) + ' 亿 = 6RDC '+ rdcSumYi.toFixed(2) + ' + 总仓 '+ twYi.toFixed(2) + '。6RDC 起始可出货库存 '+ (rdc6.reduce((s,r)=>s+startInvRdcYuan[r],0)/1e8).toFixed(2) + ' 亿。</div>' +
        '<div>4. <b>行动建议：</b>覆盖率 < 0.5 的 RDC 优先补货（向冗余 RDC 调拨或前置总仓出货）；覆盖率 > 2 的 RDC 可压缩补货释放库存。</div>' +
        '<div>5. <b>提升精度：</b>接入 7-8 月实际出货后滚动校准；按 SKU/品牌细分需求；优化覆盖天数与准确率参数。</div>' +
      '</div>' +
    '</div>';

  // === 图表 ===
  const chart = initChart('chart-forecast');
  chart.setOption({
    tooltip:{trigger:'axis'},
    legend:{data:['2025 7RDC 实际','2026 实际+渐进入市'],top:0},
    grid:{left:60,right:24,top:50,bottom:40},
    xAxis:{type:'category',data:months},
    yAxis:{type:'value',name:'亿元',min:0,max:1.2},
    series:[
      {name:'2025 7RDC 实际',type:'line',data:nat25,lineStyle:{type:'dashed',color:'#9aa7b4'},itemStyle:{color:'#9aa7b4'},symbol:'circle'},
      {name:'2026 实际+渐进入市',type:'line',data:nat26Demand,lineStyle:{type:'dashed',width:3,color:'#7b4df6'},itemStyle:{color:'#7b4df6'},
        markArea:{silent:true,itemStyle:{color:'rgba(123,77,246,0.08)'},data:[[{xAxis:'7月'},{xAxis:'12月'}]]}}
    ]
  });

  // === 覆盖表 ===
  let cb = '';
  cover.forEach(function(r){
    let tag = '';
    if (r[4]==='冗余') tag = '<span style="display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;background:#FDECEA;color:#D83A2F">冗余</span>';
    else if (r[4]==='偏高') tag = '<span style="display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;background:#EFF6FF;color:#2563EB">偏高</span>';
    else if (r[4]==='正常') tag = '<span style="display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;background:#E6F7EE;color:#1C9C5E">正常</span>';
    else tag = '<span style="display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;background:#FFF3E0;color:#C77700">偏瘦</span>';
    cb += '<tr><td style="text-align:left;font-weight:600">'+r[0]+'</td><td>'+Math.round(r[1]).toLocaleString()+'</td><td>'+Math.round(r[2]).toLocaleString()+'</td><td><b>'+r[3].toFixed(2)+'</b></td><td>'+tag+'</td><td style="text-align:left">'+r[5]+'</td></tr>';
  });
  document.getElementById('table-forecast-cover').innerHTML =
    '<table class="data-table"><thead><tr><th style="text-align:left">RDC</th><th>库存量（支）</th><th>8 月需求（支）</th><th>覆盖月数</th><th>判断</th><th style="text-align:left">说明</th></tr></thead><tbody>'+cb+'</tbody></table>';
}

// 推演参数变更后自动刷新（被 ⚙ 面板 onchange 调用）
function reRenderForecast() {
  const ctx = window._fcRenderContext;
  if (ctx && ctx.page && ctx.tabBar) renderInventoryForecast(ctx.page, ctx.tabBar);
}

// === 库存变化根因分析（数量/箱，2026年5-6月） ===
// 数据源：
//   - cov5.availableQty（5月末库存，=6月期初）
//   - cov6.availableQty（6月末库存）
//   - pullbackByRdcMonth.qty + pullbackRaw（拉回箱数，按发货RDC+月份）
//   - transship.deliveryQty（转储入箱数，按收货RDC+月份）
//   - orderDetail.totalFulfillQty（累计出货，按SKU箱规换算）
// 库存变动（箱）= 期末库存 - 期初库存 = 拉回 + 转储入 - 出货
function renderInventoryRootCause(page, tabBar) {
  const pullback = (dataStore.inventory && dataStore.inventory.pullbackByRdcMonth) || {};
  const pullbackRaw = (dataStore.inventory && dataStore.inventory.pullbackRaw) || [];
  const transship = dataStore.transship || [];
  const productMaster = (dataStore.inventory && dataStore.inventory.productMaster) || {};
  const cov5 = (dataStore.inventory && dataStore.inventory.cov5) || [];
  const cov6 = (dataStore.inventory && dataStore.inventory.cov6) || [];
  const orderDetail = dataStore.orderDetail || [];

  const rdcOrder = ['东北RDC','华北RDC','华东RDC','华南RDC','华中RDC','西北RDC','西南RDC'];
  const yms = ['2026-05','2026-06'];
  const ymsLabel = ['5月','6月'];

  // ====== 通用工具函数 ======
  function rn(v) { return Math.round(v || 0); }
  function getSpec(sku) { const bs = window._boxSpec && window._boxSpec[String(sku)]; return (bs && bs > 0) ? bs : 1; }

  // 构建 SKU→品牌 字典（从覆盖数据）
  const skuBrand = {};
  [...cov5, ...cov6].forEach(function(d) { if (d.sku && d.brand && !skuBrand[d.sku]) skuBrand[d.sku] = d.brand; });

  // ====== 数据聚合：库存（cov5/6 availableQty → 箱，按SKU箱规） ======
  function invByRdc(covArr) {
    var m = {};
    covArr.forEach(function(d) {
      if (!m[d.rdc]) m[d.rdc] = 0;
      m[d.rdc] += (d.availableQty || 0) / getSpec(d.sku);
    });
    Object.keys(m).forEach(function(k) { m[k] = rn(m[k]); });
    return m;
  }
  var inv5 = invByRdc(cov5); // 5月末=6月初
  var inv6 = invByRdc(cov6); // 6月末

  // 品牌×RDC 期末库存
  function brandRdcInv(covArr) {
    var m = {};
    covArr.forEach(function(d) {
      if (!d.brand) return;
      if (!m[d.brand]) m[d.brand] = {};

// === 海南花露水筛选器：库存金额维度 ===
// 根据 window._invHainan('all'/'yes'/'no') + 年份 + 月份索引，返回调整后的库存金额(千元)。
// 数据源策略：
//   2025 全年 + 2026 1-4 月  ← history.hainanHistory.byRdc（来自「海南花露水历史数据」sheet）
//   2026 5-6 月              ← inventory.cov6 中 isHainan===true 的 totalAmt 之和
// 注意：周转天数/共享库/出货成本 不跟随此筛选（无海南花露水维度数据）。
function getHainanAdjustedAmount(year, rdc, monthIdx) {
  const hainanFilter = window._invHainan || 'all';
  const baseArr = dataStore.history && dataStore.history.inventory
    && dataStore.history.inventory[year]
    && dataStore.history.inventory[year].inventoryAmount[rdc];
  const baseAll = (baseArr && baseArr.length > monthIdx) ? (baseArr[monthIdx] || 0) : 0;
  if (hainanFilter === 'all') return baseAll;
  let hainanAmt = 0;
  const hh = dataStore.history && dataStore.history.hainanHistory;
  if (year === '2025' || (year === '2026' && monthIdx <= 3)) {
    const arr = hh && hh.byRdc && hh.byRdc[year] && hh.byRdc[year][rdc];
    hainanAmt = (arr && arr.length > monthIdx) ? (arr[monthIdx] || 0) : 0;
  } else if (year === '2026' && (monthIdx === 4 || monthIdx === 5)) {
    // 5月→cov5, 6月→cov6（按月度对位取库存覆盖数据）
    const covKey = monthIdx === 4 ? 'cov5' : 'cov6';
    const cov = (dataStore.inventory && dataStore.inventory[covKey]) || [];
    cov.forEach(d => {
      if (d.rdc !== rdc) return;
      if (d.isHainan === true) hainanAmt += d.totalAmt || 0;
    });
    hainanAmt = Math.round(hainanAmt / 10) / 100; // 元→千元，保留两位
  }
  return hainanFilter === 'yes' ? hainanAmt : Math.max(0, baseAll - hainanAmt);
}

  function valOrNull(map, k, i) { const arr = map && map[k]; return (arr && arr.length > i) ? arr[i] : null; }
  const EXCLUDE_KEYS = ['总仓'];
  function sumSelected(map, i) { let s = 0; selectedRdcs.forEach(k => { if (EXCLUDE_KEYS.indexOf(k) >= 0) return; const v = valOrNull(map, k, i); if (v != null) s += v; }); return s; }

// ============ 通用表格分页器（每页20条 + 跳页） ============
// 用法：const rowsHtml = data.map(r => '<tr>...</tr>');
//       box.innerHTML = '<table class="data-table"><thead>...</thead><tbody></tbody></table>';
//       paginateTable('my-table-container', rowsHtml);   // 容器ID：可以是 .table-wrap / .card / <tbody>/<table> 任意ID
//
// 设计：容器ID 内部自动查找第一个 <tbody> 填入切片行；分页条放在容器同级最后（class="table-pager-{id}"）。
//       总行数 <= pageSize 时不显示分页条；筛选/数据更新时再次调用即可重置回第 1 页。
const _pagerStates = {};
const PAGER_PAGE_SIZE = 20;
function paginateTable(targetId, rowsHtmlArray, pageSize) {
  const rows = (rowsHtmlArray || []).slice();
  pageSize = pageSize || PAGER_PAGE_SIZE;
  const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
  _pagerStates[targetId] = { rows: rows, pageSize: pageSize, page: 1, totalPages: totalPages };
  renderPagerPage(targetId);
}
function setPagerPage(targetId, pageNum) {
  const st = _pagerStates[targetId]; if (!st) return;
  st.page = Math.max(1, Math.min(st.totalPages, pageNum || 1));
  renderPagerPage(targetId);
}
function getPagerPage(targetId) { const st = _pagerStates[targetId]; return st ? st.page : 1; }
function resetPager(targetId) { const st = _pagerStates[targetId]; if (st) { st.page = 1; renderPagerPage(targetId); } }

function renderPagerPage(targetId) {
  const st = _pagerStates[targetId]; if (!st) return;
  const target = document.getElementById(targetId);
  if (!target) return;
  const tbody = target.tagName === 'TBODY' ? target : target.querySelector('tbody');
  const pageSize = st.pageSize;
  let p = st.page;
  if (p < 1) p = 1;
  if (p > st.totalPages) p = st.totalPages;
  st.page = p;
  const start = (p - 1) * pageSize;
  const slice = st.rows.slice(start, start + pageSize);

  // 1) 填充 tbody
  if (tbody) {
    if (st.rows.length === 0) {
      const cols = tbody.parentElement ? tbody.parentElement.querySelectorAll('thead th').length : 1;
      tbody.innerHTML = '<tr><td colspan="' + (cols || 1) + '" style="text-align:center;padding:20px;color:var(--text-secondary)">该条件下暂无数据，请调整筛选条件</td></tr>';
    } else {
      tbody.innerHTML = slice.join('');
    }
  }

  // 2) 重写分页条（先删旧的，再插新的）——只插到容器外层结尾，避免破坏现有 max-height 滚动容器
  const host = tbody ? tbody.closest('.table-wrap, .card, div[style*="overflow"]') || tbody.parentElement.parentElement : target.parentElement;
  if (host) {
    const old = host.querySelector('.table-pager-' + targetId);
    if (old) old.remove();
    if (st.rows.length > pageSize) {
      host.insertAdjacentHTML('beforeend', buildPagerHtml(targetId, p, st.totalPages, st.rows.length, pageSize));
    }
  }
}

function buildPagerHtml(targetId, p, totalPages, total, pageSize) {
  const startP = Math.max(1, p - 2);
  const endP = Math.min(totalPages, p + 2);
  let btns = '';
  btns += '<button class="pg-btn" data-cid="' + targetId + '" data-action="first"' + (p<=1?' disabled':'') + '>首页</button>';
  btns += '<button class="pg-btn" data-cid="' + targetId + '" data-action="prev"' + (p<=1?' disabled':'') + '>上一页</button>';
  if (startP > 1) btns += '<span style="color:var(--text-secondary);font-size:11px">...</span>';
  for (let i = startP; i <= endP; i++) {
    btns += '<button class="pg-btn' + (i===p?' pg-btn-active':'') + '" data-cid="' + targetId + '" data-action="num" data-p="' + i + '">' + i + '</button>';
  }
  if (endP < totalPages) btns += '<span style="color:var(--text-secondary);font-size:11px">...</span>';
  btns += '<button class="pg-btn" data-cid="' + targetId + '" data-action="next"' + (p>=totalPages?' disabled':'') + '>下一页</button>';
  btns += '<button class="pg-btn" data-cid="' + targetId + '" data-action="last"' + (p>=totalPages?' disabled':'') + '>末页</button>';
  let html = '<div class="table-pager table-pager-' + targetId + '" data-cid="' + targetId + '">';
  html += '<span class="pg-info">共 <strong style="color:var(--text-primary)">' + total + '</strong> 条 · 每页 ' + pageSize + ' 条 · 第 <strong style="color:var(--color-blue)">' + p + '</strong> / ' + totalPages + ' 页</span>';
  html += btns;
  html += '<span class="pg-info" style="margin-left:6px">跳到 <input type="number" class="pg-jump" data-cid="' + targetId + '" min="1" max="' + totalPages + '" value="' + p + '"> 页</span>';
  html += '</div>';
  return html;
}

// 全局点击委托：分页按钮 / GO 跳转
document.addEventListener('click', function(e) {
  const btn = e.target.closest('.pg-btn');
  if (!btn) return;
  if (btn.disabled) return;
  const cid = btn.dataset.cid; const action = btn.dataset.action;
  if (!cid || !action) return;
  const st = _pagerStates[cid]; if (!st) return;
  let p = st.page;
  if (action === 'first') p = 1;
  else if (action === 'prev') p = Math.max(1, p - 1);
  else if (action === 'next') p = Math.min(st.totalPages, p + 1);
  else if (action === 'last') p = st.totalPages;
  else if (action === 'num') p = Math.max(1, Math.min(st.totalPages, parseInt(btn.dataset.p, 10) || 1));
  else if (action === 'jump') {
    const wrap = btn.closest('.table-pager');
    const input = wrap ? wrap.querySelector('.pg-jump') : null;
    if (input) p = Math.max(1, Math.min(st.totalPages, parseInt(input.value, 10) || 1));
  }
  if (p === st.page) return;
  st.page = p;
  renderPagerPage(cid);
});

// 跳页输入框回车支持
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Enter') return;
  const input = e.target.closest('.pg-jump');
  if (!input) return;
  e.preventDefault();
  const cid = input.dataset.cid; const st = _pagerStates[cid]; if (!st) return;
  const p = Math.max(1, Math.min(st.totalPages, parseInt(input.value, 10) || 1));
  if (p === st.page) return;
  st.page = p;
  renderPagerPage(cid);
});

  // Handle hash routing
  function handleHash() {
    const hash = window.location.hash.replace('#/', '');
    if (hash && ['overview','fulfillment','order-insight','shortage','weekend-sim','customer','transship','data','shortage-compare','replenishment','replenish-logic','inventory','inventory-structure','inventory-coverage-detail','slow-moving','slow-moving-logic','biz-demand','biz-demand-detail','biz-demand-dacr'].includes(hash)) {
      if (!isAuthenticated) return;
      if (hash === 'login') return;
      currentPage = hash;
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      const tp = document.getElementById('page-' + hash);
      if (tp) tp.classList.add('active');
      document.querySelectorAll('.sidebar .menu-item').forEach(m => m.classList.remove('active'));
      const mi = document.querySelector('.sidebar .menu-item[data-page="' + hash + '"]');
      if (mi) mi.classList.add('active');
      renderPage(hash);
    }
  }

  window.addEventListener('hashchange', handleHash);

  if (isAuthenticated) {
    // ===== 快速加载：manifest 变更检测 + IndexedDB 缓存 + JSON 优先 + xlsx 回退 =====
    function getStoredHashes() {
      try { return JSON.parse(localStorage.getItem('rdc_manifest_hashes') || 'null'); } catch (e) { return null; }
    }
    function setStoredHashes(h) {
      try { localStorage.setItem('rdc_manifest_hashes', JSON.stringify(h)); } catch (e) {}
    }
    function fileOrderKey(f) {
      if (f === 'data.json') return 0;
      if (f.indexOf('data-') === 0) return 1;
      if (f === 'inventory.json') return 2;
      if (f === 'history.json') return 2.5;
      if (f === 'transship.json') return 2.8;
      return 3;
    }
    function applyPreparsed(filename, j) {
      if (filename === 'transship.json') {
        // 转储独立数据源：追加到 dataStore.transship，按 date|material|location|inbound 去重
        const existingTransKeys = new Set(dataStore.transship.map(d => d.dateStr + '|' + d.material + '|' + d.location + '|' + (d.inboundQty || 0)));
        (j.transship || []).forEach(function(r) {
          if (!r || !r.dateStr || !r.material) return;
          const key = r.dateStr + '|' + r.material + '|' + r.location + '|' + (r.inboundQty || 0);
          if (existingTransKeys.has(key)) return;
          existingTransKeys.add(key);
          dataStore.transship.push(r);
        });
        return;
      }
      const wb = { __preparsed: true, SheetNames: j.sheetNames, Sheets: j.sheets };
      if (filename === 'inventory.json') parseInventoryExcel(wb);
      else if (filename === 'data.json') {
        window._boxSpec = (j && j.boxSpecMap) || {};
        window._priceMap = (j && j.priceMap) || {};
        window._discontinuedMap = (j && j.discontinuedMap) || {};
        window._brandMap = (j && j.brandMap) || {};
        window._abcMap = (j && j.abcMap) || {};
        parseExcel(wb, 'replace');
      }
      else if (filename.indexOf('data-') === 0) parseExcel(wb, 'append', { skipTransship: true });
      else if (filename === 'history.json') { dataStore.history = j; }
    }
    async function bootLoad() {
      // 1) 先获取 manifest，以部署时间戳为版本锚点
      let manifest = null;
      try {
        const mres = await fetch('./manifest.json', { cache: 'no-cache' });
        if (mres.ok) manifest = await mres.json();
      } catch (e) { manifest = null; }

      // 自动检测新版本：清除本地旧缓存，避免新旧数据源混合导致"转储有数但出货为0"等异常
      try {
        if (manifest && manifest.generatedAt) {
          const flag = sessionStorage.getItem('rdc_deploy_flag');
          if (flag !== manifest.generatedAt) {
            sessionStorage.setItem('rdc_deploy_flag', manifest.generatedAt);
            try { localStorage.removeItem('rdc_manifest_hashes'); } catch (e) {}
            await clearIDB();
            console.log('[bootLoad] 新版本部署，已清除本地旧缓存:', manifest.generatedAt);
          }
        }
      } catch (e) {}

      // 2) IndexedDB 恢复（秒开首屏）
      const restored = await loadFromIDB();
      // 2.5) v169: 产品主数据（SKU → 供应链品类）——不写入 IDB，每次启动都拉一次（881KB，后台加载不阻塞首屏）
      //      必须放这里的原因：有缓存时走 refreshFromManifest，不会执行 autoLoadData，
      //      若只在 autoLoadData 里加载，则老用户（有 IDB 缓存）的品类列会永远显示 —
      //      加载完成后若正停留在缺货分析页，自动重渲染补上该列；失败则显示 —，不影响主流程
      (async function loadProductMaster() {
        try {
          const prodResp = await fetch('./product.xlsx');
          if (prodResp.ok) {
            parseProductMasterExcel(await prodResp.arrayBuffer());
            if (String(location.hash || '').indexOf('shortage') >= 0 && typeof renderShortage === 'function') renderShortage();
          }
        } catch (e) { /* 产品主数据缺失，供应链品类列显示 — */ }
      })();
      // 自动选中最新月份（在首次渲染前生效，避免先渲染"全部月份"再闪烁切换）
      if (window._latestMonth && filters.dataMonth === 'all') filters.dataMonth = window._latestMonth;
      if (restored) renderAll();

      // === 后台刷新逻辑（不阻塞首屏交互；数据变更检测 + 拉取 + 应用都放到后台） ===
      async function refreshFromManifest() {
        // 检测缓存异常：bizDemand 仅有单月数据时，清除哈希缓存强制全量重拉（修复 replace 清空归档的旧 bug）
        if (restored && dataStore.bizDemand && dataStore.bizDemand.length > 0) {
          var bizMonths = {};
          dataStore.bizDemand.forEach(function(d) { if (d.dateStr) bizMonths[d.dateStr.slice(0,7)] = true; });
          if (Object.keys(bizMonths).length <= 1) {
            console.warn('缓存中 bizDemand 仅有单月数据(' + (Object.keys(bizMonths)[0] || '无') + ')，怀疑缓存异常，强制全量重拉');
            try { localStorage.removeItem('rdc_manifest_hashes'); } catch(e) {}
          }
        }

        // manifest 变更检测：仅拉取哈希变化的文件
        if (manifest && manifest.files) {
          const stored = getStoredHashes() || {};
          let changed = Object.keys(manifest.files).filter(f => manifest.files[f] !== stored[f]);
          // 旧缓存没有 boxSpecMap 时，强制拉取一次 data.json 以补全箱规数据（一次性兼容）
          if ((!window._boxSpec || Object.keys(window._boxSpec).length === 0) && !changed.includes('data.json')) {
            changed.push('data.json');
          }
          // data.json 替换加载后会清空全量数据，若归档文件(5月/6月)哈希未变则不被重载导致数据丢失，故强制一并重载
          if (changed.includes('data.json')) {
            Object.keys(manifest.files).forEach(function(f) { if (f.indexOf('data-') === 0 && changed.indexOf(f) < 0) changed.push(f); });
          }
          // history.json 不走 IDB 缓存：每次重新 fetch，保证 KPI 用最新历史数据（避免 IDB 缓存旧 7/8 月数据）
          if (!changed.includes('history.json')) changed.push('history.json');
          if (restored && changed.length === 0) {
            // v117: 兜底健康检查 — IDB 健康检查(已用 ||)若漏过（理论上不应发生），这里再校验一次关键字段。
            // 若 orderDetail 或 cov7 实际为空/缺失，强制走全量重拉而不是直接吞"已加载缓存"。
            const _invCache = dataStore.inventory;
            const _cov7Empty = !_invCache || !_invCache.cov7 || _invCache.cov7.length < 100;
            const _ordEmpty = !(dataStore.orderDetail && dataStore.orderDetail.length >= 100);
            if (_cov7Empty || _ordEmpty) {
              console.warn('[refreshFromManifest] 缓存关键字段残缺（cov7=' + (_invCache && _invCache.cov7 ? _invCache.cov7.length : 0) + ', orderDetail=' + (dataStore.orderDetail ? dataStore.orderDetail.length : 0) + '），强制全量重拉');
              // 触发全量重拉：清掉 stored hashes 让 changed.length > 0
              try { localStorage.removeItem('rdc_manifest_hashes'); } catch(e) {}
              try { await clearIDB(); } catch(e) {}
              // 重新计算 changed（上面 cleared 之后 stored 是空，所有 manifest 文件都算"changed"）
              const _stored2 = getStoredHashes() || {};
              changed = Object.keys(manifest.files).filter(f => manifest.files[f] !== _stored2[f]);
              if (!changed.includes('history.json')) changed.push('history.json');
            } else {
              if (window._latestMonth && filters.dataMonth === 'all') filters.dataMonth = window._latestMonth;
              showToast('已加载本地缓存（数据未更新）');
              return;
            }
          }
          const ordered = changed.slice().sort((a, b) => fileOrderKey(a) - fileOrderKey(b));
          try {
            for (const f of ordered) {
              const j = await (await fetch('./' + f, { cache: 'no-cache' })).json();
              applyPreparsed(f, j);
            }
            if (dataStore.shortage.length === 0 && dataStore.orderDetail.length === 0 && !dataStore.inventory) {
              throw new Error('JSON 解析结果为空');
            }
            setStoredHashes(manifest.files);
            detectAllMonths();
            if (window._latestMonth && filters.dataMonth === 'all') filters.dataMonth = window._latestMonth;
            saveToIDB().catch(() => {});
            showToast('已更新 ' + ordered.length + ' 个数据文件（JSON 快速加载）');
            renderAll();
            return;
          } catch (e) {
            console.warn('JSON 快速加载失败，回退 Excel：', e);
            showToast('JSON 加载异常，已回退 Excel 加载', true);
          }
        }

        // 回退：原始 xlsx 流程（全量重新解析）
        const loaded = await autoLoadData();
        detectAllMonths();
        if (window._latestMonth && filters.dataMonth === 'all') filters.dataMonth = window._latestMonth;
        renderAll();
        return loaded;
      }

      // 有缓存：先秒开展示，数据更新检测放后台（requestIdleCallback 空闲时执行，不阻塞交互）
      if (restored) {
        if (typeof window.requestIdleCallback === 'function') {
          requestIdleCallback(function() { refreshFromManifest(); }, { timeout: 3000 });
        } else {
          setTimeout(refreshFromManifest, 50);
        }
        return;
      }
      // 无缓存：正常全量加载
      return refreshFromManifest();
    }

    bootLoad().then(loaded => {
      if (window.location.hash) handleHash();
      else navigateTo((loaded || dataStore.loaded) ? 'overview' : 'data');
    });
  }
}

function onGlobalMonthChange(val) {
  filters.dataMonth = val;
  if (val !== 'all') {
    // 自动将总览缺货日期定位到该月最新日期
    const monthData = dataStore.shortage.filter(d => d.dateStr && d.dateStr.startsWith(val));
    const latest = [...new Set(monthData.map(d => d.dateStr))].sort().pop();
    if (latest) filters.overviewDate = latest;
  }
  renderAll();
}

// ============ INVENTORY STRUCTURE CACHE (sessionStorage) ============
// 库存结构页派生缓存：HTML + 图表纯数据，切 TAB 秒开（避免重遍历 cov5/cov6 + 重拼 HTML）
// key 含 DB_VERSION + 全部筛选状态；数据源哈希变化或筛选变化自动换 key
const STRUCT_CACHE_PREFIX = 'rdc_is_' + DB_VERSION + '_';
function structCacheKey() {
  return [
    window._invHainan || 'all',
    window._isRdc || 'all',
    window._invStatus || 'all',
    (window._covSelectedRdcs || []).join(',')
  ].join('|');
}
function getStructCache() {
  try {
    const s = sessionStorage.getItem(STRUCT_CACHE_PREFIX + structCacheKey());
    return s ? JSON.parse(s) : null;
  } catch (e) { return null; }
}
function setStructCache(payload) {
  try {
    const key = STRUCT_CACHE_PREFIX + structCacheKey();
    // 只保留本筛选 key 的最新一份，清理同版本其他 key，防止 sessionStorage 塞满
    try {
      Object.keys(sessionStorage).forEach(k => {
        if (k.indexOf('rdc_is_' + DB_VERSION + '_') === 0 && k !== key) sessionStorage.removeItem(k);
      });
    } catch (e) {}
    sessionStorage.setItem(key, JSON.stringify(payload));
  } catch (e) { /* 存储满或不可用则跳过，不影响功能 */ }
}

// 4状态堆叠图（从缓存数据重建，含风险占比折线）
function renderStackedChartFromData(monthLabels, totals) {
  const stackedEl = document.getElementById('chart-is-stacked');
  if (!stackedEl) return;
  const c = initChart('chart-is-stacked');
  const STATUS_META = [
    { key: 'orange', name: '橙色预警', sub: '淘汰品、退货品', color: '#F97316' },
    { key: 'red',    name: '红色预警', sub: '残次品、效期品<1/3', color: '#EF4444' },
    { key: 'yellow', name: '黄色预警', sub: '效期品1/3<效期<1/2', color: '#FACC15' },
    { key: 'safe',   name: '非风险库存', sub: '计划可用库存', color: '#10B981' }
  ];
  const riskRatioData = (totals || []).map(t => {
    if (!t) return null;
    const risk = (t.orange || 0) + (t.red || 0) + (t.yellow || 0);
    const total = risk + (t.safe || 0);
    return total > 0 ? +(risk / total * 100).toFixed(1) : null;
  });
  const latestSum = (totals[5] || { orange:0, red:0, yellow:0, safe:0 });
  const maxTot = Math.max.apply(null, (totals || []).map(t => t ? ((t.orange||0)+(t.red||0)+(t.yellow||0)+(t.safe||0)) / 10000 : 0));
  c.setOption({
    tooltip: { trigger: 'axis', confine: true, textStyle: { fontSize: 11 },
      formatter: function(params) {
        let h = '<strong>' + params[0].axisValue + '</strong>';
        let sum = 0; let ratioShown = null;
        params.forEach(p => {
          if (p.seriesType === 'line') { ratioShown = p.value; return; }
          sum += (p.value || 0);
          h += '<br/>' + p.marker + p.seriesName + '：' + (p.value == null ? '-' : (p.value).toLocaleString() + ' 万');
        });
        h += '<br/><strong style="color:#1E293B">合计：' + sum.toLocaleString() + ' 万</strong>';
        if (ratioShown != null) h += '<br/>📍 风险库存占比：<strong style="color:#DC2626">' + ratioShown + '%</strong>';
        return h;
      }
    },
    legend: { data: STATUS_META.map(s => s.name).concat(['风险库存占比']), top: 0, left: 'center', textStyle: { fontSize: 11 } },
    grid: { left: 70, right: 70, top: 40, bottom: 30 },
    xAxis: { type: 'category', data: monthLabels, axisLabel: { fontSize: 11 } },
    yAxis: [
      { type: 'value', name: '万元', nameTextStyle: { fontSize: 10 }, axisLabel: { fontSize: 10 }, max: Math.max(1, maxTot) * 1.25 },
      { type: 'value', name: '风险占比%', nameTextStyle: { fontSize: 10, color: '#DC2626' }, axisLabel: { fontSize: 10, color: '#DC2626', formatter: '{value}%' }, min: 0, max: 70, splitLine: { show: false } }
    ],
    series: STATUS_META.map(s => ({
      name: s.name, type: 'bar', stack: 'total',
      data: (totals || []).map(t => t ? Math.round(t[s.key] / 10000) : null),
      color: s.color,
      itemStyle: { borderRadius: 0 },
      emphasis: { focus: 'series' }
    })).concat([{
      name: '风险库存占比', type: 'line', yAxisIndex: 1,
      data: riskRatioData,
      color: '#DC2626', smooth: true, symbol: 'circle', symbolSize: 8,
      lineStyle: { width: 2 },
      itemStyle: { color: '#DC2626' },
      label: { show: true, position: 'top', fontSize: 10, color: '#DC2626', formatter: '{c}%' },
      z: 10
    }])
  });
}

// 库存覆盖堆叠柱状图（从缓存数据重建）
function renderCovChartFromData(covDisplayRdcs, covLabels, covAgg) {
  const covChartEl = document.getElementById('chart-cov-stacked');

  const rdcColors = ['#EF4444','#F97316','#FACC15','#10B981','#3B82F6','#8B5CF6','#06B6D4'];

  const c2 = initChart('chart-cov-stacked');
  c2.setOption({
    tooltip: { trigger: 'axis', confine: true, textStyle: { fontSize: 11 },
      formatter: function(params) {
        let h = '<strong>' + params[0].axisValue + '</strong> <span style="color:#9aa7b4;font-size:10px">(点击下钻SKU)</span>';
        const sorted = params.slice().sort((a, b) => (b.value || 0) - (a.value || 0));
        let sum = 0;
        sorted.forEach(p => { sum += (p.value || 0); h += '<br/>' + p.marker + p.seriesName + '：' + (p.value == null ? '-' : Math.round(p.value).toLocaleString() + ' 元'); });
        h += '<br/><strong style="color:#1E293B">合计：' + Math.round(sum).toLocaleString() + ' 元</strong>';

      }
    },

    grid: { left: 70, right: 30, top: 50, bottom: 45 },
    xAxis: { type: 'category', data: covLabels, axisLabel: { fontSize: 10, rotate: 30, interval: 0 } },
    yAxis: { type: 'value', name: '元', nameTextStyle: { fontSize: 10 }, axisLabel: { fontSize: 10, formatter: v => v >= 10000 ? (v/10000).toFixed(0) + '万' : v } },
    series: (covDisplayRdcs || []).map((rdc, idx) => ({
      name: rdc, type: 'bar', stack: 'cov',
      data: (covLabels || []).map(l => {
        const cov = (covAgg && covAgg[rdc]) || {};
        const key = covKey(cov, l);
        return key ? (cov[key] || 0) : 0;
      }),
      color: rdcColors[idx % rdcColors.length],
      cursor: 'pointer',
      itemStyle: { borderRadius: 0 },
      emphasis: { focus: 'series' }
    }))
  });
  c2.on('click', function(p) {
    if (!p || !p.seriesName || p.value == null) return;
    drillRdcPeriodCovDetail(p.seriesName, p.name);
  });
}

// v121: 全局慢动品根因诊断引擎（从 renderSlowMoving 内部提取）。
// 让 plan-monitor 也能通过 window._slowDiagMap[key] 查询 (rdc,sku) 的根因，无需进入「慢动品分析」页。
function diagnoseSlowItem(o) {
  var netIn = o.netIn, ship = o.ship, demand = o.demand, fut = o.fut, fut5 = o.fut5, expiryRatio = o.expiryRatio, isNew = o.isNew;
  var flags = [];
  if (netIn > 0 && ship > 0 && netIn / ship > 2.0) flags.push('分仓需求虚高(过量补货)');
  if (demand > 0 && ship / demand < 0.5) flags.push('业务提报需求虚高');
  if (fut5 > 0 && fut / fut5 < 0.7) flags.push('未来需求下降');
  if (expiryRatio > 0.3) flags.push('效期风险');
  if (ship === 0 && fut === 0) flags.push('严重呆滞');
  if (flags.indexOf('分仓需求虚高(过量补货)') >= 0 && flags.indexOf('业务提报需求虚高') >= 0) flags.push('⚡ 需求信号全面失真');
  var rc = flags.length ? flags.join(' + ') : (isNew ? '需求变化待查' : '正常慢周转');
  var adv;
  if (flags.indexOf('⚡ 需求信号全面失真') >= 0) adv = '紧急：分仓与业务双端需求失真，冻结补货并复盘提报链路';
  else if (flags.indexOf('未来需求下降') >= 0) adv = '核实未来需求下降原因：若非真实需求萎缩则恢复预测，避免库存被动积压';
  else if (flags.indexOf('分仓需求虚高(过量补货)') >= 0) adv = '回溯分仓需求预测，下调提报系数；暂停按原需求补货';
  else if (flags.indexOf('业务提报需求虚高') >= 0) adv = '回溯业务提报口径，下调该SKU提报系数；暂停按原需求补货';
  else if (flags.indexOf('效期风险') >= 0) adv = '优先折价/特价出清临期库存，评估退厂或调拨，避免在效期更差前继续补货';
  else if (flags.indexOf('严重呆滞') >= 0) adv = '建议折价出清或退厂处理，评估SKU清退或停产';
  else if (rc === '需求变化待查') adv = '核查5月→6月需求信号变化，确认是否需求虚高导致覆盖骤升';
  else adv = '持续监测';
  return { flags: flags, rc: rc, adv: adv };
}

// v169: SKU 编码规范化——纯数字去前导零（源 '09698' 与产品主数据 '9698' 需能对应上）
function normSkuCode(x) {
  const s = String(x == null ? '' : x).trim();
  if (!s) return '';
  return /^\d+$/.test(s) ? String(parseInt(s, 10)) : s;
}

    // 兼容 6月（状态列 ∈ {计划可用库存,7~1/2效期,可用库存}）与 7月（快报月报-红橙黄预警 === '可用库存'，最严格口径）
    function buildExpiryMap(arr) {

        if (!m[key]) m[key] = { sellable: 0, below23: 0 };
        m[key].sellable += amt;
        if (life > 0 && ld / life < 2/3) m[key].below23 += amt; // 临期天数/总货架寿命 < 2/3 → 效期偏短

    }

    // v59/v60/v62: 结构化行数据，避免 TAB 端硬编码列索引；增强日期/RDC/数量解析与诊断
    const pullbackRows = [];
    function normalizePullbackRDC(n) {
      let s = String(n || '').trim().replace(/仓$/g, '').replace(/RDC$/g, '');
      // v66: 直接中文/简称映射
      const m = { '华南':'华南RDC','华北':'华北RDC','东北':'东北RDC','西北':'西北RDC','华中':'华中RDC','西南':'西南RDC','华东':'华东RDC' };
      if (m[s]) return m[s];
      // v66: 工厂代码 P2xx/P4xx/P6xx/P7xx/P8xx/P9xx → RDC（按 xx 前缀映射：20东北/40华南/60西北/70华中/80西南/90华北）
      const factoryM = { '20':'东北RDC','40':'华南RDC','60':'西北RDC','70':'华中RDC','80':'西南RDC','90':'华北RDC' };
      const factoryMatch = s.match(/^P?(\d{2,3})/);
      if (factoryMatch) {
        const prefix = factoryMatch[1].substring(0, 2);
        if (factoryM[prefix]) return factoryM[prefix];
      }
      // v66: 库位代码 2x/4x/6x/7x/8x/9x 开头 → RDC（按用户规则）
      const locMatch = s.match(/^(\d{2})/);
      if (locMatch && factoryM[locMatch[1]]) return factoryM[locMatch[1]];
      // 兜底：原样 +RDC
      return s + 'RDC';
    }
    function parsePullDate(v) {
      if (v == null) return null;
      if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
      if (typeof v === 'number') {
        if (v > 30000 && v < 100000) return new Date((v - 25569) * 86400 * 1000); // Excel Windows epoch
        if (v > 1000000000000) return new Date(v); // timestamp ms
        if (v > 1000000000) return new Date(v * 1000); // timestamp s
        return null;
      }
      const s = String(v).trim();
      if (!s) return null;
      // 尝试多种中文/标准日期格式
      const d = new Date(s.replace(/年|月/g, '-').replace(/日/g, '').replace(/\\/g, '-'));
      if (!isNaN(d.getTime())) return d;
      return null;
    }
    function parsePullQty(v) {
      if (v == null) return 0;
      if (typeof v === 'number') return v;
      const n = Number(String(v).replace(/,/g, '').trim());
      return isNaN(n) ? 0 : n;
    }
    function parsePullbackWithCols(pbCols, logDiag) {

      if (!pullbackArr) return rows;

        // v65: 跳过完全空白的行（不计入失败）

        if (_isBlank) continue;
        if (!r[pbCols.date]) { failMissingDate++; continue; }
        const dt = parsePullDate(r[pbCols.date]);
        if (!dt) { failDateInvalid++; continue; }
        const ym = dt.getFullYear() + '-' + (dt.getMonth() + 1).toString().padStart(2, '0');
        // v69: RDC 优先取 H列(发货工厂,直接给答案)；缺失时回退 基础数据 收货库位→RDC 映射；再缺失用库位码交给 normalize 兜底
        let rdcRaw = String(r[pbCols.rdc] || '').trim();
        if (!rdcRaw) {
          const recLoc = String(r[pbCols.recLoc] || '').trim();
          if (recLoc) rdcRaw = recRdcMap[recLoc] || recLoc; // 基础数据映射 或 原库位码(交给 normalizePullbackRDC)
        }
        if (!rdcRaw) { failRdcEmpty++; continue; }
        rdcRaw = normalizePullbackRDC(rdcRaw);
        const sku = String(r[pbCols.sku] || '').trim();
        const name = String(r[pbCols.name] || '').trim();
        // v67: 品牌已在前面从 productMaster 抓取
        // v69: 收货仓 优先取 C列(大仓收货仓,直接给答案)；缺失时回退 基础数据 收货库位→收货仓 映射
        const recLoc = String(r[pbCols.recLoc] || '').trim();
        const rec = String(r[pbCols.rec] || '').trim() || (recLoc && recWhMap[recLoc]) || '未知';
        const master = productMaster[sku] || {};
        const spec = (window._boxSpec && window._boxSpec[String(sku)] > 0) ? window._boxSpec[String(sku)] : (master.spec > 0 ? master.spec : 0);
        const cost = (window._priceMap && window._priceMap[String(sku)] != null) ? window._priceMap[String(sku)] : (master.cost || 0);
        // v67: 品牌优先从产品主数据抓取（兼容新模板无品牌列的情况）
        const brand = (window._brandMap && window._brandMap[String(sku)]) ? window._brandMap[String(sku)] : (String(r[pbCols.brand] || '').trim() || (master.brand || '') || '未知');
        const unit = String(r[pbCols.unit] || '').trim();
        const qty = parsePullQty(r[pbCols.qty]);
        // v70 fix: 金额换算按「实际件数 × 单件成本价」。

        // 接收箱数仍然统一换算成箱：箱直接为箱数，非箱除以箱规。
        let qtyBox = 0, pieces = 0;
        if (unit === '箱') {
          qtyBox = qty;
          pieces = spec > 0 ? qty * spec : qty; // 无箱规时 fallback 按原数量×成本
        } else if (spec > 0) {
          qtyBox = qty / spec;
          pieces = qty;
        } else {
          qtyBox = qty;
          pieces = qty;
        }
        const amt = pieces * cost;
        if (!pullbackByRdcMonth[rdcRaw]) pullbackByRdcMonth[rdcRaw] = {};
        if (!pullbackByRdcMonth[rdcRaw][ym]) pullbackByRdcMonth[rdcRaw][ym] = { qty: 0, amt: 0 };
        pullbackByRdcMonth[rdcRaw][ym].qty += qtyBox;

        // v122: 补存 recLoc（B列「收货库位」实际库位号，如 T8A8/B621），供「按收货仓」下钻使用。

        rows.push({ date: dt, ym: ym, rdc: rdcRaw, sku: sku, name: name, brand: brand, rec: rec, recLoc: recLoc, qty: qty, unit: unit, boxQty: qtyBox, amount: amt });
      }

        _diag.failMissingDate = failMissingDate;

      return rows;
    }
    // 先用探测到的列解析
    let _parsed = parsePullbackWithCols(_pbCol, true);
    // v60 fallback: 若探测列未解析出有效行，回退到默认列位置再试一次

    // ===== 7月新模板：库存金额 sheet（左表=金额趋势 4透视块；右表=库存结构分析 4种状态） =====

    const structureByYear = {};   // {year:{month:{rdc名|'合计':{orange,red,yellow,safe}}}} — 全部
    const structureByYearNoHainan = {}; // 同上 — 不含海南花露水（库存金额表右表第二块）
    if (amountArr) {
      // ---- 左表：金额趋势透视块（按 是否海南花露水 × 状态 组合，共4块） ----
      for (let i = 0; i < amountArr.length; i++) {

        const byYear = {};

      // ---- 右表：库存结构分析（4种状态 × 年/月/RDC） ----

        };

    }

    // ===== 7月新模板：库存覆盖 sheet（RDC × 覆盖月数 × 订单满足率；库存状态区块按用户口径不再展示） =====

      for (let i = 0; i < covNewArr.length; i++) {

        if (String(r[2] || '').trim() === '2月' && s0 && s0 !== '统计大类') {

        const vals = { '2月': getSN(r,2), '3月': getSN(r,3), '4月': getSN(r,4), '5月': getSN(r,5), '6月': getSN(r,6), '环比': getSN(r,7), '占比': getSN(r,8) };
        if (group === '库存状态') coverageNew[curRdc].status[s1] = vals;
        else if (group === '库存覆盖-可用库存') coverageNew[curRdc].coverage[s1] = vals;

    }

    dataStore.inventory = {
      summary, rdcStatus, status5, status6, status7, cov5, cov6, cov7, rdcCoverage, expiry6, expiry7,

      pullbackRaw: pullbackArr || [],  // 原始行化数据（保留兼容）

      pullbackSheetName: pullbackSheetName,   // v60: 实际匹配到的 sheet 名
      pullbackDiag: _diag,                    // v64: 诊断信息（表头/样例/失败计数）供空态页面展示
      _rawSheets: rawSheets,  // 原始 sheet 行数组，供拉回分析 hnMap 构建

    // 转储数据（现位于库存文件，按名称查找；与 parseExcel 中逻辑一致）
    const transArr = findByName('转储');
    if (transArr) {
      // 按表头名称动态定位列（兼容新旧桌面模板的 OUn 列数差异）
      const tHeader = transArr[0] || [];

      const C_DATE = tColIdx('创建日期');
      const C_LOC = tColIdx('收货库位');
      const C_FACTORY = tColIdx('收货工厂');
      const C_MAT = tColIdx('物料');
      const C_NAME = tColIdx('短文本');
      const C_PO = tColIdx('PO 数量');
      const C_PLAN = tColIdx('计划数量');
      const C_CONFIRM = tColIdx('确认数量');
      const C_INVOICE = tColIdx('发货单数量');
      const C_SHIPFAC = tColIdx('发货工厂');
      const C_INBOUND = tColIdx('入库数量');
      const C_DELIVERY = tColIdx('发货过账数量');
      // 单位列：找数量字段后面最近的 'OUn' 列
      function unitAfter(numCol) {
        for (let i = numCol + 1; i < tHeader.length; i++) {
          if (String(tHeader[i] || '').trim() === 'OUn') return i;
        }
        return -1;
      }
      const C_UNIT = C_INVOICE >= 0 ? unitAfter(C_INVOICE) : -1;

      const existTk = new Set(dataStore.transship.map(d => d.dateStr + '|' + d.material + '|' + d.location));
      for (let i = 1; i < transArr.length; i++) {
        const r = transArr[i];

        if (!d) continue;
        const loc = getSafeStr(r, C_LOC);

        let rdc = '未知';
        if (loc.startsWith('20')) rdc = '东北RDC';
        else if (loc.startsWith('40')) rdc = '华南RDC';
        else if (loc.startsWith('60')) rdc = '西北RDC';
        else if (loc.startsWith('70')) rdc = '华中RDC';
